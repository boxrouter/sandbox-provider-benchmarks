# yaml-language-server: $schema=../schemas/reader.schema.json
# The current reader copy of every test and index, keyed by its canonical name id. Wording lives here,
# not in the scientific documents: an edit changes no measured record and needs no re-run.
# A statement of fact reads the measured definition of the result it describes:
# {param:measured.<path>}.
schema: boxrouter.bench.reader/1
common:
  blocks:
    coding-workloads:
      replay: Replaying removes the model, whose inference time would otherwise dominate the measurement, and a live model takes a different path on every attempt.
      limit_guest_runtime: Tool time measures in-sandbox execution (`runtime(cmd)`), which agents running inside the sandbox pay directly, while external harnesses that send one API request per command also pay per-call transport time.
      limit_cpu_counts: Where a provider's container reports the host's CPU count instead of the requested vCPUs (as Daytona does), tools that size worker pools from the visible count start more threads, and the result counts that as the provider's behavior.
    common:
      statistic_reading: The {param:measured.statistics.primary} summarizes successful trials in the axis unit;
      cost_reading: Only successful trials contribute to the cost value.
      statistics_citation: Per-unit medians, suite-level pooled percentiles, bootstrap confidence intervals, and tail fallback rules follow {name:page.common}.
      typical_citation: The All view aggregates each unit's selected statistic across the workload using the unweighted geometric mean and missing-unit substitution penalty defined in {name:page.common}.
      all_view_aggregation: On the All view, we aggregate each unit's selected statistic using the geometric mean, the workload value.
      failures_citation: Outcome classifications and the single completeness gate follow {name:page.common}; the first failed step ends the trial with no in-trial retries.
      complete_cell: A cell is complete once it reaches the number of successful trials set in the run's configuration; if it stops short, the result shows the count that succeeded.
      sandbox: 'Each trial uses a sandbox created from BoxRouter''s pinned standard image'
    machine-performance:
      trial_start: Create sandbox.
      shared_cpu_mem_procedure: |-
        The hardware probe records visible CPU count (`nproc`), processor model name, instruction flags (`SHA-NI`, `AVX2`, `AVX-512`), L3 cache capacity, cgroup CPU quota (`cpu.max`), and available memory.
    create:
      opening: |-
        Every interactive coding session, evaluation task, and reinforcement learning rollout begins by waiting for a sandbox to boot and accept its first shell command.

        The {name:tab.create} tab measures that startup wait, Time to Interactive (TTI), by starting one sandbox per trial ({name:test.sequential-tti}). A second launch pattern, a parallel wave of sandboxes started at the same moment ({name:test.burst-tti}), is defined but not tested yet.

        Every sandbox starts from an image the provider already holds. BoxRouter prepares the pinned standard image once in each provider account, as that provider's own template, snapshot or image, and every `create` boots from that prepared copy. No image is built or pulled during the timed `create`, so {name:test.sequential-tti} measures starting a sandbox, not preparing an image.
      limit_layer: Provider image caches and warm pools stay enabled, so a sandbox may reuse provider state. Cold image builds are not part of this test; the image-build benchmark that will measure them is not tested yet.
    files:
      opening: |-
        Coding agents and build tools constantly inspect directory trees and read or write small source files through a sandbox provider's file API.

        The {name:tab.files} tab measures the per-call time of those three primitive operations: listing a directory of {param:measured.parameters.workload.file-list.count} empty files ({name:test.list}), writing a {param:measured.parameters.workload.payloads.file-4kib.bytes}-byte file ({name:test.write-4kib}), and reading that {param:measured.parameters.workload.payloads.file-4kib.bytes}-byte file back ({name:test.read-4kib}).

        All three benchmarks execute sequentially inside one shared sandbox per trial ({name:test.list}, then {name:test.write-4kib}, then {name:test.read-4kib}), repeating each operation {param:measured.procedure.variants.0.parameters.repetitions} times back to back.
      limit_warm: The sandbox has already run the directory setup command, so the calls measure warm steady-state file operations, not cold first-touch ones.
      limit_provider_work: On some providers BoxRouter does extra work per file call (on Vercel it re-checks its process tool on every listing), and that work is part of the provider's path and of the timed call.
    exec:
      opening: |-
        When an AI agent or test harness outside the sandbox dispatches commands over the provider's API, every step pays the round-trip overhead of the provider's execution endpoint and the container's internal daemon. The {name:tab.exec} tab isolates that round-trip floor by sending the shell builtin `true`, a command with nearly zero in-sandbox runtime, {param:measured.procedure.variants.0.parameters.calls} times in a row inside each sandbox.

        The view selector presents the same benchmark runs two ways: {name:test.exec-latency} takes the median call of each sandbox's {param:measured.procedure.variants.0.parameters.calls} calls and summarizes those across {param:measured.procedure.trials} sandboxes, and {name:test.exec-latency-per-100-calls} sums the {param:measured.procedure.variants.0.parameters.calls} calls per sandbox to show session-level execution time.
      limit_network: Every call includes the network path to the provider's default US region.
      limit_warm: Calls run back to back over a connection kept open for up to the idle timeout set in {name:page.common} while idle, measuring steady-state dispatch on a warm connection rather than a cold one.
      limit_wrapper: Each call wraps `true` in a short Bash line that reads the sandbox clock with the date command before and after it, and returns the readings on standard error. The two date processes are part of every call's time.
      shared_workload: The shell builtin `true` exits immediately with status 0 without disk or network I/O, so each call's duration isolates API serialization, network transit, provider routing, and container daemon dispatch.
    cpu:
      opening: |-
        Agents that compile code, run test suites, compress build artifacts, or process data spend much of their runtime bound on integer CPU execution. Two providers selling a {machine:measured.environment.size} sandbox can deliver very different compute speeds depending on the underlying host processor generation, clock frequency, cache hierarchy, and hypervisor scheduling.

        The {name:tab.cpu} tab measures integer compute speed using 7-Zip's built-in LZMA benchmark in two configurations: {name:test.7-zip-1-thread} (single-core speed) and {name:test.7-zip-all-vcpus} (multi-core scaling across the requested vCPUs).
      setup: 'running Igor Pavlov''s official static Linux x86_64 build of 7-Zip {param:measured.source.version} (`7zzs`, verified by {hash:SHA-256|measured.parameters.workload.tools.0.sha256}).'
      limit_models: Sandboxes on one provider can land on different CPU models, and each trial records the processor model, so a bimodal spread or a low-end tail can be traced to the models across the {param:measured.procedure.trials} trials.
    pause-resume:
      opening: |-
        Interactive coding agents, chat workspaces, and notebook sessions sit idle between user turns. Pausing a sandbox between turns stops compute billing while preserving the user's workspace, but only if the sandbox can pause and wake back up with its files intact.

        Furthermore, a provider can return from a `resume` API call before the sandbox's data has been paged back in, shifting the real wait onto the first command that touches the data.

        The {name:tab.pause-resume} tab measures both sides of that lifecycle: {name:test.pause-resume} tests immediate pause, resume, and data read-back across memory and disk loads, while {name:test.delayed-resume} tests wake and read time after a sandbox has been paused or left idle across selected wait durations.
      limit_architecture: Vercel implements stop and resume by snapshotting the filesystem on stop and booting a new VM from that snapshot on resume.
    snapshots:
      opening: |-
        Agent harnesses and reinforcement learning loops use snapshots to save a configured sandbox once and boot clean copies from that state without repeating installation or repository setup.

        The {name:tab.snapshots} tab measures two patterns built on that primitive:

        - {name:test.snapshot-and-restore} times saving a snapshot of a configured sandbox, creating one new sandbox from that snapshot after the source sandbox is destroyed, and loading the Python, Node.js, and git runtimes inside it.
        - {name:test.fork} takes one snapshot and creates four sandboxes from it one after another to measure restore speed and whether later restores accelerate as the provider caches the snapshot.
      limit_modal_delete: The snapshot is deleted when the trial ends; a delete that is not accepted fails the trial, and the run's cleanup tries it again.
      snapshot_stage_start: Snapshot request is sent
      snapshot_stage_end: Snapshot operation completes and the call returns
    reconnect:
      opening: |-
        Stateless serverless workers, webhook handlers, and agents recovering from a process restart or a deploy cannot reuse an in-memory sandbox handle; instead, a fresh client process attaches to the running sandbox by its ID and issues its first command. The benchmark does not yet start a new process for each round.

        The {name:tab.reconnect} benchmark measures that cold-client attach path ({name:test.reconnect}): in each trial, one sandbox is started and {param:measured.procedure.variants.0.parameters.rounds} sequential rounds each look the sandbox up by ID to get a new handle, then run `true` through it.
    previews:
      opening: |-
        App-building agents and interactive web IDEs start a development server inside a sandbox and hand the user a public preview URL to view the live app and receive Hot Module Replacement (HMR) updates over a WebSocket.

        The {name:tab.previews} benchmark launches a pinned {param:measured.procedure.variants.0.label}. {name:stage.between} is the interval on the client host's clock from process.start returning until the first public URL probe succeeds, while the process.start duration and the server-listening runtime stay in separate figures.

        Once the preview URL is live, the benchmark measures the Time to First Byte (TTFB) of {param:measured.procedure.variants.0.parameters.requests} sequential HTTP GET requests over a kept-alive connection and tests whether a WebSocket upgrade (vite-hmr) succeeds through the preview proxy.
    image-build:
      opening: |-
        Before a team can boot sandboxes with custom system packages, language SDKs, or pre-cloned repositories, the provider must ingest the container image and build a runnable template or snapshot from it.

        The {name:tab.image-build} tab measures how long a provider takes to prepare a new image, constructed by appending one unique trial layer onto a pinned base image, across {count:measured.procedure.variants} base images, including the pinned standard image and the Jupyter data-science image ({imagesize:measured.parameters.variants.data-science.facts.uncompressed_bytes} unpacked).

    disk:
      opening: |-
        When a coding agent or CI pipeline unpacks a multi-gigabyte container layer, compiles a large Rust or C++ workspace, queries a local SQLite or vector index, or writes build artifacts in `/workspace`, performance depends on the sandbox's underlying storage once the working set exceeds or bypasses the guest page cache.

        The {name:tab.disk} tab measures uncached storage performance in `/workspace/fio` using `fio` with direct I/O (`O_DIRECT`) across four access patterns: {name:test.sequential-read} and {name:test.sequential-write} (1m blocks, reported in `MiB/s` for large streaming transfers), and {name:test.random-read} and {name:test.random-write} (4k blocks, reported in `IOPS` for small scattered operations).
      setup_read: 'running a static Linux x86_64 build of `fio` {param:measured.source.version} (verified by SHA-256) with `ioengine=libaio`, `direct=1`, `iodepth={param:measured.parameters.workload.queue_depth}`, and `numjobs=1`.'
      prepare: Download and check `fio`, check `/workspace/fio` for `O_DIRECT` support and free space, and pre-write the {size:measured.parameters.workload.file_bytes} `data.bin` file (untimed).
      finish: run post-trial cache/compression checks and destroy sandbox (untimed).
      rejects_direct_io: providers whose `/workspace` rejects `O_DIRECT` are not measured
      limit_checks: Each trial records the sandbox's facts in the raw data. No diagnostic check adds a note to a result yet.
      limit_cached_files: These tests measure sustained, high-queue-depth `O_DIRECT` throughput and IOPS on a {size:measured.parameters.workload.file_bytes} file, while everyday operations on small cached files are measured in {name:tab.files} and {name:tab.filesystem}.
      limit_batch_load: '[[when measured.procedure.concurrency.trials_in_parallel > 1: Trials run concurrently per provider, up to {param:measured.procedure.concurrency.trials_in_parallel} at once, so sandboxes in the batch can share host storage bandwidth when the provider places them on the same backing host.]]'
      shared_procedure: |-
        The setup step checks for at least {size:measured.parameters.workload.free_bytes} of free space in `/workspace/fio`, and probes `O_DIRECT` with `dd`. The post-trial check runs a {size:measured.parameters.workload.cache_probe_bytes} cached-versus-direct read probe and verifies that the first 64 MiB of `data.bin` has at least 99.9% of its 4 KiB blocks distinct and that zlib shrinks them by at most 1% (minimum ratio {param:measured.parameters.workload.min_zlib_ratio}).
      shared_failures: |-
        Outcome classifications and the single completeness gate follow {name:page.common}; the first failed step ends the trial with no in-trial retries.

        A sandbox whose `/workspace` rejects `O_DIRECT` reads or writes, or has less than {size:measured.parameters.workload.free_bytes} free, fails the trial before `fio` runs. The failure is the provider's.

        A trial fails as a provider error if `fio` exits non-zero, if the `fio` download does not match its SHA-256, or if the data-file check finds fewer than 99.9% distinct 4 KiB blocks or compression below {param:measured.parameters.workload.min_zlib_ratio}. A measured interval under {duration:measured.parameters.workload.min_interval_seconds} or a `fio` error in its output is counted as BoxRouter's and left out of the results.
    overview:
      limit_guest_clock: All three input workloads measure in-sandbox step execution on the guest clock, while sandbox creation, image preparation and per-call API time are measured separately in {name:section.sandbox-operations}.
      omitted_when: if any of its counted trials in the scope lacks a provider-sourced cost, if any unit's cost on the selected statistic is zero (so the geometric mean is undefined), or if the provider completed no units in the scope.
    workloads:
      ranking: 'A provider enters the workload ranking once every unit (task) of the workload is complete, and it also requires a provider-sourced cost.'
methods:
  common:
    notes:
      introduction: Defines the test environment, trial lifecycle, timing clocks, failure classifications, and statistical estimators that apply across all BoxRouter benchmarks.
      environment: |-
        **Scope:** BoxRouter benchmarks measure how fast cloud sandboxes run and what they cost. The tests cover coding agents, reinforcement learning rollouts, continuous integration pipelines, sandbox operations, and machine performance.

        **Accounts:** Every provider is tested the way an ordinary customer would use it. Each benchmark runs against a self-serve account with pinned client versions and no provider-specific tuning.

        **Provider Settings:** The only settings that differ by provider are the region, the runtime class where a provider offers more than one (Modal runs on its VM class and Daytona on its container class), a 10 GiB disk where a provider's default disk is too small for the standard image, and how fast trials are started.

        **Region:** Every provider runs in a US region. Boat, which is not tested yet, has no US region and no region selector; when it is tested its sandboxes will run in the EU, and its results will be labeled with that region and carry a note on the transatlantic round trip.

        **Sandbox Size:** Each benchmark asks for a {machine:measured.environment.size} sandbox unless its methodology page states another size, as a ceiling the sandbox may not exceed.

        **{param:content.ranking_statuses.nearest_size.label}:** Where a provider has no size that matches, the benchmark runs on its nearest larger size and the result says so: operation results are flagged with that size, and machine-performance and workload results show both sizes.

        **Images:** Every image is pinned by digest and prepared in each provider account before the benchmark run starts, as the provider's own template, snapshot or image. Standard benchmarks use the BoxRouter standard image, pinned by its SHA-256 digest ({hash:sha256|measured.environment.image.reference}), and no image is built or pulled inside a timed step. The digest is part of this methodology.

        **Sail Image:** Sail cannot run the standard image, so its sandboxes start from Sail's own Debian image and are labeled with it.

        {name:test.deepswe} and {name:test.terminal-bench-4-0} also start from that single standard image: an untimed setup fetches each task's files at a pinned commit and installs its dependencies before the timed steps, with nothing added to the image. {name:test.r2e-gym} unpacks each task's prebuilt archive in the same untimed setup.

        **Job Host:** One job host runs the benchmark for every provider, in the AWS region that the publication names. Each trial record stores that region and the host's CPU load during the trial. Results from different job-host regions are never combined.

        **Connections:** Calls reuse a warm connection. Where the provider's SDK supports connection keep-alive, idle client connections stay open for up to {duration:measured.environment.connection_idle_seconds}, so sequential calls reuse a warm TLS session.

        **Eligibility:** A provider's capability declaration decides which benchmarks it enters. The declarations live in {param:measured.capability_source.repository}, in the files {param:measured.capability_source.declaration_path}. A benchmark includes a provider when the declaration lists every capability the benchmark requires, and excludes the provider when a required capability is absent.
      trial_lifecycle: |-
        **Steps:** Every trial follows the same three steps.

        1. **Sandbox creation:** A fresh sandbox starts with the test environment's machine size and image, unless the benchmark page specifies others.
        2. **Timed procedure:** The benchmark's measured steps run. The first failed step ends the trial, with no retries inside it.
        3. **Resource cleanup:** Every sandbox and snapshot the trial created is deleted, on success and on failure. Each sandbox carries its run's label and a provider-enforced lifetime, so a crashed trial cannot leave one running, and the end of the run checks that every one is gone. {name:test.r2e-gym} counts `destroy` in its charted total; other benchmarks record it without charting it.

        **Concurrency:** All benchmarks run at the same time. Each provider has one pool of trials in flight, sized under BoxRouter's account limits with that provider, and each benchmark keeps up to its stated number of trials in flight within that pool. So a sandbox can share a provider's hosts with sandboxes from other benchmarks in the same run.

        **Pacing:** Creates are spaced to the rate a provider documents, and a provider's API calls are held below its published request limit. Every such wait happens before a timed step starts, so it changes no measured time.

        **Time Limits:** Every step has a time limit above the slowest normal time seen on any provider, so only a hung call reaches it. Each benchmark lists its limits in its Failures section.

        **Long Commands:** A command that can run for tens of seconds or more (a data load, a `fio` run, an install, a replay script) runs in the background, because a provider's gateway can end a synchronous call that waits too long. The benchmark script polls it every 0.5 s until it exits; its start and end come from the sandbox's clock, so polling adds nothing to the measured runtime.
      ready_check: |-
        **Readiness:** No untimed readiness check runs after `create`. The first step of each benchmark is sent as soon as `create` (or `restore`) returns, so a provider that returns before the sandbox accepts commands shows that wait in the first step, or fails that step.
      clocks: |-
        **Clocks:** A timed span contains only the steps that its benchmark names, with no warm-up request, probe, or keep-alive inside it. Operation times are the provider's time, while command runtime on the sandbox's own clock is kept separate:

        - **Provider time:** Every operation sent to the provider (`create`, `snapshots.create`, `restore`, `attach`, file transfers, commands and `destroy`) is published at the provider's own time: how long the step's exchanges with the provider were in flight, from sending each request until its last response byte arrived, plus any wait for a state the provider reported, with overlapping exchanges counted once. It includes connection setup and leaves out everything before a request is sent and after its last byte arrives. Lifecycle and file-transfer operations run without a guest shell wrapper.
        - **Client clock:** A step that does not go to the provider's API, such as a request to a preview URL or a WebSocket, is timed on the monotonic clock of the job host that sends it, from just before the call until it returns.
        - **Sandbox clock:** The guest's own clock times commands that run inside the sandbox. Network transit between the job host and the provider therefore does not enter CPU, memory, or disk runtime measurements.

        **Left-Out Steps:** A step is not published when it has no provider time (the provider only accepted its requests) or when it fails a timing check: extra time around the provider that other providers do not show in the same minute, or more provider calls than the operation needs. Only the figures that read that step leave the trial out, and the result lists each with its reason.

        **Latency:** A command's published time splits into its execution inside the sandbox (runtime) and the transport around it, which BoxRouter calls "latency" (provider time minus runtime):
      guest_timing: |-
        **Clock Wrapper:** A one-line shell wrapper reads the sandbox's clock with the shell's date command, in nanoseconds, just before and just after the command and returns both on a trailer line on standard error; runtime is their difference. It also reads `/proc/uptime` outside that span, which stands still while a sandbox is paused and is used to check that a sandbox really stood idle.
      failure_policy: |-
        **Published Results:** Speed and cost figures come from successful trials only. Every other attempt is in the published trial data with its outcome, its owner and the step that ended it; only trials that BoxRouter's own faults ended are left out, and they are counted on each result. Every published figure comes from one run.

        **Reliability:** Provider failure rates will be measured separately, in the {name:section.reliability} benchmark, which is not run yet.

        **Outcomes:** Every trial ends in one of these outcomes.

        - **Success:** The trial passed every step and check within its time limits, and every sandbox and snapshot it created was deleted. After the run, every sandbox is checked gone.
        - **Provider failure:** The provider or its sandbox failed. This covers any `create`, `snapshot`, `restore`, `destroy`, or transport error; a sandbox that stops answering; a sandbox whose stop can't be confirmed; a step that reaches its time limit; a replayed command that exits with a different code than the recording; and any failure whose owner was not recorded.
        - **Our fault:** A trial ended by BoxRouter's own script, software or account limits is not the provider's failure. It is left out of the published data and every figure, and counted on the result as excluded. The cell runs another trial in its place, within the run's attempt limit. If the cell still falls short of N, that unit is left out of the composites for every provider.
        - **Unsupported:** The provider's capability declaration does not offer what the benchmark requires, so no trial runs. A cell whose every line says so is shown as {param:content.ranking_statuses.in_development.label}, not as a failure.

        **Status Labels:** A provider without a ranked bar shows a status label instead. When a provider has no ranked bar, or has unresolved failures on a chart, the result shows one of these status labels:
      status_labels:
      
      - status_label: '{param:content.ranking_statuses.filled.label}'
        status_meaning: '{param:content.ranking_statuses.filled.definition}'
      - status_label: '{param:content.ranking_statuses.not_offered.label}'
        status_meaning: '{param:content.ranking_statuses.not_offered.definition}'
      - status_label: '{param:content.ranking_statuses.account_limit.label}'
        status_meaning: '{param:content.ranking_statuses.account_limit.definition}'
      - status_label: '{param:content.ranking_statuses.in_development.label}'
        status_meaning: '{param:content.ranking_statuses.in_development.definition}'
      - status_label: '{param:content.ranking_statuses.nearest_size.label}'
        status_meaning: '{param:content.ranking_statuses.nearest_size.definition}'
      - status_label: '{param:content.ranking_statuses.not_measured.label}'
        status_meaning: '{param:content.ranking_statuses.not_measured.definition}'
      - status_label: '{param:content.ranking_statuses.not_displayed.label}'
        status_meaning: '{param:content.ranking_statuses.not_displayed.definition}'
      top_ups: |-
        **One Gate:** A cell, defined as one provider on one benchmark (and, for a replay suite, one task), is complete when it reaches N successful trials. The target N comes from the run's configuration, along with the number of tasks per suite and the number of trials per task, so those counts can vary from run to run and each run records its own. No other gate holds a result back.

        **Publication Gate:** A new run is published only when it keeps a result for every provider, benchmark and step that the previous publication had, or names a reviewed reason for each one it lost.

        **Failed Trials:** A failed trial is never overwritten. It stays in the data with its owner and cause, and the cell runs a new trial in its place. A cell gets at most three attempts for each success it still needs, and it stops early after three failures in a row at the same step with the same error. A timeout or a rate limit is never counted as a repeat, and a success resets the count.

        **Incomplete Cells:** A cell that finishes with fewer than N successful trials is shown as partial, displaying the count it reached (k of N) alongside its failures. A cell that never ran is shown as {param:content.ranking_statuses.in_development.label}. A trial that ends early with an unknown outcome is recorded with an unknown owner, which counts as a provider failure.
      statistics_rules: |-
        **Trials Used:** Statistics are computed per provider and per unit, over successful trials only. No trial is trimmed unless the benchmark's methodology page states an exception. Cost aggregation and cost confidence intervals follow {name:page.pricing}.

        **Completeness:** A provider enters a ranking only when its cell is complete with N successful trials. On multi-unit workloads ({name:test.deepswe}, {name:test.terminal-bench-4-0}, {name:test.r2e-gym}, and {name:test.ci-jobs}), every unit in the workload must be complete, and a provider enters the All view ranking only when it also has a provider-sourced cost.
      per_unit_statistics: '**Percentiles:** Percentiles use the nearest-rank method over the unit''s n successful trials, sorted in ascending order:'
      percentile_rule: |-
        **Median:** The median is the headline statistic. It is the smallest trial value with at least half of the successful trials at or below it.

        **Tail:** The tail statistic reports the worse side of the spread. {name:statistic.p95} is the {param:measured.statistics.tail.worse_side_percentile}th percentile where lower is better, and the fifth percentile where higher is better.

        {name:statistic.p95} is pooled at the suite level across all successful samples from the suite's units and requires at least {param:measured.statistics.tail.min_successes} samples (a single-unit benchmark pools all of its successful trials). Below that floor, the single worst successful sample is shown instead, labeled Slowest for time metrics or Lowest for throughput and rate metrics. Individual units do not have a separate {name:statistic.p95}.

        **Mean:** The arithmetic mean is a secondary statistic over all n untrimmed successful trials:
      interval_rule: |-
        **Confidence Interval:** The time median carries a {percent:measured.statistics.interval.confidence} percentile-bootstrap confidence interval. The bootstrap draws n values with replacement from the unit's n successful trials {param:measured.statistics.interval.resamples} times, with the random seed fixed at {param:measured.statistics.interval.seed}, and the interval is the central {percent:measured.statistics.interval.confidence} of the resampled medians.

        {name:page.pricing} defines the bootstrap interval for mean cost per success.

        **One Value Per Trial:** A benchmark that makes many calls per trial reduces them to one value per trial, and the bootstrap resamples trials. {name:test.exec-latency} takes the median of each sandbox's calls, because calls inside one sandbox are not independent.
      workload_value: '**Geometric Mean:** A workload''s value must not let its longest task dominate. Workloads such as {name:test.deepswe}, {name:test.terminal-bench-4-0}, {name:test.r2e-gym}, and {name:test.ci-jobs} contain units whose durations span an order of magnitude, so a sum or an arithmetic mean would let the longest task decide the ranking. {param:reader.common.blocks.common.all_view_aggregation}'
      workload_value_rules: |-
        **Equal Weight:** Every unit carries equal proportional weight. Making a short unit ten percent faster changes the workload value by the same percentage as making a long unit ten percent faster.

        **Missing Units:** A provider cannot improve its value by failing a unit. A geometric mean needs positive values over the same unit set for every compared provider, and dropping a unit where a provider failed would let that provider improve its workload value by failing its slowest task.

        So when a provider completes at least one unit of a workload but has no successful trials on a unit, its value on that unit is filled with the slowest time (and highest cost) observed on the unit across all providers that completed it, and the result carries a substitution note.

        **Overview Composites:** On {name:section.overview}, {name:index.time-index} and {name:index.cost-index} take a second unweighted geometric mean across the workload values in the selected scope.
      stage_rule: |-
        **Stage Medians:** Each stage in a stacked bar has its own median. When a benchmark splits total time into stages (such as {name:stage.read}, {name:stage.write}, {name:stage.install}, {name:stage.build}, and {name:stage.test}), each stage gets its own per-stage median across trials. Per-stage medians need not sum to the median total time.

        **Bar Scaling:** Stacked bars scale their segments to fill the total but label the real values. Each segment's width is scaled by the total median divided by the sum of the stage medians, so the plotted segments fill the total median bar. The label on each segment shows its unscaled stage median. Step mean values do sum to the total mean, apart from untimed intervals between steps.

        **Derived Views:** Interactive subset sums on the charts are derived views. In each trial, a derived view sums the selected sandboxes or steps only when every selected part has a valid reading. It summarizes those per-trial sums using the same nearest-rank estimators and the same {param:measured.statistics.tail.min_successes}-sample tail floor, with no confidence interval.
  pricing:
    notes:
      introduction: Defines how sandbox costs are obtained from provider billing records, aggregated across benchmark trials, and verified against published list rates.
      cost_sources: |-
        **Evidence:** Every cost comes from the provider's own records. BoxRouter's job-host clocks, guest clocks, and requested machine sizes never produce a cost. In the other direction, provider billing timestamps never replace BoxRouter's measured execution times on speed charts.

        **Cost Methods:** Each provider's cost method uses the strongest evidence that provider supplies, and the pricing release's `cost-method.json` pins it. Each published result records the price version it used. In order of preference:

        - **Reported By Provider:** The provider's billing or usage API reports the USD charge for that sandbox ID, and BoxRouter checks it against the provider's published list rates.
        - **Calculated:** BoxRouter prices the provider's own reported usage quantities or lifecycle event timestamps at stored public list rates, following the provider's documented billing rules, state transitions, minimum durations, and rounding increments.

        **No Cost:** Without either, the sandbox has no cost. That happens when neither a verified provider charge nor complete provider usage records are available, or when a required rate or resource class is unrecorded. It also happens when the sandbox's stop can't be confirmed and the provider gives no end time and no maximum lifetime, and then the trial is the provider's failure.

        The result then records no total and lists each missing input as what held the cost back. A missing cost is never zero, a guess, a floor, or a range, and it is shown without a method label.

        **Reading Costs:** Each sandbox's cost is read from the provider's record after the run's trials end, and read again at the times the provider's billing policy names until the provider reports it or its reporting window closes. A cost not reported by then is Unknown.

        **Revised Costs:** A known cost that the provider may still revise is published as read, and the result counts how many are not final. No result is published while a cost is still being read.

        **Modal Reports:** Modal reports billing in hourly buckets, so a Modal sandbox's reported cost needs one dedicated App per sandbox. A Modal sandbox has a valid Reported By Provider cost only when all of these hold:

        - A dedicated Modal App held that single sandbox alone, and its report has at least one row and no duplicate or out-of-span rows.
        - The recorded request window covers every hour from the sandbox's start through its end; a covered hour with no row adds nothing.

        **Rate Verification:** Stored list rates are checked against provider billing exports. Each billed quantity is converted to the unit of its rate and multiplied by the stored USD rate. A line item matches when the difference is within the pricing release's tolerance. Any mismatch is investigated as evidence and never hidden.
      cost_calculation: '**Successful Trials:** A provider''s cost comes from its successful trials. {param:reader.common.blocks.common.cost_reading} The run''s records keep every attempt''s cost, failed ones included, while the displayed cost is the cost per success (the total cost of the successful trials divided by their count). Cost is computed per unit in two steps: trial cost, then unit cost.'
      trial_cost: '**Sandbox Sum:** A trial''s cost is the sum of its sandboxes'' costs. The cost of a successful trial adds up the provider-sourced costs of all sandboxes created during the trial, each counted from its `create` or `restore` request to its confirmed deletion:'
      trial_cost_sandboxes: '**Sandboxes per Trial:** Most benchmarks use one sandbox per trial. {name:test.deepswe}, {name:test.terminal-bench-4-0}, and {name:test.ci-jobs} sum one sandbox per trial, and {name:test.r2e-gym} sums its base sandbox and the rollout sandboxes restored from its snapshot.'
      unit_cost: |-
        **Two Summaries:** Each unit's successful trial costs are summarized in two forms, and each chart scales them to the unit its cost label names, such as cost per trace on {name:test.deepswe}.

        - **Statistic selector:** The statistic chosen in the chart menu summarizes the unit's successful trial costs ({name:statistic.median} by default, or {name:statistic.mean} or {name:statistic.p95}), using the nearest-rank percentile and {param:measured.statistics.tail.min_successes}-sample tail rules defined in {name:page.common}.
        - **Mean cost per success:** The total cost of the unit's successful trials, divided by the number of successful trials.

        **Confidence Interval:** The cost confidence interval is a bootstrap of the mean cost per success. It is a {percent:measured.statistics.interval.confidence} percentile-bootstrap interval across {param:measured.statistics.interval.resamples} resamples, drawn with replacement with the random seed fixed at {param:measured.statistics.interval.seed}.
      workload_cost: |-
        **Workload Cost:** A workload's cost is the geometric mean of its unit costs. On a multi-unit workload's All view, a provider's workload cost is the unweighted geometric mean of its per-unit costs under the selected statistic, across all units completed by at least one provider.

        If a provider completed at least one unit in the workload but has no successful trials on a unit, its cost on that unit is the highest unit cost observed on it across all providers that completed it. This matches the missing-unit substitution in {name:page.common}.

        **Composite Cost:** The overview's composite cost averages workload costs the same way. On {name:section.overview}, {name:index.cost-index} is the unweighted geometric mean of a provider's workload costs across the workloads in the selected scope. A workload a provider has no result on is left out of its composite.

        **Shared Units:** In {name:index.time-vs-cost}, each provider's {name:index.time-index} coordinate is computed over the same set of costed units that enter its {name:index.cost-index} coordinate, so both axes compare the same units.
      stage_cost: '**Stage Cost:** A stage''s share of the cost follows its share of the time. When a workload chart splits a unit''s time bar into stages (such as {name:stage.read}, {name:stage.write}, {name:stage.install}, {name:stage.lint}, {name:stage.build}, and {name:stage.test}), each stage is assigned a share of the unit''s displayed cost in proportion to its share of the total stage time, under the same statistic:'
      missing_costs: |-
        **Missing Costs:** One missing sandbox cost removes the provider's cost for the whole view. If any sandbox in a trial lacks a provider-sourced cost, that trial has no cost.

        If any counted trial in a unit or composite scope lacks a cost, or any unit's cost on the selected statistic is zero (which leaves the geometric mean undefined), the provider has no cost for that view and is listed under {param:content.ranking_statuses.not_displayed.label}.

        **Priced Sections:** Cost is published for workloads and the composites built on them. That covers the workloads ({name:test.deepswe}, {name:test.terminal-bench-4-0}, {name:test.ci-jobs}, and {name:test.r2e-gym}) and their composites ({name:index.cost-index}, {name:index.time-vs-cost}, and the cost scores on provider pages). {name:section.sandbox-operations} and {name:section.machine-performance} show no cost.
      comparing_models: |-
        **Why Bills Differ:** Similar hourly rates can produce very different bills, because providers meter different quantities, in different units, across different lifecycle states:

        - **CPU units:** Most price CPU per vCPU; one prices it per physical core (two vCPUs), one bundles it into its memory rate, and one bills a flat machine-hour rate per size tier.
        - **Allocation or use:** Some bill the reserved size while the sandbox runs, some only the CPU time or memory used, and some the larger of the two.
        - **Memory units:** A GiB (1,024 MiB) is larger than a GB (1,000 MB), and a provider that prices per GB may bill a GiB of memory as a GB.
        - **Metering edges:** Whole-minute minimums, whole-second truncation, or millisecond edges can outweigh rate differences for a short sandbox.
        - **Inactive states:** A paused or stopped sandbox may cost nothing, keep paying for its disk, or pay for a retained snapshot.
  time-index:
    headline: Composite time
    notes:
      introduction: '{param:content.index_copy.details.time.what_this_measures}'
      page_headline: Composite time and cost
      page_introduction: Measures each provider’s execution times and sandbox costs across coding and CI workloads, combined into one composite time and one composite cost.
      metric: "{name:index.time-index} is the unweighted geometric mean of a provider's workload times across the workloads in the selected scope. Because the composite is reported as a concrete time rather than normalized to a 0–100 score or indexed to a reference provider, adding or removing another provider does not alter any provider's composite time when all units are completed."
      calculation: |-
        Aggregation proceeds in two geometric-mean levels so neither long-running units nor multi-unit workloads dominate the index:

        - First, within each workload, the provider's workload time is the geometric mean across all units completed by at least one provider, using the selected statistic (median by default, or mean or p95); if a provider completed at least one unit in the workload but has no successful trials on a unit, that unit's value is replaced by the slowest value observed for that unit across all providers that completed it.
        - Second, the provider's {name:index.time-index} is the unweighted geometric mean of its workload times across the workloads in the selected scope, giving each workload equal proportional weight; a workload in which a provider has no completed units is left out of its composite.

        Like {name:index.time-index}, {name:index.cost-index} aggregates in two geometric-mean steps:

        - Within each workload, a provider's workload cost is the geometric mean of its per-unit costs across all units completed by at least one provider, substituting the highest observed unit cost when a provider failed a unit.
        - Across workloads in the selected scope, {name:index.cost-index} is the unweighted geometric mean of those workload costs, over the workloads the provider has a cost for; a workload it has no result on is left out.

        In {name:index.time-vs-cost}, each provider is plotted by two coordinates: Time Over the Costed Units ({axis:time-index}, lower is better) and Composite Cost ({axis:cost-index}, in USD, lower is better). Providers down and to the left deliver both faster execution and lower billed cost, forming the Pareto frontier.

        For every provider with a valid {name:index.cost-index}, the {axis:cost-index} coordinate is its {name:index.cost-index} value and the {axis:time-index} coordinate is the geometric mean of its workload times restricted to the costed units, using the same equal workload weights and missing-unit substitution rules as {name:index.time-index} and {name:index.cost-index}.

        To keep both axes directly comparable when a provider has cost data for only a subset of units, {name:index.time-vs-cost} computes each workload's time over the same set of costed units that enter that provider's {name:index.cost-index} calculation.
      setup: '{param:content.index_copy.details.time.how_it_is_measured}'
      workload: |-
        The {name:section.overview} tab combines BoxRouter's real-world software engineering and continuous integration workloads into three top-level views: {name:index.time-index}, {name:index.cost-index}, and {name:index.time-vs-cost}.

        The scope selector offers three scopes: Execution (the default), which combines {name:test.deepswe}, {name:test.terminal-bench-4-0}, and {name:test.ci-jobs}; Coding, which combines the two agentic coding workloads ({name:test.deepswe} and {name:test.terminal-bench-4-0}); and CI, which is {name:test.ci-jobs} alone.

        {name:test.r2e-gym} is excluded from the Overview composite and ranked on its own leaderboard because its group-of-five snapshot-and-fork trial structure measures reinforcement learning rollouts rather than single-sandbox execution.

        Every trial cost comes from the provider's billing API or published list rates in `cost-method.json` (sandbox-provider-pricing) over the full sandbox lifetime from creation to confirmed deletion.

        {name:index.time-vs-cost} plots each provider in the Execution scope ({name:test.deepswe}, {name:test.terminal-bench-4-0}, and {name:test.ci-jobs}). The view selector also offers per-workload scatter plots for each individual workload.
      trial_steps: '{param:content.index_copy.details.time.calculation}'
      procedure: |-
        {name:index.time-index} runs no separate trials of its own; it aggregates the completed trial records of the constituent workloads in the selected scope. Every underlying trial follows the sandbox sizing, image pinning, guest-clock timing, and post-run verification rules defined on the {name:test.deepswe}, {name:test.terminal-bench-4-0}, and {name:test.ci-jobs} methodology pages.

        {name:index.cost-index} uses the same underlying trials as {name:index.time-index}. For each successful trial, the harness sums the provider-sourced cost of the sandbox from `create` to `destroy` and scales per-unit costs to cost per 1,000 successes where displayed on individual workload pages.
      how_to_read: '{param:content.index_copy.details.time.how_to_read}'
      cost_summary: '{param:content.index_copy.description}'
      cost_how_to_read: '{param:content.index_copy.details.time.cost_how_to_read}'
      limitations:
      - '[[tests: all]]Adds no completeness requirement beyond the underlying workloads. A workload a provider has no result on is left out of its composite; a unit it did not complete in a workload it ran takes the slowest observed time.'
      - '[[tests: all]]{param:reader.common.blocks.overview.limit_guest_clock}'
      statistics_rules: |-
        Switching the statistic selector between {name:statistic.median}, {name:statistic.mean}, and {name:statistic.p95} recomputes each unit's summary statistic first, then takes the geometric mean across units in each workload, and finally takes the geometric mean across workloads in the scope.

        Both coordinates of {name:index.time-vs-cost} update together when the statistic selector switches between {name:statistic.median}, {name:statistic.mean}, and {name:statistic.p95}; providers are plotted on the two-dimensional plane rather than given a single combined scalar rank.
      failure_policy: |-
        A workload a provider has no result on, including one marked {param:content.ranking_statuses.not_offered.label} or {param:content.ranking_statuses.account_limit.label} for it, is left out of that provider's composite; other providers keep it. Providers with zero completed units across all workloads in the selected scope are not displayed.

        A provider is omitted from {name:index.cost-index} and {name:index.time-vs-cost} and listed under {param:content.ranking_statuses.not_displayed.label} {param:reader.common.blocks.overview.omitted_when}
  cost-index:
    headline: Composite cost
    notes:
      introduction: '{param:content.index_copy.details.cost.what_this_measures}'
      metric: "{name:index.cost-index} is the unweighted geometric mean of a provider's workload costs across the workloads in the selected scope."
      setup: '{param:content.index_copy.details.cost.how_it_is_measured}'
      trial_steps: '{param:content.index_copy.details.cost.calculation}'
      how_to_read: '{param:content.index_copy.details.cost.how_to_read}'
      cost_summary: '{param:content.index_copy.description}'
      cost_how_to_read: The bar shows the geometric mean of a provider's workload costs in USD across the selected scope; lower is better.
      limitations:
      - Requires a provider-reported or list-rate-calculated cost for every counted trial; if any counted trial lacks a provider-sourced cost or has a zero unit cost, the provider has no composite cost.
  time-vs-cost:
    notes:
      introduction: '{param:content.index_copy.details.time_vs_cost.what_this_measures}'
      metric: "{name:index.time-vs-cost} is the point plotted for each provider, with Time Over the Costed Units on the {axis:time-index} and Composite Cost on the {axis:cost-index}."
      setup: '{param:content.index_copy.details.time_vs_cost.how_it_is_measured}'
      trial_steps: '{param:content.index_copy.details.time_vs_cost.calculation}'
      how_to_read: '{param:content.index_copy.details.time_vs_cost.how_to_read}'
      cost_summary: '{param:content.index_copy.description}'
      cost_how_to_read: Both axes use the same costed units.
      limitations:
      - Displays only providers that have both a valid {name:index.cost-index} and a {name:index.time-index} over the costed unit set; unpriced providers are listed under {param:content.ranking_statuses.not_displayed.label}.
  deepswe:
    headline_steps: [commands]
    step_notes:
      proxy_start: "Before replay begins, an untimed step starts a proxy on localhost that answers every request with HTTP 403, and the commands run with `HTTP_PROXY`, `HTTPS_PROXY`, `http_proxy` and `https_proxy` pointing at it, matching upstream {name:test.deepswe}'s offline evaluation. The setup before it runs with the network open."
      commands: "Each command is sent as its own call and runs as root under `sh -c`. The sandbox's clock is read just before and just after it in the same call, so the runtime includes starting the shell but no network time."
    tables:
      stage_classes:
      - stage: '{name:stage.test}'
        matches: Test runners (`pytest`, `go test`, `vitest`, `jest`, `mocha`, `npm test`, `tox`, `nox`, `make test`, `test.sh` and similar) and inline verification commands when they are not combined with file-mutation operators
      - stage: '{name:stage.install}'
        matches: Package installs (`pip install`, `uv pip install`, `uv sync`, `npm`/`pnpm`/`yarn install`, `npm ci`, `go mod download`, `go get`)
      - stage: '{name:stage.build}'
        matches: Compilers, build tools, linters and formatters (`go build`/`vet`/`run`, `tsc`, bundlers, `eslint`, `prettier`, `ruff`, `mypy`, `black`, `uv run`, `make`)
      - stage: '{name:stage.write}'
        matches: File-creation and mutation commands (`sed -i`, redirects to a file, `tee`, `patch`, `git apply`/`commit`/`add`/`checkout`/`reset`/`restore`/`rm`/`mv`, heredocs, `mv`, `cp`, `rm`, `mkdir`, `touch`, `chmod`)
      - stage: '{name:stage.read}'
        matches: Every other command, such as repository navigation, search and read-only inspection
      outcomes:
      - outcome: Provider error
        when: A command exits with a code other than the recorded one, a command reaches its time limit, or the sandbox stops answering
    clock: [sandbox]
    notes:
      opening: |-
        {name:test.deepswe} measures how long each sandbox provider takes to execute the shell commands of a realistic software engineering session. We take sessions [[when measured.procedure.variants# == 1: recorded by Claude Opus 5 (high reasoning)]] on real repository tasks in DeepSWE v1.1 and replay their shell commands in order, without the model.

        It shows which providers offer the fastest tool use for a continuously running agent. {param:reader.common.blocks.coding-workloads.replay} Every provider runs the same commands.
      introduction: 'Times the sum of each command''s runtime in a replayed {name:test.deepswe} trace, on the sandbox''s clock, leaving out model speed and agent quality.'
      metric: '{name:test.deepswe} is the sum of command runtimes across a replayed trace. Each command is assigned by a deterministic command-string parser in priority order to one of five mutually exclusive stages: {name:stage.test} -> {name:stage.install} -> {name:stage.build} -> {name:stage.write} -> {name:stage.read}.'
      setup: |-
        Each trial uses a sandbox started from BoxRouter's pinned standard image, with outbound requests refused by a proxy inside the sandbox.
      workload: |-
        The parameters hold ten traces from `datacurve-ai/deep-swe`, one per task. Five of them replay on the standard image, and the run replays those five: adaptix-name-mapping-aliases, aiomonitor-task-snapshots-diff, awilix-async-container-initialization, mobly-grouped-test-barriers and yjs-map-conflict-detection.

        The other five need the Go toolchain, Deno or gcc, which the standard image does not include, so they are not tested yet.

        Candidate traces exclude\1
      trial_steps: '[[steps: create]]Create sandbox; then [[untimed]]clone the task and install its dependencies (untimed); then [[steps: proxy_start]]start loopback deny proxy (untimed); then [[steps: commands]]replay each trace command in order, one call each, in `/app` ({name:stage.read}, {name:stage.write}, {name:stage.install}, {name:stage.build}, {name:stage.test}); then [[steps: patch_check]]verify final git patch SHA-256 (untimed); then [[steps: destroy]]destroy sandbox.'
      cost_how_to_read: '{param:reader.common.blocks.common.cost_reading} {param:content.fact_list.fact_cost_split_rule}'
      limitations:
      - Commands run back to back without LLM thinking pauses (keeping the OS page cache warm and preventing idle auto-pause), and tool time measures in-sandbox execution rather than per-command API round-trip time.
      - '{param:reader.common.blocks.coding-workloads.limit_cpu_counts}'
      - No provider-level network policy is requested, so only the in-sandbox proxy blocks outbound traffic, and tools that ignore `HTTP_PROXY` (such as Node's built-in `fetch`) can still reach the internet.
      - Providers that lazily fetch container image blocks on first read run their first repository commands slower, which tool time captures because users see the same delay.
      - 'All traces[[when measured.procedure.variants# == 1:  come from Claude Opus 5 (high),]] exclude sessions that walk `/` with `find`, background jobs and 30 s timeouts, and include no Rust repository.'
      - Running on {param:measured.environment.size.vcpu} vCPUs rather than DeepSWE's 2 CPUs speeds up multi-threaded builds and starts more parallel test workers than during the original recording.
      - Replaying each trace {param:measured.procedure.trials}× within one batch measures run-to-run spread within that batch, not day-to-day provider drift.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.typical_citation} {param:reader.common.blocks.workloads.ranking}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when every command exits with the code the trace recorded, the final patch written by the task's own `pre_artifacts.sh` has the trace's SHA-256 (git's abbreviated ids cut to seven characters first), and the sandbox is destroyed.
    stages:
      read:
        start: Exec each read command
        end: Command completes
        clock: sandbox
      write:
        start: Exec each write command
        end: Command completes
        clock: sandbox
      install:
        start: Exec each install command
        end: Command completes
        clock: sandbox
      build:
        start: Exec each build command
        end: Command completes
        clock: sandbox
      test:
        start: Exec each test command
        end: Command completes
        clock: sandbox
  terminal-bench-4-0:
    hash_marks:
      environment.image.reference: sha256
    step_notes:
      steps: "Each recorded step is sent as its own call and runs as root: a `Bash` step as `bash -c <command>` in its recorded directory, an `Edit` as a `perl` program and a `Write` as a `base64` decode. The sandbox's clock is read just before and just after each step in the same call."
      destroy: "After the last replayed step, the sandbox is destroyed. There is no end-state check: Terminal-Bench's own tests run in a separate verifier image."
    headline_steps: [steps]
    clock: [sandbox]
    notes:
      opening: |-
        {name:test.terminal-bench-4-0} evaluates agentic terminal work across software engineering, scientific computing, machine learning, hardware CAD, formal theorem proving, and operations. We take Claude Code sessions recorded by Claude Opus 5.5 (max reasoning) from its public leaderboard and replay their shell commands and file edits in order, without the model.

        It shows which providers execute terminal tool calls and file edits fastest across scientific and systems workloads. {param:reader.common.blocks.coding-workloads.replay}
      introduction: 'Times the total guest-clock runtime required to execute recorded Claude Code shell commands and file edits across the selected terminal tasks, with model inference excluded.'
      metric: '{name:test.terminal-bench-4-0} is the sum of step runtimes across a replayed session of Claude Code tool calls and `Bash` commands. `Edit` and `Write` calls (replayed via `perl` and `base64`) are {name:stage.write}; each `Bash` command takes the first stage whose pattern it matches, in the order {name:stage.test} -> {name:stage.install} -> {name:stage.build} -> {name:stage.write}, and otherwise {name:stage.read}.'
      setup: |-
        Each trial uses a sandbox started from BoxRouter's pinned standard image, with the provider's default open network. An untimed setup checks out the benchmark repository at its pinned commit, copies in the task's environment files and installs its dependencies; the replayed steps run as root.
      workload: |-
        The parameters hold ten Harbor sessions, one per task. Five of them replay on the standard image, and the run replays those five: cargo-flight-dispatch, glycan-ms2-elucidation, production-planning, roy-polymorph-cn and session-window-debug. Four tasks need toolchains that the standard image does not include, and batched-eval-parity diverges on a float comparison, so they are not tested yet.
      trial_steps: '[[steps: create]]Create sandbox; then [[untimed]]check out the benchmark repository, copy in the task''s environment files and install dependencies (untimed); then [[steps: steps]]replay all recorded `Bash`, `Edit` (`perl`), and `Write` (`base64`) steps ({name:stage.read}, {name:stage.write}, {name:stage.install}, {name:stage.build}, {name:stage.test}); then [[steps: destroy]]destroy sandbox.'
      cost_how_to_read: '{param:reader.common.blocks.common.cost_reading} {param:content.fact_list.fact_cost_split_rule}'
      limitations:
      - Steps run back to back without LLM pauses, file edits spawn a subprocess (`perl` or `base64`) rather than writing in-process from Node.js, and selection filters out sessions with network installs or background jobs.
      - '{param:reader.common.blocks.coding-workloads.limit_guest_runtime}'
      - Filtering out background jobs, {duration:measured.failure_policy.timeout_seconds.steps} timeouts, subagents and network installs selects shorter, cleaner trajectories than average.
      - Claude Code edits files from its own Node process, while the replay starts a `perl` or `base64` process for each `Edit` and `Write` step.
      - '{param:reader.common.blocks.coding-workloads.limit_cpu_counts}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.typical_citation} {param:reader.common.blocks.workloads.ranking}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when every replayed step exits with the code the session recorded, and the sandbox is destroyed.

        A step whose exit code differs from the recorded one, a step that reaches its time limit, a transport error or a sandbox that stops answering is a provider failure.
    stages:
      read:
        start: Exec each read step
        end: Step completes
        clock: sandbox
      write:
        start: Exec each write step
        end: Step completes
        clock: sandbox
      install:
        start: Exec each install step
        end: Step completes
        clock: sandbox
      build:
        start: Exec each build step
        end: Step completes
        clock: sandbox
      test:
        start: Exec each test step
        end: Step completes
        clock: sandbox
  r2e-gym:
    variant_commits:
      field: task
      table: tasks
      repositories:
        namanjain12/numpy_final: numpy/numpy
        namanjain12/coveragepy_final: nedbat/coveragepy
    step_notes:
      create: "Sandbox 1 then gets one untimed `true` command before its setup."
      restore: "Each rollout sandbox is restored from the snapshot after the previous sandbox's destroy call returns."
      tool_calls: "The harness replays the rollout's recorded tool calls in order in `/testbed`, each as its own script run as root in the background and timed by the sandbox's clock."
      reward: "The harness runs the task's reward command (`timeout 300 bash /root/run_tests.sh`) and times it; the tests may pass or fail, and either is a result."
    headline_steps: [create, reset, snapshot, restore, tool_calls, reward, destroy]
    clock: [runner, sandbox]
    boundary_clock: sandbox
    notes:
      opening: |-
        Reinforcement learning trains a coding agent by running the same repository task repeatedly. A training loop sets up the repository once in a base sandbox, snapshots it, starts a group of rollout sandboxes from the snapshot, lets the policy execute tool calls in each one, and grades each rollout by running the task's test suite.

        Because RL rollouts are short, sandbox lifecycle operations (`create`, `snapshot`, `restore`, and `destroy`) account for a large share of total training time and billed cost.

        {name:test.r2e-gym} measures that complete multi-sandbox cycle on each task. In each trial, one sandbox is set up and snapshotted, and four recorded rollouts run one after another in their own sandboxes restored from that snapshot.
      introduction: 'Times the total time required to execute one complete RL training group: environment setup, snapshotting, four sequential rollout restores, tool execution, test grading, and sandbox cleanup.'
      metric: '{name:test.r2e-gym} is the sum of every timed span across a trial''s {param:measured.procedure.sandboxes_per_trial} sandboxes: one base sandbox and four rollout sandboxes.'
      setup: |-
        Sandbox 1 starts from BoxRouter's pinned standard image. An untimed setup downloads the task's prepared environment archive, pinned by SHA-256, unpacks it and installs the four tools. The four rollout sandboxes are restored from sandbox 1's snapshot.
      workload: |-
        The parameters hold {count:measured.procedure.variants} tasks from `R2E-Gym/R2E-Gym`, each with four recorded rollouts (run1 to run4). The run replays the five tasks that have a prepared archive: numpy-masked-method-lookup, numpy-issubdtype-abstract-types, numpy-apply-axis-empty, numpy-strided-custom-dtype and coveragepy-behavior-flag-rename; the other five are not tested yet.

        The rollouts include both passing (`reward = 1`) and failing (`reward = 0`) runs, mirroring a GRPO training batch where candidate rollouts vary in length and outcome.
      trial_steps: '[[steps: create]]Create sandbox 1, [[steps: reset]]run R2E-Gym''s 17-command reset, [[steps: snapshot]]snapshot and destroy sandbox 1 ({name:stage.setup}); then [[steps: restore]]for each of four rollouts, restore a sandbox from the snapshot ({name:stage.create-from-snapshot}), [[steps: tool_calls]]replay recorded tool calls ({name:stage.tool-calls}), [[untimed]]verify the git patch (untimed), [[steps: reward]]run the test suite ({name:stage.reward}), [[steps: destroy]]and destroy the sandbox ({name:stage.destroy}); then [[untimed]]delete the snapshot (untimed).'
      cost_how_to_read: '{param:reader.common.blocks.common.cost_reading} {param:content.fact_list.fact_cost_split_rule}'
      limitations:
      - The four rollouts in a group run sequentially rather than in a parallel burst, and tool calls run back to back without policy inference pauses.
      - A production RL training loop restores all sandboxes of a group at once, while a trial restores the four one after another, so four simultaneous restores may run slower or faster than four in sequence.
      - Because rollouts spend little time inside tool calls, group time is dominated by sandbox lifecycle overhead and test-suite execution (reward), which is the bottleneck for RL training.
      - Some providers snapshot full VM memory and running processes while others snapshot only the filesystem, and with no background process running at the snapshot the two kinds produce identical state here.
      - Four of the five tasks that run come from NumPy and one comes from coverage.py.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.typical_citation} {param:reader.common.blocks.workloads.ranking}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when every shell tool call exits with its recorded code, each rollout leaves the recorded patch, every step finishes within its limit, and all {param:measured.procedure.sandboxes_per_trial} sandboxes and the snapshot are deleted.

        A tool call whose exit code differs from the recorded one, or a replay that leaves another patch than the recording's, ends the trial with an unknown owner, which counts against the provider; so does any failed `create`, `snapshot`, `restore` or `destroy`.
    stages:
      setup:
        start: Create request is sent
        end: Snapshot call returns
        clock: runner
      create-from-snapshot:
        start: Restore request is sent
        start_after: Previous sandbox's destroy call returns and the restore request is sent
        end: Restore call returns
        clock: runner
      tool-calls:
        start: Exec each tool call
        end: Call exits
        clock: sandbox
      reward:
        start: Reward command is sent
        start_after: Rollout's patch is read (untimed) and the reward command is sent
        end: Reward command returns
        clock: sandbox
      destroy:
        start: Destroy request is sent
        end: Destroy call returns
        clock: runner
  ci-jobs:
    headline_steps: [job_steps]
    step_notes:
      job_steps: "Each of the job's steps runs in order as its own script started in the background, under `bash -e` as the non-root user account (as root where the job itself uses `sudo`), in the checkout with the job's environment; the sandbox's clock times each script from start to exit."
    tables:
      jobs:
      - job: '{name:job.zustand}'
        repository: '`{param:measured.procedure.variants.1.parameters.repository}`'
        commit: '{commit:measured.procedure.variants.1.parameters.repository|measured.procedure.variants.1.parameters.commit}'
        steps: '{param:measured.procedure.variants.1.parameters.steps}'
        toolchain: Node.js, `pnpm`, TypeScript typecheck, Vitest, and build
      - job: '{name:job.fastapi}'
        repository: '`{param:measured.procedure.variants.2.parameters.repository}`'
        commit: '{commit:measured.procedure.variants.2.parameters.repository|measured.procedure.variants.2.parameters.commit}'
        steps: '{param:measured.procedure.variants.2.parameters.steps}'
        toolchain: Python 3.13, `uv`, and `pytest` with coverage
      - job: '{name:job.gin}'
        repository: '`{param:measured.procedure.variants.3.parameters.repository}`'
        commit: '{commit:measured.procedure.variants.3.parameters.repository|measured.procedure.variants.3.parameters.commit}'
        steps: '{param:measured.procedure.variants.3.parameters.steps}'
        toolchain: Go 1.27 module download, vet, and race-detector test suite
      - job: '{name:job.spotify-player}'
        repository: '`{param:measured.procedure.variants.4.parameters.repository}`'
        commit: '{commit:measured.procedure.variants.4.parameters.repository|measured.procedure.variants.4.parameters.commit}'
        steps: '{param:measured.procedure.variants.4.parameters.steps}'
        toolchain: system audio headers, Rust `cargo clippy`, `cargo fmt`, and `cargo build`/test
      - job: '{name:job.jq}'
        repository: '`{param:measured.procedure.variants.5.parameters.repository}`'
        commit: '{commit:measured.procedure.variants.5.parameters.repository|measured.procedure.variants.5.parameters.commit}'
        steps: '{param:measured.procedure.variants.5.parameters.steps}'
        toolchain: '`autoreconf`, `./configure`, `make`, and `make check`'
      - job: '{name:job.gson}'
        repository: '`{param:measured.procedure.variants.6.parameters.repository}`'
        commit: '{commit:measured.procedure.variants.6.parameters.repository|measured.procedure.variants.6.parameters.commit}'
        steps: '{param:measured.procedure.variants.6.parameters.steps}'
        toolchain: JDK 21 and `mvn test --batch-mode`
    clock: [sandbox]
    notes:
      opening: |-
        {name:test.ci-jobs} measures how fast a sandbox executes an end-to-end continuous integration pipeline from a cold start, the batch workload engineering teams offload from hosted CI runners and the verification sequence coding agents run after modifying a repository. We replay six real GitHub Actions jobs from open-source repositories, one per language across Node.js, Python, Go, Rust, C, and Java.

        Every trial downloads its repository checkout, compiler toolchain, system packages, and language dependencies from scratch over the provider's network. These {name:stage.install} steps are timed and listed apart.

        The job time leaves {name:stage.install} out, because it mostly waits on public package mirrors and CDNs whose speed changes from hour to hour for every provider alike. It measures the sandbox's CPU and disk speed during linting, compilation, and testing.
      introduction: 'Times each job as the sum of its lint, test and build step runtimes on the sandbox''s clock, after setup; {name:job.all} is the geometric mean of the selected jobs.'
      metric: '{name:test.ci-jobs} is the sum of the {name:stage.lint}, {name:stage.test} and {name:stage.build} step runtimes across a job; {name:stage.install} steps are timed and listed apart and are not in the sum. Each step is assigned by the parameter file to one of four stages: {name:stage.install} (`git clone`, `git checkout`, `apt-get`, toolchains, and `pnpm install`, `uv sync`, `go mod download`, `cargo fetch`, `autoreconf`/`./configure`, or Maven) and {name:stage.lint}, {name:stage.test}, or {name:stage.build} (`pnpm test`, `pytest`, `go test`, `cargo test`, `make check`, or `mvn test`).'
      setup: |-
        Each trial uses a sandbox started from BoxRouter's pinned standard image (the non-root user account with passwordless `sudo`, like GitHub's ubuntu-latest runner), with open networking and no cached toolchains, packages, builds or Git state.
      workload: |-
        The workload translates 6 `.github/workflows` jobs from public open-source repositories into self-contained `bash` step sequences pinned to a repository commit. GitHub Actions workflow expressions, matrix variables, `actions/checkout`, and `actions/setup-*` steps become explicit shell commands with caches disabled so each trial clones from GitHub and fetches dependencies from live upstream registries.
      trial_steps: '[[steps: create]]Create sandbox; then [[steps: setup_steps]]execute the {name:stage.install} steps, timed apart; then [[steps: job_steps]]execute the remaining workflow steps across three stages ({name:stage.lint}, {name:stage.test}, {name:stage.build}); then [[steps: destroy]]destroy sandbox.'
      cost_how_to_read: '{param:reader.common.blocks.common.cost_reading} {param:content.fact_list.fact_cost_split_rule}'
      limitations:
      - Every trial starts cold without dependency caches or pre-baked SDK images, and live downloads from GitHub, npm, PyPI, crates.io, and Maven Central include upstream registry variance.
      - Teams that keep warm dependency caches on network volumes, snapshots or prebuilt custom images wait much less on {name:stage.install} than the cold-start times measured here.
      - Downloading Go, rustup, uv, Temurin JDK, Maven and `apt` build packages that GitHub's hosted ubuntu-latest image pre-installs makes {name:stage.install} longer here than on a hosted GitHub runner.
      - The suite covers one representative workflow per language on Linux x86-64 (`linux/amd64`) only.
      - The gin test suite binds port 8080, which collides with the port Blaxel reserves for its internal sandbox API.
      - Blaxel stores the sandbox filesystem entirely in RAM, and BoxRouter does not yet mount external volumes on Blaxel, which limits disk-heavy Rust builds such as spotify-player.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.typical_citation} {param:reader.common.blocks.workloads.ranking}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        Every step in the job must exit 0. A step that exits non-zero or reaches its limit ends the trial as a provider failure, whatever its cause.

        One retry exists: a setup step download that an upstream registry refuses for load (HTTP 429, 502, 503 or 504) is repeated in place, up to five times with growing waits, while it still fits the step's time limit. Setup steps are timed apart from the job time.
    stages:
      install:
        start: Exec each install step
        end: Step exits
        clock: sandbox
      lint:
        start: Exec each lint step
        end: Step exits
        clock: sandbox
      test:
        start: Exec each test step
        end: Step exits
        clock: sandbox
      build:
        start: Exec each build step
        end: Step exits
        clock: sandbox
  sequential-tti:
    clock: [runner]
    headline: Create to first command
    headline_steps: [create, first_command]
    step_notes:
      first_command: Sent once by the benchmark script, as soon as `create` returns, with no ready check before it and no retry. A not-ready answer (HTTP 502, 503 or 504, or a refused or reset connection) ends the trial like any other error.
    notes:
      opening: '{param:reader.common.blocks.create.opening}'
      introduction: 'Times each sandbox from its create request until its first command returns.'
      metric: '{name:test.sequential-tti} is the duration from the start of `create` until the first command inside the sandbox returns its expected output, computed as the sum of {name:stage.create} and {param:measured.procedure.stages.1.name}.'
      setup: |-
        Each trial starts one sandbox from the provider's prepared copy of BoxRouter's pinned standard image, with nothing added.
      trial_steps: '[[steps: create]]Call `create` ({name:stage.create}) [[steps: first_command]]and immediately dispatch the selected first command ({param:measured.procedure.stages.1.name}); then [[steps: destroy]]destroy the sandbox.'
      procedure: |-
        The {countword:measured.procedure.variants} first-command variants compare bare container readiness (`true`) against the dynamic-linking and filesystem page-in time of loading a language runtime on first touch.
      limitations:
      - '{param:reader.common.blocks.create.limit_layer}'
      - '[[when measured.procedure.concurrency.trials_in_parallel > 1: Up to {param:measured.procedure.concurrency.trials_in_parallel} trials run at once per provider, while the provider''s other benchmarks run beside them on the same account, so other sandboxes of the run can be in flight on the provider''s infrastructure.]]'
      - Providers that lazily stream container filesystem blocks pay only for the blocks that `/bin/bash`, `python3`, `node` and `git` touch, not for the full pinned image.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        Each trial gives one reading, and confidence intervals resample trials. {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when its sandbox completes `create`, its first command exits 0, and the sandbox is destroyed.
    stages:
      create:
        start: Create request is sent
        end: Create call returns
        clock: runner
      first-command:
        start: '`{command}` request is sent'
        start_after: Create returns and the `{command}` request is sent
        end: '`{command}` returns its exit code'
        clock: runner
  burst-tti:
    step_notes:
      create: "{name:stage.create} in a burst runs from the first `create` request sent to the last `create` call returned."
      ready: "{param:measured.procedure.stages.1.name} is measured as the time from the last `create` call returned to the last sandbox's first successful `true`. {name:stage.create} and {param:measured.procedure.stages.1.name} add up to the burst time. As each individual `create` call returns, its coroutine immediately sends `true` ({duration:measured.failure_policy.timeout_seconds.ready_attempt} per-attempt timeout)."
    headline_steps: [create, ready]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.create.opening}'
      introduction: 'Times each burst from the first dispatched create request until every sandbox''s first command returns.'
      metric: |-
        {name:test.burst-tti} is the duration of an N-sandbox wave from the first dispatched `create` request until every sandbox completes both `create` and its first `true` command, computed as max(end_i) - min(start_i) across the N sandboxes. The burst time is the sum of two parts:

        - {name:stage.create}: from the first `create` request sent to the last `create` call returned.
        - {param:measured.procedure.stages.1.name}: from the last `create` call returned to the last sandbox's first successful `true`.

        Each sandbox's own times are reported beside the burst and are not parts of it. A sandbox's create time is its own `create` call, its ready time runs from its own `create` call returning to its first successful `true` (retries included), and its TTI runs from its own `create` request to that `true`. Each of these per-sandbox times is summarized per burst as the median, the slowest and, when at least {param:measured.statistics.tail.min_successes} sandboxes answered, the p95; across trials the result is the median of the medians, the slowest of the slowests and the median of the p95s.
      setup: |-
        Each trial launches N sandboxes in parallel from the provider's prepared copy of BoxRouter's pinned standard image, with nothing added to the image in any trial. Bursts on a provider run one at a time, so only one burst's N sandboxes are in flight at once.
      trial_steps: '[[untimed]]Initialize N provider creation contexts (untimed); then [[steps: create]]dispatch N asynchronous `create` calls together ({name:stage.create}); then [[steps: ready]]as each `create` call returns, run `true` and retry transient not-ready errors ({param:measured.procedure.stages.1.name}); then [[steps: size_probe]]probe the sandbox sizes (untimed) [[steps: destroy]]and destroy all N sandboxes together.'
      limitations:
      - The N sandboxes in a burst contend with one another by design and are not comparable to sequential starts; burst sizes above the concurrency limit of BoxRouter's account with a provider are not run and show as {param:content.ranking_statuses.account_limit.label}.
      - '{param:reader.common.blocks.create.limit_layer}'
      - One burst yields one burst-time data point, not one TTI sample per sandbox, because its sandboxes share account rate limits, scheduler queues and host placement at the same instant.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        Each N-sandbox wave yields one burst-time reading (up to {param:measured.procedure.trials} readings for each burst-size variant). {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        If a burst size exceeds the concurrency limit of BoxRouter's account with the provider, that variant is marked {param:content.ranking_statuses.account_limit.label} rather than failed. A trial succeeds only when all N sandboxes in the burst complete `create` and `true` within timeout and all N sandboxes are destroyed; if any single sandbox in the wave fails or times out, the entire burst trial fails.

        A trial whose N create requests were sent over more than {param:measured.failure_policy.exclusion_limits.launch_spread_ms} ms was not launched together; it is excluded as BoxRouter's own failure and replaced by a new trial.
    stages:
      create:
        start: Create requests are sent together
        end: Create call returns
        clock: runner
      first-command:
        start: '`true` requests are attempted'
        start_after: Create returns and the `true` requests are attempted
        end: First successful `true` return; retried if sandbox isn't ready
        clock: runner
  exec-latency-per-100-calls:
    headline_steps: ["true"]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.exec.opening}'
      page_introduction: 'Times calls to a command with almost no runtime, one call alone and {param:measured.procedure.variants.0.parameters.calls} calls in a row.'
      introduction: 'Times {param:measured.procedure.variants.0.parameters.calls} calls in a row to a command with almost no runtime and adds up their times.'
      metric: '{name:test.exec-latency-per-100-calls} is the sum of the {param:measured.procedure.variants.0.parameters.calls} sequential `true` call durations inside a single sandbox trial, measuring the cumulative command-dispatch overhead a chatty external agent pays over a {param:measured.procedure.variants.0.parameters.calls}-step session.'
      setup: '{param:reader.common.blocks.common.sandbox}.'
      workload: '{param:reader.common.blocks.exec.shared_workload}'
      trial_steps: '[[steps: create]]Create sandbox; then [[steps: true]]send {param:measured.procedure.variants.0.parameters.calls} sequential `true` commands wrapped in sandbox clock readings, timing each call at the provider''s own time until the exit code and the clock readings return; then [[steps: destroy]]destroy sandbox (untimed).'
      limitations:
      - '[[tests: exec-latency-per-100-calls]]Summing {param:measured.procedure.variants.0.parameters.calls} calls per sandbox smooths out single-call time spikes that do not persist across the whole sandbox session; use {name:test.exec-latency} to inspect per-call {name:statistic.p95} tail spikes.'
      - '[[tests: all]]{param:reader.common.blocks.exec.limit_network}'
      - '[[tests: all]]{param:reader.common.blocks.exec.limit_warm}'
      - '[[tests: all]]{param:reader.common.blocks.exec.limit_wrapper}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        For {name:test.exec-latency}, each trial contributes the median of its calls, and the headline statistics are taken over those trial values, like every other benchmark.

        For {name:test.exec-latency-per-100-calls}, each trial produces one summed duration across its {param:measured.procedure.variants.0.parameters.calls} calls (up to {param:measured.procedure.trials} trial values for each provider). {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when all {param:measured.procedure.variants.0.parameters.calls} sequential `true` calls exit 0 and the sandbox is destroyed.
  exec-latency:
    headline_steps: ["true"]
    clock: [runner]
    notes:
      introduction: 'Times one call to a command with almost no runtime, from the request until its result returns.'
      metric: '{name:test.exec-latency} is the duration of a single `true` call (a command with almost no runtime) on a warm sandbox. Each trial''s value is the median of its {param:measured.procedure.variants.0.parameters.calls} calls.'
  list:
    headline_steps: [list]
    clock: [runner]
    notes:
      introduction: 'Times listing a directory containing {param:measured.procedure.variants.0.parameters.file_count} empty files and returning their sorted names, at the provider''s own time.'
      metric: '{name:test.list} is the duration of a single `files.list` call on `/workspace/prim/list` returning the sorted names of {param:measured.procedure.variants.0.parameters.file_count} empty files. Each trial''s value is the median of its {param:measured.procedure.variants.0.parameters.repetitions} calls.'
  read-4kib:
    headline_steps: [read]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.files.opening}'
      page_introduction: 'Times listing a directory and reading and writing a {size:measured.procedure.variants.0.parameters.bytes} file in a sandbox, at the provider''s own time.'
      introduction: 'Times reading a {size:measured.procedure.variants.0.parameters.bytes} file from the sandbox and returning its contents, at the provider''s own time.'
      metric: '{name:test.read-4kib} is the duration of a single `files.read` call reading the {size:measured.procedure.variants.0.parameters.bytes} file `/workspace/prim/file-4kib.bin`. Each trial''s value is the median of its {param:measured.procedure.variants.0.parameters.repetitions} sequential reads.'
      setup: |-
        Each trial uses one shared sandbox created from BoxRouter's pinned standard image across all three file benchmarks.
      workload: |-
        The {param:measured.parameters.workload.file-list.count} empty files in `/workspace/prim/list` are named f000 through f199. The {param:measured.parameters.workload.payloads.file-4kib.bytes}-byte payload is that many copies of the letter x.
      trial_steps: '[[steps: create]]Create sandbox and create {param:measured.parameters.workload.file-list.count} empty files (untimed); [[steps: list]]call `files.list` {param:measured.procedure.variants.0.parameters.repetitions} times back to back ({name:test.list}); [[steps: write]]call `files.write` {param:measured.procedure.variants.0.parameters.repetitions} times ({name:test.write-4kib}); [[steps: read]]call `files.read` {param:measured.procedure.variants.0.parameters.repetitions} times ({name:test.read-4kib}); then [[steps: destroy]]destroy sandbox (untimed).'
      limitations:
      - '[[tests: list, list-2vcpu-8gib]]Calls to `files.list` run no command in the sandbox, so only their provider time is published.'
      - '[[tests: write-4kib, write-4kib-2vcpu-8gib]]Each `files.write` call includes BoxRouter''s staging step (writing the bytes to a private path and copying them into place in the same call), and writes two through {param:measured.procedure.variants.0.parameters.repetitions} overwrite the existing file.'
      - '[[tests: write-4kib, write-4kib-2vcpu-8gib]]Because of the staging step a write takes several provider requests and is slower than a read, which is the path a BoxRouter user takes.'
      - '[[tests: read-4kib, read-4kib-2vcpu-8gib]]Because the file was just written in the same sandbox, the sandbox''s page cache may serve the reads, so they measure the file API''s per-call overhead rather than disk speed.'
      - '[[tests: all]]{param:reader.common.blocks.files.limit_warm}'
      - '[[tests: all]]{param:reader.common.blocks.files.limit_provider_work}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        In {name:test.list}, {name:test.write-4kib}, and {name:test.read-4kib}, each trial contributes the median of its {param:measured.procedure.variants.0.parameters.repetitions} calls of each operation, and the headline median, mean, and {name:statistic.p95} are taken over those trial values, while bootstrap confidence intervals resample trials. {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when the directory setup completes, every `files.list`, `files.write` and `files.read` call returns without an error, and the shared trial sandbox is destroyed.
  write-4kib:
    headline_steps: [write]
    clock: [runner]
    notes:
      introduction: 'Times staging and writing a {size:measured.procedure.variants.0.parameters.bytes} payload to a sandbox file, at the provider''s own time.'
      metric: '{name:test.write-4kib} is the duration of a single `files.write` call transferring a {size:measured.procedure.variants.0.parameters.bytes} payload to `/workspace/prim/file-4kib.bin`. Each trial''s value is the median of its {param:measured.procedure.variants.0.parameters.repetitions} sequential writes.'
  pause-resume:
    headline_steps: [resume, data_back]
    step_notes:
      data_back: "The data read-back command reads the entire payload with `dd` (`iflag=direct` where supported). An untimed check then verifies its SHA-256 digest."
      load: "An untimed load step generates the selected payload and records its SHA-256 digest."
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.pause-resume.opening}'
      introduction: 'Times a sandbox''s pause, its resume and a file read afterwards, under different disk loads.'
      metric: '{name:test.pause-resume} is the sum of two timed post-pause stages: {name:stage.resume} (the `resume` API call) and {name:stage.read} (the command that reads the full seeded payload; an untimed check then verifies its SHA-256 digest), charted alongside {name:stage.pause} (the `pause` API call).'
      setup: '{param:reader.common.blocks.common.sandbox}.'
      workload: |-
        The {count:measured.procedure.variants} data-load variants are {name:variant.empty} ({param:measured.procedure.variants.0.parameters.bytes}-byte marker file), {name:variant.memory-1gib} (pinned in a live process), and {size:measured.procedure.variants.2.parameters.bytes}, {size:measured.procedure.variants.3.parameters.bytes}, or {size:measured.procedure.variants.4.parameters.bytes} on disk ({size:measured.procedure.variants.4.parameters.bytes} is the default headline variant). Every payload is filled from a seeded pseudo-random stream (`seed = {param:measured.procedure.variants.0.parameters.seed}`) so storage deduplication or zero-page compression cannot short-circuit the state transfer.
      trial_steps: '[[steps: create, load]]Create sandbox, generate the selected payload, drop the page cache on disk variants where permitted, and wait 60 s for disk writeback to settle (untimed); then [[steps: pause]]call `pause` ({name:stage.pause}); then [[steps: resume]]immediately call `resume` ({name:stage.resume}); then [[steps: data_back]]read the file with `dd` ({name:stage.read}); then [[steps: destroy]]destroy sandbox (untimed).'
      limitations:
      - Evaluates resume time on a single sandbox, sent immediately after the previous pause returns.
      - Only providers with an explicit `pause` command or equivalent are tested.
      - This test does not capture providers' ability to scale down or auto-idle/auto-pause.
      - A completed `pause()` call means the provider reported the sandbox paused, not that all state has reached durable storage, so background uploads after the pause can overlap with `resume`.
      - On the disk variants the load script tries to drop the page cache and reads with `dd iflag=direct` where the sandbox allows it.
      - '{param:reader.common.blocks.pause-resume.limit_architecture}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        Providers that do not support `pause` and `resume` are shown as {param:content.ranking_statuses.in_development.label}. A trial succeeds only when `pause`, `resume`, and {name:stage.read} complete within timeout, the post-resume SHA-256 digest and byte count match the pre-pause payload, and the sandbox is destroyed.
    stages:
      pause:
        start: Pause request is sent
        end: Provider reports the sandbox paused and the pause call returns
        clock: runner
      resume:
        start: Resume request is sent
        start_after: Pause call returns and the resume request is sent
        end: Resume call returns
        clock: runner
      read:
        start: Read command is sent
        start_after: Resume call returns and the read command is sent
        end: Read result and sandbox clock readings return
        clock: runner
  delayed-resume:
    step_notes:
      wait: "For auto-idle providers, the sandbox is left untouched for that wait so it can enter standby on its own."
      destroy: "For auto-idle providers, the harness compares the client's monotonic gap between the two reads with the progress of the sandbox's `/proc/uptime`, to verify that the kernel was frozen for at least 5 s during the wait."
    headline_steps: [resume, data_back]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.pause-resume.opening}'
      introduction: 'Times reading data from a sandbox that was paused or idle for {duration:measured.procedure.variants.0.parameters.wait_seconds}, {duration:measured.procedure.variants.1.parameters.wait_seconds} or {duration:measured.procedure.variants.2.parameters.wait_seconds}.'
      metric: '{name:test.delayed-resume} is the sum after the wait of two timed stages: {name:stage.resume} (`resume` for explicit-pause providers, or 0 for auto-idle providers that wake on command) and {name:stage.read} (reading back the {param:measured.procedure.variants.0.parameters.bytes}-byte marker file with `dd`).'
      setup: '{param:reader.common.blocks.common.sandbox}.'
      workload: |-
        The {param:measured.procedure.variants.0.parameters.bytes}-byte marker file is generated from a seeded pseudo-random stream (`seed = {param:measured.procedure.variants.0.parameters.seed}`), and {duration:measured.procedure.variants.2.parameters.wait_seconds} is the default headline view. The three wait durations ({duration:measured.procedure.variants.0.parameters.wait_seconds}, {duration:measured.procedure.variants.1.parameters.wait_seconds}, and {duration:measured.procedure.variants.2.parameters.wait_seconds}) test whether a paused or idle sandbox is evicted from local host memory to colder network storage as idle time grows.
      trial_steps: '[[steps: create, control, pause, wait]]Create sandbox, write {param:measured.procedure.variants.0.parameters.bytes}-byte marker, read it once (control), call `pause` if supported, and wait {duration:measured.procedure.variants.0.parameters.wait_seconds}, {duration:measured.procedure.variants.1.parameters.wait_seconds}, or {duration:measured.procedure.variants.2.parameters.wait_seconds} (untimed); then [[steps: resume]]call `resume` where supported ({name:stage.resume}); then [[steps: data_back]]read the {param:measured.procedure.variants.0.parameters.bytes}-byte marker file again with `dd` ({name:stage.read}); then [[steps: destroy]]verify standby duration and destroy sandbox (untimed).'
      limitations:
      - Waits longer than {name:page.common}'s idle timeout (the {duration:measured.procedure.variants.2.parameters.wait_seconds} variant) may include a new TCP and TLS handshake in the post-wait call, and auto-idle providers that fail to enter standby during a positive wait have their metric withheld.
      - Blaxel has no pause to call; its sandbox stands by on its own after about 15 s idle, and the first read after the wait wakes it, so `read` includes the wake.
      - Auto-idle providers are not applicable at {duration:measured.procedure.variants.0.parameters.wait_seconds}, because their sandbox cannot stand by within it and an immediate read would compare a running sandbox with a resumed one.
      - '{param:reader.common.blocks.pause-resume.limit_architecture}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when all steps complete within timeout, the post-wait marker read matches the pre-wait SHA-256 digest, and the sandbox is destroyed. On positive wait variants ({duration:measured.procedure.variants.1.parameters.wait_seconds} and {duration:measured.procedure.variants.2.parameters.wait_seconds}), an auto-idle provider whose guest `/proc/uptime` kept advancing throughout the wait (never entering standby) has its metric withheld.
    stages:
      resume:
        start: Resume request is sent after the selected wait
        end: Resume call returns
        clock: runner
      read:
        start: Read command is sent
        start_after: Resume call returns and the read command is sent
        end: Read result and sandbox clock readings return
        clock: runner
  snapshot-and-restore:
    step_notes:
      write_marker: "Each trial writes {param:measured.parameters.workload.marker.text} to `/workspace/snapshot/marker`."
      snapshot: "The harness times `snapshots.create`."
      destroy_source: "The harness destroys the source sandbox untimed so the restore cannot depend on the live parent container."
    headline_steps: [snapshot, restore, first_commands]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.snapshots.opening}'
      introduction: 'Times how long a provider takes to save a sandbox snapshot, create a new sandbox from it, and run the first Python, Node.js, and git command.'
      metric: '{name:test.snapshot-and-restore} is the sum of three timed stages: {name:stage.snapshot} (saving the configured source sandbox), {name:stage.create-from-snapshot} (booting a new sandbox after the source sandbox is destroyed), and {name:stage.load-runtimes} (running the first chained `python3`, `node`, and `git` command inside the restored sandbox).'
      setup: |-
        Each trial uses {param:measured.procedure.sandboxes_per_trial} sequential sandboxes created from BoxRouter's pinned standard image on providers that support the snapshots capability.
      workload: |-
        The {name:stage.load-runtimes} step is sent as soon as `restore` returns, importing standard-library modules in `python3` (json, `sqlite3`, ssl, asyncio, `urllib.request`, `email.parser`, `xml.etree.ElementTree`) and `node` (crypto, zlib, http) and running `git --version` to fault in binary and library pages from the snapshot.
      trial_steps: '[[steps: create, write_marker]]Create source sandbox and write a marker file (untimed); [[steps: snapshot]]take a snapshot ({name:stage.snapshot}); [[steps: destroy_source]]destroy source sandbox and confirm deletion (untimed). [[steps: restore]]Restore a new sandbox from the snapshot ({name:stage.create-from-snapshot}) [[steps: first_commands]]and run the chained Python, Node.js, and git command ({name:stage.load-runtimes}). [[steps: verify_marker, destroy]]Verify the marker file, destroy the restored sandbox, and delete the snapshot (untimed).'
      limitations:
      - Providers differ in whether snapshots capture filesystem state alone or both filesystem and memory.
      - E2B snapshots capture the VM memory as well as the filesystem, while Modal, Vercel and Daytona capture the filesystem only; a snapshot that keeps memory takes longer to save and may start faster.
      - Providers handle the source sandbox differently during `snapshots.create` (Vercel stops it, E2B pauses it briefly, Modal and Daytona keep it running), and the procedure destroys it before every restore.
      - '{param:reader.common.blocks.snapshots.limit_modal_delete}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when {name:stage.snapshot}, {name:stage.create-from-snapshot}, and {name:stage.load-runtimes} complete within timeout, the restored sandbox contains the expected `/workspace/snapshot/marker` content, and both sandboxes and the snapshot are deleted.
    stages:
      snapshot:
        start: '{param:reader.common.blocks.snapshots.snapshot_stage_start}'
        end: '{param:reader.common.blocks.snapshots.snapshot_stage_end}'
        clock: runner
      create-from-snapshot:
        start: Restore request is sent
        start_after: Source sandbox's destroy call returns and the restore request is sent
        end: Restore call returns with the new sandbox
        clock: runner
      load-runtimes:
        start: Runtime command is sent
        start_after: Restore returns and the runtime command is sent
        end: Command returns its result
        clock: runner
  fork:
    headline_steps: [restore, first_commands]
    step_notes:
      create: "Those setup steps are recorded in the trial data ({name:test.snapshot-and-restore} times them directly) and excluded from the {name:test.fork} bar."
      delete_snapshot: "After Fork {param:measured.procedure.variants.0.parameters.restores} is destroyed, the snapshot is deleted."
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.snapshots.opening}'
      introduction: 'Times how long a provider takes to create {param:measured.procedure.variants.0.parameters.restores} sequential sandboxes from a single snapshot and run the first Python, Node.js, and git command in each fork.'
      metric: '{name:test.fork} is the sum across all {param:measured.procedure.variants.0.parameters.restores} sequential forks of two timed stages: {name:stage.create-from-snapshot} (creating each sandbox from the shared trial snapshot) and {name:stage.load-runtimes} (running the chained Python, Node.js, and git command inside each fork).'
      setup: |-
        Each trial uses {param:measured.procedure.sandboxes_per_trial} sequential sandboxes (1 source sandbox and {param:measured.procedure.variants.0.parameters.restores} sequential forks) created from BoxRouter's pinned standard image on providers that support the snapshots capability.
      workload: |-
        The marker file `/workspace/snapshot/marker` contains {param:measured.parameters.workload.marker.text}. In each fork, {name:stage.load-runtimes} is sent as soon as `restore` returns, importing `python3` (json, `sqlite3`, ssl, asyncio, `urllib.request`, `email.parser`, `xml.etree.ElementTree`) and `node` (crypto, zlib, http) modules and running `git --version` to fault in pages from the snapshot.
      trial_steps: '[[steps: create, snapshot, destroy_source]]Create source sandbox, write marker file, take one snapshot, and destroy source sandbox (untimed on the {name:test.fork} chart); then [[steps: restore]]for each of {param:measured.procedure.variants.0.parameters.restores} sequential forks, restore a sandbox from the snapshot ({name:stage.create-from-snapshot}) [[steps: first_commands]]and immediately run the Python, Node.js, and git command ({name:stage.load-runtimes}), then [[steps: verify_destroy]]verify the marker and destroy the fork before creating the next; then [[steps: delete_snapshot]]delete the snapshot (untimed).'
      limitations:
      - Forks are created one after another rather than in parallel, so the test isolates sequential snapshot caching (the first fork cold versus later forks warm) rather than concurrent fork contention.
      - '{param:reader.common.blocks.snapshots.limit_modal_delete}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when all {param:measured.procedure.variants.0.parameters.restores} sequential restores and their runtime-load commands succeed within timeout, every fork verifies `/workspace/snapshot/marker`, and all {param:measured.procedure.sandboxes_per_trial} sandboxes and the snapshot are deleted.
    stages:
      snapshot:
        start: '{param:reader.common.blocks.snapshots.snapshot_stage_start}'
        end: '{param:reader.common.blocks.snapshots.snapshot_stage_end}'
        clock: runner
      create-from-snapshot:
        start: Restore request is sent
        end: Restore call returns with the fork
        clock: runner
      load-runtimes:
        start: Runtime command is sent
        start_after: Restore returns and the runtime command is sent
        end: Command returns its result
        clock: runner
  image-build-2vcpu-4gib:
    headline_steps: [build]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.image-build.opening}'
      introduction: Times how long a provider takes to prepare a new image layer on top of the selected base image.
      metric: 'Image Build is the duration of `image.prepare` ({name:stage.build}), from submitting the new trial image tag until the provider returns a prepared image handle ready to create {machine:measured.environment.size} sandboxes.'
      setup: |-
        Each trial prepares one of {count:measured.procedure.variants} pinned base images with a unique per-trial top layer, without starting a sandbox.
      workload: |-
        The {count:measured.procedure.variants} pinned base images span four groups:

        - standard ({hash:sha256|measured.procedure.variants.0.parameters.base_image})
        - python, `node`, go, rust, and java (Eclipse Temurin)
        - data-science (`jupyter/datascience-notebook`, {imagesize:measured.parameters.variants.data-science.facts.uncompressed_bytes} unpacked)
        - igel, yjs, and dasel (three SWE-bench task images)

        The unique trial-ID layer is a single uncompressed tar archive containing `/etc/boxrouter-trial-id` with a fresh UUID, forcing the provider to ingest a new manifest and top layer while keeping its cache of the base layers.
      trial_steps: '[[untimed]]Append a unique trial-ID layer to the selected base image and push it to the public GHCR trial-image registry (untimed); then [[steps: build]]call `image.prepare` at {machine:measured.environment.size} and wait until the provider returns the prepared image handle ({name:stage.build}); then [[untimed]]delete the provider''s prepared copy and the registry tag (untimed).'
      limitations:
      - Each trial adds one small layer to a pinned base image (so provider base-layer caching remains active, matching incremental user builds), and timings include BoxRouter's build-status polling interval.
      - Vercel starts sandboxes only from its own registry, so the job host copies each missing image layer from GHCR into it, and Vercel's time includes that copy.
      - An image with too few successful trials for a {name:statistic.p95} shows a median and its Slowest trial instead.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.typical_citation} {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when `image.prepare` completes and the provider's prepared image artifact and temporary registry tag are deleted.
  previews:
    step_notes:
      url_poll: "The client host requests the preview URL back to back from the moment the process-start call returns, while an in-sandbox loop checks localhost every {duration:measured.procedure.variants.0.parameters.local_poll_gap_seconds}. {name:stage.between} runs on the client host's monotonic clock from process.start returning until the first public probe succeeds."
      websocket: "The harness times a WebSocket upgrade with subprotocol `{param:measured.procedure.variants.0.parameters.websocket_subprotocol}` and verifies its connected message."
    headline_steps: [start_server, server_listening, url_poll]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.previews.opening}'
      introduction: 'Times the {name:stage.between} span from process.start returning until the first public preview URL probe succeeds.'
      metric: '{name:test.previews} is the duration on the client host''s monotonic clock from process.start returning until the public preview URL first answers HTTP 200 with body {param:measured.procedure.variants.0.parameters.expected_body} on `{param:measured.procedure.variants.0.parameters.path}`.'
      setup: |-
        Each trial uses a sandbox created from BoxRouter's pinned standard image with port {param:measured.procedure.variants.0.parameters.port} exposed as a public preview URL, running a pre-bundled Vite {version:measured.source.ids.2} archive (`previews-app.tar`, verified by {hash:SHA-256|measured.parameters.workload.app.sha256}).
      trial_steps: '[[steps: create]]Create sandbox with a port {param:measured.procedure.variants.0.parameters.port} preview, [[steps: upload]]download and check the Vite archive, [[steps: open_preview]]and open the preview URL (timed, not charted); [[steps: start_server]]start Vite (start-server), [[steps: url_poll]]poll the preview URL until it answers [[steps: server_listening]]and poll `127.0.0.1:{param:measured.procedure.variants.0.parameters.port}` (server-listening); [[steps: request]]send {param:measured.procedure.variants.0.parameters.requests} sequential `GET /ping.txt` requests on a kept-alive connection (request); [[steps: websocket]]test a vite-hmr WebSocket upgrade (websocket) [[steps: destroy]]and destroy the sandbox.'
      limitations:
      - Only providers that support the previews capability are tested (others show {param:content.ranking_statuses.in_development.label}); {name:stage.between} starts when process.start returns and includes both the public HTTP probe and provider edge routing.
      - The in-sandbox loop sleeps {duration:measured.procedure.variants.0.parameters.local_poll_gap_seconds} between attempts, so server listening carries up to that much polling delay. The preview URL poll does not pause between attempts.
      - The request GET calls reuse the connection from url-poll, so request TTFB excludes DNS lookup, TCP connect, and TLS handshake time while including network transit to the provider's preview ingress.
      - 'Vite runs with `allowedHosts: true` and `skipWebSocketTokenCheck: true` so the benchmark script can test HTTP and WebSocket routing directly without a headless browser.'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        Providers that do not support public preview URLs are shown as {param:content.ranking_statuses.in_development.label}. A trial succeeds only when Vite binds locally, the public preview URL returns HTTP 200 with body `{param:measured.procedure.variants.0.parameters.expected_body}`, all {param:measured.procedure.variants.0.parameters.requests} `GET` requests succeed, and the sandbox is destroyed.
    stages:
      server-listening:
        start: Server launch is requested in the sandbox
        end: Localhost in the sandbox first answers HTTP 200 with body ok
        clock: sandbox
      between:
        start: The process.start call returns to the client host
        end: The first successful URL probe after that start edge (HTTP 200 with body ok)
        clock: runner
  reconnect:
    headline_steps: [attach, "true"]
    clock: [runner]
    notes:
      opening: '{param:reader.common.blocks.reconnect.opening}'
      introduction: 'Times attaching to a running sandbox by ID and executing `true` through the new handle in each round.'
      metric: '{name:test.reconnect} is the sum of median `attach` and median `true` operation times, pooled across {param:measured.procedure.variants.0.parameters.rounds} sequential rounds per trial and {param:measured.procedure.trials} trials ({product:measured.procedure.trials*measured.procedure.variants.0.parameters.rounds} reconnect rounds total).'
      setup: '{param:reader.common.blocks.common.sandbox}.'
      workload: |-
        Each round gets a new sandbox handle by looking the sandbox up by ID; the client and its connections are the ones the trial already uses.
      trial_steps: '[[steps: create]]Create a sandbox; then [[steps: attach]]in each of the {param:measured.procedure.variants.0.parameters.rounds} sequential rounds, time the `attach` lookup by sandbox ID [[steps: true]]and time the first `true` command through the new handle with guest clock readings; then [[steps: destroy]]destroy the sandbox (untimed).'
      limitations:
      - Provider SDKs differ in how much work happens during `attach` versus the first command (no provider's `attach` pre-opens the command execution socket), so the chart compares the combined `attach + first command` time together.
      - Both `attach` and `true` are timed at the provider's own time.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        All {product:measured.procedure.trials*measured.procedure.variants.0.parameters.rounds} reconnect rounds across the {param:measured.procedure.trials} trials are pooled to compute the headline median, mean, and {name:statistic.p95}, while bootstrap confidence intervals resample whole trials. {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when all {param:measured.procedure.variants.0.parameters.rounds} rounds complete `attach` and `true` with exit code 0 and the sandbox is destroyed.
  7-zip-1-thread:
    clock: [sandbox]
    panel:
      command: 7zzs b -mmt{param:measured.parameters.workload.rows.cpu-7zip-1t.threads}
    headline_steps: [7-zip-1-thread]
    notes:
      opening: '{param:reader.common.blocks.cpu.opening}'
      page_introduction: "Measures integer compute speed with 7-Zip's built-in compression and decompression benchmark, on one thread and on every vCPU."
      introduction: 'Measures single-core integer compute speed with 7-Zip''s built-in compression and decompression benchmark on one thread.'
      metric: '7-Zip is the combined compression and decompression Tot rating of single-core integer compute speed on 7-Zip''s internal LZMA benchmark scale, reported on the Avr summary line of `./7zzs b -mmt{param:measured.parameters.workload.rows.cpu-7zip-1t.threads}`.'
      calculation: '7-Zip runs its built-in LZMA dictionary compression and decompression passes in memory and prints Avr: ratings for compression (CompMIPS), decompression (DecompMIPS), and their combined total (Tot:), which we record directly as the total rating. With `-mmt{param:measured.parameters.workload.rows.cpu-7zip-1t.threads}` it runs on a single thread; with `-mmt{param:measured.environment.size.vcpu}` it spawns {param:measured.environment.size.vcpu} worker threads, sized to the requested vCPU count rather than `nproc`.'
      setup: '{param:reader.common.blocks.common.sandbox}, {param:reader.common.blocks.cpu.setup}'
      workload: |-
        The built-in `7zzs b` benchmark compresses and decompresses synthetic data in memory with LZMA, exercising integer arithmetic, branching, lookup tables, and cache speed without disk or network I/O. Flag `-mmt{param:measured.parameters.workload.rows.cpu-7zip-1t.threads}` isolates single-vCPU throughput in {name:test.7-zip-1-thread}, while `-mmt{param:measured.environment.size.vcpu}` drives both requested vCPUs in {name:test.7-zip-all-vcpus} to measure multi-core scaling, CPU quota throttling, and hyperthread contention.
      trial_steps: '[[steps: create]]{param:reader.common.blocks.machine-performance.trial_start} [[steps: cpu-facts, install-tools]]Record CPU model, flags, cache size, and cgroup limits, then download and check `7zzs` and `stream` (untimed). [[steps: 7-zip-1-thread]]Run `./7zzs b -mmt{param:measured.parameters.workload.rows.cpu-7zip-1t.threads}` and `./7zzs b -mmt{param:measured.environment.size.vcpu}` (sized to the requested vCPUs, never `nproc`) as polled background scripts in shuffled order alongside the memory test, then [[steps: destroy]]destroy sandbox (untimed).'
      procedure: '{param:reader.common.blocks.machine-performance.shared_cpu_mem_procedure}'
      limitations:
      - '[[tests: all]]Evaluates integer compression, branching, and cache lookup operations rather than floating-point or SIMD vector math; sandboxes on a single provider can land on different host CPU models across trials.'
      - '[[tests: all]]The workload exercises no floating-point or wide SIMD instructions, though every trial records whether the sha_ni, avx2 and avx512f flags are present.'
      - '[[tests: all]]{param:reader.common.blocks.cpu.limit_models}'
      - '[[tests: all]]When a provider exposes a higher host core count through `nproc`, the multi-thread test still runs {param:measured.environment.size.vcpu} threads and the CPU count is recorded in the raw data.'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when the `7zzs` binary SHA-256 matches the pinned {hash:SHA-256|measured.parameters.workload.tools.0.sha256}, both `7zzs b` runs exit 0 with a positive Avr: MIPS rating, and the shared sandbox is destroyed.
  7-zip-all-vcpus:
    clock: [sandbox]
    panel:
      command: 7zzs b -mmt{param:measured.environment.size.vcpu}
    headline_steps: [7-zip-all-vcpus]
    notes:
      introduction: 'Measures multi-core integer compute speed using 7-Zip''s built-in benchmark with one thread per requested vCPU (`-mmt{param:measured.environment.size.vcpu}` on a {param:measured.environment.size.vcpu} vCPU sandbox).'
      metric: '{name:test.7-zip-all-vcpus} is the same measurement as {name:test.7-zip-1-thread}, run with one thread per vCPU ({param:measured.environment.size.vcpu} threads).'
  stream-triad:
    clock: [sandbox]
    panel:
      command: OMP_NUM_THREADS={param:measured.environment.size.vcpu} stream
    headline_steps: [stream-triad]
    notes:
      opening: |-
        Data-science workloads, in-memory analytics, and large language or compiler toolchains frequently bottleneck on how fast the system can stream data between main memory (DRAM) and the CPU rather than on raw clock speed. Two providers that sell the same {machine:measured.environment.size} can differ in memory bandwidth, for example by the CPU model a sandbox lands on.

        The Memory tab measures sustainable memory bandwidth using John McCalpin's {name:test.stream-triad} benchmark across arrays sized to bypass CPU caches.
      introduction: 'Measures sustained main-memory bandwidth with the {name:test.stream-triad} benchmark across three 610.4 MiB arrays using one OpenMP thread per requested vCPU.'
      metric: '{name:test.stream-triad} is the sustained main-memory bandwidth of the STREAM Triad kernel (`a[i] = b[i] + scalar * c[i]`) across {param:measured.environment.size.vcpu} OpenMP threads, reported in GB/s of 10^9 bytes/s.'
      calculation: |-
        Each Triad pass streams two double arrays of {size:measured.parameters.workload.stream_array_bytes} each (b and c, eighty million elements each) and writes one double array of {size:measured.parameters.workload.stream_array_bytes} (a), transferring 3 * 640,000,000 = 1,920,000,000 bytes (1.92 GB decimal / 1.83 GiB binary) per pass.

        Across {param:measured.parameters.workload.stream_passes} passes, STREAM discards pass 0, takes the minimum time across the remaining passes, reports Best Rate MB/s (10^6 bytes/s), and we divide by 1,000 to publish `GB/s` (10^9 bytes/s).
      setup: |-
        {param:reader.common.blocks.common.sandbox}, running a static Linux x86_64 build of John D. McCalpin's STREAM {param:measured.source.version} (`stream`, verified by {hash:SHA-256|measured.parameters.workload.tools.1.sha256}).
      workload: The `stream` binary is compiled with 80,000,000 double elements per array ({size:measured.parameters.workload.stream_array_bytes} / 610.4 MiB each, 1.83 GiB total across a, b, and c) and `NTIMES = {param:measured.parameters.workload.stream_passes}`.
      trial_steps: '[[steps: create]]{param:reader.common.blocks.machine-performance.trial_start} [[steps: cpu-facts, install-tools]]Record CPU model, L3 cache size, and memory facts, then download and check the static `stream` binary (untimed). [[steps: stream-triad]]Run `OMP_NUM_THREADS={param:measured.environment.size.vcpu} ./stream` for {param:measured.parameters.workload.stream_passes} passes as a polled background script in shuffled order alongside the 7-Zip tests and verify "Solution Validates", then [[steps: destroy]]destroy sandbox (untimed).'
      procedure: '{param:reader.common.blocks.machine-performance.shared_cpu_mem_procedure}'
      limitations:
      - Measures sequential vector streaming from DRAM rather than random pointer-chasing access time or CPU compute speed; always uses {param:measured.environment.size.vcpu} OpenMP threads for the {param:measured.environment.size.vcpu} requested vCPUs.
      - Where the sandbox reports more than 160 MB of L3 cache, one array is under four times the cache, which breaks STREAM's run rule, and the trial records the cache size in the raw data.
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when the `stream` binary SHA-256 matches the pinned {hash:SHA-256|measured.parameters.workload.tools.1.sha256}, `stream` exits 0, stdout includes Solution Validates and a positive Triad: rate, and the shared sandbox is destroyed. Output that does not validate is counted as BoxRouter's and left out of the results.
  sequential-read:
    clock: [sandbox]
    panel:
      command: fio --rw={param:measured.parameters.workload.rows.disk-seq-read-1m.rw} --bs={param:measured.parameters.workload.rows.disk-seq-read-1m.bs}
    headline_steps: [sequential-read]
    notes:
      opening: '{param:reader.common.blocks.disk.opening}'
      page_introduction: "Measures uncached sequential and random read and write speed of the sandbox's disk with `fio`, using direct I/O (`O_DIRECT`)."
      introduction: 'Measures uncached 1 MiB sequential read throughput from a {size:measured.parameters.workload.file_bytes} file in `/workspace/fio` using direct I/O (`O_DIRECT`) over a {duration:measured.parameters.workload.runtime_seconds} measured window.'
      metric: '{name:test.sequential-read} is the sustained uncached 1 MiB sequential read throughput across the {size:measured.parameters.workload.file_bytes} file `/workspace/fio/data.bin` using direct I/O (`O_DIRECT`), reported by `fio` (`rw={param:measured.parameters.workload.rows.disk-seq-read-1m.rw}`, `bs={param:measured.parameters.workload.rows.disk-seq-read-1m.bs}`) in binary mebibytes per second (2^20 = 1,048,576 bytes/s).'
      calculation: After the {duration:measured.parameters.workload.ramp_seconds} ramp-up finishes, `fio` sums the bytes read or written across the {duration:measured.parameters.workload.runtime_seconds} measured window and reports bytes per second in its terse output, which we divide by 1,048,576 (2^20) to report `MiB/s` for the sequential tests. For the random tests, `fio` counts completed {size:measured.parameters.workload.rows.disk-rand-read-4k.bs} read or write operations across the same window and reports iops directly.
      setup: '{param:reader.common.blocks.common.sandbox}, {param:reader.common.blocks.disk.setup_read}'
      workload: |-
        Every buffer is filled with incompressible pseudo-random bytes so storage compression or deduplication cannot inflate throughput, with `refill_buffers=1` and `fsync=0` on write rows and uniformly distributed offsets on random rows.
      trial_steps: '[[steps: create]]{param:reader.common.blocks.machine-performance.trial_start} [[steps: setup]]{param:reader.common.blocks.disk.prepare} [[steps: sequential-read]]Run the four `fio` rows as polled background scripts in shuffled order, with fresh random buffers on every write, then [[steps: cache-checks, destroy]]{param:reader.common.blocks.disk.finish}'
      procedure: '{param:reader.common.blocks.disk.shared_procedure}'
      limitations:
      - '[[tests: all]]Bypasses the guest OS page cache via `O_DIRECT` to measure the storage path (so it does not reflect small cached file access); {param:reader.common.blocks.disk.rejects_direct_io}, such as Blaxel''s default RAM filesystem.'
      - '[[tests: all]]Blaxel does not provision a disk for their sandboxes. They recommend using volumes, which are not measured by this test.'
      - '[[tests: sequential-write, random-write]]The write rows rewrite an existing {size:measured.parameters.workload.file_bytes} file with `O_DIRECT` and `fsync=0`.'
      - '[[tests: random-read, random-write]]The random rows use a queue depth of 64 asynchronous requests (libaio) to measure storage IOPS ceilings rather than single-threaded synchronous time.'
      - '[[tests: all]]{param:reader.common.blocks.disk.limit_checks}'
      - '[[tests: all]]{param:reader.common.blocks.disk.limit_cached_files}'
      - '[[tests: all]]{param:reader.common.blocks.disk.limit_batch_load}'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: '{param:reader.common.blocks.disk.shared_failures}'
  sequential-write:
    clock: [sandbox]
    panel:
      command: fio --rw={param:measured.parameters.workload.rows.disk-seq-write-1m.rw} --bs={param:measured.parameters.workload.rows.disk-seq-write-1m.bs}
    headline_steps: [sequential-write]
    notes:
      introduction: 'Measures uncached 1 MiB sequential write throughput to a {size:measured.parameters.workload.file_bytes} file in `/workspace/fio` using direct I/O (`O_DIRECT`) over a {duration:measured.parameters.workload.runtime_seconds} measured window.'
      metric: '{name:test.sequential-write} is the sustained uncached 1 MiB sequential write throughput to the {size:measured.parameters.workload.file_bytes} file `/workspace/fio/data.bin` using direct I/O (`O_DIRECT`), reported by `fio` (`rw={param:measured.parameters.workload.rows.disk-seq-write-1m.rw}`, `bs={param:measured.parameters.workload.rows.disk-seq-write-1m.bs}`).'
  random-read:
    clock: [sandbox]
    panel:
      command: fio --rw={param:measured.parameters.workload.rows.disk-rand-read-4k.rw} --bs={param:measured.parameters.workload.rows.disk-rand-read-4k.bs}
    headline_steps: [random-read]
    notes:
      introduction: 'Measures uncached 4 KiB random read operations per second across a {size:measured.parameters.workload.file_bytes} file in `/workspace/fio` using direct I/O (`O_DIRECT`) over a {duration:measured.parameters.workload.runtime_seconds} measured window.'
      metric: '{name:test.random-read} is the sustained uncached 4 KiB random read rate across the {size:measured.parameters.workload.file_bytes} file `/workspace/fio/data.bin` using direct I/O (`O_DIRECT`), reported by `fio` (`rw={param:measured.parameters.workload.rows.disk-rand-read-4k.rw}`, `bs={param:measured.parameters.workload.rows.disk-rand-read-4k.bs}`).'
  random-write:
    clock: [sandbox]
    panel:
      command: fio --rw={param:measured.parameters.workload.rows.disk-rand-write-4k.rw} --bs={param:measured.parameters.workload.rows.disk-rand-write-4k.bs}
    headline_steps: [random-write]
    notes:
      introduction: 'Measures uncached 4 KiB random write operations per second across a {size:measured.parameters.workload.file_bytes} file in `/workspace/fio` using direct I/O (`O_DIRECT`) over a {duration:measured.parameters.workload.runtime_seconds} measured window.'
      metric: '{name:test.random-write} is the sustained uncached 4 KiB random write rate across the {size:measured.parameters.workload.file_bytes} file `/workspace/fio/data.bin` using direct I/O (`O_DIRECT`), reported by `fio` (`rw={param:measured.parameters.workload.rows.disk-rand-write-4k.rw}`, `bs={param:measured.parameters.workload.rows.disk-rand-write-4k.bs}`).'
  hard-links:
    clock: [sandbox]
    panel:
      command: stress-ng --link {param:measured.parameters.workload.options.link}
    headline_steps: [hard-links]
    step_notes:
      hard-links: "The trial runs `./stress-ng --link {param:measured.parameters.workload.options.link} --metrics --no-rand-seed -t 30 --temp-path /workspace/hardlink --yaml /workspace/hardlink/out.yaml` as a polled background script (guest clock)."
      destroy: "The trial parses links-createdremoved-per-sec and bogo-ops-per-second-real-time from `/workspace/hardlink/out.yaml`."
      mount-facts: "An untimed setup step runs a {size:measured.parameters.workload.probe_bytes} shared-memory probe to detect whether `/workspace/hardlink` is backed by RAM (tmpfs/ramfs)."
    notes:
      opening: |-
        Package managers such as `pnpm` install packages by creating thousands of hard links from a global store into the project (`node_modules`).

        Because creating and removing hard links never transfers file data blocks, its speed is governed by the metadata system-call path inside the sandbox: the guest kernel's filesystem and its locking, any overlay filesystem, any layer that intercepts system calls, and single-core CPU speed.

        The Filesystem tab measures that metadata rate in `/workspace/hardlink` using `stress-ng`'s {name:test.hard-links} stressor.
      page_introduction: "Measures the rate at which `stress-ng` creates and removes hard links in `/workspace/hardlink`."
      introduction: 'Measures the rate of hard links created per second in `/workspace/hardlink` over a 30-second `stress-ng` run, with link removal time included.'
      metric: '{name:test.hard-links} is the rate of hard links created per second in `/workspace/hardlink` over an elapsed denominator of both `link()` creation and `unlink()` removal time, reported by `stress-ng`''s `link` stressor (links-createdremoved-per-sec in `out.yaml`).'
      calculation: In each round, a single `stress-ng` worker creates up to 8,192 hard links to a seed inode in `/workspace/hardlink` and then unlinks all of them; at the end of the 30 s run, `stress-ng` divides the total count of successfully created hard links across all rounds by the total elapsed run time (creation plus removal) to report links-createdremoved-per-sec.
      setup: |-
        {param:reader.common.blocks.common.sandbox}, running a static Linux x86_64 build of `stress-ng` V{param:measured.source.version} (verified by {hash:SHA-256|measured.parameters.workload.tool.sha256}).
      trial_steps: '[[steps: create]]{param:reader.common.blocks.machine-performance.trial_start} [[steps: mount-facts, install-stress-ng]]Record the backing filesystem of `/workspace/hardlink`, check that at least {size:measured.parameters.workload.free_bytes} is free, and download and check static `stress-ng` (untimed). [[steps: hard-links]]Run `./stress-ng` ({name:test.hard-links}), then [[steps: destroy]]parse `out.yaml` and destroy sandbox (untimed).'
      limitations:
      - '[[tests: all]]Runs a single-worker system-call loop without calling `fsync`, so the rate reflects both VFS/syscall overhead and single-core CPU speed in memory rather than physical disk write time.'
      - '[[tests: all]]The published metric is individual hard links per second (links-createdremoved-per-sec), not bogo ops/s, because one bogo op is a whole round of up to 8,192 links plus their removal.'
      - '[[tests: all]]Each round creates and unlinks the same 8,192 filenames in `/workspace/hardlink`, so path lookups benefit from the kernel''s directory entry cache after round 1.'
      - '[[tests: all]]The link stressor silently retries a `link()` call that fails with `EDQUOT`, `ENOMEM`, `EMLINK`, `EINTR` or `ENOSPC` without counting it, and the check for at least {size:measured.parameters.workload.free_bytes} of free space prevents `ENOSPC` in normal operation.'
      - '[[tests: all]]When `/workspace/hardlink` is backed by tmpfs or ramfs, or the {size:measured.parameters.workload.probe_bytes} probe raises shared memory by at least 80% of {size:measured.parameters.workload.probe_bytes}, the trial records that in the raw data.'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        Less than {size:measured.parameters.workload.free_bytes} free in `/workspace/hardlink` fails the trial before stress-ng runs, as a provider failure, and so does a downloaded stress-ng whose SHA-256 differs from the pinned one. The trial succeeds only when `stress-ng` exits 0, runs for at least 29 s of its 30 s window, writes a positive links-createdremoved-per-sec value to `out.yaml`, and the sandbox is destroyed.
  package-registries:
    step_notes:
      create: "Each trial uploads the pinned lockfiles (`axios-package.json`, `axios-package-lock.json`, or `fastapi-requirements.txt`) to `/tmp`."
      setup: "The caches `~/.npm` and `~/.cache/pip` are empty when the command runs, and for pip it runs in a new virtualenv."
      install: "A background script runs the variant's install command timed by the sandbox clock ({name:stage.install}, polled every 0.5 s) and verifies the checkout commit or installed package exit code."
    headline_steps: [install]
    clock: [sandbox]
    panel:
      command: git clone · npm ci · pip install -r
    notes:
      opening: |-
        Whenever a developer or coding agent initializes a fresh sandbox without a pre-baked project image, the workflow waits on the sandbox's outbound network connection and disk to clone the repository and install dependencies from public package registries.

        The Network tab ({name:test.package-registries}) measures the guest-clock runtime of {count:measured.procedure.variants} everyday cold-cache installation commands, `git clone` from GitHub, `npm ci` from the npm registry, and `pip install -r` from PyPI.

        Network has one benchmark. It does not test bandwidth or response time on their own: each time combines download speed, the registry's own speed, and the sandbox's CPU and disk while it unpacks.
      introduction: 'Times the in-sandbox command runtime to clone a pinned GitHub repository or install pinned npm or PyPI dependencies from a cold cache, by the sandbox''s own clock.'
      metric: '{name:test.package-registries} is the in-sandbox runtime of the selected cold-cache installation command ({name:stage.install}), measured by the sandbox clock.'
      calculation: |-
        The install time of a trial is the sandbox clock reading just after the command minus the reading just before it. Received Data is the number of bytes the sandbox's network interfaces received while the command ran, read from `/proc/net/dev` just before and just after it, loopback left out, and it also counts the status checks on the running command.

        Both readings are taken by the same script that runs the command, so no request from the job host is inside either figure.
      setup: |-
        {param:reader.common.blocks.common.sandbox} with outbound network access to `github.com`, `registry.npmjs.org`, `pypi.org`, and `files.pythonhosted.org`.
      workload: |-
        Every repository and lockfile is pinned by commit and SHA-256 hash across {countword:measured.procedure.variants} cold-cache installation variants:

        - `git clone` performs a full clone of `fastapi/fastapi` and checks out the pinned {commit:commit|fastapi/fastapi|69ddc2badf9da1123bba4d360225ae6b085985f6}.
        - `npm ci` installs 687 locked packages from the pinned `package.json` and `package-lock.json` of `axios/axios`.
        - `pip install -r` installs into a new virtualenv from a hash-pinned requirements file exported with `uv export --frozen --no-dev --group tests --extra all --no-emit-project` from `fastapi/fastapi`'s `uv.lock`.
      trial_steps: '[[steps: create]]Create sandbox and upload pinned lockfiles (untimed). [[steps: setup]]Run a command as the non-root user that clears `~/.npm` and `~/.cache/pip` and prepares `/workspace` (untimed), [[steps: install]]records `/proc/net/dev` received bytes, runs the selected install command ({name:stage.install}), and records received bytes again. [[steps: destroy]]Destroy sandbox (untimed).'
      limitations:
      - End-to-end install time combines network download speed from public registry CDNs with in-sandbox decompression and filesystem writes; shared registry slowdowns outside a provider's network can affect all providers.
      - Comparing the received bytes, recorded on every trial, with the {name:tab.disk} and {name:tab.filesystem} tabs helps tell a download-bound time from a CPU-bound one.
      - Both `npm ci` and `pip install` make a brief registry check for a newer version of their own CLI at the end of a run, as a developer sees with default flags.
      - '[[when measured.procedure.concurrency.trials_in_parallel > 1: Trials run in parallel per provider, up to {param:measured.procedure.concurrency.trials_in_parallel} at once, so up to that many sandboxes on one provider can download from the registry at once.]]'
      statistics_rules: |-
        {param:reader.common.blocks.common.statistics_citation}

        {param:reader.common.blocks.common.typical_citation} {param:reader.common.blocks.common.complete_cell}
      failure_policy: |-
        {param:reader.common.blocks.common.failures_citation}

        A trial succeeds only when cache clearing and the install command exit 0 and the sandbox is destroyed.
  exec-latency-2vcpu-8gib:
    headline_steps: ["true"]
    clock: [runner]
    notes:
      introduction: "Times each `true` command call at the provider's own time from dispatch until the exit code and the sandbox clock readings return."
      metric: '{name:test.exec-latency-2vcpu-8gib} is the same measurement as {name:test.exec-latency}, taken in a {machine:measured.environment.size} sandbox.'
  list-2vcpu-8gib:
    headline_steps: [list]
    clock: [runner]
    notes:
      introduction: "Times each directory-list request at the provider's own time from dispatch until the sorted file names of the prepared directory return."
      metric: '{name:test.list-2vcpu-8gib} is the same measurement as {name:test.list}, taken in a {machine:measured.environment.size} sandbox.'
  write-4kib-2vcpu-8gib:
    headline_steps: [write]
    clock: [runner]
    notes:
      introduction: "Times each file-write request at the provider's own time from dispatch until the write call returns after staging and copying the payload into place."
      metric: '{name:test.write-4kib-2vcpu-8gib} is the same measurement as {name:test.write-4kib}, taken in a {machine:measured.environment.size} sandbox.'
  read-4kib-2vcpu-8gib:
    headline_steps: [read]
    clock: [runner]
    notes:
      introduction: "Times each file-read request at the provider's own time from dispatch until the complete file payload returns."
      metric: '{name:test.read-4kib-2vcpu-8gib} is the same measurement as {name:test.read-4kib}, taken in a {machine:measured.environment.size} sandbox.'
  hard-links-2vcpu-8gib:
    headline_steps: [hard-links]
    clock: [sandbox]
    notes:
      introduction: "Measures the rate at which one `stress-ng` worker creates and removes hard links in `/workspace/hardlink` on the stressor's own clock."
      metric: '{name:test.hard-links-2vcpu-8gib} is the same measurement as {name:test.hard-links}, taken in a {machine:measured.environment.size} sandbox.'
