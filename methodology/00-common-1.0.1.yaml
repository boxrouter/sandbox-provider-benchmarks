id: sbs.common
version: 1.0.1
effective: "2026-10-25"
name: Common methodology
category: common
description: >-
  Clocks, sizing, trial policy, statistics, cost and failure rules shared by every benchmark.
  A benchmark inherits these and states only what differs.

environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  region_policy: The provider's US region, never a narrower one; ordinary self-serve product, nothing tuned per provider.
  connection_idle_seconds: 300

clocks:
  operation: Monotonic clock of the job host, around each call.
  command_runtime: The sandbox's own clock, read just before and after the command. Total time, runtime and latency (total minus runtime) stay separate.

ready_check:
  command: "true"
  retry_on:
    - HTTP 502
    - HTTP 503
    - HTTP 504
    - connection refused
    - connection reset
  interval_ms: 100
  max_attempts: 40
  attempt_timeout_seconds: 30
  published: false
  skipped_by_benchmarks:
    - sandbox.create.sequential_tti

statistics:
  primary: median
  secondary:
    - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
      - median
      - cost_per_success
  ranking:
    ranked: true
    min_successes: unknown
    failing_often: >-
      A provider failing at least twice, and in more than 1 in 10 of its successes plus provider
      failures, is shown but not ranked; exclusions and the benchmark's own failures are left out.

cost:
  method: provider_reported_or_priced
  pricing_reference:
    repository: sandbox-provider-pricing
    function: price()
    price_sheet_version: recorded in the run manifest
  billed_span: From the create request to the confirmed destroy.
  per_success: >-
    Cost of the successful attempts divided by their number; failed attempts' cost is not included.
  notes:
    - A cost comes from the provider's own cost or usage record for that sandbox, priced at list rates. Without such a record it is unknown, with no total; it is never zero and never a range.

failure_policy:
  timeout_seconds: {}
  retries: >-
    None in the benchmark, of a call or a trial, except the untimed ready check after a create.
    The first failed step ends the trial; the steps after it are not reached.
  success: Every benchmark-specific check passes and every resource the trial created is confirmed deleted.
  provider_errors:
    - Create and transport errors, and a sandbox that stops answering.
    - A failure whose owner is uncertain.
    - Forty not-ready answers to the ready check, or any other failure of it.
  benchmark_errors:
    - A failure of the benchmark's own script, such as output it cannot parse after a command exited 0.
  exclusions:
    - An error shown, by its error fields or a trace, not to be the provider's.
    - A workload that does not replay on that provider.
    - An excluded trial stays in the data with its reason.

capability_source:
  repository: https://github.com/boxrouter/sandbox-provider-spec
  release: v0.3.85
  declaration_path: providers/<provider>/declaration*.yaml
  use: The benchmark page uses declarations to include tests whose required capabilities are declared and exclude tests when a required capability is absent; the next SPS release will carry Vercel's updated custom_images status, which remains unproven until a matching conformance report establishes it.
