id: index.speed_score
version: 1.0.8
effective: '2026-11-08'
name: '{name:quantity.time-score}'
category: index
headline: '{name:hero.time-score}'
notes:
  summary: '{param:content.index_copy.descriptions.time_score}'
  what_this_measures: '{param:content.index_copy.details.time_score.what_this_measures}'
  how_it_is_measured: '{param:content.index_copy.details.time_score.how_it_is_measured}'
  how_to_read: '{param:content.index_copy.details.time_score.how_to_read}'
  cost_summary: '{param:content.index_copy.description}'
  cost_how_to_read: '{param:content.index_copy.details.time_score.how_to_read}'
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: typical_time_score
  unit: points
  direction: higher_is_better
  description: Arithmetic mean over the combined workloads of each workload's time score for the provider.
  quantity: time_score
  per: provider
composition:
  inputs:
  - id: deepswe
    version: 1.1.22
    quantity: Time per trace
  - id: terminal-bench-4-0
    version: 1.1.19
    quantity: Time per trace
  - id: github-actions
    version: 1.1.16
    quantity: Time per job
  per_input_value: 'A provider''s score for a workload is the arithmetic mean, over that workload''s units
    (traces or jobs) that some provider completed on the unit statistic, of each unit''s score: 100 times
    the best provider''s time on the unit divided by this provider''s, or 0 when it has no result. A unit
    without a result adds no points and stays in the denominator; nothing is substituted.'
  aggregation: arithmetic_mean
  weighting: Equal weight per workload; a workload a provider has no result on adds 0.
  inclusion: Only providers that have a result of their own in at least one workload of the scope. The
    composite applies no ranking floor or failing-often rule of its own.
  not_displayed:
  - condition: The provider has no result of its own in any workload of the scope, for example because
      it was not measured there.
    reason: The page lists the provider under "Not displayed" without a stated reason on this view; if
      no provider qualifies it says that no provider has a result in any of the benchmarks in the composite.
  - condition: No unit of a workload was completed by any measured provider.
    reason: The workload has no time for any provider, so no provider has a composite value.
  scopes:
  - id: execution
    label: Execution (all three workloads)
    inputs:
    - deepswe
    - terminal-bench-4-0
    - github-actions
  - id: coding
    label: Coding ({name:test.deepswe}, {name:test.terminal-bench-4-0})
    inputs:
    - deepswe
    - terminal-bench-4-0
  - id: ci
    label: '{name:test.ci-jobs}'
    inputs:
    - github-actions
statistics:
  primary: arithmetic_mean
  percentile_method: The p95 set contains every unit completed by at least one measured provider, as for every unit statistic. For each provider's completed unit, use the exact inherited common's worse-side tail, with its worst successful value below that common's successful-trial floor. No separate scheduled-trial cutoff removes a completed unit from the set.
  ranking:
    ranked: true
    failing_often: Not applied at the composite; each workload applies it to its own result.
    requires_all_successful: false
  unit_statistic:
    default: median
    options:
    - median
    - mean
    - p95
cost:
  method: not_applicable
  notes:
  - '{name:time-index} carries no cost; {name:cost-index} and {name:time-vs-cost} show it.'
interpretation:
  limits:
  - The composite applies no extra ranking rule.
  - The comparison retains the measurement boundaries of its workload inputs.


