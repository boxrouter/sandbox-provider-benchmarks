id: index.provider_score
version: 1.0.16
effective: '2026-11-08'
name: '{name:hero.provider-score}'
category: index
headline: '{name:hero.provider-score}'
notes:
  what_this_measures: '{param:content.index_copy.details.provider_score.what_this_measures_four_scores}'
  how_it_is_measured: '{param:content.index_copy.details.provider_score.how_it_is_measured}'
  how_to_read: '{param:content.index_copy.details.provider_score.how_to_read}'
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: provider_score
  unit: points
  direction: higher_is_better
  description: One of the provider's four part scores, each an arithmetic mean of the level below it.
  quantity: provider_score
  per: provider
composition:
  inputs:
  - id: deepswe
    version: 1.1.22
    quantity: '{name:quantity.time-score} and {name:quantity.cost-score} per trace'
  - id: terminal-bench-4-0
    version: 1.1.19
    quantity: '{name:quantity.time-score} and {name:quantity.cost-score} per trace'
  - id: r2e-gym
    version: 1.1.22
    quantity: '{name:quantity.time-score} and {name:quantity.cost-score} per task'
  - id: github-actions
    version: 1.1.16
    quantity: '{name:quantity.time-score} and {name:quantity.cost-score} per job'
  - id: sequential-tti
    version: 1.2.18
    quantity: Score on the test's default configuration
  - id: burst-tti
    version: 1.2.15
    quantity: Score on the test's default configuration
  - id: exec-latency-per-100-calls
    version: 1.0.11
    quantity: Score on the test's default configuration
  - id: read-4kib
    version: 1.1.13
    quantity: Score on the test's default configuration
  - id: write-4kib
    version: 1.1.13
    quantity: Score on the test's default configuration
  - id: list
    version: 1.1.13
    quantity: Score on the test's default configuration
  - id: read-4kib-2vcpu-8gib
    version: 1.0.3
    quantity: Score on the test's default configuration
  - id: write-4kib-2vcpu-8gib
    version: 1.0.3
    quantity: Score on the test's default configuration
  - id: list-2vcpu-8gib
    version: 1.0.3
    quantity: Score on the test's default configuration
  - id: pause-resume
    version: 1.2.16
    quantity: Score on the test's default configuration
  - id: delayed-resume
    version: 1.2.16
    quantity: Score on the test's default configuration
  - id: snapshot-and-restore
    version: 1.1.14
    quantity: Score on the test's default configuration
  - id: fork
    version: 1.1.15
    quantity: Score on the test's default configuration
  - id: image-build-2vcpu-4gib
    version: 1.2.14
    quantity: Score on the test's default configuration
  - id: previews
    version: 1.1.14
    quantity: Score on the test's default configuration
  - id: reconnect
    version: 1.1.13
    quantity: Score on the test's default configuration
  - id: 7-zip-1-thread
    version: 1.1.18
    quantity: Score on the test's default configuration
  - id: stream-triad
    version: 1.1.18
    quantity: Score on the test's default configuration
  - id: sequential-read
    version: 1.1.18
    quantity: Score on the test's default configuration
  - id: sequential-write
    version: 1.1.18
    quantity: Score on the test's default configuration
  - id: random-read
    version: 1.1.17
    quantity: Score on the test's default configuration
  - id: random-write
    version: 1.1.17
    quantity: Score on the test's default configuration
  - id: hard-links
    version: 1.1.17
    quantity: Score on the test's default configuration
  - id: hard-links-2vcpu-8gib
    version: 1.0.3
    quantity: Score on the test's default configuration
  - id: package-registries
    version: 1.1.16
    quantity: Score on the test's default configuration
  per_input_value: 'A workload suite''s score is its time score or its cost score (the arithmetic mean
    of its units'' scores). Exclude from the unit set for every provider any unit with a failed attempt
    whose recorded owner is not the provider, unless a later successful rerun replaces that failure; an
    unknown owner counts as provider-owned. A provider with no result on a remaining unit scores 0 there.
    An operation or machine leaf''s score is 100 times the best provider''s value divided by this provider''s
    where lower is better, or 100 times this provider''s value divided by the best provider''s where higher
    is better. The leaf''s value is the test''s median in its default configuration: the variant the test
    publishes as its default, else its first variant; where the bar has segments, its total; and, where
    a step is switched off in the test''s default view, the total without that step.'
  aggregation: arithmetic_mean
  weighting: 'Equal weight at every level: a suite''s score is a mean of its units'' scores; a subsection''s
    or tab''s, of its suites'' or leaves''; a part''s, of its subsections'' or tabs'' (the machine performance
    part, of its tabs). Before averaging a workload-time or workload-cost level, omit any workload marked
    Not offered for a provider from that level for every provider. A remaining child that some provider
    has a score on and this provider has none counts 0. A child that no provider has a value on is left
    out for every provider.'
  inclusion: Every provider, at every level that has a child with a value for some provider.
  not_displayed:
  - condition: No child of a level has a value for any provider.
    reason: The level has no score for any provider.
  - condition: A cost score's unit lacks a provider-sourced cost for the provider.
    reason: The provider has no cost score for the workload, as on the cost score.
  levels:
  - id: workload_time
    label: '{name:quantity.workload-time}'
    section: workloads
    measure: time
  - id: workload_cost
    label: '{name:quantity.workload-cost}'
    section: workloads
    measure: cost
  - id: sandbox_operations
    label: '{name:quantity.sandbox-operations-score}'
    section: sandbox-operations
  - id: machine_performance
    label: '{name:quantity.machine-performance-score}'
    section: machine-performance
  rank: 'Every level of the tree is ranked: providers are ordered by the level''s published score, higher
    first, and tied providers share the better rank (1, 2, 2, 4). The count of providers is the number
    with a score at that level; a provider with none has no rank.'
  leaves:
    first_test_only:
    - cpu
    - exec
    summed:
    - id: files-read-write
      tests:
      - read-4kib
      - write-4kib
statistics:
  primary: arithmetic_mean
  percentile_method: Not applicable; a leaf takes the median.
  ranking:
    ranked: true
    failing_often: Not applied here; each test applies it to its own result.
    requires_all_successful: false
  unit_statistic:
    default: median
    options:
    - median
cost:
  method: not_applicable
  notes:
  - The cost score, one of the four parts' inputs, carries the cost; the other parts carry none.
interpretation:
  limits:
  - A workload marked Not offered for a provider remains on its own leaderboard with its reason and is
    omitted from workload-time and workload-cost levels for every provider.
  - Each leaf keeps the measurement boundaries of its test in the default configuration.
