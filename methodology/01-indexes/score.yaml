id: index.cost_score
version: 1.0.8
effective: '2026-11-08'
name: '{name:quantity.cost-score}'
category: index
headline: '{name:hero.cost-score}'
notes:
  summary: '{param:content.index_copy.descriptions.cost_score}'
  what_this_measures: '{param:content.index_copy.details.cost_score.what_this_measures}'
  how_it_is_measured: '{param:content.index_copy.details.cost_score.how_it_is_measured}'
  how_to_read: '{param:content.index_copy.details.cost_score.how_to_read}'
  cost_summary: '{param:content.index_copy.description}'
  cost_how_to_read: '{param:content.index_copy.details.cost_score.how_to_read}'
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: typical_cost_score
  unit: points
  direction: higher_is_better
  description: Arithmetic mean over the combined workloads of each workload's cost score for the provider.
  quantity: cost_score
  per: provider
composition:
  inputs:
  - id: deepswe
    version: 1.1.22
    quantity: Cost per trace
  - id: terminal-bench-4-0
    version: 1.1.19
    quantity: Cost per trace
  - id: github-actions
    version: 1.1.16
    quantity: Cost per job
  per_input_value: 'A provider''s score for a workload is the arithmetic mean, over that workload''s units
    (traces or jobs) that some provider completed on the unit statistic, of each unit''s score: 100 times
    the best provider''s cost on the unit divided by this provider''s, or 0 when it has no result. A unit
    without a result adds no points and stays in the denominator; nothing is substituted.'
  aggregation: arithmetic_mean
  weighting: Equal weight per workload; a workload a provider has no result on adds 0.
  inclusion: Only providers that have a result of their own in at least one workload of the scope. A provider
    with results but no provider-sourced cost in a workload has no cost score for it.
  not_displayed:
  - condition: At least one counted trial of the provider in a workload has no provider-sourced cost.
    reason: The page names how many of the counted trials have no provider-sourced cost; the provider
      has no cost, never a zero or a range.
  - condition: A unit's cost on the chosen statistic is zero.
    reason: A unit costs nothing, so the geometric mean is undefined and the provider has no cost.
  - condition: No unit of a workload was completed by any measured provider.
    reason: No unit was completed by any provider, so no workload cost exists.
  - condition: A workload has no provider-sourced cost for the provider.
    reason: The page gives "a workload has no provider-sourced cost for it".
  scopes:
  - id: execution
    label: Execution (all three workloads)
    inputs:
    - deepswe
    - terminal-bench-4-0
    - github-actions
  - id: coding
    label: Coding ({name:test.deepswe}, {name:test.terminal-bench-4-0})
    inputs:
    - deepswe
    - terminal-bench-4-0
  - id: ci
    label: '{name:test.ci-jobs}'
    inputs:
    - github-actions
statistics:
  primary: arithmetic_mean
  percentile_method: The p95 set contains every unit completed by at least one measured provider, as for every unit statistic. For each provider's completed unit, use the exact inherited common's worse-side tail, with its worst successful value below that common's successful-trial floor. No separate scheduled-trial cutoff removes a completed unit from the set.
  ranking:
    ranked: true
    failing_often: Not applied at the composite; each workload applies it to its own result.
    requires_all_successful: false
  unit_statistic:
    default: median
    options:
    - median
    - mean
    - p95
cost:
  method: provider_reported_or_priced
  counted_sandboxes: The composite takes each input workload's per-unit cost as given.
  per_success: Each workload's per-unit cost is its cost on the unit statistic over the successful trials;
    failed attempts' cost is not included.
  notes:
  - A cost comes from the provider's own cost or usage record priced at list rates. Without one the provider
    has no cost on this composite; it is never zero and never a range.
interpretation:
  limits:
  - Every counted trial must have an exact provider-reported or calculated cost.
  - The composite excludes failed attempts from the successful-unit costs.


