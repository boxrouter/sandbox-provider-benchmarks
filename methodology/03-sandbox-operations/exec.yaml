# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: exec-latency-2vcpu-8gib
version: 1.0.3
effective: '2026-11-08'
name: '{name:test.exec-latency-2vcpu-8gib}'
category: sandbox_operation
notes:
  summary: Sequential calls run the true command in one 2 vCPU and 8 GiB sandbox to measure single-call
    round-trip latency.
  what_this_measures: The result is the round-trip latency of one call to the true command, which runs
    for almost no time inside a 2 vCPU and 8 GiB sandbox, measured from dispatch until the exit code and
    the sandbox clock readings return to the job host.
  how_it_is_measured: A monotonic clock on the job host times each of 100 sequential true calls in one
    fresh 2 vCPU and 8 GiB sandbox from dispatch until the exit status and the sandbox clock readings
    return.
  how_to_read: The {param:exec-latency.1.2.12.statistics.primary} summarizes every call of every successful
    trial, pooled across trials, in the axis unit; {direction:total_time}.
  cost_summary: The cost is the sum of the provider-sourced sandbox costs for successful trials, divided
    by the number of successful calls.
  cost_how_to_read: Only successful trials contribute to the cost value, and provider-sourced costs are
    required for a cost to be shown.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: total_time
  unit: ms
  direction: lower_is_better
  description: Median time from one command call starting until its result and clock readings return,
    over every call of every successful trial.
  formula: median(total(true))
  quantity: latency
  per: call
environment:
  size:
    vcpu: 2
    memory_gib: 8
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 600
clocks:
  operation: Job-host monotonic clock around each command call.
  command_runtime: Sandbox clock read immediately before and after true.
procedure:
  mode: single
  trials: 100
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: One fresh sandbox per trial; 100 calls run sequentially in the same sandbox, so later calls
      reuse the session's warmed state.
    cold: First call after the untimed ready check.
    warm: Calls 2 through 100 follow immediately after the preceding call returns.
  variants:
  - id: 'true'
    label: true, 100 calls through the sandbox
    command: 'true'
    parameters:
      calls: 100
    description: The workload uses the {param:exec-latency.1.2.12.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox from the pinned standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: 'true'
    name: true calls
    action: Send 100 true commands one at a time, with each call's sandbox clock readings returned to
      the job host.
    timer:
      start_event: The command call is dispatched.
      stop_event: The exit code and sandbox clock readings return to the job host.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - 'true'
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each true command call is dispatched.
  stop: Its exit code and the sandbox clock readings return to the job host.
statistics:
  primary: median
  secondary:
  - mean
  ranking:
    ranked: true
    min_successes: 5
  percentile_method: Nearest rank over every call of every successful trial, pooled; calls of a trial
    that failed partway are left out, as they are from the per-trial sums; no trimming.
  sample: pooled_calls
  interval:
    type: cluster_bootstrap_percentile
    cluster: trial
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  scatter:
    sampling: one_random_call_per_trial
    seed: 0
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    'true': 30
    destroy: 300
  retries: No command call is retried; the first failed call ends the trial.
  success: All 100 commands exit 0 and return both clock readings; the sandbox is confirmed destroyed.
  provider_errors:
  - A command call or transport error
  - a nonzero command exit
  - or missing clock readings.
  benchmark_errors:
  - A malformed measurement record or failure in benchmark-side timing and parsing.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Later calls reuse the session's warmed state, as a user's calls do; nothing is cleared between
      calls. The provider's image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: exception
    text: Guest CPU model/count, kernel and working-directory device/filesystem are probed outside timing
      on a best-effort basis; unavailable readings remain unknown. Native host/zone identifiers are not
      collected. Missing facts leave the affected independence checks unassessed.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
parameters:
  path: parameters/exec-latency-2vcpu-8gib/1.0.3/
  sha256: f97b44012d461bfe429c9918e4d9b3c7bf43b8cc030f84115a43424d1363da79
interpretation:
  what_to_do: Use this latency to judge the per-call overhead floor under every command that an agent
    runs in a 2 vCPU and 8 GiB sandbox, and compare results only against other runs in the 2 vCPU and
    8 GiB cell.
  informs: The result shows how long the shortest command, true, takes to complete a round trip through
    BoxRouter in a 2 vCPU and 8 GiB sandbox. A high latency points to overhead in the provider's command
    execution API or its in-sandbox daemon.
  limits:
  - The measured latency includes the network path between the job host and the provider's configured
    region, so a provider in a more distant region pays for that network distance.
  - Only command calls sent through BoxRouter in the 2 vCPU and 8 GiB cell are measured; the result is
    not equivalent to 2 vCPU and 4 GiB or 4 vCPU and 8 GiB results and is not pooled with them.
  caveats:
  - Each trial creates one fresh sandbox and runs 100 calls sequentially after an untimed readiness check,
    so calls 2 through 100 reuse the warmed session state of that sandbox.
  - BoxRouter keeps idle provider connections open for 300 seconds where the integration supports it,
    whereas a call that follows a longer pause in real use may pay for a new connection handshake.
  - A complete run targets 100 trials with up to 10 trials running in parallel, which produces 10,000
    pooled calls across 100 sandboxes when all trials succeed.
validity_checks:
- id: clock_cross_check
  threat: A wrong sandbox clock reading would skew the runtime and the latency.
  check: Each call sends `true` between two reads of the sandbox's clock (`$EPOCHREALTIME`, checked against
    `/proc/uptime`), run by Bash.
- id: all_calls_succeed
  threat: A failed call could be left out of the median.
  check: A call succeeds when it exits 0 with the clock readings back, and a trial succeeds only when
    all 100 calls do; every call counts, including the first.
- id: first_command_not_measured
  threat: The sandbox's first command would add start-up work to the calls.
  check: The ready check runs untimed after create, so the 100 calls do not include the sandbox's first
    command.
source:
  name: true command workload and BoxRouter standard image
  version: sha256:8db60a2eeeb06993
  ids:
  - true workload sha256:8db60a2eeeb06993
  - ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false
