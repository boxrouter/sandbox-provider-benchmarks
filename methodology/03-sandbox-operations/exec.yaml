  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/exec-latency/1.1.0/
  sha256: f97b44012d461bfe429c9918e4d9b3c7bf43b8cc030f84115a43424d1363da79
interpretation:
  what_to_do: Use the latency to judge the floor under every command an agent runs through a provider.
  informs: How long the shortest command, `true`, takes to come back through BoxRouter. A high latency
    points at the provider's exec API and its in-sandbox agent.
  limits:
  - The latency includes the network between the job host and the provider's US region; a provider whose
    region is farther away pays that distance.
  - Only calls through BoxRouter are measured.
  caveats:
  - BoxRouter keeps idle connections for 300 s, so a call that follows a pause may pay a new connection.
  - A run is 100 trials, so each provider's figures come from 100 sandboxes and 10,000 calls. Until 2026-10-26
    a run was 10 trials; the trial itself did not change.
  - Version 4 of the earlier test measures only the calls through BoxRouter and makes 100 calls instead
    of 20; version 3's results are not pooled with it.
validity_checks:
- id: clock_cross_check
  threat: A wrong sandbox clock reading would skew the runtime and the latency.
  check: Each call sends `true` between two reads of the sandbox's clock (`$EPOCHREALTIME`, checked against
    `/proc/uptime`), run by Bash.
- id: all_calls_succeed
  threat: A failed call could be left out of the median.
  check: A call succeeds when it exits 0 with the clock readings back, and a trial succeeds only when
    all 100 calls do; every call counts, including the first.
- id: first_command_not_measured
  threat: The sandbox's first command would add start-up work to the calls.
  check: The ready check runs untimed after create, so the 100 calls do not include the sandbox's first
    command.
