  equal_concurrency:
    status: exception
    text: One build runs at a time per provider, so no other build shares the job host's network or the
      provider's builders while one is timed.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
