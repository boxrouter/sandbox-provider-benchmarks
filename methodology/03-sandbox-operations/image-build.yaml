independence_answers:
  fresh_sandbox:
    status: exception
    text: No sandbox runs in this test; each trial builds its own new image layer and nothing is shared
      between trials.
  equal_concurrency:
    status: exception
    text: One build runs at a time per provider, so no other build shares the job host's network or the
      provider's builders while one is timed.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Provider layer caching of the base stays on, as customers get it; each trial's new layer is
      unique, so no earlier trial's build is reused.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: exception
    text: One build runs at a time per provider, so no other trial of the batch is in flight.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: exception
    text: No sandbox runs, so no sandbox host facts exist; the job host's load over each trial's window
      is recorded.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.

