notes:
  what_this_measures: The result records snapshot creation, creation of a sandbox from that snapshot and
    the first commands in the restored sandbox.
  how_to_read: The {param:snapshot-and-restore.1.1.1.statistics.primary} is shown in {unit:snapshot_time};
    {direction:snapshot_time}.
  summary: A sandbox creates a snapshot, restores it and runs representative first commands.
  how_it_is_measured: A job-host monotonic clock times each snapshot, restore, or first-command call from
    dispatch until its result returns. The workload uses a fixed snapshot marker and standard runtime
    commands.
  cost_summary: The cost covers the declared billing span, divided by successful units.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: snapshot_time
  unit: ms
  direction: lower_is_better
  description: Time from snapshot request dispatch until the snapshot call returns.
  quantity: time
  per: sandbox
- name: restore_time
  unit: ms
  direction: lower_is_better
  description: Time from create-from-snapshot request dispatch until the new sandbox is created.
  quantity: time
  per: sandbox
- name: first_command_time
  unit: ms
  direction: lower_is_better
  description: Time for the first Python, Node and git commands to return from the restored sandbox.
  quantity: time
  per: sandbox
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  network: unknown
  lifetime_seconds: 900
clocks:
  operation: Job-host monotonic clock around snapshot, restore and command calls.
  command_runtime: Sandbox clock for the first command after restore.
procedure:
  mode: sequential
  trials: 40
  sandboxes_per_trial: 2
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: One fresh sandbox writes a marker and is snapshotted; after it is destroyed, a new sandbox
      is created from that snapshot.
    cold: First create from a snapshot in a trial.
    warm: Not measured.
  variants:
  - id: marker
    label: Standard sandbox with marker file
    command: python3 -c 'import json, sqlite3, ssl, asyncio, urllib.request, email.parser, xml.etree.ElementTree'
      && node -e 'require("crypto"); require("zlib"); require("http")' && git --version
    parameters:
      snapshot_deletable: true
    description: The workload uses the {param:snapshot-and-restore.1.1.3.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: Create source sandbox
    action: Create a new sandbox with snapshot support and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: write_marker
    name: Write marker
    action: Write the fixed marker file in the source sandbox before snapshotting.
    timer: null
    timeout_seconds: 30
  - id: snapshot
    name: '{name:stage.snapshot}'
    action: Request a snapshot immediately after the marker write.
    timer:
      from: the snapshot request
      sent: immediately after the marker write
      until: the snapshot operation completes and returns
    timeout_seconds: 600
    record_steps:
    - snapshot
  - id: destroy_source
    name: Destroy source
    action: Probe size, destroy the original sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
  - id: restore
    name: '{name:stage.create-from-snapshot}'
    action: Create a new sandbox from the snapshot after the source sandbox is confirmed gone.
    timer:
      from: the create-from-snapshot request
      sent: once the source sandbox is confirmed gone
      until: the call returns with the new sandbox
    timeout_seconds: 300
    record_steps:
    - create-from-snapshot
  - id: first_commands
    name: '{name:stage.load-runtimes}'
    action: Run the pinned Python import, Node built-in and git version command immediately after restore,
      without a ready check first.
    timer:
      from: the command
      sent: immediately after the restore, without a ready check first
      until: its result and sandbox clock readings return
    timeout_seconds: 100
    record_steps:
    - exec
  - id: verify_marker
    name: Verify marker
    action: Read back the marker and check it matches.
    timer: null
    timeout_seconds: 30
  - id: destroy
    name: Destroy restored sandbox
    action: Destroy and confirm the restored sandbox is gone; delete and check the snapshot.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: snapshot
    name: '{name:stage.snapshot}'
    record_steps:
    - snapshot
  - id: create-from-snapshot
    name: '{name:stage.create-from-snapshot}'
    record_steps:
    - create-from-snapshot
  - id: load-runtimes
    name: '{name:stage.load-runtimes}'
    record_steps:
    - exec
timing_boundaries:
  start: The snapshot request or create-from-snapshot request is dispatched for the corresponding metric;
    first-command timing begins at command dispatch.
  stop: The corresponding call returns; first-command timing ends when command result and sandbox clock
    readings return.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
  billed_span: From each sandbox create request to confirmed destroy.
  notes:
  - Snapshot storage has no published cost in this benchmark; trial cost covers the two sandboxes' compute.
failure_policy:
  timeout_seconds:
    create: 300
    write_marker: 30
    snapshot: 600
    destroy_source: 300
    restore: 300
    first_commands: 100
    verify_marker: 30
    destroy: 300
  retries: No measured operation is retried; first failed step ends the trial.
  success: Snapshot and restore succeed, the first commands exit 0, marker matches, and the restored sandbox
    and snapshot are cleaned up.
  provider_errors:
  - Snapshot
  - restore
  - transport or command error; missing or changed marker; or unconfirmed resource cleanup.
  benchmark_errors:
  - A malformed timing record or benchmark-side workload failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/snapshot-and-restore/1.1.3/
  sha256: c487406246a17af5bd28277bdade464a182157b34fee9e36ccb876b03c6d044d
capabilities:
  required:
  - snapshots
interpretation:
  what_to_do: Compare the steps an agent takes to save a prepared environment and start again from it.
  informs: How long a sandbox takes to save as a snapshot, how long a new sandbox takes to create from
    it, and how long the first Python, Node and git command takes in it.
  limits:
  - A snapshot may retain files alone or files and memory, which affects save and start time.
  - The source sandbox may stop, pause or keep running during capture; it is destroyed before restore.
  - Snapshot storage is unpriced because no provider publishes a rate for a snapshot held for seconds.
  caveats:
  - Each trial's cost is the two sandboxes' compute.
  - Where BoxRouter cannot look a snapshot up after its delete, the delete is sent and recorded as not
    checkable.
  - Each time is BoxRouter's operation time on the job host.
validity_checks:
- id: marker_read_back
  threat: A snapshot that restores an empty sandbox would still look fast.
  check: The marker file written before the snapshot is read back in the new sandbox; a missing or different
    marker is the provider's failure.
- id: nothing_inherited
  threat: A create that inherits the first sandbox would not measure the snapshot.
  check: The create from the snapshot names no capability, so nothing is inherited from the first sandbox,
    which is destroyed and confirmed gone first.
- id: no_ready_check_first
  threat: A ready check would hide the first command's time.
  check: The load-runtimes command is sent as soon as the create returns, with no ready check first, and
    its runtime is read by the sandbox's clock.
source:
  name: fixed snapshot marker and standard runtime commands
  version: sha256:0a4b0df635ec48f1
  ids:
  - snapshot/marker workload sha256:0a4b0df635ec48f1
  - snapshot/marker
  licence: Apache-2.0
execution:
  mode: script
  inference: false

