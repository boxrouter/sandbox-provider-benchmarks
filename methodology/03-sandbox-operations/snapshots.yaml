capabilities:
  required:
  - snapshots
interpretation:
  what_to_do: Compare the steps an agent takes to fork a prepared environment into several copies.
  informs: How long new sandboxes take to create from one snapshot, four in turn, and how long the first
    Python, Node and git command takes in each. Whether the later copies start faster than the first shows
