# yaml-language-server: $schema=../../schemas/methodology.schema.json
# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: fork
version: 1.1.1
effective: '2026-10-26'
name: Fork
category: sandbox_operation
notes:
  what_this_measures: Creating four sandboxes in turn from one snapshot and running representative first
    commands in each.
  how_to_read: Each provider's median is shown in milliseconds. Lower is better.
  summary: Creating four sandboxes in turn from one snapshot and running representative first commands
    in each.
  how_it_is_measured: A job-host monotonic clock times each create-from-snapshot request and first command
    until its result returns. The workload creates four sandboxes in turn from one snapshot.
  cost_summary: Cost over the measured billing span per successful sandbox.
  cost_how_to_read: Cost is shown in dollars. Lower is better.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: create_from_snapshot
  unit: ms
  direction: lower_is_better
  description: Median create-from-snapshot duration for each of four sequential forks.
  quantity: time
  per: sandbox
- name: first_command_time
  unit: ms
  direction: lower_is_better
  description: Median time for the first Python, Node and git commands in each fork.
  quantity: time
  per: sandbox
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  network: unknown
  lifetime_seconds: 900
clocks:
  operation: Job-host monotonic clock around create and command calls.
  command_runtime: Sandbox clock around the first command after each restore.
procedure:
  mode: sequential
  trials: 40
  sandboxes_per_trial: 5
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Four forks are created one after another after the original sandbox has been destroyed.
    cold: First fork in a trial.
    warm: Forks two through four follow prior forks and may benefit from provider cache.
  variants:
  - id: marker-4-forks
    label: One snapshot and four sequential forks
    parameters:
      restores: 4
      snapshot_deletable: true
    description: This option selects the recorded workload used for the measurement.
  steps:
  - id: create
    name: Create source sandbox
    action: Create a sandbox with snapshot support and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: snapshot
    name: Snapshot
    action: Write a marker, then request a snapshot.
    timer: null
    timeout_seconds: 600
    record_steps:
    - snapshot
  - id: destroy_source
    name: Destroy source
    action: Probe size, destroy the original sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
  - id: restore
    name: Create fork
    action: Create one new sandbox from the snapshot after the preceding sandbox is confirmed gone.
    timer:
      start_event: Create-from-snapshot request is dispatched.
      stop_event: The call returns with the fork.
    timeout_seconds: 300
    repeats: true
    record_steps:
    - create-from-snapshot
  - id: first_commands
    name: Load runtimes
    action: Run the Python import, Node built-in and git version command immediately after each fork is
      created.
    timer:
      start_event: The command is dispatched.
      stop_event: Its result and sandbox clock readings return.
    timeout_seconds: 100
    repeats: true
    record_steps:
    - exec
  - id: verify_destroy
    name: Verify and destroy fork
    action: Read the marker, then destroy and confirm the fork is gone before creating the next.
    timer: null
    timeout_seconds: 300
  - id: delete_snapshot
    name: Delete snapshot
    action: Delete the snapshot after the final fork and check it is gone.
    timer: null
    timeout_seconds: 300
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each create-from-snapshot request or first command is dispatched.
  stop: The corresponding call returns with command clock readings where applicable.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
  billed_span: From each of five sandbox creates to confirmed destroy.
  notes:
  - Snapshot storage has no published cost in this benchmark.
failure_policy:
  timeout_seconds:
    create: 300
    snapshot: 600
    destroy_source: 300
    restore: 300
    first_commands: 100
    verify_destroy: 300
    delete_snapshot: 300
  retries: No measured operation is retried; first failed step ends the trial.
  success: All four forks are created sequentially, commands succeed, marker matches, and all sandboxes
    and the snapshot are cleaned up.
  provider_errors:
  - Snapshot
  - restore
  - transport or command error; missing or changed marker; or unconfirmed resource cleanup.
  benchmark_errors:
  - A malformed timing record or benchmark-side workload failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/fork/1.1.1/
  sha256: 8b732952eed6563d3e764c863b4aaf0bf336aa29e5c8e7b8b2bc3d67a5ad6734
capabilities:
  required:
  - snapshots
interpretation:
  what_to_do: Compare the steps an agent takes to fork a prepared environment into several copies.
  informs: How long new sandboxes take to create from one snapshot, four in turn, and how long the first
    Python, Node and git command takes in each. Whether the later copies start faster than the first shows
    the provider's caching of a snapshot.
  limits:
  - 'Providers capture different things: a snapshot may keep files and memory or files only. A snapshot
    that keeps memory takes longer to save and may start faster.'
  - 'Providers treat the snapshotted sandbox differently: it may stop, pause briefly, or keep running.
    The first sandbox is destroyed before the create from the snapshot either way.'
  - Snapshot storage is unpriced because no provider publishes a rate for a snapshot held for seconds.
  caveats:
  - Each trial's cost is the five sandboxes' compute.
  - Each time is BoxRouter's operation time on the job host.
  - The first sandbox and snapshot are shared with Snapshot and Restore's trial design.
validity_checks:
- id: marker_read_back
  threat: A fork that starts empty would still look fast.
  check: The marker is read back in each fork; a missing or different marker is the provider's failure.
- id: one_fork_at_a_time
  threat: Overlapping forks would measure contention instead of a fork.
  check: Each fork is destroyed and confirmed gone before the next one is created.
source:
  name: fixed snapshot marker and standard runtime commands
  version: sha256:1d6c76a30f30daae
  ids:
  - snapshot-fork/marker-4-forks workload sha256:1d6c76a30f30daae
  - snapshot-fork/marker-4-forks
  licence: Apache-2.0
execution:
  mode: script
  inference: false

