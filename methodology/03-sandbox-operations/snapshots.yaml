    repeats: true
    record_steps:
    - exec
  - id: verify_destroy
    name: Verify and destroy fork
    action: Read the marker, then destroy and confirm the fork is gone before creating the next.
    timer: null
    timeout_seconds: 300
  - id: delete_snapshot
    name: Delete snapshot
    action: Delete the snapshot after the final fork and check it is gone.
    timer: null
    timeout_seconds: 300
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
