validity_checks:
- id: marker_read_back
  threat: A fork that starts empty would still look fast.
  check: The marker is read back in each fork; a missing or different marker is the provider's failure.
- id: one_fork_at_a_time
  threat: Overlapping forks would measure contention instead of a fork.
  check: Each fork is destroyed and confirmed gone before the next one is created.
