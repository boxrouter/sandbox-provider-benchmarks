# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: exec-latency
effective: '2026-11-08'
name: Exec Latency
category: sandbox_operation
notes:
  summary: Time to send a single exec `true` call.
  how_it_is_measured: Provider time covers each `true` call until its exit status and sandbox
    clock readings return. Calls run sequentially in one sandbox.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful call.
  cost_how_to_read: Only successful trials contribute to the cost value.
  what_this_measures: The result is the round-trip latency of one call to a command that runs for almost
    no time, from the call until its result and the sandbox clock readings return.
  how_to_read: The {param:exec-latency.statistics.primary} summarizes each successful trial's median call, in the axis unit; {direction:total_time}.
inherits: sbs.common
metrics:
- name: total_time
  unit: ms
  direction: lower_is_better
  description: Median provider time of one command call until its result and clock readings return. Each trial's
    value is the median of its 100 calls.
  formula: median(total(true))
  quantity: latency
  per: call
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 600
clocks:
  operation: Provider time of each command call.
  command_runtime: Sandbox clock read immediately before and after true.
default_view:
  metric: total_time
  variant: 'true'
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 5
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: One fresh sandbox per trial; 100 calls run sequentially in the same sandbox, so later calls
      reuse the session's warmed state.
    cold: The first of the 100 calls, which is also the sandbox's first command.
    warm: Calls 2 through 100 follow immediately after the preceding call returns.
  variants:
  - id: 'true'
    label: true, 100 calls through the sandbox
    command: 'true'
    parameters:
      calls: 100
    description: The workload uses the {param:exec-latency.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    action: Create a fresh sandbox from the pinned standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: 'true'
    name: true calls
    label: 'true'
    show: stack
    action: Send 100 true commands one at a time, with each call's sandbox clock readings returned.
    timer:
      start_event: The command call is dispatched.
      stop_event: The exit code and sandbox clock readings return.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - 'true'
  - id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    action: Destroy the sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each true command call is dispatched.
  stop: Its exit code and the sandbox clock readings return.
statistics:
  primary: median
  secondary:
  - mean
  ranking:
    ranked: true
  percentile_method: Nearest rank over successful trials, each trial taken as the median of its calls; no
    trimming.
  sample: trial
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  scatter:
    sampling: one_random_call_per_trial
    seed: 0
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    'true': 30
    destroy: 300
  retries: No command call is retried; the first failed call ends the trial.
  success: All 100 commands exit 0 and return both clock readings; the sandbox is destroyed.
  provider_errors:
  - A command call or transport error
  - a nonzero command exit
  - or missing clock readings.
  benchmark_errors:
  - A malformed measurement record or failure in benchmark-side timing and parsing.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/exec-latency/
  sha256: f97b44012d461bfe429c9918e4d9b3c7bf43b8cc030f84115a43424d1363da79
interpretation:
  what_to_do: Use the latency to judge the floor under every command an agent runs through a provider.
  informs: How long the shortest command, `true`, takes to complete a round trip to the sandbox and back. A high latency
    points at the provider's exec API and its in-sandbox agent.
  limits:
  - Every call includes the network path to the provider's US region; a provider whose
    region is farther away pays that distance.
  - Only calls sent from the client host are measured.
  caveats:
  - BoxRouter keeps idle connections for 300 s, so a call that follows a pause may pay a new connection.
  - A complete run targets 20 trials with up to 5 trials running in parallel, which gives 2,000 calls across
    20 sandboxes when all trials succeed.
validity_checks:
- id: clock_cross_check
  threat: A wrong sandbox clock reading would skew the runtime and the latency.
  check: Each call sends `true` between two readings of the sandbox's clock (`date +%s%N`). A call whose
    readings do not come back fails.
- id: all_calls_succeed
  threat: A failed call could be left out of the median.
  check: A call succeeds when it exits 0 with the clock readings back, and a trial succeeds only when
    all 100 calls do; every call counts, including the first.
- id: first_command_included
  threat: The sandbox's first command can add start-up work to the first call.
  check: The first call is the sandbox's first command, so it can include start-up work. Each trial's median
    call is not moved by one slow call.
source:
  name: true command workload and BoxRouter standard image
  version: sha256:8db60a2eeeb06993
  ids:
  - true workload sha256:8db60a2eeeb06993
  - ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false

