# yaml-language-server: $schema=../../schemas/methodology.schema.json
# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: previews
version: 1.1.1
effective: '2026-10-26'
name: Previews
category: sandbox_operation
notes:
  what_this_measures: A pinned Vite dev server's time to become reachable through a public preview, repeated
    request time-to-first-byte and WebSocket upgrade support.
  how_to_read: Times are in milliseconds and lower is better. WebSocket support is a count of successful
    connections, and more is better.
  summary: A pinned Vite dev server is timed until its public preview returns the expected response.
  how_it_is_measured: A job-host monotonic clock measures from server start dispatch to the first expected
    HTTP 200 response through the preview URL. The workload is a pinned Vite dev server.
  cost_summary: Cost over the measured billing span per successful request.
  cost_how_to_read: Cost is shown in dollars. Lower is better.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: url_ready
  unit: ms
  direction: lower_is_better
  description: Time from server-start request until the preview returns the expected response, split into
    server runtime and remaining time.
  formula: end(url-poll) - start(start-server)
  quantity: time
  per: preview
- name: server_listening
  unit: ms
  direction: lower_is_better
  description: Time inside the sandbox from server launch until localhost returns the expected response.
  quantity: time
  per: server start
- name: url_reachable
  unit: ms
  direction: lower_is_better
  description: URL-ready duration less the in-sandbox server-listening runtime.
  formula: end(url-poll) - start(start-server) - runtime(server-listening)
  quantity: time
  per: preview
- name: request_ttfb
  unit: ms
  direction: lower_is_better
  description: Time to first byte for each successful GET over the preview's reused keep-alive connection.
  quantity: time
  per: request
- name: websocket_success
  unit: count
  direction: higher_is_better
  description: One when the preview WebSocket connects and receives the expected first message, otherwise
    zero.
  quantity: count
  per: connection
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  network: Public preview endpoint must be reachable from the job host; sandbox itself requires no network.
  lifetime_seconds: 900
  capability_settings:
    previews:
      access: public
      ports:
      - 5173
clocks:
  operation: Job-host monotonic clock around calls and preview requests.
  command_runtime: Sandbox clock around localhost polling until the server responds.
procedure:
  mode: single
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: One fresh sandbox per trial; upload the pinned app, open a preview on port 5173, then start
      the server and poll the URL.
    cold: First Vite server start and preview request in a fresh sandbox.
    warm: The 100 HTTP requests follow the first reachable response over one kept-alive connection.
  variants:
  - id: vite-dev
    label: Vite 8.3.4 development server on port 5173
    command: node node_modules/vite/bin/vite.js
    parameters:
      port: 5173
      path: /ping.txt
      expected_body: ok
      requests: 100
      poll_gap_seconds: 0.01
      local_poll_gap_seconds: 0.01
      websocket_subprotocol: vite-hmr
    description: This option selects the recorded workload used for the measurement.
  steps:
  - id: create
    name: Create
    action: Create a sandbox with a public preview for port 5173.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: upload
    name: Upload app
    action: Upload and unpack the pinned app archive, then verify its SHA-256.
    timer: null
    timeout_seconds: 300
  - id: open_preview
    name: Open preview
    action: Open port 5173 and obtain its public preview URL.
    timer:
      start_event: The preview open request is dispatched.
      stop_event: The preview URL returns.
    timeout_seconds: 60
    record_steps:
    - open-preview
  - id: start_server
    name: Start server
    action: Start the Vite server while the job host polls its URL; the command records the sandbox clock
      before launch.
    timer:
      start_event: The process start request is dispatched.
      stop_event: The process start call returns.
    timeout_seconds: 60
    record_steps:
    - start-server
  - id: server_listening
    name: Server listening
    action: Poll localhost every 10 ms until it returns HTTP 200 with body ok.
    timer:
      start_event: The sandbox clock reading immediately before server launch.
      stop_event: The first successful localhost response, measured by the sandbox clock.
    timeout_seconds: 120
    record_steps:
    - server-listening
  - id: url_poll
    name: Preview URL ready
    action: Poll the public preview URL every 10 ms until it returns HTTP 200 with body ok; record each
      attempt.
    timer:
      start_event: First GET sent just before server start.
      stop_event: First GET returning HTTP 200 with body ok.
    timeout_seconds: 120
    record_steps:
    - url-poll
  - id: request
    name: Requests through preview
    action: Send 100 sequential GET requests for /ping.txt over one kept-alive connection; each response
      must be HTTP 200 with body ok.
    timer:
      start_event: Each GET is sent after the preceding response returns.
      stop_event: The response status and headers arrive at the job host.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - request
  - id: websocket
    name: WebSocket upgrade
    action: Connect with the vite-hmr subprotocol and record whether upgrade succeeds and the first message
      is the expected connected message within 10 s.
    timer:
      start_event: The WebSocket connection is attempted.
      stop_event: The first server message arrives or the 10 s timeout expires.
    timeout_seconds: 10
    record_steps:
    - websocket
  - id: destroy
    name: Destroy
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: The process start request is dispatched.
  stop: The job host receives the first expected HTTP 200 response through the preview URL.
statistics:
  primary: median
  secondary:
  - mean
  - p95
  - p99
  percentile_method: Nearest rank over successful request observations; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
  billed_span: From create request to confirmed destroy.
failure_policy:
  timeout_seconds:
    create: 300
    upload: 300
    open_preview: 60
    start_server: 60
    server_listening: 120
    url_poll: 120
    request: 30
    websocket: 10
    destroy: 300
  retries: Polling the URL and localhost repeats at 10 ms intervals; HTTP requests after readiness are
    not retried; WebSocket support is recorded without failing the trial.
  success: URL polling reaches the expected HTTP response, all 100 requests return the expected body,
    and the sandbox is confirmed destroyed.
  provider_errors:
  - Preview open or request transport error; server or URL fails to become ready within 120 s; a request
    returns an unexpected status or body.
  benchmark_errors:
  - Malformed timing record
  - archive checksum mismatch
  - or failure in benchmark-side polling or parsing.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/previews/1.1.1/
  sha256: ff47ba34de0654994a51a10112df055c8c2677f92ed13287bf2a173f76f83da5
capabilities:
  required:
  - previews
interpretation:
  what_to_do: Check which providers give an app-builder agent a working preview URL, and how fast.
  informs: How long a sandbox's preview URL takes to answer after a dev server is started, split into
    the server listening inside the sandbox and the rest; how long requests through the preview take to
    their first byte; and whether a WebSocket upgrade, which hot reload needs, works through the preview.
  limits:
  - URL-ready time includes the process-start call, provider routing, and launch delay; it does not isolate
    routing.
  - The process-start call's own time is recorded beside the other timings but not subtracted from either.
  - Request latency is time to first byte on one keep-alive connection; it excludes connect, TLS, and
    DNS, and includes the route and Vite's static-file response.
  caveats:
  - Only providers that offer the `previews` capability through BoxRouter are measured; the rest show
    Not Supported.
  - Vite is configured to accept any Host header and to skip its WebSocket token check, so the benchmark
    can open the socket without first reading the token from the served client script.
  - 'Two clocks are used and never mixed: BoxRouter''s calls and the job host''s own requests use the
    job host''s monotonic clock; server listening uses the sandbox''s clock.'
validity_checks:
- id: pinned_answer
  threat: A provider's waiting page could be counted as the app.
  check: A 200 whose body is not the pinned `ok` counts as another attempt, as a 502 does; every attempt's
    status and time is recorded.
- id: pinned_app
  threat: A different app would make runs incomparable.
  check: The pinned Vite 8.3.4 project is uploaded as one tar file and checked by its SHA-256 in the sandbox
    before it is unpacked.
- id: poll_timeout
  threat: A server that never answers could hang the trial.
  check: Both polls give up after 120 s, which is the provider's failure.
- id: requests_ok
  threat: A bad response could be timed as a good one.
  check: Each of the 100 requests must be a 200 with the body `ok`.
- id: websocket_recorded
  threat: A failed WebSocket could fail the whole trial.
  check: A WebSocket that does not work is recorded as not working and does not fail the trial.
source:
  name: Vite dev server test app
  version: sha256:7e8022109f94dab2
  ids:
  - previews/vite-dev
  - previews-app-vite-8.3.4.tar.xz sha256:dcbf111bf57713b8da45750b9ef3e4bad15c123f54479000b33028d55a178812
  - vite 8.3.4
  licence: MIT (Vite 8.3.4); Apache-2.0 (BoxRouter app); unknown for unreviewed dependencies
execution:
  mode: script
  inference: false

