effective: '2026-11-08'
name: '{name:test.previews}'
category: sandbox_operation
notes:
  what_this_measures: The result records preview readiness, request time to first byte and successful
    {name:stage.websocket} upgrades.
  how_to_read: The {param:previews.1.1.14.statistics.primary} summarizes successful trials in the axis
    unit; {direction:url_ready}.
  summary: A pinned development server starts and serves requests through its public preview URL.
  how_it_is_measured: A job-host monotonic clock times from server-start dispatch to the expected HTTP
    response through the preview URL. The workload is a pinned Vite development server.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful request.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
