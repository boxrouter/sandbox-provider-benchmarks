id: previews
effective: '2026-11-08'
name: '{name:test.previews}'
category: sandbox_operation
notes:
  what_this_measures: The result records preview readiness, request time to first byte and successful
    {name:stage.websocket} upgrades.
  how_to_read: The {param:previews.statistics.primary} summarizes successful trials in the axis
    unit; {direction:url_ready}.
  summary: A pinned development server starts and serves requests through its public preview URL.
  how_it_is_measured: Direct uses its job-host clock. Cloud starts the process and polls the URL in one request;
    URL-ready and {name:stage.between} run on its one monotonic clock to the first expected response,
    {name:stage.between} from process.start returning.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful request.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: url_ready
  unit: ms
  direction: lower_is_better
  description: Time from process-start dispatch until the preview returns the expected response; Cloud takes it from one request's monotonic clock.
  formula: end(url-poll) - start(start-server)
  quantity: time
  per: preview
- name: server_listening
  unit: ms
  direction: lower_is_better
  description: Time inside the sandbox from server launch until localhost returns the expected response.
  quantity: time
  per: server start
  formula: runtime(server-listening)
- name: url_reachable
  unit: ms
  direction: lower_is_better
  description: Cloud interval on one request's monotonic clock from process.start returning to the first successful HTTP probe response.
  formula: end(url-poll) - end(start-server)
  quantity: time
  per: preview
- name: request_ttfb
  unit: ms
  direction: lower_is_better
  description: Time to first byte for each successful GET over the preview's reused keep-alive connection.
  quantity: time
  per: request
  formula: total(request)
- name: websocket_success
  unit: count
  direction: higher_is_better
  description: One when the preview {name:stage.websocket} connects and receives the expected first message,
    otherwise zero.
  quantity: count
  per: connection
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: The runner must reach the public preview endpoint; the sandbox itself requires no network.
  lifetime_seconds: 900
  capability_settings:
    previews:
      access: public
      ports:
      - 5173
clocks:
  operation: Direct uses the job-host monotonic clock around calls and preview probes. Cloud records provider-operation durations and the URL-ready and URL-reachable intervals on the API server's monotonic clock; the runner's own request and {name:stage.websocket} probes keep the runner clock.
  command_runtime: Sandbox clock around localhost polling until the server responds.
procedure:
  mode: single
  trials: 60
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: One fresh sandbox per trial; upload the pinned app, open a preview on port 5173, then start
      the server and poll the URL.
    cold: First Vite server start and preview request in a fresh sandbox.
    warm: The 100 HTTP requests follow the first reachable response over one kept-alive connection.
  variants:
  - id: vite-dev
    label: Vite 8.3.4 development server on port 5173
    command: node node_modules/vite/bin/vite.js
    parameters:
      port: 5173
      path: /ping.txt
      expected_body: ok
      requests: 100
      poll_gap_seconds: 0.01
      local_poll_gap_seconds: 0.01
      websocket_subprotocol: vite-hmr
    description: The workload uses the {param:previews.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a sandbox with a public preview for port 5173.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: upload
    name: Upload app
    action: Upload and unpack the pinned app archive, then verify its SHA-256.
    timer: null
    timeout_seconds: 300
  - id: open_preview
    name: Open preview
    action: Open port 5173 and obtain its public preview URL.
    timer:
      start_event: The preview open request is dispatched.
      stop_event: The preview URL returns.
    timeout_seconds: 60
    record_steps:
    - open-preview
  - id: start_server
    name: Start server
    action: Start the Vite server while Direct's job host or the Cloud runner polls its URL; the command
      records the sandbox clock before launch.
    timer:
      start_event: Direct dispatches process start; Cloud dispatches process.start to the API server.
      stop_event: The process-start call returns to the runner.
    timeout_seconds: 60
    record_steps:
    - start-server
  - id: server_listening
    name: '{name:stage.server-listening}'
    action: Poll localhost every 10 ms until it returns HTTP 200 with body ok.
    timer:
      start_event: The sandbox clock reading immediately before server launch.
      stop_event: The first successful localhost response, measured by the sandbox's own clock.
    timeout_seconds: 120
    record_steps:
    - server-listening
  - id: url_poll
    name: Preview URL ready
    action: Poll the public preview URL every 10 ms until it returns HTTP 200 with body ok; record each
      attempt.
    timer:
      start_event: First GET sent just before server start.
      stop_event: First GET returning HTTP 200 with body ok.
    timeout_seconds: 120
    record_steps:
    - url-poll
  - id: request
    name: Requests through preview
    action: Send 100 sequential GET requests for /ping.txt over one kept-alive connection; each response
      must be HTTP 200 with body ok.
    timer:
      start_event: Each GET is sent after the preceding response returns.
      stop_event: The response status and headers arrive at the job host or runner.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - request
  - id: websocket
    name: '{name:stage.websocket} upgrade'
    action: Connect with the vite-hmr subprotocol and record whether upgrade succeeds and the first message
      is the expected connected message within 10 s.
    timer:
      start_event: The {name:stage.websocket} connection is attempted.
      stop_event: The first server message arrives or the 10 s timeout expires.
    timeout_seconds: 10
    record_steps:
    - websocket
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: server-listening
    name: '{name:stage.server}'
    description: Time from server launch until localhost in the sandbox first answers HTTP 200 with body
      ok.
    record_steps:
    - server-listening
  - id: between
    name: '{name:stage.between}'
    description: Cloud time on one request's monotonic clock from process.start returning until the first public
      preview probe answers HTTP 200 with body ok.
    record_steps:
    - url-poll
timing_boundaries:
  start: The process start request is dispatched.
  stop: The first expected HTTP 200 response through the preview URL is received, by the job host in Direct and by the process-start request's probe in Cloud.
statistics:
  primary: median
  secondary:
  - mean
  - p95
  - p99
  percentile_method: Nearest rank over successful request observations; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    upload: 300
    open_preview: 60
    start_server: 60
    server_listening: 120
    url_poll: 120
    request: 30
    websocket: 10
    destroy: 300
  retries: Polling the URL and localhost repeats at 10 ms intervals; HTTP requests after readiness are
    not retried; {name:stage.websocket} support is recorded without failing the trial.
  success: URL polling reaches the expected HTTP response, all 100 requests return the expected body,
    and the sandbox is confirmed destroyed.
  provider_errors:
  - Preview open or request transport error; server or URL fails to become ready within 120 s; a request
    returns an unexpected status or body.
  benchmark_errors:
  - Malformed timing record
  - archive checksum mismatch
  - or failure in benchmark-side polling or parsing.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/previews/
  sha256: ff47ba34de0654994a51a10112df055c8c2677f92ed13287bf2a173f76f83da5
capabilities:
  required:
  - previews
interpretation:
  what_to_do: Check which providers give an app-builder agent a working preview URL, and how fast.
  informs: How long the preview URL takes to answer after a dev server is started, alongside the separate
    sandbox-clock server-listening time and the {name:stage.between} interval; how long requests through the preview take to
    their first byte; and whether a {name:stage.websocket} upgrade, which hot reload needs, works through
    the preview.
  limits:
  - URL-ready time includes the process-start call, provider routing, and launch delay; it does not isolate
    routing.
  - Cloud records the process-start operation separately. Neither its duration nor the sandbox-clock
    server-listening time is subtracted from or combined with the {name:stage.between} interval.
  - Request latency is time to first byte on one keep-alive connection; it excludes connect, TLS, and
    DNS, and includes the route and Vite's static-file response.
  caveats:
  - Only providers that offer the `previews` capability through BoxRouter are measured; the rest show
    Not Supported.
  - Vite is configured to accept any Host header and to skip its {name:stage.websocket} token check, so
    the benchmark can open the socket without first reading the token from the served client script.
  - 'Direct uses the job-host clock for calls and URL probes, and the sandbox clock for server listening. Cloud
    keeps three clocks separate: the API server monotonic clock for openPreview, process.start, URL-ready and
    {name:stage.between}, the runner clock for request and {name:stage.websocket} probes, and the sandbox clock for server listening.'
validity_checks:
- id: pinned_answer
  threat: A provider's waiting page could be counted as the app.
  check: A 200 whose body is not the pinned `ok` counts as another attempt, as a 502 does; every attempt's
    status and time is recorded.
- id: pinned_app
  threat: A different app would make runs incomparable.
  check: The pinned Vite 8.3.4 project is uploaded as one tar file and checked by its SHA-256 in the sandbox
    before it is unpacked.
- id: poll_timeout
  threat: A server that never answers could hang the trial.
  check: Both polls give up after 120 s, which is the provider's failure.
- id: requests_ok
  threat: A bad response could be timed as a good one.
  check: Each of the 100 requests must be a 200 with the body `ok`.
- id: websocket_recorded
  threat: A failed {name:stage.websocket} could fail the whole trial.
  check: A {name:stage.websocket} that does not work is recorded as not working and does not fail the
    trial.
source:
  name: Vite dev server test app
  version: sha256:7e8022109f94dab2
  ids:
  - previews/vite-dev
  - previews-app-vite-8.3.4.tar.xz sha256:dcbf111bf57713b8da45750b9ef3e4bad15c123f54479000b33028d55a178812
  - vite 8.3.4
  licence: MIT (Vite 8.3.4); Apache-2.0 (BoxRouter app); unknown for unreviewed dependencies
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: A fresh sandbox per trial; the first server start is cold and the later requests reuse the kept-alive
      connection. The provider's image caches stay on.
  job_host:
    status: meets
    text: Direct operation times use the job host's monotonic clock and command runtimes use the sandbox's
      own clock; Cloud operation durations use the API server's monotonic clock and each call's stall is
      checked against the configured bound.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, and working-directory device and file system. Direct also records job-host load over each trial's window; Cloud timing records per-call API-server stall.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
