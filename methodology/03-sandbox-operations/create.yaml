# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: sequential-tti
version: 1.2.3
effective: '2026-10-28'
name: Sequential TTI
category: sandbox_operation
headline: Create to first command
notes:
  what_this_measures: The result measures from dispatch of a create request until
    the selected first command returns successfully.
  how_to_read: The {param:sequential-tti.1.2.1.statistics.primary} is shown in {unit:time_to_interactive};
    {direction:time_to_interactive}.
  summary: A sandbox starts from a new image and runs the selected first command.
  how_it_is_measured: A job-host monotonic clock times each create request through
    the selected command’s exit code. Each trial starts from a new image.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: time_to_interactive
  unit: ms
  direction: lower_is_better
  description: Create request start to the first command's exit code returned, per
    sandbox.
  formula: end(first-true) - start(create)
  quantity: time
  per: sandbox
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
    modification: Each trial appends one small layer holding its unique trial id to
      this image and pushes it, so every trial starts from an image the provider has
      not seen.
  network: unknown
  lifetime_seconds: 300
procedure:
  mode: sequential
  trials: 40
  sandboxes_per_trial: 10
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: The image is new for every trial, so sandbox 1 starts cold. Sandboxes
      2 through 10 follow the previous one by seconds and may use warmer provider
      hosts than a start after a long idle period. Nothing is sent to the provider
      between the image build and the first create, or between a create and its command.
    cold: Sandbox 1 of a trial.
    warm: Sandbox 10 of a trial.
  variants:
  - id: 'true'
    label: true command
    command: 'true'
    description: The workload uses the {param:sequential-tti.1.2.3.procedure.variants.0.label}
      configuration.
    notes:
      summary: '{param:sequential-tti.1.2.3.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.3.notes.what_this_measures}'
  - id: python3
    label: python3 command
    command: python3 -c 'import json, sqlite3, ssl, asyncio, urllib.request, email.parser,
      xml.etree.ElementTree'
    description: The workload uses the {param:sequential-tti.1.2.3.procedure.variants.1.label}
      configuration.
    notes:
      summary: '{param:sequential-tti.1.2.3.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.3.notes.what_this_measures}'
  - id: node
    label: node command
    command: node -e 'require("crypto"); require("zlib"); require("http")'
    description: The workload uses the {param:sequential-tti.1.2.3.procedure.variants.2.label}
      configuration.
    notes:
      summary: '{param:sequential-tti.1.2.3.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.3.notes.what_this_measures}'
  - id: git
    label: git command
    command: git --version
    description: The workload uses the {param:sequential-tti.1.2.3.procedure.variants.3.label}
      configuration.
    notes:
      summary: '{param:sequential-tti.1.2.3.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.3.notes.what_this_measures}'
  steps:
  - id: build
    name: Image build
    action: Push a new image layer containing this trial's id to the registry and
      prepare the image with the provider. Recorded, but not part of the headline
      number.
    timer: null
    timeout_seconds: 1800
    record_steps:
    - build
  - id: create
    name: Create
    action: Ask the provider for a fresh sandbox from the trial's prepared image,
      after the previous sandbox has been confirmed gone.
    timer:
      start_event: The create request is dispatched.
      stop_event: The create call returns.
    timeout_seconds: 300
    record_steps:
    - create
  - id: first_command
    name: First command
    action: Send the variant's command as soon as create returns, with no other request
      or command in between.
    timer:
      start_event: The command is sent.
      stop_event: The command's exit code has returned to the job host.
    timeout_seconds: 120
    record_steps:
    - first-true
  - id: uptime
    name: Uptime read
    action: Read the sandbox's /proc/uptime after the command and keep the reading.
    timer: null
    timeout_seconds: 30
  - id: destroy
    name: Destroy
    action: Destroy the sandbox and confirm it is gone before the next create.
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: The create request for the sandbox is dispatched.
  stop: The first command's exit code has returned to the job host, within 120 seconds
    of the start.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 1
cost:
  method: not_published
  billed_span: From each sandbox's create request to its confirmed destroy.
  notes:
  - A trial's charge covers the image build and all ten sandboxes, and no per-sandbox
    split is defined, so no cost is published for this benchmark.
  - The provider may also charge for image preparation or short-lived image storage.
failure_policy:
  timeout_seconds:
    build: 1800
    create: 300
    first_command_from_create_start: 120
    destroy: 300
  retries: 'None; the first failed step ends the trial. A sequence that stops partway
    counts against the provider: earlier sandboxes count as successes, the failed
    one as a failure, and the rest as not reached.'
  success: The command exits 0 within 120 seconds of that sandbox's create start,
    and every resource the trial created is confirmed deleted.
  provider_errors:
  - A create or transport error, or a command that does not exit 0.
  - A first command that returns later than 120 seconds after its create started.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - A failure of the benchmark's own script, such as a missing operation record.
  exclusions:
  - An error shown not to be the provider's.
  - An excluded trial stays in the data with its reason.
  - The ready check does not run before the first command, since that command is what
    is measured.
parameters:
  path: parameters/sequential-tti/1.2.1/
  sha256: 52c020602028d2c34b62e9bdeac13d446de1132a5685b99ae20168b0f913ada1
interpretation:
  what_to_do: Compare how quickly providers start fresh sandboxes for work, and which
    first command you care about.
  informs: 'How quickly a provider can start fresh sandboxes for work: the wait between
    asking for a sandbox and its first command returning.'
  limits:
  - The trial image differs from the standard image by one small layer.
  - Later starts follow the preceding sandbox closely and may use warmer provider
    hosts.
  - Image build is recorded but excluded from the computed start time.
  caveats:
  - Sandbox 1 of a trial is shown as Cold and sandbox 10 as Warm.
  - Version 6 of the earlier Startup Time test replaced Start time + exec, which ran
    the three programs as one command; its earlier records stay as history.
  - One trial runs at a time per provider, so no other sandbox of the batch starts
    at the same time.
validity_checks:
- id: image_new_per_trial
  threat: A provider could start every trial from an image it has already seen.
  check: Each trial appends a file holding its unique trial id to the pinned standard
    image, pushes it and prepares it, so the image is new to the provider.
- id: command_within_window
  threat: A slow first command could be counted as a start.
  check: The first command must exit 0 within 120 seconds of that sandbox's create
    start; otherwise the trial fails as the provider's.
- id: no_ready_check_first
  threat: A ready check before the first command would hide the time being measured.
  check: No ready check runs before the first command; the command itself is what
    is measured.
source:
  name: BoxRouter standard image
  version: sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  ids:
  - ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  licence: unknown
execution:
  mode: script
  inference: false

