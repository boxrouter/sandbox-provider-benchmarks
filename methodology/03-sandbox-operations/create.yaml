id: burst-tti
version: 1.2.2
effective: '2026-10-27'
name: Burst TTI
category: sandbox_operation
notes:
  what_this_measures: "The result measures from the first dispatched create request until every sandbox\u2019\
    s first command returns successfully."
  how_to_read: The {param:burst-tti.1.2.1.statistics.primary} summarizes successful trials in the axis
    unit; {direction:burst_time}.
  summary: A burst of sandboxes starts together and each runs its first command.
  how_it_is_measured: A job-host monotonic clock runs from the first create request until the last sandbox's
    first successful command returns. Each burst starts from a new image.
  cost_summary: The cost covers the measured billing span per successful burst.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: burst_time
  unit: ms
  direction: lower_is_better
  description: First create request sent to the last sandbox's first successful command returned. Defined
    only when all N sandboxes answered.
  quantity: time
  per: burst
- name: answered_count
  unit: count
  direction: higher_is_better
  description: Sandboxes of the burst that answered their first command, out of N.
  quantity: count
  per: burst
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
    modification: Each trial appends one small layer holding its unique trial id to this image and pushes
      it, so every trial starts from an image the provider has not seen.
  network: unknown
  lifetime_seconds: 300
procedure:
  mode: concurrent
  trials: 20
  sandboxes_per_trial: unknown
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: variant
  warm_cold_policy:
    policy: The image is new for every trial. The N sandboxes of one burst are created together and
      are not independent samples; their times describe that burst and are not comparable with sequential
      starts. One burst runs at a time per provider account.
    cold: Every sandbox of the burst starts from a new image.
    warm: No measurement is taken warm.
  variants:
  - id: n5
    label: 5 sandboxes
    command: 'true'
    parameters:
      sandboxes: 5
    description: The workload uses the {param:burst-tti.1.2.2.procedure.variants.0.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.2.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.2.notes.what_this_measures}'
  - id: n10
    label: 10 sandboxes
    command: 'true'
    parameters:
      sandboxes: 10
    description: The workload uses the {param:burst-tti.1.2.2.procedure.variants.1.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.2.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.2.notes.what_this_measures}'
  - id: n20
    label: 20 sandboxes
    command: 'true'
    parameters:
      sandboxes: 20
    description: The workload uses the {param:burst-tti.1.2.2.procedure.variants.2.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.2.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.2.notes.what_this_measures}'
  - id: n50
    label: 50 sandboxes
    command: 'true'
    parameters:
      sandboxes: 50
    description: The workload uses the {param:burst-tti.1.2.2.procedure.variants.3.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.2.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.2.notes.what_this_measures}'
  steps:
  - id: build
    name: Image build
    action: Push a new image layer containing this trial's id to the registry and prepare the image
      with the provider. Recorded, but not part of the burst time.
    timer: null
    timeout_seconds: 1800
    record_steps:
    - build
  - id: create
    name: Create
    action: Send N create requests together, from the prepared image, on one event loop using asynchronous
      create.
    timer:
      start_event: The create request is dispatched.
      stop_event: That sandbox's create call returns.
    timeout_seconds: 300
    record_steps:
    - create
  - id: ready
    name: First command
    action: Send true as soon as that sandbox's create returns, and again 100 ms after each not-ready
      answer (HTTP 502, 503 or 504, or a refused or reset connection), at most 40 times with 30 seconds
      each. Every attempt is recorded.
    timer:
      start_event: The create call for that sandbox returns.
      stop_event: The first attempt that exits 0 returns.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - ready
  - id: size_probe
    name: Size probe
    action: Once every sandbox has answered or failed, probe each sandbox's size, untimed.
    timer: null
  - id: destroy
    name: Destroy
    action: Destroy all sandboxes together and confirm each is gone, then delete the trial's image.
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: The first of the N create requests is sent.
  stop: The last of the N sandboxes returns its first successful command.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 10
    requires_all_successful: true
cost:
  method: provider_reported_or_priced
  pricing_reference:
    repository: sandbox-provider-pricing
    function: price()
    price_sheet_version: recorded in the run manifest
  billed_span: From each sandbox's create request to its confirmed destroy.
  per_success: Cost of the successful attempts divided by their number; failed attempts' cost is not
    included.
  notes:
  - A throttled create makes no sandbox and costs nothing.
  - The provider may also charge for image preparation or short-lived image storage.
failure_policy:
  timeout_seconds:
    build: 1800
    create: 300
    ready_attempt: 30
    destroy: 300
  retries: None, except the ready attempts above, which are part of the measurement.
  success: All N sandboxes answer their first command and every resource the trial created is confirmed
    deleted. Otherwise the result is the number that answered, k of N.
  provider_errors:
  - A sandbox that never answers.
  - A create refused with a rate or concurrency limit (HTTP 429, or `rate_limited` or `quota_exceeded`),
    counted as throttled and against the provider on the benchmark's plan.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - A failure of the benchmark's own script.
  exclusions:
  - An error shown not to be the provider's.
  - A burst size above what the account's plan runs at once is not run and is shown as not offered on
    that plan.
  - Image build is recorded but excluded from the burst time.
parameters:
  path: parameters/burst-tti/1.2.1/
  sha256: 5c385682504796c4bf6c85c8de123017dbbc1718f6d9d9f54949f61f50ce2eaa
interpretation:
  what_to_do: Compare how much start-up throughput each provider gives a burst of 5, 10, 20 or 50 sandboxes,
    and how many of them answered.
  informs: How much throughput a provider gives when a team starts many sandboxes at once, as evals
    and reinforcement learning do.
  limits:
  - Sandboxes in one burst are not independent samples.
  - Burst times are not comparable with sequential starts.
  - A size above the account plan's concurrent limit is not run.
  caveats:
  - The burst time is defined only when all N sandboxes answered; otherwise the result is the number
    that answered, k of N.
  - One burst runs at a time per provider account, so no other sandbox of the batch starts beside it.
  - Version 3 moves provider creation-context setup before the timed sandbox creates; the sandbox create
    and ready workload is unchanged.
validity_checks:
- id: image_new_per_trial
  threat: A provider could start every trial from an image it has already seen.
  check: Each trial appends a file holding its unique trial id to the pinned standard image, pushes
    it and prepares it before the burst.
- id: setup_outside_burst
  threat: Provider setup for creating sandboxes could inflate the create time.
  check: N distinct creation contexts are prepared before the timed burst, so provider setup stays out
    of the sandbox create measurement.
- id: all_n_answered
  threat: A burst time over fewer sandboxes than requested would look faster than it was.
  check: The burst time is defined only when all N sandboxes answered; otherwise the result is how many
    answered, k of N.
- id: throttled_counted
  threat: A refused create could be hidden.
  check: A create refused with a rate or concurrency limit is counted as throttled, and against the
    provider on the benchmark's plan.
source:
  name: BoxRouter standard image
  version: sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  ids:
  - ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  licence: unknown
execution:
  mode: script
  inference: false


