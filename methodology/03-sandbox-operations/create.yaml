id: burst-tti
version: 1.2.15
effective: '2026-11-08'
name: '{name:test.burst-tti}'
category: sandbox_operation
notes:
  what_this_measures: The result measures from the first dispatched create request until every sandbox’s
    first command returns successfully.
  how_to_read: The {param:burst-tti.1.2.15.statistics.primary} summarizes successful trials in the axis
    unit; {direction:burst_time}.
  summary: >-
    Time to first command is measured for sandboxes created in parallel from one unique trial
    image.
  how_it_is_measured: >-
    A job-host monotonic clock runs from the first create request until the last sandbox's first
    successful command returns. Each trial uses a unique image layer while provider base-image
    caches and warm pools stay enabled.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful burst.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: burst_time
  unit: ms
  direction: lower_is_better
  description: First create request sent to the last sandbox's first successful command returned. Defined
    only when all N sandboxes answered.
  quantity: time
  per: burst
  formula: max(end(ready)) - min(start(create))
- name: answered_count
  unit: count
  direction: higher_is_better
  description: Sandboxes of the burst that answered their first command, out of N.
  quantity: count
  per: burst
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
    modification: Each trial appends a layer containing its unique trial id and pushes a unique trial
      image; provider base-image caches and warm pools stay enabled.
  network: unknown
  lifetime_seconds: 300
procedure:
  mode: concurrent
  trials: 20
  sandboxes_per_trial: unknown
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: variant
  warm_cold_policy:
    policy: Each trial uses a unique trial-image layer. Provider base-image caches and warm pools
      remain enabled; sandboxes in one burst may reuse provider state. The N sandboxes of one burst
      are created together and are not independent samples; their times describe that burst and are
      not comparable with sequential starts. One burst runs at a time per provider account.
    cold: The trial image layer is unique; no cold-host or cold-base-layer state is claimed.
    warm: Sandboxes in one burst may reuse provider caches or warm-pool state.
  variants:
  - id: n5
    label: 5 sandboxes
    command: 'true'
    parameters:
      sandboxes: 5
    description: The workload uses the {param:burst-tti.1.2.15.procedure.variants.0.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.15.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.15.notes.what_this_measures}'
  - id: n10
    label: 10 sandboxes
    command: 'true'
    parameters:
      sandboxes: 10
    description: The workload uses the {param:burst-tti.1.2.15.procedure.variants.1.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.15.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.15.notes.what_this_measures}'
  - id: n20
    label: 20 sandboxes
    command: 'true'
    parameters:
      sandboxes: 20
    description: The workload uses the {param:burst-tti.1.2.15.procedure.variants.2.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.15.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.15.notes.what_this_measures}'
  - id: n50
    label: 50 sandboxes
    command: 'true'
    parameters:
      sandboxes: 50
    description: The workload uses the {param:burst-tti.1.2.15.procedure.variants.3.label} configuration.
    notes:
      summary: '{param:burst-tti.1.2.15.notes.summary}'
      what_this_measures: '{param:burst-tti.1.2.15.notes.what_this_measures}'
  steps:
  - id: build
    name: Image build
    action: Push a new image layer containing this trial's id to the registry and prepare the image with
      the provider. Recorded, but not part of the burst time.
    timer: null
    timeout_seconds: 1800
    record_steps:
    - build
  - id: create
    name: '{name:stage.create}'
    action: Send N create requests together, from the prepared image, on one event loop using asynchronous
      create.
    timer:
      from: each create request
      sent: together with the rest of the burst
      until: that sandbox's create call returns
    timeout_seconds: 300
    record_steps:
    - create
  - id: ready
    name: First command
    action: Send true as soon as that sandbox's create returns, and again after each not-ready answer
      (HTTP 502, 503 or 504, or a refused or reset connection), with the waits, deadline and attempt timeout
      of the common ready check (ready_check). Every attempt is recorded.
    timer:
      from: the return of that sandbox's create call
      until: the first attempt of `true` that exits 0 returns
    timeout_seconds: 30
    repeats: true
    record_steps:
    - ready
  - id: size_probe
    name: Size probe
    action: Once every sandbox has answered or failed, probe each sandbox's size, untimed.
    timer: null
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy all sandboxes together and confirm each is gone, then delete the trial's image.
    timer:
      from: the destroy request
      until: the destroy calls return
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: create
    name: '{name:stage.create}'
    record_steps:
    - create
  - id: first-command
    name: First command
    record_steps:
    - ready
timing_boundaries:
  start: The first of the N create requests is sent.
  stop: The last of the N sandboxes returns its first successful command.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 10
    requires_all_successful: true
cost:
  method: provider_reported_or_priced
  notes:
  - A throttled create makes no sandbox and costs nothing.
  - The provider may also charge for image preparation or short-lived image storage.
failure_policy:
  timeout_seconds:
    build: 1800
    create: 300
    ready_attempt: 30
    destroy: 300
  retries: None, except the ready attempts above, which are part of the measurement.
  success: All N sandboxes answer their first command and every resource the trial created is confirmed
    deleted. Otherwise the result is the number that answered, k of N.
  provider_errors:
  - A sandbox that never answers.
  - A create refused with a rate or concurrency limit (HTTP 429, or `rate_limited` or `quota_exceeded`),
    counted as throttled and against the provider on the benchmark's plan.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - A failure of the benchmark's own script.
  exclusions:
  - An error shown not to be the provider's.
  - A burst size above what BoxRouter's account with the provider runs at once is not run and is shown
    as that account's limit.
  - Image build is recorded but excluded from the burst time.
  exclusion_limits:
    launch_spread_ms: 1000
parameters:
  path: parameters/burst-tti/1.2.15/
  sha256: 877884a1cb072043e6533c0251ea50e82ed979fe415081378d8a7316aa236d36
interpretation:
  what_to_do: Compare how much start-up throughput each provider gives a burst of 5, 10, 20 or 50 sandboxes,
    and how many of them answered.
  informs: How much throughput a provider gives when a team starts many sandboxes at once, as evals and
    reinforcement learning do.
  limits:
  - Sandboxes in one burst are not independent samples.
  - Burst times are not comparable with sequential starts.
  - A size above the account plan's concurrent limit is not run.
  caveats:
  - The burst time is defined only when all N sandboxes answered; otherwise the result is the number that
    answered, k of N.
  - One burst runs at a time per provider account, so no other sandbox of the batch starts beside it.
  - Version 3 moves provider creation-context setup before the timed sandbox creates; the sandbox create
    and ready workload is unchanged.
validity_checks:
- id: image_new_per_trial
  threat: A provider could start every trial from an image it has already seen.
  check: Each trial appends a file holding its unique trial id to the pinned standard image, pushes it
    and prepares it before the burst.
- id: setup_outside_burst
  threat: Provider setup for creating sandboxes could inflate the create time.
  check: N distinct creation contexts are prepared before the timed burst, so provider setup stays out
    of the sandbox create measurement.
- id: all_n_answered
  threat: A burst time over fewer sandboxes than requested would look faster than it was.
  check: The burst time is defined only when all N sandboxes answered; otherwise the result is how many
    answered, k of N.
- id: throttled_counted
  threat: A refused create could be hidden.
  check: A create refused with a rate or concurrency limit is counted as throttled, and against the provider
    on the benchmark's plan.
source:
  name: BoxRouter standard image
  version: sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  ids:
  - ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: exception
    text: Each trial creates N sandboxes together from one new image, by design; they describe one burst
      and are not independent samples.
  equal_concurrency:
    status: exception
    text: 'One burst runs at a time per provider account: the burst''s own sandboxes are the concurrency
      under test and must not share the account''s limits with other trials.'
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: >-
      Each trial uses a unique image layer. Provider base-image caches and warm pools stay
      enabled; sandboxes in one burst may reuse provider state.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: One burst runs at a time, so no other trial is in flight; the burst's own sandboxes share hosts
      by design.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, working-directory device and file system,
      and the job host's load over its window.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: exception
    text: Besides the common outlier and physical-limit rule, a burst whose create requests were sent over
      more than its launch-spread limit (exclusion_limits) is excluded as the benchmark's own, with the
      reason recorded, and topped off.

---
id: sequential-tti
version: 1.2.18
effective: '2026-11-08'
name: '{name:test.sequential-tti}'
category: sandbox_operation
headline: Create to first command
notes:
  what_this_measures: The result measures from dispatch of a create request until the selected first command
    returns successfully.
  how_to_read: The {param:sequential-tti.1.2.18.statistics.primary} is shown in {unit:time_to_interactive};
    {direction:time_to_interactive}.
  summary: >-
    Time to first command is measured for sandboxes created in sequence from one unique trial
    image.
  how_it_is_measured: >-
    A job-host monotonic clock times each create request through the selected command’s exit code.
    Each trial uses a unique image layer; provider base-image caches and warm pools stay enabled.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: time_to_interactive
  unit: ms
  direction: lower_is_better
  description: Create request start to the first command's exit code returned, per sandbox.
  formula: end(first-true) - start(create)
  quantity: time
  per: sandbox
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
    modification: Each trial appends a layer containing its unique trial id and pushes a unique trial
      image; provider base-image caches and warm pools stay enabled.
  network: unknown
  lifetime_seconds: 300
procedure:
  mode: sequential
  trials: 40
  sandboxes_per_trial: 10
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Each trial uses a unique trial-image layer. Provider base-image caches and warm pools
      remain enabled. Sandboxes 2 through 10 follow the previous one by seconds and may reuse provider
      caches or warm-pool state. Nothing is sent to the provider between the image build and the first
      create, or between a create and its command.
    cold: The trial-image layer is unique; host and base-layer cache state is not claimed.
    warm: Later sandboxes follow seconds apart and may reuse provider caches or warm-pool state.
  variants:
  - id: 'true'
    label: 'true'
    command: 'true'
    description: The workload uses the {param:sequential-tti.1.2.18.procedure.variants.0.label} configuration.
    notes:
      summary: '{param:sequential-tti.1.2.18.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.18.notes.what_this_measures}'
  - id: python3
    label: python3 -c import
    command: python3 -c 'import json, sqlite3, ssl, asyncio, urllib.request, email.parser, xml.etree.ElementTree'
    description: The workload uses the {param:sequential-tti.1.2.18.procedure.variants.1.label} configuration.
    notes:
      summary: '{param:sequential-tti.1.2.18.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.18.notes.what_this_measures}'
  - id: node
    label: node -e require
    command: node -e 'require("crypto"); require("zlib"); require("http")'
    description: The workload uses the {param:sequential-tti.1.2.18.procedure.variants.2.label} configuration.
    notes:
      summary: '{param:sequential-tti.1.2.18.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.18.notes.what_this_measures}'
  - id: git
    label: git --version
    command: git --version
    description: The workload uses the {param:sequential-tti.1.2.18.procedure.variants.3.label} configuration.
    notes:
      summary: '{param:sequential-tti.1.2.18.notes.summary}'
      what_this_measures: '{param:sequential-tti.1.2.18.notes.what_this_measures}'
  steps:
  - id: build
    name: Image build
    action: Push a new image layer containing this trial's id to the registry and prepare the image with
      the provider. Recorded, but not part of the headline number.
    timer: null
    timeout_seconds: 1800
    record_steps:
    - build
  - id: create
    name: '{name:stage.create}'
    action: Ask the provider for a fresh sandbox from the trial's prepared image, after the previous sandbox
      has been confirmed gone.
    timer:
      from: the create request
      sent: once the previous sandbox is confirmed gone
      until: the create call returns
    timeout_seconds: 300
    record_steps:
    - create
  - id: first_command
    name: First command
    action: Send the variant's command as soon as create returns, with no other request or command in
      between.
    timer:
      from: the command
      sent: as soon as the create call returns
      until: its exit code is back at the job host
    timeout_seconds: 120
    record_steps:
    - first-true
  - id: uptime
    name: Uptime read
    action: Read the sandbox's /proc/uptime after the command and keep the reading.
    timer: null
    timeout_seconds: 30
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone before the next create.
    timer:
      from: the destroy request
      until: the destroy call returns
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: create
    name: '{name:stage.create}'
    record_steps:
    - create
  - id: first-command
    name: First command
    record_steps:
    - first-true
timing_boundaries:
  start: The create request for the sandbox is dispatched.
  stop: The first command's exit code has returned to the job host, within 120 seconds of the start.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 1
cost:
  method: not_published
  notes:
  - A trial's charge covers the image build and all ten sandboxes, and no per-sandbox split is defined,
    so no cost is published for this benchmark.
  - The provider may also charge for image preparation or short-lived image storage.
failure_policy:
  timeout_seconds:
    build: 1800
    create: 300
    first_command_from_create_start: 120
    destroy: 300
  retries: 'None; the first failed step ends the trial. A sequence that stops partway counts against the
    provider: earlier sandboxes count as successes, the failed one as a failure, and the rest as not reached.'
  success: The command exits 0 within 120 seconds of that sandbox's create start, and every resource the
    trial created is confirmed deleted.
  provider_errors:
  - A create or transport error, or a command that does not exit 0.
  - A first command that returns later than 120 seconds after its create started.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - A failure of the benchmark's own script, such as a missing operation record.
  exclusions:
  - An error shown not to be the provider's.
  - An excluded trial stays in the data with its reason.
  - The ready check does not run before the first command, since that command is what is measured.
parameters:
  path: parameters/sequential-tti/1.2.18/
  sha256: 240fe318604b76eeec1d775c1b75b9491dbe6369e76bb1627d65a13bd20bfe4d
interpretation:
  what_to_do: Compare how quickly providers start fresh sandboxes for work, and which first command you
    care about.
  informs: 'How quickly a provider can start fresh sandboxes for work: the wait between asking for a sandbox
    and its first command returning.'
  limits:
  - The trial image differs from the standard image by one small layer.
  - Later starts follow the preceding sandbox closely and may use warmer provider hosts.
  - Image build is recorded but excluded from the computed start time.
  caveats:
  - Sandboxes 1 and 10 are shown as separate positions; provider base-image caches and warm pools
    remain enabled, so these positions do not mean cold hosts or base layers.
  - Version 6 of the earlier test replaced Start time + exec, which ran the three programs as one command;
    its earlier records stay as history.
  - Up to ten trials of a provider run at once, so a trial can share the provider's hosts with the other
    trials of its batch; the number in flight is recorded for each trial.
validity_checks:
- id: image_new_per_trial
  threat: A provider could start every trial from an image it has already seen.
  check: Each trial appends a file holding its unique trial id to the pinned standard image, pushes it
    and prepares it, so the image is new to the provider.
- id: command_within_window
  threat: A slow first command could be counted as a start.
  check: The first command must exit 0 within 120 seconds of that sandbox's create start; otherwise the
    trial fails as the provider's.
- id: no_ready_check_first
  threat: A ready check before the first command would hide the time being measured.
  check: No ready check runs before the first command; the command itself is what is measured.
source:
  name: BoxRouter standard image
  version: sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  ids:
  - ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: exception
    text: Each trial creates ten sandboxes one after another from one new image, by design; the ten are
      one sequence reported by position, and the trial, not the sandbox, is the independent sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: >-
      Each trial uses a unique image layer. Provider base-image caches and warm pools stay
      enabled; later sandboxes may reuse provider state.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, working-directory device and file system,
      and the job host's load over its window.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
