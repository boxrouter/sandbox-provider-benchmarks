    8 GiB sandbox.
  how_it_is_measured: A monotonic clock on the job host times each of 100 sequential writes of a fixed
    4,096-byte incompressible payload to /workspace/prim/file-4kib.bin until the write call returns.
  cost_summary: The cost is the sum of the provider-sourced sandbox costs for successful trials, divided
