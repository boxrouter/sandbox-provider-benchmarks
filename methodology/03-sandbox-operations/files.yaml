  what_to_do: Compare providers on the cost of a directory listing, which an agent pays at the start of
    many steps.
  informs: How long listing a directory of 200 files takes. Agents list directories to find their way
    around a repository, so a slow listing slows every step. It is the provider's command round trip with
    a small output; a provider improves it with a faster round trip.
