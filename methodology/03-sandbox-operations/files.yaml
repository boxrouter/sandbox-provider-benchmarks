  success: All 100 writes return successfully and the sandbox is confirmed destroyed.
  provider_errors:
  - A write request or transport error.
  benchmark_errors:
  - A malformed measurement record or failure in benchmark-side timing or payload preparation.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
interpretation:
  what_to_do: Compare providers within the 2 vCPU and 8 GiB cell on the fixed per-call time of writing
    a small source-sized file to a sandbox.
  informs: The result shows how long writing a 4 KiB file takes in a 2 vCPU and 8 GiB sandbox. Every file
    edit that an agent performs through the file API pays this write time; for a provider, the time points
    to per-call upload overhead and the number of round trips that a write requires.
  limits:
  - The 100 writes run sequentially to the same path after the directory-list phase in a shared trial,
    so they do not measure large streaming transfers or concurrent writes.
  - File-write calls execute through the file API without an in-sandbox command timer, so only total round-trip
    time on the job host is published.
  - Results belong to the 2 vCPU and 8 GiB declared-fit cell and are not equivalent to 2 vCPU and 4 GiB
    or 4 vCPU and 8 GiB results.
  caveats:
  - The three 2 vCPU and 8 GiB file benchmarks ({name:test.list-2vcpu-8gib}, {name:test.write-4kib-2vcpu-8gib},
    and {name:test.read-4kib-2vcpu-8gib}) share one trial and run back to back in the fixed order list,
    write, and read.
  - The first write creates /workspace/prim/file-4kib.bin and is recorded separately as the cold repetition,
    while writes 2 through 100 overwrite that file; a trial's value is the median across its 100 writes.
  - No write request is retried; the first failed repetition ends the trial and marks any remaining writes
    and the subsequent read phase as not reached.
  - Each repetition also records throughput in bytes per second, along with the total wall time and inter-call
    time, which are kept in the trial record and not published as headline metrics.
