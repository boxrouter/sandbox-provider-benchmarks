id: read-4kib-2vcpu-8gib
version: 1.0.3
effective: '2026-11-08'
name: '{name:test.read-4kib-2vcpu-8gib}'
category: sandbox_operation
notes:
  what_this_measures: The result measures the round-trip time of a 4 KiB file-read request in a 2 vCPU
    and 8 GiB sandbox, from dispatch on the job host until the complete 4,096-byte file returns.
  how_to_read: The {param:read-4kib.1.1.13.statistics.primary} summarizes successful trials in the axis
    unit; {direction:total_time}.
  summary: Repeated requests read a fixed 4 KiB file from a 2 vCPU and 8 GiB sandbox and verify its SHA-256
    digest.
  how_it_is_measured: A monotonic clock on the job host times each of 100 sequential reads of /workspace/prim/file-4kib.bin
    until the complete file returns, and the job host checks each returned payload's SHA-256 digest after
    timing stops.
  cost_summary: The cost is the sum of the provider-sourced sandbox costs for successful trials, divided
    by the number of successful calls.
  cost_how_to_read: Only successful trials contribute to the cost value, and provider-sourced costs are
    required for a cost to be shown.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: total_time
  unit: ms
  direction: lower_is_better
  description: Median time for one 4 KiB file-read call to return.
  formula: median(total(file-read-4kib))
  quantity: time
  per: call
environment:
  size:
    vcpu: 2
    memory_gib: 8
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1800
procedure:
  mode: single
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: The directory is listed and the fixed file is written in the same trial before 100 sequential
      reads.
    cold: First read after the final write.
    warm: Later reads follow the preceding response.
  variants:
  - id: shared-trial
    label: '{name:test.read-4kib}'
    parameters:
      bytes: 4096
      repetitions: 100
    description: The workload uses the {param:read-4kib.1.1.13.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox from the pinned standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: list
    name: List directory
    action: Run 100 earlier directory listings in the shared trial; this benchmark times file reads.
    timer: null
    timeout_seconds: 60
  - id: write
    name: Write file
    action: Write the fixed 4 KiB payload to the target path 100 times after the directory listing and
      before reads begin.
    timer: null
    timeout_seconds: 60
  - id: read
    name: Read file
    action: Read the file 100 times sequentially and check each returned payload's SHA-256 on the job
      host.
    timer:
      start_event: Each read request is dispatched.
      stop_event: The complete file returns to the job host.
    timeout_seconds: 60
    repeats: true
    record_steps:
    - file-read-4kib
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  shared_trial:
    with: list-2vcpu-8gib
    version: 1.0.3
timing_boundaries:
  start: Each file-read request is dispatched.
  stop: The complete file returns to the job host.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful calls; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
  tail:
    worse_side_percentile: 95
    min_successes: 20
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    write: 60
    read: 60
    destroy: 300
  retries: No read call is retried; the first failed call ends the trial.
  success: All reads return the file with the expected SHA-256 and the sandbox is confirmed destroyed.
  provider_errors:
  - A read request or transport error
  - or returned bytes that differ from the expected payload.
  benchmark_errors:
  - A malformed measurement record or failure in benchmark-side timing or checksum checking.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
interpretation:
  what_to_do: Compare providers within the 2 vCPU and 8 GiB cell on the fixed per-call time of reading
    a small source-sized file from a sandbox.
  informs: The result shows how long reading a 4 KiB file takes in a 2 vCPU and 8 GiB sandbox. Agents
    read source files before editing them, so this latency reflects the per-call overhead of the provider's
    file-download path.
  limits:
  - The 100 reads follow the directory-list and file-write phases in the same sandbox without warm-up
    or keep-alive delays between repetitions, and they do not measure concurrent reads or cold-sandbox
    startup.
  - Because the 4 KiB file was just written in the same trial, the guest kernel's page cache may serve
    the reads from memory rather than from a backing disk.
  - Results belong to the 2 vCPU and 8 GiB declared-fit cell and are not equivalent to 2 vCPU and 4 GiB
    or 4 vCPU and 8 GiB results.
  caveats:
  - The three 2 vCPU and 8 GiB file benchmarks ({name:test.list-2vcpu-8gib}, {name:test.write-4kib-2vcpu-8gib},
    and {name:test.read-4kib-2vcpu-8gib}) share one trial and run back to back in the fixed order list,
    write, and read.
  - Each trial's value is the median of its 100 read repetitions, while the first read after the final
    write is also recorded separately as the cold repetition and confirms that the preceding write persisted
    the expected bytes.
  - No read request is retried; the first failed repetition or SHA-256 mismatch ends the trial and marks
    any remaining repetitions as not reached.
validity_checks:
- id: read_digest
  threat: A read could return the wrong bytes and still be fast.
  check: Every read must bring back bytes with the same SHA-256 as the payload, checked on the job host
    after the call returns, so the first read also proves the last write. An error or another digest is
    the provider's failure.
source:
  name: fixed incompressible 4 KiB file payload
  version: sha256:d3864095125f1d38
  ids:
  - primitives/shared-trial
  - primitives/shared-trial sha256:d3864095125f1d38
  - /workspace/prim/file-4kib.bin
  - sha256:4e55ae0a74113b512e38db4100858f0bc5b5a38538fc11ce6293b0fc907a4450
  licence: Apache-2.0
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: The requests run back to back in one fresh sandbox, so later requests reuse warmed state; the
      first is the cold one. The provider's image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, working-directory device and file system,
      and the job host's load over its window.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.

