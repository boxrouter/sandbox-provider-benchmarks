# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: list-2vcpu-8gib
version: 1.0.3
effective: '2026-11-08'
name: '{name:test.list-2vcpu-8gib}'
category: sandbox_operation
notes:
  what_this_measures: The result measures the round-trip time of a directory-list request in a 2 vCPU
    and 8 GiB sandbox, from dispatch on the job host until the 200 file names return.
  how_to_read: The {param:list.1.1.13.statistics.primary} across successful trials is shown in {unit:total_time};
    {direction:total_time}.
  summary: Repeated requests list a prepared directory of 200 empty files in a 2 vCPU and 8 GiB sandbox.
  how_it_is_measured: After an untimed setup command creates 200 empty files in /workspace/prim/list,
    a monotonic clock on the job host times each of 100 sequential directory-list requests until the sorted
    file names return.
  cost_summary: The cost is the sum of the provider-sourced sandbox costs for successful trials, divided
    by the number of successful calls.
  cost_how_to_read: Only successful trials contribute to the cost value, and provider-sourced costs are
    required for a cost to be shown.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: total_time
  unit: ms
  direction: lower_is_better
  description: Median time for a directory-list request and its names to return.
  formula: median(total(file-list))
  quantity: time
  per: call
environment:
  size:
    vcpu: 2
    memory_gib: 8
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1800
procedure:
  mode: single
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: The 100 directory-list requests run back to back in one fresh sandbox after the directory
      is prepared.
    cold: First listing after untimed setup.
    warm: Subsequent listings follow the prior response.
  variants:
  - id: shared-trial
    label: List 200 empty files
    parameters:
      file_count: 200
      repetitions: 100
    description: The workload uses the {param:list.1.1.13.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox from the pinned standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: setup
    name: Prepare directory
    action: Create 200 empty files in the target directory in an untimed command.
    timer: null
    timeout_seconds: 60
  - id: list
    name: List directory
    action: List the prepared directory 100 times sequentially and return its names.
    timer:
      start_event: Each list request is dispatched.
      stop_event: The directory names return to the job host.
    timeout_seconds: 60
    repeats: true
    record_steps:
    - file-list
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each directory-list request is dispatched.
  stop: The directory names return to the job host.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful calls; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
  tail:
    worse_side_percentile: 95
    min_successes: 20
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    setup: 60
    list: 60
    destroy: 300
  retries: No list request is retried; the first failed call ends the trial.
  success: All 100 listing calls return the directory's 200 names and the sandbox is confirmed destroyed.
  provider_errors:
  - A list request or transport error
  - or a returned list that does not contain the expected names.
  benchmark_errors:
  - A malformed measurement record or failure in benchmark-side timing and checking.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/list-2vcpu-8gib/1.0.3/
  sha256: efb4031b7a6ff9a3b883f52e8e4000b3b2be7a6669d158e3f8d120ccace36b6e
interpretation:
  what_to_do: Compare providers within the 2 vCPU and 8 GiB cell on the round-trip time of listing a directory,
    which an agent pays repeatedly when inspecting a repository.
  informs: The result shows how long listing a directory of 200 files takes in a 2 vCPU and 8 GiB sandbox.
    Agents list directories to navigate a workspace, so slow directory listings add delay across many
    steps; for a provider, the time reflects the file API round trip and directory-reading overhead.
  limits:
  - The 100 listings run back to back in one fresh sandbox after untimed setup, so they do not measure
    concurrent file requests or a cold sandbox's first operation.
  - Directory-list requests execute through the file API without an in-sandbox shell command timer, so
    only total round-trip time on the job host is published.
  - Results belong to the 2 vCPU and 8 GiB declared-fit cell and are not equivalent to 2 vCPU and 4 GiB
    or 4 vCPU and 8 GiB results.
  caveats:
  - The three 2 vCPU and 8 GiB file benchmarks ({name:test.list-2vcpu-8gib}, {name:test.write-4kib-2vcpu-8gib},
    and {name:test.read-4kib-2vcpu-8gib}) share one trial and run back to back in the fixed order list,
    write, and read.
  - Each trial's value is the median of its 100 directory-list repetitions, while the first repetition
    is also recorded separately as the cold call after setup.
  - No request is retried; the first failed repetition ends the trial and marks any remaining repetitions
    and later file operations in that trial as not reached.
validity_checks:
- id: names_exact
  threat: A listing that returns the wrong names could still be fast.
  check: Each repetition succeeds only when the names back are exactly f000 to f199, sorted, and nothing
    else; an error or a different list is the provider's failure.
- id: setup_untimed
  threat: The first sandbox commands could add one-off work to the listing time.
  check: The 200 files are made by an untimed setup command; a non-zero exit is the provider's failure.
source:
  name: generated directory listing workload
  version: sha256:d3864095125f1d38
  ids:
  - primitives/shared-trial
  - primitives/shared-trial sha256:d3864095125f1d38
  - path /workspace/prim/list
  - 200 empty files named f000 through f199
  licence: Apache-2.0
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: The requests run back to back in one fresh sandbox, so later requests reuse warmed state; the
      first is the cold one. The provider's image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, working-directory device and file system,
      and the job host's load over its window.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.

