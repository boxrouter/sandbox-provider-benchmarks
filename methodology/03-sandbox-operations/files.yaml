- id: payload_digest
  threat: A wrong payload would make writes and reads incomparable.
  check: The payload is the first 4,096 bytes of SHAKE256 over a fixed ASCII seed, incompressible, generated
    in memory and checked against its SHA-256 before the first write; a mismatch is the benchmark's.
- id: write_succeeds
  threat: A failed write could be left out of the median.
  check: An error is the provider's failure; a size-limit refusal from BoxRouter is the benchmark's.
