- name: total_time
  unit: ms
  direction: lower_is_better
  description: Median time for one 4 KiB file-write call to finish.
  formula: median(total(file-write-4kib))
  quantity: time
  per: call
environment:
  size:
    vcpu: 2
    memory_gib: 8
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1800
procedure:
  mode: single
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: The payload is written 100 times to one path in the same fresh sandbox.
    cold: First write creates the file.
    warm: Later writes replace the existing file and follow the prior response.
  variants:
  - id: shared-trial
    label: Write a 4 KiB payload
    parameters:
      bytes: 4096
      repetitions: 100
    description: The workload uses the {param:write-4kib.1.1.13.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox from the pinned standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: list
    name: List directory
    action: Run 100 earlier directory listings in the shared trial; this benchmark times file writes.
    timer: null
    timeout_seconds: 60
  - id: write
    name: Write file
    action: Write the same fixed 4 KiB payload to the target path 100 times sequentially.
    timer:
      start_event: Each write request is dispatched.
      stop_event: The write call returns after staging and copying the bytes into place.
    timeout_seconds: 60
    repeats: true
    record_steps:
    - file-write-4kib
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  shared_trial:
    with: list-2vcpu-8gib
    version: 1.0.3
timing_boundaries:
  start: Each file-write request is dispatched.
  stop: The write call returns after staging and copying the bytes into place.
statistics:
  primary: median
  secondary:
  - mean
