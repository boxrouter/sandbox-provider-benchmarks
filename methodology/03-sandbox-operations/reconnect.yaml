id: reconnect
effective: '2026-11-08'
name: '{name:test.reconnect}'
category: sandbox_operation
notes:
  what_this_measures: Direct results time attach and the first command from fresh client processes; Cloud
    records their API-server operation timings with a fresh provider session for each call.
  how_to_read: The {param:reconnect.statistics.primary} summarizes successful trials in the axis
    unit; {direction:reconnect_time}.
  summary: A fresh client attaches to an existing sandbox and runs its first command; Cloud uses a fresh
    provider session for each API call.
  how_it_is_measured: Direct times attach and the first command with the job-host monotonic clock. Cloud
    records separate API-server operation timings for them, each using a fresh provider session; sandbox
    clock readings from `true` stay separate.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful round.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: reconnect_time
  unit: ms
  direction: lower_is_better
  description: Median attach duration plus median first-command duration across ten rounds.
  formula: median(total(attach)) + median(total(true))
  quantity: time
  per: round
- name: attach_time
  unit: ms
  direction: lower_is_better
  description: Median time for BoxRouter to look up the existing sandbox by id.
  formula: median(total(attach))
  quantity: time
  per: round
- name: command_total
  unit: ms
  direction: lower_is_better
  description: Median total time for true through the attached sandbox.
  formula: median(total(true))
  quantity: time
  per: round
- name: command_runtime
  unit: ms
  direction: lower_is_better
  description: Median true runtime measured by the sandbox clock.
  formula: median(runtime(true))
  quantity: time
  per: round
- name: command_latency
  unit: ms
  direction: lower_is_better
  description: Median command total time less in-sandbox runtime.
  formula: median(latency(true))
  quantity: time
  per: round
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 900
clocks:
  operation: Direct uses the job-host monotonic clock around attach and command calls; Cloud uses the API
    server's monotonic clock around each provider call.
  command_runtime: Sandbox clock around true.
procedure:
  mode: sequential
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Each trial uses one fresh sandbox; Direct starts a new client process for each round, while
      Cloud opens a fresh provider session for each API call.
    cold: First attach from a fresh Direct client process or Cloud provider session.
    warm: Later rounds also use fresh Direct client processes or Cloud provider sessions; the provider
      sandbox remains the same.
  variants:
  - id: attach-true
    label: Attach, then true, 10 rounds
    command: 'true'
    parameters:
      rounds: 10
    description: The workload uses the {param:reconnect.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: attach
    name: Attach by id
    action: In each of ten rounds, Direct uses a fresh client process and Cloud uses a fresh provider
      session to attach to the existing sandbox by its id.
    timer:
      start_event: Direct starts timing the attach lookup; Cloud records the API-server attach operation.
      stop_event: The attach lookup returns to the Direct client or the Cloud API server completes the operation.
    timeout_seconds: 120
    repeats: true
    record_steps:
    - attach
  - id: 'true'
    name: Run true
    action: Direct sends true from its fresh client process; Cloud uses a separate fresh provider session.
      Both return its exit status and sandbox clock readings.
    timer:
      start_event: Direct starts timing the command after attach; Cloud records the API-server command operation.
      stop_event: The command returns the result and sandbox clock readings.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - 'true'
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox from its creating process and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each round's attach lookup begins.
  stop: The first true command's result and sandbox clock readings return to the runner.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful rounds; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    attach: 120
    'true': 30
    destroy: 300
  retries: No attach or command round is retried; any failed round ends the trial.
  success: All ten Direct client-process or Cloud provider-session rounds attach and run true successfully,
    and the sandbox is confirmed destroyed.
  provider_errors:
  - Attach
  - command or transport error; nonzero true exit; or missing sandbox clock readings.
  benchmark_errors:
  - A malformed timing record, Direct client-process setup failure, or failure to open a fresh Cloud provider session.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/reconnect/
  sha256: 7e7bb0c04d39980a1a5b2bf42d6258ad9c00c9392729f21762427403d15f2a5b
interpretation:
  what_to_do: Compare what a stateless worker, or an agent restarted after a crash or a deploy, pays before
    its first command.
  informs: 'Direct attach and first-command timings from a fresh client process, or Cloud API-server operation
    timings for the same calls with a fresh provider session for each API call.'
  limits:
  - Providers differ in attach behavior; no attach opens the connection used by commands, so first-command
    time includes that work.
  - Cloud reports API-server operation timings for attach and `true` separately; session setup is not a separate metric.
  - Times include the network between the Direct job host or Cloud API server and the provider's region.
  caveats:
  - 'The chart shows reconnect: the median attach plus the median first command.'
  - Each round is recorded with its number, so the first round can be compared with the later ones.
validity_checks:
- id: fresh_process_per_round
  threat: A reused client or provider session could hide the reconnect cost.
  check: Direct starts a fresh client process for each round. Cloud uses a fresh provider session for each
    API call, so neither mode reuses session state from the process that created the sandbox or an earlier round.
- id: round_succeeds
  threat: A failed attach or command could be left out.
  check: A round succeeds when the attach returns and `true` exits 0 with the clock readings back; a trial
    succeeds when all 10 rounds do.
source:
  name: true attach-and-command workload
  version: sha256:7a2a55839e3d8949
  ids:
  - reconnect/attach-true workload sha256:7a2a55839e3d8949
  - standard-image sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Direct uses a fresh client process each round; Cloud uses a fresh provider session per API call,
      while the sandbox stays the same. The provider's image caches stay on.
  job_host:
    status: meets
    text: Direct operation times use the job host's monotonic clock and command runtimes use the sandbox's
      own clock; Cloud operation durations use the API server's monotonic clock and each call's stall is
      checked against the configured bound.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, and working-directory device and file system. Direct also records job-host load over each trial's window; Cloud timing records per-call API-server stall.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
