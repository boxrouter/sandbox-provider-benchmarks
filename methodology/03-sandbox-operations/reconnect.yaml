id: reconnect
effective: '2026-11-08'
name: '{name:test.reconnect}'
category: sandbox_operation
notes:
  what_this_measures: The result measures the time to attach to a running sandbox and run a first command from a fresh client process.
  how_to_read: The {param:reconnect.statistics.primary} summarizes successful trials in the axis
    unit; {direction:reconnect_time}.
  summary: A fresh client process attaches to an existing sandbox by ID and runs its first command.
  how_it_is_measured: The monotonic clock on the client host times the attach call and the first command separately in
    each fresh client process, while sandbox clock readings from `true` stay separate.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful round.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: reconnect_time
  unit: ms
  direction: lower_is_better
  description: Median attach duration plus median first-command duration across ten rounds.
  formula: median(total(attach)) + median(total(true))
  quantity: time
  per: round
- name: attach_time
  unit: ms
  direction: lower_is_better
  description: Median time for BoxRouter to look up the existing sandbox by id.
  formula: median(total(attach))
  quantity: time
  per: round
- name: command_total
  unit: ms
  direction: lower_is_better
  description: Median total time for true through the attached sandbox.
  formula: median(total(true))
  quantity: time
  per: round
- name: command_runtime
  unit: ms
  direction: lower_is_better
  description: Median true runtime measured by the sandbox clock.
  formula: median(runtime(true))
  quantity: time
  per: round
- name: command_latency
  unit: ms
  direction: lower_is_better
  description: Median command total time less in-sandbox runtime.
  formula: median(latency(true))
  quantity: time
  per: round
- name: first_round_attach
  unit: ms
  direction: lower_is_better
  description: Time on the client host's monotonic clock that a fresh client process takes to attach
    to the existing sandbox by id in the first, cold round.
  formula: first(total(attach))
  quantity: time
  per: round
- name: first_round_command
  unit: ms
  direction: lower_is_better
  description: Time on the client host's monotonic clock that the client process takes to run true
    on the attached sandbox in the first, cold round.
  formula: first(total(true))
  quantity: time
  per: round
- name: later_rounds_attach
  unit: ms
  direction: lower_is_better
  description: Median time on the client host's monotonic clock that a fresh client process takes to
    attach to the existing sandbox by id across the later, warm rounds.
  formula: median(later(total(attach)))
  quantity: time
  per: round
- name: later_rounds_command
  unit: ms
  direction: lower_is_better
  description: Median time on the client host's monotonic clock that the client process takes to run
    true on the attached sandbox across the later, warm rounds.
  formula: median(later(total(true)))
  quantity: time
  per: round
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 900
clocks:
  operation: The client host's monotonic clock times each attach call and each command call.
  command_runtime: Sandbox clock around true.
default_view:
  metric: reconnect_time
  variant: attach-true
procedure:
  mode: sequential
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 5
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Each trial creates one fresh sandbox, and each reconnect round starts in a new client process.
    cold: The first round attaches to the sandbox from a fresh client process.
    warm: Later rounds also attach from fresh client processes while the target sandbox remains the same.
  variants:
  - id: attach-true
    label: Attach, then true, 10 rounds
    command: 'true'
    parameters:
      rounds: 10
    description: The workload uses the {param:reconnect.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    action: Create a fresh sandbox and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: attach
    name: Attach by id
    label: Attach
    show: hidden
    action: In each of the ten rounds, start a fresh client process and attach to the existing sandbox by its id.
    timer:
      start_event: The client process dispatches the attach lookup.
      stop_event: The attach lookup returns to the client process.
    timeout_seconds: 120
    repeats: true
    record_steps:
    - attach
  - id: 'true'
    name: Run true
    label: 'true'
    show: hidden
    action: From that same client process, run true and receive its exit status and sandbox clock readings.
    timer:
      start_event: The client process dispatches the command right after the attach call returns.
      stop_event: The command returns the result and sandbox clock readings.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - 'true'
  - id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    action: Destroy the sandbox from its creating process and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each round's attach lookup begins.
  stop: The first true command's result and sandbox clock readings return to the runner.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful rounds; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    attach: 120
    'true': 30
    destroy: 300
  retries: No attach or command round is retried; any failed round ends the trial.
  success: All ten rounds attach from a fresh client process and run true with exit code 0, and the sandbox is
    confirmed destroyed.
  provider_errors:
  - Attach
  - command or transport error; nonzero true exit; or missing sandbox clock readings.
  benchmark_errors:
  - A malformed timing record or a failure to start a fresh client process.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/reconnect/
  sha256: 7e7bb0c04d39980a1a5b2bf42d6258ad9c00c9392729f21762427403d15f2a5b
interpretation:
  what_to_do: Compare what a stateless worker, or an agent restarted after a crash or a deploy, pays before
    its first command.
  informs: 'How long a fresh client process takes to attach to a running sandbox and run its first command.'
  limits:
  - Providers differ in attach behavior; no attach opens the connection used by commands, so first-command
    time includes that work.
  - The attach call and `true` are timed separately, while starting the client process is outside both timers.
  - Every time covers the whole request from the client host to the provider and back, which is the same for every provider.
  caveats:
  - 'The chart shows reconnect: the median attach plus the median first command.'
  - Each round is recorded with its number, so the first round can be compared with the later ones.
validity_checks:
- id: fresh_process_per_round
  threat: A reused client or provider session could hide the reconnect cost.
  check: Each round runs in a newly started client process, so no connection or session state carries over from
    the process that created the sandbox or from an earlier round.
- id: round_succeeds
  threat: A failed attach or command could be left out.
  check: A round succeeds when the attach returns and `true` exits 0 with the clock readings back; a trial
    succeeds when all 10 rounds do.
source:
  name: true attach-and-command workload
  version: sha256:7a2a55839e3d8949
  ids:
  - reconnect/attach-true workload sha256:7a2a55839e3d8949
  - standard-image sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false