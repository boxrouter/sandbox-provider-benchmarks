id: reconnect
version: 1.1.13
effective: '2026-11-08'
name: '{name:test.reconnect}'
category: sandbox_operation
notes:
  what_this_measures: The result records attach lookup and the first command’s runtime and surrounding
    latency in a fresh client process.
  how_to_read: The {param:reconnect.1.1.13.statistics.primary} summarizes successful trials in the axis
    unit; {direction:reconnect_time}.
  summary: A fresh client process attaches to an existing sandbox and runs its first command.
  how_it_is_measured: A job-host monotonic clock times each round from attach lookup until the first `true`
    result and sandbox clock readings return. Each round attaches from a fresh process and runs `true`.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful round.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: reconnect_time
  unit: ms
  direction: lower_is_better
  description: Median attach duration plus median first-command duration across the ten fresh-process
    rounds.
  formula: median(total(attach)) + median(total(true))
  quantity: time
  per: round
- name: attach_time
  unit: ms
  direction: lower_is_better
  description: Median time for BoxRouter to look up the existing sandbox by id.
  formula: median(total(attach))
  quantity: time
  per: round
- name: command_total
  unit: ms
  direction: lower_is_better
  description: Median total time for true through the attached sandbox.
  formula: median(total(true))
  quantity: time
  per: round
- name: command_runtime
  unit: ms
  direction: lower_is_better
  description: Median true runtime measured by the sandbox clock.
  formula: median(runtime(true))
  quantity: time
  per: round
- name: command_latency
  unit: ms
  direction: lower_is_better
  description: Median command total time less in-sandbox runtime.
  formula: median(latency(true))
  quantity: time
  per: round
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 900
clocks:
  operation: Job-host monotonic clock around attach and command calls.
  command_runtime: Sandbox clock around true.
procedure:
  mode: sequential
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Each trial uses one fresh sandbox; each of ten rounds starts a new job-host process and client.
    cold: First attach from a fresh process.
    warm: Later rounds also use fresh processes and clients; provider sandbox remains the same.
  variants:
  - id: attach-true
    label: Attach, then true, 10 rounds
    command: 'true'
    parameters:
      rounds: 10
    description: The workload uses the {param:reconnect.1.1.13.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: attach
    name: Attach by id
    action: In each of ten new processes, create a new client and attach to the existing sandbox by its
      id.
    timer:
      start_event: Attach lookup begins in the fresh process.
      stop_event: The sandbox lookup returns.
    timeout_seconds: 120
    repeats: true
    record_steps:
    - attach
  - id: 'true'
    name: Run true
    action: Send true as the first command in the newly attached process and return its exit status and
      sandbox clock readings.
    timer:
      start_event: The command is dispatched after attach returns.
      stop_event: The result and clock readings return to the new process.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - 'true'
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox from its creating process and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each round's attach lookup begins.
  stop: The first true command's result and sandbox clock readings return to that round's new process.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful rounds; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    attach: 120
    'true': 30
    destroy: 300
  retries: No attach or command round is retried; any failed round ends the trial.
  success: All ten fresh processes attach and run true successfully, and the sandbox is confirmed destroyed.
  provider_errors:
  - Attach
  - command or transport error; nonzero true exit; or missing sandbox clock readings.
  benchmark_errors:
  - A malformed timing record or fresh-process client setup failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/reconnect/1.1.13/
  sha256: 7e7bb0c04d39980a1a5b2bf42d6258ad9c00c9392729f21762427403d15f2a5b
interpretation:
  what_to_do: Compare what a stateless worker, or an agent restarted after a crash or a deploy, pays before
    its first command.
  informs: 'How long a new process takes to reach a sandbox that already exists: it attaches to the sandbox
    by its id through BoxRouter, then runs `true` there.'
  limits:
  - Providers differ in attach behavior; no attach opens the connection used by commands, so first-command
    time includes that work.
  - The new process's startup, imports, and client setup are not timed.
  - Times include the network between the job host and the provider's US region.
  caveats:
  - 'The chart shows reconnect: the median attach plus the median first command.'
  - Each round is recorded with its number, so the first round can be compared with the later ones.
validity_checks:
- id: fresh_process_per_round
  threat: A shared connection, pool or token would hide the reconnect cost.
  check: Each of the 10 rounds starts a new process that builds its own client, untimed, so nothing is
    shared with the process that created the sandbox or with an earlier round.
- id: round_succeeds
  threat: A failed attach or command could be left out.
  check: A round succeeds when the attach returns and `true` exits 0 with the clock readings back; a trial
    succeeds when all 10 rounds do.
source:
  name: true attach-and-command workload
  version: sha256:7a2a55839e3d8949
  ids:
  - reconnect/attach-true workload sha256:7a2a55839e3d8949
  - standard-image sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  licence: unknown
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Each round starts a new job-host process and client, so no client state is reused; the sandbox
      stays the same. The provider's image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: exception
    text: >-
      Guest CPU model/count, kernel and working-directory device/filesystem are probed outside
      timing on a best-effort basis; unavailable readings remain unknown. Native host/zone
      identifiers are not collected. Missing facts leave the affected independence checks
      unassessed.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
