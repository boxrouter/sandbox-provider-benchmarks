id: delayed-resume
effective: '2026-11-08'
name: '{name:test.delayed-resume}'
category: sandbox_operation
notes:
  what_this_measures: The result measures the first marker read after the selected idle wait; an explicit
    resume is included when used.
  how_to_read: The {param:delayed-resume.statistics.primary} summarizes successful trials in the
    axis unit; {direction:resume_to_data_back}.
  summary: A sandbox reads a fixed marker after the selected idle wait.
  how_it_is_measured: The provider's time starts at explicit resume, or at the first read when
    resume is implicit, and ends when the marker returns. Each trial uses a fresh sandbox.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful round.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: resume_to_data_back
  unit: ms
  direction: lower_is_better
  description: Time from explicit resume request or first post-wait read until the marker returns.
  quantity: time
  per: round
  formula: end(data-back) - start(resume|data-back)
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1500
clocks:
  operation: Provider time of each call; the job host's monotonic clock measures the idle interval.
  command_runtime: Sandbox clock readings from the pre-wait and post-wait marker reads.
default_view:
  metric: resume_to_data_back
  variant: wait-15min
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 5
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox is created per trial, the 4 KiB marker is read before the idle interval, then
      read again afterward.
    cold: First workload in a fresh sandbox.
    warm: The post-wait read follows the trial's stated idle interval.
  variants:
  - id: wait-0s
    label: Resumed at once
    parameters:
      bytes: 4096
      seed: 20261004
      wait_seconds: 0
    description: Resume at once, with no idle interval after the pause; not applicable without a pause
      call, as the sandbox cannot stand by in 0 s.
    notes:
      summary: '{param:delayed-resume.notes.summary}'
      what_this_measures: '{param:delayed-resume.notes.what_this_measures}'
  - id: wait-60s
    label: Resumed after 60 s
    parameters:
      bytes: 4096
      seed: 20261004
      wait_seconds: 60
    description: The paused sandbox receives no commands during its shorter idle interval.
    notes:
      summary: '{param:delayed-resume.notes.summary}'
      what_this_measures: '{param:delayed-resume.notes.what_this_measures}'
  - id: wait-15min
    label: Resumed after 15 min
    parameters:
      bytes: 4096
      seed: 20261004
      wait_seconds: 900
    description: During the longer wait, leave the paused sandbox untouched before resume.
    notes:
      summary: '{param:delayed-resume.notes.summary}'
      what_this_measures: '{param:delayed-resume.notes.what_this_measures}'
  steps:
  - id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    action: Create a fresh sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: control
    name: Read before wait
    label: Read before
    show: table
    action: Read the 4 KiB marker and record the sandbox clock immediately before the idle interval.
    timer: null
    timeout_seconds: 300
    record_steps:
    - control
  - id: pause
    name: '{name:stage.pause}'
    label: '{name:stage.pause}'
    show: hidden
    action: Call pause where the provider supports an explicit pause; otherwise, where the provider
      declares that an idle sandbox pauses by itself, leave the sandbox idle.
    timer: null
    timeout_seconds: 300
    record_steps:
    - pause
  - id: wait
    name: Idle wait
    action: Send no requests for the selected wait duration.
    timer: null
    timeout_seconds: 900
  - id: resume
    name: '{name:stage.resume}'
    label: '{name:stage.resume}'
    show: stack
    action: Call resume immediately after the wait where explicit pause is supported.
    timer:
      from: the resume request
      sent: after the selected wait following the pause
      until: the resume call returns
    timeout_seconds: 300
    record_steps:
    - resume
  - id: data_back
    name: Read after wait
    label: '{name:stage.read}'
    show: stack
    action: Read the same marker; when there is no explicit resume operation, this first read wakes the
      sandbox.
    timer:
      from: the resume, or the first read where the provider has no resume call
      until: the marker and clock readings return
    timeout_seconds: 300
    record_steps:
    - data-back
  - id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    action: Destroy the sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: resume
    name: '{name:stage.resume}'
    record_steps:
    - resume
  - id: read
    name: '{name:stage.read}'
    record_steps:
    - data-back
timing_boundaries:
  start: Resume dispatch, or the first marker-read dispatch when no explicit resume is available.
  stop: The post-wait marker and sandbox clock readings return.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    control: 300
    pause: 300
    wait: 900
    resume: 300
    data_back: 300
    destroy: 300
  retries: No control or post-wait read is retried; first failed step ends the trial.
  success: Both marker reads succeed and integrity is preserved; standby evidence is required to publish
    a positive-wait resume metric when applicable; sandbox is destroyed.
  provider_errors:
  - Call or transport error
  - marker mismatch
  - or absence of required standby evidence.
  benchmark_errors:
  - A malformed timing record or benchmark-side workload failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/delayed-resume/
  sha256: 64de08afbcb2e1599d7bc4b68025e6fd1dc6e0799ebfc24deaa427bccf8785b6
capabilities:
  optional:
    pause_resume: {}
    idle_shutdown:
      on_idle: paused
interpretation:
  what_to_do: Compare resume modes and wait lengths when choosing a provider for work that pauses between
    tool calls.
  informs: How long an agent sandbox takes to read its data back after it has been left alone for 0 s,
    60 s or 15 min. A slower result points at the provider's pause and resume or idle-standby path; the
    timed spans identify where to look.
  limits:
  - Results do not establish performance for larger files, memory state, busy sandboxes or a different
    client connection pattern.
  - A wait past the connection idle timeout may include a TCP and TLS handshake in the return time.
  caveats:
  - Providers that support pause and resume receive explicit pause and resume calls. A provider without
    them that declares an idle sandbox pauses by itself is left idle; its wake occurs during the first
    read after the wait. A provider with neither is not offered.
  - A provider that is left idle is not applicable at the 0 s wait, because its sandbox cannot stand by
    within 0 s and a read at once would compare a running sandbox with a resumed one.
  - If the evidence of idle standby is missing, or a positive wait did not enter standby, the affected
    resume metric is withheld.
validity_checks:
- id: same_file_read_twice
  threat: The data read after the wait could differ from the data written.
  check: The same deterministic 4 KiB file is read before and after the wait; a trial succeeds when both
    reads finish without an error.
- id: standby_evidence
  threat: A provider that never went to sleep would look like a fast resume.
  check: Where the sandbox is left idle, both marker reads also record the sandbox's uptime, which
    stands still while the sandbox is frozen, just before and just after the read. The check uses
    `standby_lower_bound_s`, a value that is not published. It is the job host's monotonic gap from
    the return of the `control` request to the send of the `data-back` request, less the uptime's
    progress from the end of `control`, the last command before the wait, to the start of
    `data-back`. The uptime readings lie outside that gap, so the value never exceeds the time the
    sandbox was frozen. A trial whose value is under 5 s, or whose uptime could not be read, fails
    as the provider's, and its resume metric is withheld. It is a validity check only. It is never
    a latency and is never added to or subtracted from a published time.
source:
  name: deterministic 4 KiB marker workload
  version: unknown
  ids:
  - resume-after-wait/wait-0s sha256:f3a1ebbc8848bfcf
  - resume-after-wait/wait-60s sha256:d13aa379889a0b87
  - resume-after-wait/wait-15min sha256:e5027dfa8dffe0f3
  licence: Apache-2.0
execution:
  mode: script
  inference: false
---
id: pause-resume
effective: '2026-11-08'
name: '{name:test.pause-resume}'
category: sandbox_operation
notes:
  what_this_measures: The result measures pause, resume and the return of readable data for the selected
    data shape.
  how_to_read: The {param:pause-resume.statistics.primary} is shown in {unit:resume_to_data_back};
    {direction:resume_to_data_back}.
  summary: A sandbox pauses and resumes before reading the selected data.
  how_it_is_measured: Pause and resume calls, and the first read after resume through its data and sandbox
    clock readings, are timed at the provider's own time. The sandbox clock measures the read's runtime.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, divided by successful
    units.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: resume_to_data_back
  unit: ms
  direction: lower_is_better
  description: Time from resume dispatch until the first post-resume data read returns.
  formula: end(data-back) - start(resume)
  quantity: time
  per: sandbox
- name: resume_to_first_answer
  unit: ms
  direction: lower_is_better
  description: Resume-to-data-read time less the command runtime measured inside the sandbox.
  formula: end(data-back) - start(resume) - runtime(data-back)
  quantity: time
  per: sandbox
- name: pause_to_data_back
  unit: ms
  direction: lower_is_better
  description: Time from pause dispatch until the post-resume data read returns.
  formula: end(data-back) - start(pause)
  quantity: time
  per: sandbox
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 2700
clocks:
  operation: Provider time of each operation.
  command_runtime: Sandbox clock readings around the read after resume.
default_view:
  metric: pause_to_data_back
  variant: storage-2gib
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 5
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Each trial uses one fresh sandbox and one deterministic data workload; after loading, it settles
      60 s before pause.
    cold: First run of each trial.
    warm: No repeated or warm path is measured.
  variants:
  - id: empty
    label: Empty
    parameters:
      bytes: 4096
      seed: 20261004
    description: Only the seeded marker file is loaded; no bulk payload is added.
    notes:
      summary: '{param:pause-resume.notes.summary}'
      what_this_measures: '{param:pause-resume.notes.what_this_measures}'
  - id: memory-1gib
    label: 1 GiB in memory
    parameters:
      bytes: 1073741824
      seed: 20261004
    description: A live process keeps the generated payload resident in RAM across the pause.
    notes:
      summary: '{param:pause-resume.notes.summary}'
      what_this_measures: '{param:pause-resume.notes.what_this_measures}'
  - id: storage-1gib
    label: 1 GiB on disk
    parameters:
      bytes: 1073741824
      seed: 20261004
    description: Write the generated payload to disk before pausing the sandbox.
    notes:
      summary: '{param:pause-resume.notes.summary}'
      what_this_measures: '{param:pause-resume.notes.what_this_measures}'
  - id: storage-2gib
    label: 2 GiB on disk
    parameters:
      bytes: 2147483648
      seed: 20261004
    description: The larger disk case leaves a generated file in place through pause.
    notes:
      summary: '{param:pause-resume.notes.summary}'
      what_this_measures: '{param:pause-resume.notes.what_this_measures}'
  - id: storage-4gib
    label: 4 GiB on disk
    parameters:
      bytes: 4294967296
      seed: 20261004
    description: After resume, verify the generated disk payload against its recorded digest.
    notes:
      summary: '{param:pause-resume.notes.summary}'
      what_this_measures: '{param:pause-resume.notes.what_this_measures}'
  steps:
  - id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    action: Create a fresh sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: load
    name: Load data
    action: Generate the selected deterministic file or in-memory buffer using the benchmark workload,
      then wait 60 s without sending requests.
    timer: null
    timeout_seconds: 900
  - id: pause
    name: '{name:stage.pause}'
    label: '{name:stage.pause}'
    show: stack
    action: Request pause after the 60 s settle, with data loaded and no intervening request.
    timer:
      from: the pause request
      sent: once the data has settled for 60 s
      until: the provider reports the sandbox paused and the call returns
    timeout_seconds: 300
    record_steps:
    - pause
  - id: resume
    name: '{name:stage.resume}'
    label: '{name:stage.resume}'
    show: stack
    action: Request resume immediately after pause returns, with no intervening request.
    timer:
      from: the resume request
      sent: immediately after the pause call returns
      until: the resume call returns
    timeout_seconds: 300
    record_steps:
    - resume
  - id: data_back
    name: Read data after resume
    label: '{name:stage.read}'
    show: stack
    action: Read the marker or disk data directly where supported; for memory, verify the original holder
      PID and buffer hash.
    timer:
      from: the first command after the resume
      until: the read result and sandbox clock readings return
    timeout_seconds: 900
    record_steps:
    - data-back
  - id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    action: Destroy the sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: pause
    name: '{name:stage.pause}'
    record_steps:
    - pause
  - id: resume
    name: '{name:stage.resume}'
    record_steps:
    - resume
  - id: read
    name: '{name:stage.read}'
    default_off: true
    record_steps:
    - data-back
timing_boundaries:
  start: The resume request is dispatched.
  stop: The first post-resume data read and its clock readings return.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    load: 900
    pause: 300
    resume: 300
    data_back: 900
    destroy: 300
  retries: No pause, resume or data-read step is retried; the first failed step ends the trial.
  success: The selected data is returned without error; memory trials also retain the holder PID and
    buffer hash; the sandbox is destroyed.
  provider_errors:
  - '{name:stage.pause}'
  - resume
  - transport or data-read error; changed memory holder identity; or data that fails its integrity
    check.
  benchmark_errors:
  - A malformed timing record or benchmark-side workload failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/pause-resume/
  sha256: ea56d588b59bff66022401273b083c0bb2d00ff4d3c8607939c8b551a53684b4
capabilities:
  required:
  - pause_resume
interpretation:
  what_to_do: 'Choose a provider and a pause mode for the data your jobs keep between calls: nothing,
    memory or disk.'
  informs: How long a sandbox takes to pause and to read its data back after resume, with an empty marker,
    in-memory data or data stored on disk. The pause, resume and first-answer spans locate restore costs.
  limits:
  - This measures one sandbox's pause and restore path, not a concurrency test.
  - Results apply only to these data shapes and to providers that expose pause and resume.
  - The in-memory workload's read includes hashing its buffer.
  caveats:
  - The memory workload requires a pause that keeps memory; a provider whose pause keeps files only is
    shown as not offered.
  - '`data-back`, a plain read of the file, is the only timed command after the resume; its SHA-256 digest
    is checked afterwards, outside the timed span, and there is no read before the pause.'
  - The untimed load is started in the background and its status read every 0.5 s until it exits, because
    a load takes up to 58 s and a call that waits more than about 120 s can be cut by a provider's
    gateway.
validity_checks:
- id: data_read_back
  threat: A resume that loses the data would still return quickly.
  check: Success requires `data-back` to read the data without an error.
- id: memory_holder_unchanged
  threat: A memory workload could restart from scratch and look restored.
  check: For the memory workload, the holder that answers must have the process id and buffer hash it
    reported when it was loaded; a change is the provider's failure of the restore.
- id: nothing_between
  threat: Extra requests between pause and read could warm the sandbox.
  check: Nothing but the pause and the resume is sent between the end of the settle and the read.
source:
  name: deterministic pause-resume data workloads
  version: unknown
  ids:
  - pause-resume/empty sha256:f431302a992dacd8
  - pause-resume/memory-1gib sha256:f7ae360ce2516c40
  - pause-resume/storage-1gib sha256:dc223fe77775e638
  - pause-resume/storage-2gib sha256:01b1c0b73cbbf055
  - pause-resume/storage-4gib sha256:a120e67ae400cf3d
  licence: Apache-2.0
execution:
  mode: script
  inference: false