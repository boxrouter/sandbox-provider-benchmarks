id: delayed-resume
version: 1.2.16
effective: '2026-11-08'
name: '{name:test.delayed-resume}'
category: sandbox_operation
notes:
  what_this_measures: The result measures the first marker read after the selected idle wait; an explicit
    resume is included when used.
  how_to_read: The {param:delayed-resume.1.2.16.statistics.primary} summarizes successful trials in the
    axis unit; {direction:resume_to_data_back}.
  summary: A sandbox reads a fixed marker after the selected idle wait.
  how_it_is_measured: A job-host monotonic clock starts at explicit resume, or at the first read when
    resume is implicit, and stops when the marker returns. Each trial uses a fresh sandbox.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful round.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: resume_to_data_back
  unit: ms
  direction: lower_is_better
  description: Time from explicit resume request or first post-wait read until the marker returns.
  quantity: time
  per: round
  formula: end(data-back) - start(resume|data-back)
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1500
clocks:
  operation: Job-host monotonic clock around calls and the idle interval.
  command_runtime: Sandbox clock readings from the pre-wait and post-wait marker reads.
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox is created per trial, the 4 KiB marker is read before the idle interval, then
      read again afterward.
    cold: First workload in a fresh sandbox.
    warm: The post-wait read follows the trial's stated idle interval.
  variants:
  - id: wait-0s
    label: Resumed at once
    parameters:
      bytes: 4096
      seed: 20261004
      wait_seconds: 0
    description: Resume the sandbox immediately; no idle interval follows the pause.
    notes:
      summary: '{param:delayed-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:delayed-resume.1.2.16.notes.what_this_measures}'
  - id: wait-60s
    label: Resumed after 60 s
    parameters:
      bytes: 4096
      seed: 20261004
      wait_seconds: 60
    description: The paused sandbox receives no commands during its shorter idle interval.
    notes:
      summary: '{param:delayed-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:delayed-resume.1.2.16.notes.what_this_measures}'
  - id: wait-15min
    label: Resumed after 15 min
    parameters:
      bytes: 4096
      seed: 20261004
      wait_seconds: 900
    description: During the longer wait, leave the paused sandbox untouched before resume.
    notes:
      summary: '{param:delayed-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:delayed-resume.1.2.16.notes.what_this_measures}'
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: control
    name: Read before wait
    action: Read the 4 KiB marker and record the sandbox clock immediately before the idle interval.
    timer: null
    timeout_seconds: 300
    record_steps:
    - control
  - id: pause
    name: '{name:stage.pause}'
    action: Call pause where the provider supports an explicit pause; otherwise leave the sandbox idle.
    timer: null
    timeout_seconds: 300
    record_steps:
    - pause
  - id: wait
    name: Idle wait
    action: Send no requests for the selected wait duration.
    timer: null
    timeout_seconds: 900
  - id: resume
    name: '{name:stage.resume}'
    action: Call resume immediately after the wait where explicit pause is supported.
    timer:
      from: the resume request
      sent: after the selected wait following the pause
      until: the resume call returns
    timeout_seconds: 300
    record_steps:
    - resume
  - id: data_back
    name: Read after wait
    action: Read the same marker; when there is no explicit resume operation, this first read wakes the
      sandbox.
    timer:
      from: the resume, or the first read where the provider has no resume call
      until: the marker and clock readings return to the job host
    timeout_seconds: 300
    record_steps:
    - data-back
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: resume
    name: '{name:stage.resume}'
    record_steps:
    - resume
  - id: read
    name: '{name:stage.read}'
    record_steps:
    - data-back
timing_boundaries:
  start: Resume dispatch, or the first marker-read dispatch when no explicit resume is available.
  stop: The post-wait marker and sandbox clock readings return to the job host.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 18
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    control: 300
    pause: 300
    wait: 900
    resume: 300
    data_back: 300
    destroy: 300
  retries: No control or post-wait read is retried; first failed step ends the trial.
  success: Both marker reads succeed and integrity is preserved; standby evidence is required to publish
    a positive-wait resume metric when applicable; sandbox is confirmed destroyed.
  provider_errors:
  - Call or transport error
  - marker mismatch
  - or absence of required standby evidence.
  benchmark_errors:
  - A malformed timing record or benchmark-side workload failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/delayed-resume/1.2.16/
  sha256: 64de08afbcb2e1599d7bc4b68025e6fd1dc6e0799ebfc24deaa427bccf8785b6
capabilities:
  optional:
    pause_resume: {}
interpretation:
  what_to_do: Compare resume modes and wait lengths when choosing a provider for work that pauses between
    tool calls.
  informs: How long an agent sandbox takes to read its data back after it has been left alone for 0 s,
    60 s or 15 min. A slower result points at the provider's pause and resume or idle-standby path; the
    timed spans identify where to look.
  limits:
  - Results do not establish performance for larger files, memory state, busy sandboxes or a different
    client connection pattern.
  - A wait past the connection idle timeout may include a TCP and TLS handshake in the return time.
  caveats:
  - Providers that support pause and resume receive explicit pause and resume calls. A provider without
    it is left idle and may enter standby by itself; its wake occurs during the first read after the wait.
  - If the evidence of idle standby is missing, or a positive wait did not enter standby, the affected
    resume metric is withheld.
validity_checks:
- id: same_file_read_twice
  threat: The data read after the wait could differ from the data written.
  check: The same deterministic 4 KiB file is read before and after the wait; a trial succeeds when both
    reads finish without an error.
- id: standby_evidence
  threat: A provider that never went to sleep would look like a fast resume.
  check: The observed `frozen_s` value compares the job-host gap with the sandbox clock readings, from
    the end of `control`, the last command before the wait, to the start of `data-back`.
source:
  name: deterministic 4 KiB marker workload
  version: unknown
  ids:
  - resume-after-wait/wait-0s sha256:f3a1ebbc8848bfcf
  - resume-after-wait/wait-60s sha256:d13aa379889a0b87
  - resume-after-wait/wait-15min sha256:e5027dfa8dffe0f3
  licence: Apache-2.0
execution:
  mode: script
  inference: false
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Each trial uses a fresh sandbox and one data workload; nothing warm is repeated. The provider's
      image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, working-directory device and file system,
      and the job host's load over its window.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.

---
id: pause-resume
version: 1.2.16
effective: '2026-11-08'
name: '{name:test.pause-resume}'
category: sandbox_operation
notes:
  what_this_measures: The result measures pause, resume and the return of readable data for the selected
    data shape.
  how_to_read: The {param:pause-resume.1.2.16.statistics.primary} is shown in {unit:resume_to_data_back};
    {direction:resume_to_data_back}.
  summary: A sandbox pauses and resumes before reading the selected data.
  how_it_is_measured: A job-host monotonic clock times pause and resume calls, then the first read after
    resume through its data and sandbox clock readings. The sandbox clock measures the read's runtime.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, divided by successful
    units.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: resume_to_data_back
  unit: ms
  direction: lower_is_better
  description: Time from resume dispatch until the first post-resume data read returns.
  formula: end(data-back) - start(resume)
  quantity: time
  per: sandbox
- name: resume_to_first_answer
  unit: ms
  direction: lower_is_better
  description: Resume-to-data-read time less the command runtime measured inside the sandbox.
  formula: end(data-back) - start(resume) - runtime(data-back)
  quantity: time
  per: sandbox
- name: pause_to_data_back
  unit: ms
  direction: lower_is_better
  description: Time from pause dispatch until the post-resume data read returns.
  formula: end(data-back) - start(pause)
  quantity: time
  per: sandbox
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 300
clocks:
  operation: Job-host monotonic clock around each operation.
  command_runtime: Sandbox clock readings around the read after resume.
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Each trial uses one fresh sandbox and one deterministic data workload; after loading, it settles
      60 s before pause.
    cold: First run of each trial.
    warm: No repeated or warm path is measured.
  variants:
  - id: empty
    label: Empty
    parameters:
      bytes: 4096
      seed: 20261004
    description: Only the seeded marker file is loaded; no bulk payload is added.
    notes:
      summary: '{param:pause-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:pause-resume.1.2.16.notes.what_this_measures}'
  - id: memory-1gib
    label: 1 GiB in memory
    parameters:
      bytes: 1073741824
      seed: 20261004
    description: A live process keeps the generated payload resident in RAM across the pause.
    notes:
      summary: '{param:pause-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:pause-resume.1.2.16.notes.what_this_measures}'
  - id: storage-1gib
    label: 1 GiB on disk
    parameters:
      bytes: 1073741824
      seed: 20261004
    description: Write the generated payload to disk before pausing the sandbox.
    notes:
      summary: '{param:pause-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:pause-resume.1.2.16.notes.what_this_measures}'
  - id: storage-2gib
    label: 2 GiB on disk
    parameters:
      bytes: 2147483648
      seed: 20261004
    description: The larger disk case leaves a generated file in place through pause.
    notes:
      summary: '{param:pause-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:pause-resume.1.2.16.notes.what_this_measures}'
  - id: storage-4gib
    label: 4 GiB on disk
    parameters:
      bytes: 4294967296
      seed: 20261004
    description: After resume, verify the generated disk payload against its recorded digest.
    notes:
      summary: '{param:pause-resume.1.2.16.notes.summary}'
      what_this_measures: '{param:pause-resume.1.2.16.notes.what_this_measures}'
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Create a fresh sandbox and pass the untimed ready check.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: load
    name: Load data
    action: Generate the selected deterministic file or in-memory buffer using the benchmark workload,
      then wait 60 s without sending requests.
    timer: null
    timeout_seconds: 900
  - id: pause
    name: '{name:stage.pause}'
    action: Request pause after the 60 s settle, with data loaded and no intervening request.
    timer:
      from: the pause request
      sent: once the data has settled for 60 s
      until: the provider reports the sandbox paused and the call returns
    timeout_seconds: 300
    record_steps:
    - pause
  - id: resume
    name: '{name:stage.resume}'
    action: Request resume immediately after pause returns, with no intervening request.
    timer:
      from: the resume request
      sent: immediately after the pause call returns
      until: the resume call returns
    timeout_seconds: 300
    record_steps:
    - resume
  - id: data_back
    name: Read data after resume
    action: Read the marker or disk data directly where supported; for memory, verify the original holder
      PID and buffer hash.
    timer:
      from: the first command after the resume
      until: the read result and sandbox clock readings return to the job host
    timeout_seconds: 900
    record_steps:
    - data-back
  - id: destroy
    name: '{name:stage.destroy}'
    action: Check boot id and available memory, then destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  stages:
  - id: pause
    name: '{name:stage.pause}'
    record_steps:
    - pause
  - id: resume
    name: '{name:stage.resume}'
    record_steps:
    - resume
  - id: read
    name: '{name:stage.read}'
    record_steps:
    - data-back
timing_boundaries:
  start: The resume request is dispatched.
  stop: The first post-resume data read and its clock readings return to the job host.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; no trimming.
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 18
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    load: 900
    pause: 300
    resume: 300
    data_back: 900
    destroy: 300
  retries: No pause, resume or data-read step is retried; the first failed step ends the trial.
  success: The selected data is returned without error; memory trials also retain the holder PID, buffer
    hash and boot id; the sandbox is confirmed destroyed.
  provider_errors:
  - '{name:stage.pause}'
  - resume
  - transport or data-read error; changed memory holder identity or boot id; or data that fails its integrity
    check.
  benchmark_errors:
  - A malformed timing record or benchmark-side workload failure.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/pause-resume/1.2.16/
  sha256: 31f502c6ac3766306d6ba2cea7c68e6a07f268dbbecad43dadad7641b4f1df7d
capabilities:
  required:
  - pause_resume
interpretation:
  what_to_do: 'Choose a provider and a pause mode for the data your jobs keep between calls: nothing,
    memory or disk.'
  informs: How long a sandbox takes to pause and to read its data back after resume, with an empty marker,
    in-memory data or data stored on disk. The pause, resume and first-answer spans locate restore costs.
  limits:
  - This measures one sandbox's pause and restore path, not a concurrency test.
  - Results apply to these data shapes and providers whose bindings expose pause and resume.
  - The in-memory workload's read includes hashing its buffer.
  caveats:
  - The memory workload requires a pause that keeps memory; a provider whose pause keeps files only is
    shown as not offered.
  - Since version 13, `data-back`, a plain read of the file, is the only command sent after the resume;
    there is no read before the pause, no checksum and no restore-added value. Version 12's results are
    not pooled with it.
  - Since version 16, the untimed load is started in the background and its status read every 10 s until
    it exits, because a load takes up to 58 s and a call that waits more than about 120 s can be cut by
    a provider's gateway. Version 15's results are not pooled with it.
validity_checks:
- id: data_read_back
  threat: A resume that loses the data would still return quickly.
  check: Success requires `data-back` to read the data without an error.
- id: memory_holder_unchanged
  threat: A memory workload could restart from scratch and look restored.
  check: For the memory workload, the holder that answers must have the process id and buffer hash it
    reported when it was loaded, and the sandbox's boot id must not change; a change is the provider's
    failure of the restore.
- id: nothing_between
  threat: Extra requests between pause and read could warm the sandbox.
  check: Nothing but the pause and the resume is sent between the end of the settle and the read.
