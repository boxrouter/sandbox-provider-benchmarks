# yaml-language-server: $schema=../../schemas/methodology.schema.json
id: exec-latency
version: 1.2.1
effective: '2026-10-29'
name: Exec Latency
category: sandbox_operation
notes:
  summary: Time to send a single exec `true` call.
  how_it_is_measured: A job-host monotonic clock times each `true` call until its exit status and sandbox
    clock readings return. Calls run sequentially in one sandbox.
  cost_summary: The cost covers the measured billing span per successful call.
  cost_how_to_read: Only successful trials contribute to the cost value.
  what_this_measures: The result is the round-trip latency of one call to a command that runs for almost
    no time, from the call until its result and the sandbox clock readings return.
  how_to_read: The {param:exec-latency.1.1.1.statistics.primary} summarizes every call of every successful
    trial, pooled, in the axis unit; {direction:total_time}.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: total_time
  unit: ms
  direction: lower_is_better
  description: Median time from one command call starting until its result and clock readings return,
    over every call of every successful trial.
  formula: median(total(true))
  quantity: latency
  per: call
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  network: unknown
  lifetime_seconds: 600
clocks:
  operation: Job-host monotonic clock around each command call.
  command_runtime: Sandbox clock read immediately before and after true.
procedure:
  mode: single
  trials: 100
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: One fresh sandbox per trial; 100 calls run sequentially in the same sandbox, so later calls
      reuse the session's warmed state.
    cold: First call after the untimed ready check.
    warm: Calls 2 through 100 follow immediately after the preceding call returns.
  variants:
  - id: 'true'
    label: true, 100 calls through the sandbox
    command: 'true'
    parameters:
      calls: 100
    description: The workload uses the {param:exec-latency.1.1.2.procedure.variants.0.label} configuration.
  steps:
  - id: create
    name: Create
    action: Create a fresh sandbox from the pinned standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: 'true'
    name: true calls
    action: Send 100 true commands one at a time, with each call's sandbox clock readings returned to
      the job host.
    timer:
      start_event: The command call is dispatched.
      stop_event: The exit code and sandbox clock readings return to the job host.
    timeout_seconds: 30
    repeats: true
    record_steps:
    - 'true'
  - id: destroy
    name: Destroy
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
timing_boundaries:
  start: Each true command call is dispatched.
  stop: Its exit code and the sandbox clock readings return to the job host.
statistics:
  primary: median
  secondary:
  - mean
  ranking:
    ranked: true
    min_successes: 5
  percentile_method: Nearest rank over every call of every successful trial, pooled; calls of a trial
    that failed partway are left out, as they are from the per-trial sums; no trimming.
  sample: pooled_calls
  interval:
    type: cluster_bootstrap_percentile
    cluster: trial
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  scatter:
    sampling: one_random_call_per_trial
    seed: 0
cost:
  method: provider_reported_or_priced
  billed_span: From create request to confirmed destroy.
failure_policy:
  timeout_seconds:
    create: 300
    'true': 30
    destroy: 300
  retries: No command call is retried; the first failed call ends the trial.
  success: All 100 commands exit 0 and return both clock readings; the sandbox is confirmed destroyed.
  provider_errors:
  - A command call or transport error
  - a nonzero command exit
  - or missing clock readings.
  benchmark_errors:
  - A malformed measurement record or failure in benchmark-side timing and parsing.
  exclusions:
  - A failure shown not to be the provider's; retain the trial with its reason.
parameters:
  path: parameters/exec-latency/1.2.1/
  sha256: f97b44012d461bfe429c9918e4d9b3c7bf43b8cc030f84115a43424d1363da79
interpretation:
  what_to_do: Use the latency to judge the floor under every command an agent runs through a provider.
  informs: How long the shortest command, `true`, takes to come back through BoxRouter. A high latency
    points at the provider's exec API and its in-sandbox agent.
  limits:
  - The latency includes the network between the job host and the provider's US region; a provider whose
    region is farther away pays that distance.
  - Only calls through BoxRouter are measured.
  caveats:
  - BoxRouter keeps idle connections for 300 s, so a call that follows a pause may pay a new connection.
  - A run is 100 trials, so each provider's figures come from 100 sandboxes and 10,000 calls. Until 2026-10-26
    a run was 10 trials; the trial itself did not change.
  - Version 4 of the earlier test measures only the calls through BoxRouter and makes 100 calls instead
    of 20; version 3's results are not pooled with it.
validity_checks:
- id: clock_cross_check
  threat: A wrong sandbox clock reading would skew the runtime and the latency.
  check: Each call sends `true` between two reads of the sandbox's clock (`$EPOCHREALTIME`, checked against
    `/proc/uptime`), run by Bash.
- id: all_calls_succeed
  threat: A failed call could be left out of the median.
  check: A call succeeds when it exits 0 with the clock readings back, and a trial succeeds only when
    all 100 calls do; every call counts, including the first.
- id: first_command_not_measured
  threat: The sandbox's first command would add start-up work to the calls.
  check: The ready check runs untimed after create, so the 100 calls do not include the sandbox's first
    command.
source:
  name: true command workload and BoxRouter standard image
  version: sha256:8db60a2eeeb06993
  ids:
  - true workload sha256:8db60a2eeeb06993
  - ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  licence: unknown
execution:
  mode: script
  inference: false

