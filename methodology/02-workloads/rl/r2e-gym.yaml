      name: Create from snapshot
      action: For each of sandboxes 2 to 5, create a sandbox from the snapshot once the previous sandbox is confirmed gone.
      timer:
        start_event: The restore request is dispatched.
        stop_event: The restore call returns.
      timeout_seconds: 600
      record_steps: [restore]
      in_sandboxes: [2, 3, 4, 5]
    - id: tool_calls
