    parameters:
      task: namanjain12/numpy_final:ad48eaa76403798c298c2761e53e1e43008ab1b1
    description: This option selects the recorded workload used for the measurement.
  stages:
  - id: setup
    name: Setup
    description: Sandbox 1 is created from the task's prepared image, R2E-Gym's environment is reset in
      it and it is snapshotted.
    record_steps:
    - create
    - reset
    - snapshot
  - id: create-from-snapshot
    name: Create from snapshot
    description: Each of sandboxes 2 to 5 is created from the snapshot.
    record_steps:
    - restore
  - id: tool-calls
    name: Tool calls
    description: One recorded rollout's tool calls are replayed in each of sandboxes 2 to 5.
    record_steps:
    - cmd
  - id: reward
    name: Reward
    description: R2E-Gym's reward command runs after each rollout.
    record_steps:
    - reward
  - id: destroy
    name: Destroy
    description: Each sandbox is destroyed after its last command; the snapshot is deleted after the last
      sandbox.
    record_steps:
    - destroy
  steps:
  - id: create
    name: Create
    action: Start sandbox 1 from the task's prepared image, with the snapshots capability requested.
    timer:
      start_event: The create request is dispatched.
      stop_event: The create call returns.
    timeout_seconds: 600
    record_steps:
    - create
    in_sandboxes:
    - 1
  - id: ready_check
    name: Ready check
    action: Untimed; send `true` to sandbox 1 until it answers. Sandboxes created from the snapshot skip
      it.
    timer: null
  - id: reset
    name: Reset
    action: After an untimed upload of R2E-Gym's four tools, run R2E-Gym's environment reset commands
      in order as `timeout 120 <command>` under `sh -c` in /testbed, in one script started in the background.
    timer:
      start_event: The command starts, by the sandbox's own clock.
      stop_event: The command exits, by the sandbox's own clock.
    timeout_seconds: 150
    repeats: true
    record_steps:
    - reset
    in_sandboxes:
    - 1
  - id: snapshot
    name: Snapshot
    action: Create a snapshot of sandbox 1, sent after the reset script ended with nothing sent in between.
    timer:
      start_event: The snapshot request is dispatched.
      stop_event: The snapshot call returns.
    timeout_seconds: 600
    record_steps:
    - snapshot
    in_sandboxes:
    - 1
  - id: restore
    name: Create from snapshot
    action: For each of sandboxes 2 to 5, create a sandbox from the snapshot once the previous sandbox
      is confirmed gone.
    timer:
      start_event: The restore request is dispatched.
      stop_event: The restore call returns.
    timeout_seconds: 600
    record_steps:
    - restore
    in_sandboxes:
    - 2
    - 3
    - 4
    - 5
  - id: tool_calls
    name: Tool calls
    action: 'Replay one rollout''s tool calls back to back in recorded order as one script started in
      the background in sandbox 2, 3, 4 or 5, each as R2E-Gym ran it: `timeout 90 <tool> <arguments>`
      under `sh -c` in /testbed.'
    timer:
      start_event: The call starts, by the sandbox's own clock.
      stop_event: The call exits, by the sandbox's own clock; its runtime is the difference between two
        consecutive readings.
    timeout_seconds: 120
    repeats: true
    record_steps:
    - cmd
    in_sandboxes:
    - 2
    - 3
    - 4
    - 5
  - id: reward
    name: Reward
    action: After an untimed command reads the rollout's patch, run R2E-Gym's reward command (`timeout
      300 bash /root/run_tests.sh`).
    timer:
      start_event: The reward command is sent, measured by the job-host monotonic clock.
      stop_event: The call returns, measured by the job-host monotonic clock.
    timeout_seconds: 330
    record_steps:
    - reward
    in_sandboxes:
    - 2
    - 3
    - 4
    - 5
  - id: destroy
    name: Destroy
    action: After each sandbox's last command, probe its size, destroy it and confirm it is gone. After
      the last sandbox, delete the snapshot and check it is gone, untimed.
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
    timeout_seconds: 300
    record_steps:
    - destroy
