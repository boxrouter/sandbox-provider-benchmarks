      record_steps: [create, reset, snapshot]
    - id: create-from-snapshot
      name: Create from snapshot
      description: Each of sandboxes 2 to 5 is created from the snapshot.
      record_steps: [restore]
    - id: tool-calls
      name: Tool calls
      description: One recorded rollout's tool calls are replayed in each of sandboxes 2 to 5.
      record_steps: [cmd]
    - id: reward
      name: Reward
      description: R2E-Gym's reward command runs after each rollout.
      record_steps: [reward]
    - id: destroy
      name: Destroy
      description: Each sandbox is destroyed after its last command; the snapshot is deleted after the last sandbox.
