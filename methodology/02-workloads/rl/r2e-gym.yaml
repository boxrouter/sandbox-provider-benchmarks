      name: Destroy
      action: >-
        After each sandbox's last command, probe its size, destroy it and confirm it is gone. After
        the last sandbox, delete the snapshot and check it is gone, untimed.
      timer:
        start_event: The destroy request is dispatched.
        stop_event: The destroy call returns.
      timeout_seconds: 300
      record_steps: [destroy]

timing_boundaries:
  start: The first tool call of a rollout starts in its sandbox, by the sandbox's own clock.
  stop: The last tool call of the rollout exits, by the sandbox's own clock.

statistics:
  primary: median
  secondary:
    - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  ranking:
    ranked: true
    min_successes: 36
    requires_all_successful: false

cost:
  method: provider_reported_or_priced
  pricing_reference:
    repository: sandbox-provider-pricing
    function: price()
    price_sheet_version: recorded in the run manifest
  billed_span: From the first create request to the last confirmed destroy; whether snapshot storage is billed is unknown.
  per_success: Cost of the successful trials divided by their number; failed attempts' cost is not included.

parameters:
  path: parameters/r2e-gym/1.1.0/
  sha256: bca7e012017c557013116e06fbee133aeb77e2d67d400560c79a98fd1871dc3b

capabilities:
  required:
    - snapshots

interpretation:
  what_to_do: >-
    Compare which provider serves reinforcement-learning rollouts that share a prepared
    environment fastest.
  informs: How long a provider takes to serve RL rollouts from one snapshotted coding environment.
  limits:
    - No model is called; the rollouts are recorded and their tool calls replayed.
    - A provider with no create-from-snapshot through the integration is not measured.
  caveats:
    - >-
      The first sandbox gets the ready check right after its create; the sandboxes created from its
      snapshot do not.
    - The restore request names no capability.
    - Whether snapshot storage is billed is unknown.

validity_checks:
  - id: rollout_set_pinned
    threat: A fetched rollout set that differs from the one this version pins would replay different tool calls.
    check: The protocol pins the SHA-256 of the rollout set; a batch whose fetched set differs is a failure of the benchmark, not of the provider.
  - id: one_at_a_time
    threat: Sandboxes alive together would change the load on the provider.
    check: Each of sandboxes 2 to 5 is created only after the previous one has been probed, destroyed and confirmed gone.
  - id: snapshot_cleanup
    threat: A leftover snapshot would carry cost and state into later trials.
    check: After the last sandbox the snapshot is deleted and checked gone, untimed.

failure_policy:
  timeout_seconds:
    create: 600
    reset: 150
    snapshot: 600
    restore: 600
    tool_calls: 120
    reward: 330
    destroy: 300
  retries: None; the first failed step ends the trial. A top-up run replaces a provider-owned failure of a workload benchmark; the failed trial stays in the data as excluded, with its owner and cause.
  success: unknown
  provider_errors:
    - Create, snapshot, restore and transport errors, and a sandbox that stops answering.
    - A failure whose owner is uncertain.
  benchmark_errors:
    - A fetched rollout set that differs from the pinned set.
    - A failure of the benchmark's own script.
  exclusions:
    - A provider with no create-from-snapshot through the integration is not measured.
    - A workload that does not replay on that provider.
    - An error shown not to be the provider's.

