  steps:
    - id: create
      name: Create
      action: Start sandbox 1 from the task's prepared image, with the snapshots capability requested.
      timer:
        start_event: The create request is dispatched.
        stop_event: The create call returns.
      timeout_seconds: 600
      record_steps: [create]
      in_sandboxes: [1]
    - id: ready_check
      name: Ready check
      action: Untimed; send `true` to sandbox 1 until it answers. Sandboxes created from the snapshot skip it.
      timer: null
    - id: reset
      name: Reset
      action: >-
        After an untimed upload of R2E-Gym's four tools, run R2E-Gym's environment reset commands in
        order as `timeout 120 <command>` under `sh -c` in /testbed, in one script started in the
        background.
      timer:
