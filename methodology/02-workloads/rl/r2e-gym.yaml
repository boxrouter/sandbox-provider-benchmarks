id: r2e-gym
version: 1.1.4
effective: '2026-10-26'
name: R2E-Gym
category: workload
notes:
  what_this_measures: The result covers environment reset, snapshot and restore, rollout tool calls, and
    reward checks. Tool calls use the sandbox clock; reward commands use the job-host monotonic clock.
  how_to_read: The median is shown in milliseconds. Lower is better.
  summary: Time to prepare a coding environment, then serve four recorded R2E-Gym rollouts from its snapshot.
  how_it_is_measured: Four recorded rollouts per task come from R2E-Gym trajectory data and are replayed
    with R2E-Gym's tools. Tool calls use the sandbox clock; reward commands use the job-host monotonic
    clock.
  cost_summary: Cost from the first sandbox create through the last confirmed destroy, divided by successful
    trials.
  cost_how_to_read: Cost per successful trial excludes failed attempts. Snapshot storage billing is unknown.
    Lower is better.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: tool_time
  unit: ms
  direction: lower_is_better
  description: Sum of one rollout's replayed tool calls' runtimes, each by the sandbox's own clock.
  quantity: Tool-call runtime
  per: rollout
- name: reward_time
  unit: ms
  direction: lower_is_better
  description: Runtime of R2E-Gym's reward command for one rollout.
  quantity: Reward-command runtime
  per: rollout
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: Each task's own image, pinned by digest (docker.io/namanjain12/<repository>_final@sha256:<digest>);
      the digests are in the parameters' workloads.json.
    modification: Prepared in each account before the run. Sandboxes 2 to 5 start from a snapshot of sandbox
      1 taken after the environment reset.
  network: unknown
  region_policy: The provider's US region, never a narrower one; ordinary self-serve product, nothing
    tuned per provider.
  lifetime_seconds: 900
procedure:
  mode: sequential
  trials: 4
  sandboxes_per_trial: 5
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: Sandbox 1 is created from the task's prepared image and reset; sandboxes 2 to 5 are created
      one after another from its snapshot, each only after the previous one has been probed, destroyed
      and confirmed gone. The restore request names no capability. The snapshot is deleted and checked
      gone after the last sandbox. Providers without create-from-snapshot are not measured.
  variants:
  - id: numpy-0a476002600c
    label: numpy 0a476002600c
    parameters:
      task: namanjain12/numpy_final:0a476002600cb42068a899f4dc2cf0bc8cdb26d7
    description: This option selects the recorded workload used for the measurement.
  - id: numpy-dda20349d172
    label: numpy dda20349d172
    parameters:
      task: namanjain12/numpy_final:dda20349d172ed09b949a3b819eb16a384cd29a8
    description: This option selects the recorded workload used for the measurement.
