procedure:
  concurrency:
    sandboxes_at_once: 1
    trials_in_parallel: 10
  mode: single
  sandboxes_per_trial: 1
  stages:
  - description: 'The job''s setup steps: checkout, toolchain and dependency install.'
    id: install
    name: '{name:stage.install}'
    record_steps:
    - cmd
  - description: The job's check steps, such as format, type and lint checks.
    id: lint
    name: '{name:stage.lint}'
    record_steps:
    - cmd
  - description: The job's test steps.
    id: test
    name: '{name:stage.test}'
    record_steps:
    - cmd
  - description: The job's build steps.
    id: build
    name: '{name:stage.build}'
    record_steps:
    - cmd
  steps:
  - action: Start a new sandbox from the prepared benchmark image.
    id: create
    name: '{name:stage.create}'
    record_steps:
    - create
    timeout_seconds: 300
    timer:
      start_event: The create request is dispatched.
      stop_event: The create call returns.
  - action: Untimed; send `true` until the sandbox answers, as the common ready check describes.
    id: ready_check
    name: Ready check
    timer: null
  - action: Run the selected job's steps back to back in workflow order as one script started in the background.
      A `run:` line is used as written; a `uses:` step is represented by the commands that do its work,
      such as checkout or toolchain download. Tools normally preinstalled for hosted CI jobs are fetched
      or installed in a separate step. Each step runs under bash as a non-root sandbox user, with no input,
      in the checkout and job environment; the job's own `sudo` lines run as the sandbox user, which may
      be root. Core dumps are disabled before timing.
    id: job_steps
    name: Job step
    record_steps:
    - cmd
    repeats: true
    timeout_seconds: 600
    timer:
      start_event: The step starts, by the sandbox's own clock.
      stop_event: The step exits, by the sandbox's own clock; its runtime is the difference between two
        consecutive readings.
  - action: Destroy the sandbox after the job's last step and confirm it is gone.
    id: destroy
    name: '{name:stage.destroy}'
    record_steps:
    - destroy
    timeout_seconds: 300
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
