id: github-actions
version: 1.1.0
effective: "2026-10-26"
name: GitHub Actions
category: workload
description: >-
  How long a sandbox takes to run the steps of a public repository's own GitHub Actions job,
  replayed from a clean checkout with nothing cached. It shows which provider runs CI-style
  install, lint, test and build work fastest and at what cost.
notes:
  what_this_measures: >-
    How long a sandbox takes to run the steps of a public repository's own GitHub Actions job,
    replayed from a clean checkout with nothing cached.
  how_to_read: >-
    Each provider's median job time is shown in milliseconds, split into the Install, Lint, Test
    and Build stages. Choose All Jobs or one job. Lower is better. The tail is the 95th percentile
    once at least 20 trials have succeeded; below that the slowest trial is shown instead.
inherits:
  id: sbs.common
  version: 1.0.1

metrics:
  - name: job_time
    unit: ms
    direction: lower_is_better
    description: Sum of the job's steps' runtimes, each by the sandbox's own clock.

environment:
  size:
    vcpu: 4
    memory_gib: 8
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
    modification: Prepared in each account at 4 vCPU / 8 GiB before the run; nothing is added per trial.
  network: >-
    Open; steps clone the repository and download toolchains and dependencies, so a network failure
    in a setup step can fail a trial.
  region_policy: The provider's US region, never a narrower one; ordinary self-serve product, nothing tuned per provider.
  lifetime_seconds: 900

procedure:
  mode: single
  trials: 10
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: >-
      A fresh sandbox per trial from a prepared image, with no cache of any kind: every checkout,
      toolchain and dependency is fetched in the trial. Steps run back to back as one script.
  variants:
    - id: all
      label: All Jobs
      parameters: { combines: [zustand, fastapi, gin, spotify-player, jq, gson] }
    - id: zustand
      label: Node (zustand)
      parameters: { repository: pmndrs/zustand, commit: d7a5583cffd80af515f7dfb69583c95cbdc9e2ce, workflow: .github/workflows/test.yml, job: test, steps: 9 }
    - id: fastapi
      label: Python (fastapi)
      parameters: { repository: fastapi/fastapi, commit: 69ddc2badf9da1123bba4d360225ae6b085985f6, workflow: .github/workflows/test.yml, job: "test (ubuntu-latest, 3.13, highest, no-deprecation, coverage)", steps: 5 }
    - id: gin
      label: Go (gin)
      parameters: { repository: gin-gonic/gin, commit: 43fe48e8a0f44af783116cdb010725e6bb50255f, workflow: .github/workflows/gin.yml, job: "ubuntu-latest @ Go 1.27", steps: 4 }
    - id: spotify-player
      label: Rust (spotify-player)
      parameters: { repository: aome510/spotify-player, commit: 7dc9d17a7bf5671eb6129fdf9127729f659637fc, workflow: .github/workflows/ci.yml, job: "rust-ci (ubuntu-latest)", steps: 7 }
    - id: jq
      label: C (jq)
      parameters: { repository: jqlang/jq, commit: 49fbca1242c7f46f00b849de76565764e0254a03, workflow: .github/workflows/ci.yml, job: "linux (amd64)", steps: 5 }
    - id: gson
      label: Java (gson)
      parameters: { repository: google/gson, commit: 881d2b55de74dd6c2fded7b2cb307b048117af97, workflow: .github/workflows/build.yml, job: "Build on JDK 21 (jdk)", steps: 3 }
  stages:
    - id: install
      name: Install
      description: "The job's setup steps: checkout, toolchain and dependency install."
      record_steps: [cmd]
    - id: lint
      name: Lint
      description: The job's check steps, such as format, type and lint checks.
      record_steps: [cmd]
    - id: test
      name: Test
      description: The job's test steps.
      record_steps: [cmd]
    - id: build
      name: Build
      description: The job's build steps.
      record_steps: [cmd]
  steps:
    - id: create
      name: Create
      action: Start a new sandbox from BoxRouter's standard image, prepared in the account before the run.
      timer:
        start_event: The create request is dispatched.
        stop_event: The create call returns.
      timeout_seconds: 300
      record_steps: [create]
    - id: ready_check
      name: Ready check
      action: Untimed; send `true` until the sandbox answers, as the common ready check describes.
      timer: null
    - id: job_steps
      name: Job step
      action: >-
        Run the job's steps back to back in the workflow's order as one script started in the
        background. A job's `run:` lines are used as written and each `uses:` step is replaced by the
        commands that do its work (checkout, toolchain download). Tools GitHub's runner image
        preinstalls (Go, Rust's rustup, uv, a JDK and Maven, file, make) are fetched in a step of
        their own, marked as the runner's stand-in. Each step runs under bash as the image's non-root
        `box` user, as GitHub's runner runs a job as its non-root `runner` user, with no input, in
        the checkout (itself in /workspace) and the job's environment; the job's own `sudo` lines run
        as the sandbox's user, which may be root. The script first turns core dumps off, untimed.
      timer:
        start_event: The step starts, by the sandbox's own clock.
        stop_event: The step exits, by the sandbox's own clock; its runtime is the difference between two consecutive readings.
      timeout_seconds: 600
      repeats: true
      record_steps: [cmd]
    - id: destroy
      name: Destroy
      action: Destroy the sandbox after the job's last step and confirm it is gone.
      timer:
        start_event: The destroy request is dispatched.
        stop_event: The destroy call returns.
      timeout_seconds: 300
      record_steps: [destroy]

