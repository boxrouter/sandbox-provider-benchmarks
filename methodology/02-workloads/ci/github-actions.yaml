capabilities:
  required: []
category: workload
cost:
  method: provider_reported_or_priced
effective: '2026-11-08'
environment:
  image:
    modification: Prepared with 4 vCPU and 8 GiB before the run; nothing is added per trial.
    reference: A prepared Linux image for the selected job.
  lifetime_seconds: 900
  network: Open; steps clone the repository and download toolchains and dependencies, so a network failure
    in a setup step can fail a trial.
  size:
    memory_gib: 8
    vcpu: 4
execution:
  inference: false
  mode: trace_replay
failure_policy:
  benchmark_errors:
  - A failure of the benchmark's own script.
  exclusions:
  - Any other non-zero step does not replay on that provider and is excluded with its step and exit code.
  - A setup failure that every provider's sandbox shows alike is external and excluded.
  provider_errors:
  - Create and transport errors, and a sandbox that stops answering.
  - A step whose output says the disk was full.
  - A setup step (checkout, toolchain, install, system packages) whose output names a network failure
    (DNS, a refused, reset or timed-out connection), unless every provider's sandbox failed that step
    the same way, which is external.
  - A step that starts one worker per reported CPU (fastapi's `pytest -n auto`) on a sandbox that reports
    more CPUs than were asked for.
  - A failure whose owner is uncertain.
  retries: None; the first non-zero step ends the trial. A top-up run refills every missed, excluded or
    failed slot whoever owned the failure; each failed trial stays in the data with its owner and cause.
  success: Every step exits 0 and the sandbox is confirmed deleted.
  timeout_seconds:
    create: 300
    destroy: 300
    job_steps: 600
id: github-actions
inherits:
  id: sbs.common
  version: 1.0.18
interpretation:
  caveats:
  - Each step runs under bash as the image's non-root `box` user; the job's own `sudo` lines run as the
    sandbox's user, which may be root.
  - The spotify-player job is also measured by RunsOn's open runner benchmark.
  - A step that crashes still shows its abort in its output.
  informs: How fast and how costly a provider is for the install, lint, test and build steps of a real
    CI job.
  limits:
  - The same job is replayed with no caches for every trial.
  - Tools normally preinstalled for hosted CI jobs are fetched or installed in separate steps.
  - Each step runs as a non-root sandbox user; job `sudo` lines may run as root.
  what_to_do: Compare which provider runs CI-style install, lint, test and build work fastest and at what
    cost.
metrics:
- description: Sum of the job's steps' runtimes, each by the sandbox's own clock.
  direction: lower_is_better
  name: job_time
  per: job
  quantity: Job-step runtime
  unit: ms
name: '{name:test.ci-jobs}'
notes:
  cost_how_to_read: Only successful trials contribute to the cost value.
  cost_summary: The cost covers sandbox creation through confirmed destruction per successful job trial.
  how_it_is_measured: Each pinned public repository job is replayed in a fresh sandbox; step runtimes
    use the sandbox clock.
  how_to_read: The {param:github-actions.1.1.16.statistics.primary} summarizes successful trials in the
    axis unit; {direction:job_time}.
  summary: Each selected repository job runs its recorded steps in a fresh sandbox.
  what_this_measures: The result sums the selected jobs’ step runtimes using the sandbox clock.
parameters:
  path: parameters/github-actions/1.1.16/
  sha256: c95ec83910058a173925f9dc6848e9b71cc5ed2a4b368d8a9db409831625c983
procedure:
  concurrency:
    sandboxes_at_once: 1
    trials_in_parallel: 10
  mode: single
  sandboxes_per_trial: 1
  stages:
  - description: 'The job''s setup steps: checkout, toolchain and dependency install.'
    id: install
    name: '{name:stage.install}'
    record_steps:
    - cmd
  - description: The job's check steps, such as format, type and lint checks.
    id: lint
    name: '{name:stage.lint}'
    record_steps:
    - cmd
  - description: The job's test steps.
    id: test
    name: '{name:stage.test}'
    record_steps:
    - cmd
  - description: The job's build steps.
    id: build
    name: '{name:stage.build}'
    record_steps:
    - cmd
  steps:
  - action: Start a new sandbox from the prepared benchmark image.
    id: create
    name: '{name:stage.create}'
    record_steps:
    - create
    timeout_seconds: 300
    timer:
      start_event: The create request is dispatched.
      stop_event: The create call returns.
  - action: Untimed; send `true` until the sandbox answers, as the common ready check describes.
    id: ready_check
    name: Ready check
    timer: null
  - action: Run the selected job's steps back to back in workflow order as one script started in the background.
      A `run:` line is used as written; a `uses:` step is represented by the commands that do its work,
      such as checkout or toolchain download. Tools normally preinstalled for hosted CI jobs are fetched
      or installed in a separate step. Each step runs under bash as a non-root sandbox user, with no input,
      in the checkout and job environment; the job's own `sudo` lines run as the sandbox user, which may
      be root. Core dumps are disabled before timing.
    id: job_steps
    name: Job step
    record_steps:
    - cmd
    repeats: true
    timeout_seconds: 600
    timer:
      start_event: The step starts, by the sandbox's own clock.
      stop_event: The step exits, by the sandbox's own clock; its runtime is the difference between two
        consecutive readings.
  - action: Destroy the sandbox after the job's last step and confirm it is gone.
    id: destroy
    name: '{name:stage.destroy}'
    record_steps:
    - destroy
    timeout_seconds: 300
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
  trials: 20
  variants:
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.0.label} configuration.
    id: all
    label: All Jobs
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      combines:
      - zustand
      - fastapi
      - gin
      - spotify-player
      - jq
      - gson
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.1.label} configuration.
    id: zustand
    label: Node (zustand)
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      commit: d7a5583cffd80af515f7dfb69583c95cbdc9e2ce
      job: test
      repository: pmndrs/zustand
      steps: 9
      workflow: .github/workflows/test.yml
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.2.label} configuration.
    id: fastapi
    label: Python (fastapi)
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      commit: 69ddc2badf9da1123bba4d360225ae6b085985f6
      job: test (ubuntu-latest, 3.13, highest, no-deprecation, coverage)
      repository: fastapi/fastapi
      steps: 5
      workflow: .github/workflows/test.yml
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.3.label} configuration.
    id: gin
    label: Go (gin)
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      commit: 43fe48e8a0f44af783116cdb010725e6bb50255f
      job: ubuntu-latest @ Go 1.27
      repository: gin-gonic/gin
      steps: 4
      workflow: .github/workflows/gin.yml
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.4.label} configuration.
    id: spotify-player
    label: Rust (spotify-player)
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      commit: 7dc9d17a7bf5671eb6129fdf9127729f659637fc
      job: rust-ci (ubuntu-latest)
      repository: aome510/spotify-player
      steps: 7
      workflow: .github/workflows/ci.yml
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.5.label} configuration.
    id: jq
    label: C (jq)
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      commit: 49fbca1242c7f46f00b849de76565764e0254a03
      job: linux (amd64)
      repository: jqlang/jq
      steps: 5
      workflow: .github/workflows/ci.yml
  - description: The workload uses the {param:github-actions.1.1.16.procedure.variants.6.label} configuration.
    id: gson
    label: Java (gson)
    notes:
      summary: '{param:github-actions.1.1.16.notes.summary}'
      what_this_measures: '{param:github-actions.1.1.16.notes.what_this_measures}'
    parameters:
      commit: 881d2b55de74dd6c2fded7b2cb307b048117af97
      job: Build on JDK 21 (jdk)
      repository: google/gson
      steps: 3
      workflow: .github/workflows/build.yml
  warm_cold_policy:
    policy: 'A fresh sandbox per trial from a prepared image, with no cache of any kind: every checkout,
      toolchain and dependency is fetched in the trial. Steps run back to back as one script.'
source:
  ids:
  - pmndrs/zustand@d7a5583cffd80af515f7dfb69583c95cbdc9e2ce
  - fastapi/fastapi@69ddc2badf9da1123bba4d360225ae6b085985f6
  - gin-gonic/gin@43fe48e8a0f44af783116cdb010725e6bb50255f
  - aome510/spotify-player@7dc9d17a7bf5671eb6129fdf9127729f659637fc
  - jqlang/jq@49fbca1242c7f46f00b849de76565764e0254a03
  - google/gson@881d2b55de74dd6c2fded7b2cb307b048117af97
  licence: MIT (Zustand, FastAPI, Gin and spotify-player); Apache-2.0 (Gson); MIT source (jq), bundled
    components unaudited; unknown (spotify-player workflow)
  name: CI jobs from six public repositories
  version: pinned per job by repository commit
statistics:
  interval:
    applies_to:
    - median
    - cost_per_success
    confidence: 0.95
    resamples: 10000
    seed: 0
    type: bootstrap_percentile
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  primary: median
  ranking:
    min_successes: 108
    ranked: true
  secondary:
  - mean
  tail:
    min_successes: 20
    worse_side_percentile: 95
timing_boundaries:
  start: The first step of the job starts in the sandbox.
  stop: The last step of the job exits.
validity_checks:
- check: Every step must exit 0. A step that exits non-zero ends the trial and does not replay here, except
    in the cases the failure policy lists as the provider's failure.
  id: every_step_exits_zero
  threat: A step that fails would make the job time cover less work than the job does.
- check: The replay script turns core dumps off (`ulimit -c 0`); this is neither logged nor timed.
  id: replay_script_start
  threat: A crash writes a core dump that changes what a step costs.
version: 1.1.16
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: 'No cache of any kind: every checkout, toolchain and dependency is fetched in the trial from
      a prepared image. The provider''s image caches stay on.'
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: meets
    text: Each trial records its CPU model and count, kernel, working-directory device and file system,
      any provider host identifier and the job host's load over its window.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
