capabilities:
  required: []
category: workload
cost:
  method: provider_reported_or_priced
effective: '2026-11-08'
environment:
  image:
    modification: None. Every checkout, toolchain and dependency is fetched in the trial's own setup steps.
    reference: BoxRouter's pinned standard image.
  lifetime_seconds: 2700
  network: Open; steps clone the repository and download toolchains and dependencies, so a network failure
    in a setup step can fail a trial.
  size:
    memory_gib: 8
    vcpu: 4
execution:
  inference: false
  mode: trace_replay
failure_policy:
  benchmark_errors:
  - A failure of the benchmark's own script.
  exclusions:
  - An error shown to be BoxRouter's.
  provider_errors:
  - Create and transport errors, and a sandbox that stops answering.
  - A step that exits non-zero or reaches its limit, whatever its cause.
  - A failure whose owner is uncertain.
  retries: None inside a trial, except that a setup download an upstream registry refuses for load (HTTP 429, 502, 503 or 504) is repeated in place, with backoff, within that step's timeout; the first non-zero step ends the trial. When a trial fails, a new trial runs in its
    place up to the run's attempt limit for that cell, regardless of who owned the failure, and each failed trial remains in the data with its owner and cause.
  success: Every step exits 0 and the sandbox is deleted.
  timeout_seconds:
    create: 300
    destroy: 300
    setup_steps: 1500
    job_steps: 600
id: github-actions
inherits: sbs.common
interpretation:
  caveats:
  - Each step runs under bash as the image's non-root `user` account; the job's own `sudo` lines run as the
    sandbox's user, which may be root.
  - The spotify-player job is also measured by RunsOn's open runner benchmark.
  - A step that crashes still shows its abort in its output.
  informs: How fast and how costly a provider is for the lint, test and build steps of a real CI job.
  limits:
  - The same job is replayed with no caches for every trial.
  - The job time leaves out the setup steps (checkout, toolchain, system packages and dependency install).
    They mostly download from public package mirrors and CDNs, whose speed changes from hour to hour
    for every provider alike; they are timed and listed apart.
  - Tools normally preinstalled for hosted CI jobs are fetched or installed in separate steps.
  - Each step runs as a non-root sandbox user; job `sudo` lines may run as root.
  what_to_do: Compare which provider runs CI-style lint, test and build work fastest and at what cost.
metrics:
- description: Sum of the job's lint, test and build steps' runtimes, each by the sandbox's own clock; the
    setup steps are not included.
  direction: lower_is_better
  name: job_time
  per: job
  quantity: Job-step runtime
  unit: ms
  formula: sum(runtime(cmd))
- description: The job set's median job times (each job's median over its trials) added up for one
    provider; defined only when every job of the set has a successful trial.
  direction: lower_is_better
  name: job_time_set_total
  per: job set
  quantity: Job-step runtime
  unit: ms
  formula: sum(median(sum(runtime(cmd))))
name: '{name:test.ci-jobs}'
notes:
  cost_how_to_read: Only successful trials contribute to the cost value.
  cost_summary: The cost covers sandbox creation through confirmed destruction per successful job trial.
  how_it_is_measured: Each pinned public repository job is replayed in a fresh sandbox; step runtimes
    use the sandbox clock. The job time sums the lint, test and build steps; setup steps are timed apart.
  how_to_read: The {param:github-actions.statistics.primary} summarizes successful trials in the
    axis unit; {direction:job_time}.
  summary: Each selected repository job runs its recorded steps in a fresh sandbox.
  what_this_measures: The result sums the selected jobs’ lint, test and build step runtimes using the
    sandbox clock, after setup.
parameters:
  path: parameters/github-actions/
  sha256: 6d617f14b263836b19d46e400f1719a6423ce67f04c2f2a50e9b7acb773d5d8b
default_view:
  metric: job_time
procedure:
  concurrency:
    sandboxes_at_once: 1
    trials_in_parallel: 5
  mode: single
  sandboxes_per_trial: 1
  stages:
  - description: 'The job''s setup steps: checkout, toolchain and dependency install.'
    id: setup
    name: '{name:stage.install}'
    record_steps:
    - setup
  - description: The job's check steps, such as format, type and lint checks.
    id: checks
    name: '{name:stage.lint}'
    record_steps:
    - cmd
  - description: The job's test steps.
    id: test
    name: '{name:stage.test}'
    record_steps:
    - cmd
  - description: The job's build steps.
    id: build
    name: '{name:stage.build}'
    record_steps:
    - cmd
  steps:
  - action: Start a new sandbox from the prepared benchmark image.
    id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    record_steps:
    - create
    timeout_seconds: 300
    timer:
      start_event: The create request is dispatched.
      stop_event: The create call returns.
  - action: Run the job's setup steps (checkout, toolchain, system packages and dependency install) first,
      each as its own script started in the background, the same way as the job steps below. Each is timed by
      the sandbox's own clock and listed apart; the job time does not include them, because they mostly
      download from public package mirrors and CDNs whose speed changes independently of the sandbox.
    id: setup_steps
    name: Setup step
    label: Setup step
    show: table
    record_steps:
    - setup
    repeats: true
    timeout_seconds: 1500
    timer:
      start_event: The step starts, by the sandbox's own clock.
      stop_event: The step exits, by the sandbox's own clock; its runtime is the difference between two
        consecutive readings.
  - action: Run the rest of the selected job's steps back to back in workflow order, each as its own script started in the background.
      A `run:` line is used as written; a `uses:` step is represented by the commands that do its work,
      such as checkout or toolchain download. Tools normally preinstalled for hosted CI jobs are fetched
      or installed in a separate step. Each step runs under bash as a non-root sandbox user, with no input,
      in the checkout and job environment; the job's own `sudo` lines run as the sandbox user, which may
      be root. Each step's script first turns core dumps off (`ulimit -c 0`); this is inside the step's time and takes well under a millisecond.
    id: job_steps
    name: Job step
    label: Job step
    show: stack
    record_steps:
    - cmd
    repeats: true
    timeout_seconds: 600
    timer:
      start_event: The step starts, by the sandbox's own clock.
      stop_event: The step exits, by the sandbox's own clock; its runtime is the difference between two
        consecutive readings.
  - action: Destroy the sandbox after the job's last step.
    id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    record_steps:
    - destroy
    timeout_seconds: 300
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
  trials: 10
  variants:
  - description: The workload uses the {param:github-actions.procedure.variants.0.label} configuration.
    id: all
    label: All Jobs
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      combines:
      - zustand
      - fastapi
      - gin
      - spotify-player
      - jq
      - gson
  - description: The workload uses the {param:github-actions.procedure.variants.1.label} configuration.
    id: zustand
    label: Node (zustand)
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      commit: d7a5583cffd80af515f7dfb69583c95cbdc9e2ce
      job: test
      repository: pmndrs/zustand
      steps: 9
      workflow: .github/workflows/test.yml
  - description: The workload uses the {param:github-actions.procedure.variants.2.label} configuration.
    id: fastapi
    label: Python (fastapi)
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      commit: 69ddc2badf9da1123bba4d360225ae6b085985f6
      job: test (ubuntu-latest, 3.13, highest, no-deprecation, coverage)
      repository: fastapi/fastapi
      steps: 5
      workflow: .github/workflows/test.yml
  - description: The workload uses the {param:github-actions.procedure.variants.3.label} configuration.
    id: gin
    label: Go (gin)
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      commit: 43fe48e8a0f44af783116cdb010725e6bb50255f
      job: ubuntu-latest @ Go 1.27
      repository: gin-gonic/gin
      steps: 4
      workflow: .github/workflows/gin.yml
  - description: The workload uses the {param:github-actions.procedure.variants.4.label} configuration.
    id: spotify-player
    label: Rust (spotify-player)
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      commit: 7dc9d17a7bf5671eb6129fdf9127729f659637fc
      job: rust-ci (ubuntu-latest)
      repository: aome510/spotify-player
      steps: 7
      workflow: .github/workflows/ci.yml
  - description: The workload uses the {param:github-actions.procedure.variants.5.label} configuration.
    id: jq
    label: C (jq)
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      commit: 49fbca1242c7f46f00b849de76565764e0254a03
      job: linux (amd64)
      repository: jqlang/jq
      steps: 5
      workflow: .github/workflows/ci.yml
  - description: The workload uses the {param:github-actions.procedure.variants.6.label} configuration.
    id: gson
    label: Java (gson)
    notes:
      summary: '{param:github-actions.notes.summary}'
      what_this_measures: '{param:github-actions.notes.what_this_measures}'
    parameters:
      commit: 881d2b55de74dd6c2fded7b2cb307b048117af97
      job: Build on JDK 21 (jdk)
      repository: google/gson
      steps: 3
      workflow: .github/workflows/build.yml
  warm_cold_policy:
    policy: 'A fresh sandbox per trial from a prepared image, with no cache of any kind: every checkout,
      toolchain and dependency is fetched in the trial. Steps run back to back, one script each.'
source:
  ids:
  - pmndrs/zustand@d7a5583cffd80af515f7dfb69583c95cbdc9e2ce
  - fastapi/fastapi@69ddc2badf9da1123bba4d360225ae6b085985f6
  - gin-gonic/gin@43fe48e8a0f44af783116cdb010725e6bb50255f
  - aome510/spotify-player@7dc9d17a7bf5671eb6129fdf9127729f659637fc
  - jqlang/jq@49fbca1242c7f46f00b849de76565764e0254a03
  - google/gson@881d2b55de74dd6c2fded7b2cb307b048117af97
  licence: MIT (Zustand, FastAPI, Gin and spotify-player); Apache-2.0 (Gson); MIT source (jq), bundled
    components unaudited; unknown (spotify-player workflow)
  name: CI jobs from six public repositories
  version: pinned per job by repository commit
statistics:
  interval:
    applies_to:
    - median
    - cost_per_success
    confidence: 0.95
    resamples: 10000
    seed: 0
    type: bootstrap_percentile
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  primary: median
  ranking:
    ranked: true
  secondary:
  - mean
  tail:
    min_successes: 20
    worse_side_percentile: 95
timing_boundaries:
  start: The first lint, test or build step of the job starts in the sandbox, after setup.
  stop: The last step of the job exits.
validity_checks:
- check: Every step must exit 0. A step that exits non-zero ends the trial as a provider failure.
  id: every_step_exits_zero
  threat: A step that fails would make the job time cover less work than the job does.
