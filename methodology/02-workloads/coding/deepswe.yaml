---
id: deepswe
version: 1.1.22
effective: '2026-11-08'
name: '{name:test.deepswe}'
category: workload
notes:
  what_this_measures: The result sums command runtimes for a recorded session using the sandbox clock.
    Model speed and agent quality are excluded.
  how_to_read: The {param:deepswe.1.1.22.statistics.primary} summarizes successful trials in the axis unit;
    {direction:tool_time}.
  summary: Each {name:test.deepswe} trace is one agent's full tool-use trace on a repository task.
  how_it_is_measured: Recorded sessions come from {name:test.deepswe} {param:deepswe.1.1.22.source.dataset_version} tasks. Commands run back to
    back in each task's prepared image, with each runtime measured by the sandbox's own clock.
  cost_summary: The cost covers sandbox creation through confirmed destruction, divided by successful
    traces.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: tool_time
  unit: ms
  direction: lower_is_better
  description: Sum of the replayed commands' runtimes for one trace, each by the sandbox's own clock.
  quantity: Command runtime
  per: trace
- name: tool_time_set_total
  unit: ms
  direction: lower_is_better
  description: The trace set's median tool times (each trace's median over its replays) added up for one
    provider; defined only when every trace of the set has a successful replay.
  quantity: Total command runtime
  per: trace set
environment:
  size:
    vcpu: 4
    memory_gib: 8
  image:
    reference: Each trace's task image, pinned by digest (public.ecr.aws/d3j8x8q7/swe-bench-202605:<task
      tag>-v1.1@sha256:<digest>); the digests are in the parameters' workloads.json.
    modification: Prepared in each provider account before the run; nothing is added per trial.
  network: A proxy started in the sandbox refuses every host, as {name:test.deepswe}'s own harness did.
    Where the provider allows it, the sandbox is also created with a deny-all network policy; this is
    optional.
  lifetime_seconds: 1500
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox per trace from an image prepared ahead in the account. Commands run back to
      back with no model time between them, so the page cache stays warm and no provider sleeps between
      commands. Each trace is replayed 20 times per provider in a run, so a result is 20 samples per trace.
  variants:
  - id: claude-opus-5-high
    label: Claude Opus 5 high
    parameters:
      config: claude-opus-5-high
    description: The workload uses the {param:deepswe.1.1.22.procedure.variants.0.label} configuration.
  stages:
  - id: read
    name: '{name:stage.read}'
    description: Commands that match none of the other stages' patterns. A command's stage comes from
      the patterns in the parameters' protocol.json (groups).
    record_steps:
    - cmd
  - id: write
    name: '{name:stage.write}'
    description: Commands that change files, such as edits, redirects, `git apply`, `mv`, `cp` and `rm`.
    record_steps:
    - cmd
  - id: install
    name: '{name:stage.install}'
    description: Commands that install dependencies, such as `pip install`, `npm install` and `go mod
      download`.
    record_steps:
    - cmd
  - id: build
    name: '{name:stage.build}'
    description: Commands that build, compile, lint or format, such as `go build`, `tsc`, `ruff` and `make`.
    record_steps:
    - cmd
  - id: test
    name: '{name:stage.test}'
    description: Commands that run tests, such as `pytest`, `go test`, `vitest` and `cargo test`.
    record_steps:
    - cmd
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Start a new sandbox from the trace's task image, prepared in the account before the run.
    timer:
      start_event: The create request is dispatched.
      stop_event: The create call returns.
    timeout_seconds: 600
    record_steps:
    - create
  - id: ready_check
    name: Ready check
    action: Untimed; send `true` until the sandbox answers, as the common ready check describes.
    timer: null
  - id: proxy_start
    name: Proxy start
    action: Untimed; start the proxy that refuses every host.
    timer: null
  - id: commands
    name: Command replay
    action: Run every command of the trace in its recorded order as `sh -c <command>` with no input and
      output merged, in /app, with the image's environment plus a few non-interactive settings (no pager,
      no progress bars, git told not to guess an identity), in one script started in the background. The
      script first sets PATH to the image's and turns core dumps off; neither is timed. It records the
      sandbox clock before the first command and after each one.
    timer:
      start_event: The command starts, by the sandbox's own clock.
      stop_event: The command exits, by the sandbox's own clock; its runtime is the difference between
        two consecutive readings.
    timeout_seconds: 600
    repeats: true
    record_steps:
    - cmd
  - id: patch_check
    name: Patch check
    action: Untimed; check the final patch.
    timer: null
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox after the patch check and confirm it is gone.
    timer:
      start_event: The destroy request is dispatched.
      stop_event: The destroy call returns.
    timeout_seconds: 300
    record_steps:
    - destroy
timing_boundaries:
  start: The first command of the trace starts in the sandbox.
  stop: The last command of the trace exits.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  ranking:
    ranked: true
    min_successes: 180
    requires_all_successful: false
cost:
  method: provider_reported_or_priced
parameters:
  path: parameters/deepswe/1.1.22/
  sha256: ddca17744dfb792446f807c71430b706b1055f1e0fcd6b46ee0d4379129888e4
capabilities:
  required: []
  optional:
    network_lockdown:
      policy: deny_all
interpretation:
  what_to_do: Compare the sandbox time and cost to run these command sequences. A provider can use the
    command span to investigate execution overhead for this workload.
  informs: Which provider makes a coding agent wait least on its tool calls, and what the sandbox side
    of a session costs.
  limits:
  - The replay measures recorded commands; it does not measure agent quality or model speed.
  - Commands run back to back, so the page cache stays warm and the provider does not sleep between commands.
  - A proxy refuses every host; a provider deny-all network policy is optional.
  caveats:
  - Trace and patch files are fetched by trial id from the public {name:test.deepswe} trial endpoints
    named in the parameters' protocol.json and are not republished; the upstream setup source states no
    licence for them, so no licence claim is made for the fetched data.
  - A command that crashes still shows its abort in its output.
validity_checks:
- id: trace_set_pinned
  threat: A fetched trace set that differs from the one this version pins would replay different commands.
  check: The protocol pins the SHA-256 of the trace set; a missing trace is recorded as a missed trial.
- id: final_patch
  threat: A replay that ran the commands but did not reproduce the recorded result.
  check: After the last command, the final patch is checked; the trial succeeds only when it passes.
- id: replay_script_start
  threat: A provider's login shell resets PATH, or a crash writes a core dump, and either changes what
    a command does or costs.
  check: The replay script first sets PATH to the image's and turns core dumps off (`ulimit -c 0`); neither
    is logged or timed.
failure_policy:
  timeout_seconds:
    create: 600
    commands: 600
    destroy: 300
  retries: None; the first failed step ends the trial. A top-up run refills every missed, excluded or
    failed slot whoever owned the failure; each failed trial stays in the data with its owner and cause.
  success: Every saved command executes in order, the final patch check passes and the sandbox is confirmed
    deleted.
  provider_errors:
  - Create and transport errors, and a sandbox that stops answering.
  - A command timeout.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - A missing trace, recorded as a missed trial.
  - A failure of the benchmark's own script.
  exclusions:
  - A workload that does not replay on that provider.
  - An error shown not to be the provider's.
