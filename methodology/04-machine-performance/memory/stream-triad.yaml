name: STREAM Triad
category: machine_performance
notes:
  summary: Sustained memory bandwidth measured by STREAM Triad over arrays larger than cache.
  what_this_measures: Sustained memory bandwidth with STREAM Triad, using arrays larger than cache. It
    does not measure CPU compute speed.
  how_it_is_measured: STREAM Triad runs 20 passes over three arrays of 610.4 MiB each with as many threads
    as requested vCPUs; its best Triad rate uses its own clock.
  how_to_read: Each provider's median is shown in GB/s. Higher is better. The tail is the 95th percentile
    once at least 20 trials have succeeded; below that the lowest trial is shown instead.
  cost_summary: Cost over the measured billing span per successful trial.
  cost_how_to_read: Cost of successful attempts divided by their number; failed attempts' cost is not
    included. Lower is better.
