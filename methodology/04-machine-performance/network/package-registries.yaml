id: package-registries
version: 1.1.16
effective: '2026-11-08'
name: '{name:test.package-registries}'
category: machine_performance
notes:
  summary: A fresh sandbox installs a pinned project from the selected registry or repository.
  what_this_measures: The result is command runtime for a cold-cache install, including downloads, unpacking
    and local filesystem work.
  how_it_is_measured: Each selected pinned workload comes from GitHub, npm or PyPI; its command runs after
    setup with package caches cleared. The sandbox clock times it, including downloads, unpacking and
    installation work.
  how_to_read: The {param:package-registries.1.1.16.statistics.primary} summarizes successful trials in
    the axis unit; {direction:install_runtime_ms}.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful install.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits:
  id: sbs.common
  version: 1.0.18
metrics:
- name: install_runtime_ms
  unit: ms
  direction: lower_is_better
  description: Runtime of the selected install command by the sandbox clock.
  quantity: time
  per: install
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: Outbound access to github.com, registry.npmjs.org, pypi.org and files.pythonhosted.org for
    workload downloads.
  lifetime_seconds: 900
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 10
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox per trial; no warm-up. Workload rows are shuffled within each trial where
      stated.
  steps:
  - id: create
    name: '{name:stage.create}'
    action: Start a new sandbox from the standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: setup
    name: '{name:stage.setup}'
    timeout_seconds: 120
    timer:
      start_event: The sandbox answers and the workload's pinned inputs have been uploaded.
      stop_event: The setup command exits, by the sandbox's own clock.
    action: 'Upload the workload''s pinned inputs, each checked against its SHA-256, then run one script
      as the image''s non-root `user` account: a preparation command that removes ~/.npm and ~/.cache/pip,
      so nothing is cached, and sets up the project directory or the virtualenv.'
  - id: install
    name: '{name:stage.install}'
    timeout_seconds: 600
    record_steps:
    - install
    action: In the same script, read the bytes the network interfaces have received, run the workload's
      one command as `user` from a cold cache, then read the bytes again. The script runs in the background
      and its status is read every 10 s, so no call's latency is in the result.
    timer:
      start_event: The workload's install command starts, right after setup.
      stop_event: The command exits, by the sandbox's own clock.
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: Manual.
  variants:
  - id: git-clone
    label: git clone
    description: Full clone of fastapi with its Git history from GitHub.
    notes:
      summary: '{param:package-registries.1.1.16.notes.summary}'
      what_this_measures: '{param:package-registries.1.1.16.notes.what_this_measures}'
    parameters:
      command: full clone of fastapi/fastapi, then checkout of commit 69ddc2badf9da1123bba4d360225ae6b085985f6,
        which is checked
  - id: npm-ci
    label: npm ci
    description: Clean install of axios's 687 packages exactly as pinned in its lockfile from npm.
    notes:
      summary: '{param:package-registries.1.1.16.notes.summary}'
      what_this_measures: '{param:package-registries.1.1.16.notes.what_this_measures}'
    parameters:
      command: npm ci from the pinned package.json and package-lock.json of axios/axios at commit e6b79d9cef796ca3a903bb83e51d4752b019fd67
        (687 locked packages, from the npm registry)
  - id: pip-install
    label: pip install -r
    description: Installs fastapi's pinned test dependencies from PyPI into a new virtual environment.
    notes:
      summary: '{param:package-registries.1.1.16.notes.summary}'
      what_this_measures: '{param:package-registries.1.1.16.notes.what_this_measures}'
    parameters:
      command: pip install -r a pinned requirements file with hashes, exported by `uv export --frozen
        --no-dev --group tests --extra all --no-emit-project` from fastapi/fastapi's uv.lock at the clone's
        commit, into a new virtualenv
timing_boundaries:
  start: Each selected command runs immediately after setup with package caches cleared.
  stop: The selected install command exits; report its runtime, excluding setup.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 5
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    setup: 120
    install: 600
    destroy: 300
  retries: None in the benchmark except the untimed ready check; first failed step ends the trial.
  success: The command exits 0 and the sandbox is confirmed deleted.
  provider_errors:
  - A failure whose output names a network failure (DNS, a refused, reset or timed-out connection) or
    a full disk, with the matched line kept.
  - Any other failure of the command, a command that ran its whole time limit (600 s), and a script that
    ended early.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - Output that cannot be parsed after the benchmark tool exits successfully.
  exclusions:
  - A network failure that every provider had on the same workload in one publication is external instead.
  - An error shown not to be the provider's; retain the trial and reason in the data.
source:
  name: Package registry install workloads
  version: install-v1
  ids:
  - install/git-clone
  - install/npm-ci
  - install/pip-install
  licence: Multiple workload sources; see datasets[].licence.
  datasets:
  - id: git-clone
    source: fastapi/fastapi commit 69ddc2badf9da1123bba4d360225ae6b085985f6
    version: sha256:9dec661181dad2c0
    licence: MIT for the pinned FastAPI source; published commands only, not copied project files.
  - id: npm-ci
    source: axios/axios package.json and package-lock.json at e6b79d9cef796ca3a903bb83e51d4752b019fd67
    version: sha256:ea1a8fe13f8ada7c
    licence: MIT for the axios package; transitive dependency licences unknown
  - id: pip-install
    source: fastapi/fastapi uv.lock export at 69ddc2badf9da1123bba4d360225ae6b085985f6
    version: sha256:d6c58f6048ab1d4c
    licence: MIT for FastAPI; transitive dependency licences unknown
execution:
  mode: script
  inference: false
parameters:
  path: parameters/package-registries/1.1.16/
  sha256: 1227fc886dbf7ea6aee736de0fce7a6a3c305d7104929f830ec7053752c36cb7
interpretation:
  informs: How long a user waits for a pinned project to install in a new sandbox on each provider.
  limits:
  - The result includes registry service and network-route time, which can change for every provider.
  - A slow shared registry or CDN edge can move every provider's time.
  - The pinned Python requirements have wheels for the standard image's Python; compiling is not measured.
  caveats:
  - The record keeps the bytes the interfaces received while the command ran (including the script's status
    reads, a few kilobytes) and the hosts each workload reaches (github.com; registry.npmjs.org; pypi.org
    and files.pythonhosted.org), so a download-bound time can be told from a CPU-bound one.
  - '`npm ci` and `pip` also check for a newer version of themselves at the end, as they do for a user.'
  - Twenty trials per workload per provider is a first look.
validity_checks:
- id: git-commit
  threat: A clone at the wrong commit would time a different project.
  check: After the full clone, the checkout of commit 69ddc2badf9da1123bba4d360225ae6b085985f6 is checked.
- id: input-digests
  threat: A changed input file would time a different install.
  check: Each pinned input file is checked against its SHA-256 in the workload before the timed command.
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Every install runs from a cold package cache in a fresh sandbox, so no earlier trial's download
      is reused. The provider's image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: exception
    text: >-
      Guest CPU model/count, kernel and working-directory device/filesystem are probed outside
      timing on a best-effort basis; unavailable readings remain unknown. Native host/zone
      identifiers are not collected. Missing facts leave the affected independence checks
      unassessed.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
