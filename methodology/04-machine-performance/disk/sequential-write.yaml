id: sequential-write
effective: '2026-11-08'
name: '{name:test.sequential-write}'
category: machine_performance
panel:
  command: fio --rw=write --bs=1m
  quantities: sequential write throughput
notes:
  what_this_measures: The result measures sequential storage write performance in the workspace with direct
    I/O, so the page cache does not supply the data.
  how_it_is_measured: The `fio` workload performs sequential write operations with direct I/O in the workspace
    for the declared duration and ramp; its result uses the sandbox clock.
  how_to_read: The {param:sequential-write.statistics.primary} summarizes successful trials in the
    axis unit; {direction:sequential_write_mib_per_second}.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful trial.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: sequential_write_mib_per_second
  unit: MiB/s
  direction: higher_is_better
  description: fio write bandwidth using sequential 1 MiB blocks.
  quantity: bandwidth
  per: trial
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1800
default_view:
  metric: sequential_write_mib_per_second
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 5
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox per trial; no warm-up. Workload rows are shuffled within each trial where
      stated.
  steps:
  - id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    action: Start a new sandbox from the standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: setup
    name: Prepare disk workload
    action: 'Untimed: make /workspace/fio, then download the pinned static fio 3.39 from a pinned release on
      GitHub inside the sandbox and check its SHA-256 (another digest is the provider''s failure); probe
      direct I/O with `dd` (a /workspace that refuses O_DIRECT reads or writes, or has under 2 GiB free,
      fails the trial); then write the job file and the data file''s first write: 1 GiB, direct, fresh
      random contents in every buffer. The first write and the cache checks are started in the background
      and polled.'
    timer: null
  - id: sequential-write
    name: '{name:test.sequential-write}'
    label: Sequential write
    show: stack
    action: Run fio 3.39 on one 1 GiB file in /workspace/fio with direct I/O (libaio), 64 requests in
      flight, one process, a 5 s ramp and a 60 s measured interval, changing only the access pattern and
      block size. The row is started in the background and its status read every 0.5 s until fio exits,
      because a call that waits more than about 120 s can be cut by a provider's gateway. The four disk
      rows of a trial run in an order shuffled per trial. This row uses sequential 1 MiB blocks, and the reported byte count divided by 1,048,576
      gives MiB/s.
    timer:
      start_event: When fio starts. Setting up the sandbox and writing the 1 GiB test file before that are not timed.
      stop_event: When fio exits, after a 5 s warm-up and 60 s of writes. The figure is fio's own rate over those 60 s. Reading fio's results afterwards is not timed.
    timeout_seconds: 180
    record_steps:
    - disk-seq-write-1m
  - id: cache-checks
    name: Cache checks
    timer: null
    action: 'After the rows, untimed: write a separate 256 MiB file and read it through the page cache,
      then read it with direct I/O. Sample the first 64 MiB of the data file: at least 99.9% of its 4 KiB
      blocks must differ and zlib may shrink them by at most 1%, or the trial fails as the provider''s.'
  - id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    action: Destroy the sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: Manual.
  shared_trial:
    with: sequential-read
timing_boundaries:
  start: The row's fio starts. Setting up the sandbox and writing the 1 GiB test file before that are not timed. The four rows run one after another, in a new random order in each trial.
  stop: fio exits after a 5 s ramp and 60 s measured interval. The value is
    fio's reported byte count divided by 1,048,576.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
cost:
  method: provider_reported_or_priced
failure_policy:
  timeout_seconds:
    create: 300
    sequential-write: 180
    destroy: 300
  retries: None; the first failed step ends the trial.
  success: Benchmark checks pass and the sandbox is deleted.
  provider_errors:
  - Create or transport error, sandbox stops answering, or an uncertain failure owner.
  - fio exiting non-zero, or an error in its job.
  - A /workspace that refuses direct I/O, or has under 2 GiB free, fails the trial before fio runs.
  - A fio download whose SHA-256 differs from the pinned one.
  - Data-file blocks that repeat or compress by more than 1%.
  benchmark_errors:
  - Output that cannot be parsed after the benchmark tool exits successfully.
  - fio output that cannot be read after fio exited 0, a measured interval under 59 s, or a fio error in
    its output; these are counted as BoxRouter's and left out of the results.
  exclusions:
  - An error shown not to be the provider's; retain the trial and reason in the data.
source:
  name: fio
  version: '3.39'
  ids:
  - 'workload: fio-1g'
  - job file sha256:fd3213eb531c5908cd1dbd4d11db8c12312bcee2fe17e9b8571011b5ef89a4b7
  - fio-3.39-linux-x86_64-static sha256:4986f10f2072a20e1dd1b7c31311b14610b1174235410a11491167953e655ddb
  licence: GPL-2.0-only; publish commands and results naming fio 3.39; reference-only for the binary.
execution:
  mode: script
  inference: false
interpretation:
  informs: 'The sequential rows are about large files: datasets, archives and build artifacts.'
  what_to_do: For a provider, this row points at the bandwidth limit of the path from the guest to its
    storage.
  limits:
  - The numbers say little about everyday agent work on small, cached files.
validity_checks:
- id: interval-length
  threat: A measured interval shorter than intended reports a rate over too little time.
  check: A measured interval under 59 s is counted as BoxRouter's and left out of the results.
    of the data file's first write; it becomes a note on the provider's result. No result is removed.