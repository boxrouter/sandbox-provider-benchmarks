id: sequential-write
version: 1.1.2
effective: '2026-10-26'
name: Sequential Write
category: machine_performance
notes:
  summary: How fast /workspace storage writes sequential 1 MiB blocks without help from the page cache.
  what_this_measures: How fast the sandbox's own storage, where an agent's files live (/workspace), writes
    sequential 1 MiB blocks when the page cache can't help.
  how_it_is_measured: The `fio` workload writes sequential 1 MiB blocks with direct I/O in /workspace
    for 60 s after a 5 s ramp; its result uses the sandbox's clock.
  how_to_read: Each provider's median is shown in MiB/s. Higher is better. The tail is the 95th percentile
    once at least 20 trials have succeeded; below that the lowest trial is shown instead.
  cost_summary: Cost over the measured billing span per successful trial.
  cost_how_to_read: Cost of successful attempts divided by their number; failed attempts' cost is not
    included. Lower is better.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: sequential_write_mib_per_second
  unit: MiB/s
  direction: higher_is_better
  description: fio write bandwidth using sequential 1 MiB blocks.
  quantity: bandwidth
  per: trial
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  network: unknown
  lifetime_seconds: 1800
procedure:
  mode: single
  trials: 40
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox per trial; no warm-up. Workload rows are shuffled within each trial where
      stated.
  steps:
  - id: create
    name: Create
    action: Start a new sandbox from the standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: setup
    name: Prepare disk workload
    action: 'Untimed: read the mount facts of /workspace/fio; write in and check the pinned static fio
      3.39 by its SHA-256 (another digest is the benchmark''s failure); probe direct I/O with `dd` (a
      /workspace that refuses O_DIRECT reads or writes, or has under 2 GiB free, misses the trial); then
      write the job file and the data file''s first write: 1 GiB, direct, fresh random contents in every
      buffer, with the sandbox''s memory figures read before and after. The first write and the cache
      checks are started in the background and polled, each writing what it prints to a file that is read
      back.'
    timer: null
  - id: sequential-write
    name: Sequential Write
    action: 'Run fio 3.39 on one 1 GiB file in /workspace/fio with direct I/O (libaio), 64 requests in
      flight, one process, a 5 s ramp and a 60 s measured interval, changing only the access pattern and
      block size. The row is started in the background and its status read every 10 s until fio exits,
      because a call that waits more than about 120 s can be cut by a provider''s gateway. The four disk
      rows of a trial run in an order shuffled per trial; each row''s per-second log is read back, untimed,
      before the next. One trial runs at a time per provider. This row: `rw=write`, `bs=1m`; the value
      is fio''s `bw_bytes` / 1,048,576 in MiB/s.'
    timer:
      start_event: fio starts after the untimed setup and the data file's first write, or the row before
        it.
      stop_event: fio exits after its 5 s ramp and 60 s measured interval, by the sandbox's own clock;
        its JSON is written to a file and read back, untimed, after.
    timeout_seconds: 180
    record_steps:
    - disk-seq-write-1m
  - id: cache-checks
    name: Cache checks
    timer: null
    action: 'After the rows, untimed: write a separate 256 MiB file and read it through the page cache,
      then read it with direct I/O. Sample the first 64 MiB of the data file: its 4 KiB blocks must all
      differ and zlib may shrink them by at most 1%, or the trial is the benchmark''s failure.'
  - id: destroy
    name: Destroy
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: Manual.
  shared_trial:
    with: sequential-read
    version: 1.1.0
timing_boundaries:
  start: The row's fio starts after the untimed setup and the data file's first write, or the row before
    it; rows are shuffled within each trial.
  stop: fio exits after a 5 s ramp and 60 s measured interval, by the sandbox's own clock. The value is
    fio's bw_bytes / 1,048,576.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 20
cost:
  method: provider_reported_or_priced
  pricing_reference:
    repository: sandbox-provider-pricing
    function: price()
    price_sheet_version: recorded in the run manifest
  billed_span: From the create request to the confirmed destroy.
  per_success: Cost of successful attempts divided by their number; failed attempts' cost is not included.
failure_policy:
  timeout_seconds:
    create: 300
    sequential-write: 180
    destroy: 300
  retries: None in the benchmark except the untimed ready check; first failed step ends the trial.
  success: Benchmark checks pass and the sandbox is confirmed deleted.
  provider_errors:
  - Create or transport error, sandbox stops answering, or an uncertain failure owner.
  - fio exiting non-zero, an error in its job, or a measured interval under 59 s.
  - A /workspace that refuses direct I/O shows no number, only the reason.
  benchmark_errors:
  - Output that cannot be parsed after the benchmark tool exits successfully.
  - fio JSON that cannot be read after fio exited 0.
  - A fio binary whose SHA-256 differs from the pinned one.
  - Data-file blocks that repeat or compress by more than 1%.
  exclusions:
  - An error shown not to be the provider's; retain the trial and reason in the data.
source:
  name: fio
  version: '3.39'
  ids:
  - 'workload: fio-1g'
  - job file sha256:85c02cea782dad97fd9b0835b981f4ca90c335be61fd11a4ab98620181f1b207
  - fio-3.39-linux-x86_64-static sha256:4986f10f2072a20e1dd1b7c31311b14610b1174235410a11491167953e655ddb
  licence: GPL-2.0-only; publish commands and results naming fio 3.39; reference-only for the binary.
execution:
  mode: script
  inference: false
interpretation:
  informs: 'The sequential rows are about large files: datasets, archives and build artifacts.'
  what_to_do: For a provider, this row points at the bandwidth limit of the path from the guest to its
    storage.
  limits:
  - The numbers say little about everyday agent work on small, cached files.
validity_checks:
- id: files-in-memory
  threat: /workspace is held in memory, so the number is memory speed, not a device.
  check: Recorded when /workspace is a tmpfs or an overlay on one, or the first write of the data file
    took 0.8 GiB or more of the sandbox's memory; it becomes a note on the provider's result saying in
    how many trials it fired. No result is removed.
- id: direct-reads-at-memory-speed
  threat: Direct reads are served from host memory, so the number is not the device.
  check: Recorded when a proven cache hit read at least half as fast when bypassing the cache, or single
    direct reads take under 10 µs at the median; it becomes a note on the provider's result. No result
    is removed.
- id: throughput-drop
  threat: Throughput that falls during the interval means the first seconds were not sustained.
  check: Recorded when throughput fell by more than 30% from the first 10 s to the last 10 s; it becomes
    a note on the provider's result. No result is removed.
- id: queue-depth-and-cpu
  threat: A row that did not keep the queue full, or was held back by fio's own CPU, measures the sandbox's
    CPU rather than its storage.
  check: Recorded when fewer than 90% of requests kept 64 in flight, or fio used more than 90% of one
    vCPU; it becomes a note on the provider's result. No result is removed.
- id: interval-length
  threat: A measured interval shorter than intended reports a rate over too little time.
  check: A measured interval under 59 s is the provider's failure.
- id: above-link-limit
  threat: A sequential figure above one storage device's link limit cannot come from a device.
  check: Recorded when a sequential row is above 15.75 GB/s, one storage device's link limit; it becomes
    a note on the provider's result. No result is removed.
- id: rewrite-speed
  threat: A rewrite much faster or slower than the first write means the first write measured something
    else.
  check: Recorded when the sequential write row rewrites more than twice, or less than half, the speed
    of the data file's first write; it becomes a note on the provider's result. No result is removed.
