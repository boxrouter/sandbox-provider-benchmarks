      start_event: 7-Zip's benchmark begins.
      stop_event: 7zzs b -mmt<requested vCPU> exits; its rating is 7-Zip's own total MIPS over compress
        and decompress, by its own clock.
    timeout_seconds: 300
    record_steps:
    - cpu-7zip-mt
  - id: destroy
    name: '{name:stage.destroy}'
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: Manual.
  shared_trial:
    with: 7-zip-1-thread
    version: 1.1.18
timing_boundaries:
  start: 7-Zip's benchmark begins in the sandbox.
  stop: 7-Zip exits and prints its totals. The figure is 7-Zip's own; the job host times
    nothing.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 5
cost:
  method: provider_reported_or_priced
  counted_sandboxes: Each of the unit's five sandboxes.
failure_policy:
  timeout_seconds:
    create: 300
    7-zip-all-vcpus: 300
    destroy: 300
  retries: None; the first failed step ends the trial.
  success: 7-Zip exits 0 and prints a rating, and the sandbox is confirmed deleted.
  provider_errors:
  - A benchmark row that does not exit 0.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - Output the benchmark cannot read after 7-Zip exited 0.
  exclusions:
  - An error shown not to be the provider's.
  - A sandbox that shows another CPU count than requested is recorded as a CPU count mismatch, and its
    result is kept.
source:
  name: 7-Zip
  version: '25.01'
  ids:
  - 7zzs-25.01-linux-x64-static
  - sha256:5ef56fbef44a9b618036a90039d4a709a18e0950d7939112114f5c43674c5422
  licence: LGPL-2.1-or-later
execution:
  mode: script
  inference: false
interpretation:
  informs: 'How fast a sandbox computes when all the requested vCPUs work at once: agents that build,
    test, compress or crunch data wait on the CPU, and two providers that sell the same 2 vCPU / 4 GiB
    can differ, for example by the CPU model a sandbox lands on.'
  limits:
  - The tool rates integer work such as compression, branching and cache access; it does not measure floating-point
    or vector speed.
  caveats:
  - A sandbox that shows another CPU count than requested is recorded as a CPU count mismatch; the threads
    used are still the requested count.
  - A provider's sandboxes can land on different CPU models; each trial records its model, so a spread
    in results can be traced to it.
  - Each result is the tool's own figure by its own clock; the job host times nothing.
  - The 7-Zip rating covers integer work such as compression, branching, and cache access; it does not
    measure floating-point or vector speed.
validity_checks:
- id: threads-differ
  threat: A sandbox shows another CPU count than requested, for example the host's CPUs.
  check: The CPU count the sandbox shows is compared with the requested vCPU count; a difference is recorded
    as a CPU count mismatch and the result is kept.
independence_answers:
  fresh_sandbox:
    status: meets
    text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
  equal_concurrency:
    status: meets
    text: Up to 10 trials at once for every provider, the same number for each.
  shuffled_order:
    status: meets
    text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded,
      and the pair's trials run in 4 rounds.
  caches:
    status: meets
    text: Nothing is warmed up and the work runs from memory and CPU, so page and package caches do not
      enter the result. The provider's image caches stay on.
  job_host:
    status: meets
    text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
      own clock; the job host serves one provider only.
  shared_provider_hosts:
    status: meets
    text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number
      in flight is recorded for each trial.
  empty_account:
    status: meets
    text: The account is checked empty before the provider's chain, and the count of other live sandboxes
      is recorded at each batch's start and end.
  placement_facts:
    status: exception
    text: >-
      Guest CPU model/count, kernel and working-directory device/filesystem are probed outside
      timing on a best-effort basis; unavailable readings remain unknown. Native host/zone
      identifiers are not collected. Missing facts leave the affected independence checks
      unassessed.
  run_check:
    status: meets
    text: The run's independence check covers the pair on its main metric with the common thresholds.
  outliers:
    status: meets
    text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
