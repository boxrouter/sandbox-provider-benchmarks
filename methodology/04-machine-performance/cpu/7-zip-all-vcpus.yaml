id: 7-zip-all-vcpus
effective: '2026-11-08'
name: '{name:test.7-zip-all-vcpus}'
category: machine_performance
panel:
  command: 7zzs b -mmt{param:7-zip-all-vcpus.environment.size.vcpu}
  quantities: compression and decompression speed
notes:
  what_this_measures: The result is the compression and decompression rating with as many threads as requested
    vCPUs.
  how_it_is_measured: The compression and decompression tool runs with as many threads as requested vCPUs
    and reports its own rating using its own clock.
  how_to_read: The {param:7-zip-all-vcpus.statistics.primary} summarizes successful trials in the
    axis unit; {direction:total_mips}.
  cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful trial.
  cost_how_to_read: Only successful trials contribute to the cost value.
inherits: sbs.common
metrics:
- name: total_mips
  unit: MIPS
  direction: higher_is_better
  description: 7-Zip's total rating over compression and decompression, from its own output.
  quantity: rating
  per: trial
  formula: value(cpu-7zip-mt)
- name: compress_mips
  unit: MIPS
  direction: higher_is_better
  description: 7-Zip's compression rating.
  quantity: rating
  per: trial
  phase:
    kind: stage
    id: compression
    parent: cpu
  formula: value(cpu-7zip-mt.compress_mips)
- name: decompress_mips
  unit: MIPS
  direction: higher_is_better
  description: 7-Zip's decompression rating.
  quantity: rating
  per: trial
  phase:
    kind: stage
    id: decompression
    parent: cpu
  formula: value(cpu-7zip-mt.decompress_mips)
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  network: unknown
  lifetime_seconds: 1200
default_view:
  metric: total_mips
procedure:
  mode: single
  trials: 20
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 5
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox per trial from the standard image, prepared in the account before the run.
      Nothing is warmed up. A provider's sandboxes can land on different CPU models; each trial records
      its model so a spread can be traced to it.
  steps:
  - id: create
    name: '{name:stage.create}'
    label: '{name:stage.create}'
    show: hidden
    action: Start a new sandbox from the standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: cpu-facts
    name: CPU facts
    action: Untimed, record nproc, the CPU model, the sha_ni, avx2 and avx512f flags, the L3 cache size,
      the cgroup's cpu.max and the memory size.
    timer: null
    timeout_seconds: 30
  - id: install-tools
    name: Install tools
    action: Download the pinned static 7-Zip 25.01 build (Igor Pavlov's own static build) and the pinned
      STREAM 5.10 build (John McCalpin's stream.c, built once with OpenMP for generic x86-64) from a pinned
      release on GitHub inside the sandbox and check each by its SHA-256.
    timer: null
  - id: 7-zip-all-vcpus
    name: '{name:test.7-zip-all-vcpus}'
    label: '{name:stage.total}'
    show: stack
    action: 'Run `./7zzs b -mmt<N>` as a background script that the harness polls, where N is the vCPU
      count requested, never `nproc`: some providers show the host''s CPUs inside a sandbox. The row runs
      in an order shuffled per trial with the other two rows of the trial. The compression and decompression ratings are recorded too.'
    timer:
      start_event: When 7-Zip's benchmark starts. Downloading and checking the tools before that is not timed.
      stop_event: When 7-Zip exits. The figure is 7-Zip's own rating, its total MIPS over compression and decompression.
    timeout_seconds: 300
    record_steps:
    - cpu-7zip-mt
  - id: destroy
    name: '{name:stage.destroy}'
    label: '{name:stage.destroy}'
    show: hidden
    action: Destroy the sandbox.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: Manual.
  shared_trial:
    with: 7-zip-1-thread
timing_boundaries:
  start: 7-Zip's benchmark begins in the sandbox.
  stop: 7-Zip exits and prints its totals. The figure is 7-Zip's own; the job host times
    nothing.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
cost:
  method: provider_reported_or_priced
  counted_sandboxes: The trial's one sandbox.
failure_policy:
  timeout_seconds:
    create: 300
    7-zip-all-vcpus: 300
    destroy: 300
  retries: None; the first failed step ends the trial.
  success: 7-Zip exits 0 and prints a rating, and the sandbox is deleted.
  provider_errors:
  - A benchmark row that does not exit 0.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - Output the benchmark cannot read after 7-Zip exited 0.
  exclusions:
  - An error shown not to be the provider's.
  - A sandbox that shows another CPU count than requested keeps its result; the CPU count it shows is recorded
    in the raw data.
source:
  name: 7-Zip
  version: '25.01'
  ids:
  - 7zzs-25.01-linux-x64-static
  - sha256:5ef56fbef44a9b618036a90039d4a709a18e0950d7939112114f5c43674c5422
  licence: LGPL-2.1-or-later
execution:
  mode: script
  inference: false
interpretation:
  informs: 'How fast a sandbox computes when all the requested vCPUs work at once: agents that build,
    test, compress or crunch data wait on the CPU, and two providers that sell the same 2 vCPU / 4 GiB
    can differ, for example by the CPU model a sandbox lands on.'
  limits:
  - The tool rates integer work such as compression, branching and cache access; it does not measure floating-point
    or vector speed.
  caveats:
  - A sandbox that shows another CPU count than requested keeps its result; the threads used are still the
    requested count, and the CPU count it shows is recorded in the raw data.
  - A provider's sandboxes can land on different CPU models; each trial records its model, so a spread
    in results can be traced to it.
  - Each result is the tool's own figure by its own clock; the job host times nothing.
  - The 7-Zip rating covers integer work such as compression, branching, and cache access; it does not
    measure floating-point or vector speed.
validity_checks:
- id: threads-differ
  threat: A sandbox shows another CPU count than requested, for example the host's CPUs.
  check: The CPU count the sandbox shows is compared with the requested vCPU count; a difference does not
    change the result.