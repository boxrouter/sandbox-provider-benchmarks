# yaml-language-server: $schema=../../../schemas/methodology.schema.json
# yaml-language-server: $schema=../../../schemas/methodology.schema.json
id: 7-zip-all-vcpus
version: 1.1.2
effective: '2026-10-26'
name: 7-Zip, All vCPUs
category: machine_performance
notes:
  summary: How fast all requested vCPUs compress and decompress by 7-Zip's own benchmark.
  what_this_measures: How fast all the vCPUs requested for a sandbox compress and decompress together,
    by 7-Zip's own benchmark at as many threads as vCPUs requested.
  how_it_is_measured: The 7-Zip benchmark runs with as many threads as requested vCPUs and rates compression
    and decompression by its own clock; the job host does not time it.
  how_to_read: Each provider's median is shown in MIPS. Higher is better. The tail is the 95th percentile
    once at least 20 trials have succeeded; below that the lowest trial is shown instead.
  cost_summary: Cost over the measured billing span per successful trial.
  cost_how_to_read: Cost of the successful attempts divided by their number; failed attempts' cost is
    not included. Lower is better.
inherits:
  id: sbs.common
  version: 1.0.1
metrics:
- name: total_mips
  unit: MIPS
  direction: higher_is_better
  description: 7-Zip's total rating over compression and decompression, from its own output.
  quantity: rating
  per: trial
- name: compress_mips
  unit: MIPS
  direction: higher_is_better
  description: 7-Zip's compression rating.
  quantity: rating
  per: trial
- name: decompress_mips
  unit: MIPS
  direction: higher_is_better
  description: 7-Zip's decompression rating.
  quantity: rating
  per: trial
environment:
  size:
    vcpu: 2
    memory_gib: 4
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:1f77271b6d589cc77ebbc2ce00a9d33a866980b05a0b37eb234f66a1bd09bc61
  network: unknown
  lifetime_seconds: 1200
procedure:
  mode: single
  trials: 10
  sandboxes_per_trial: 1
  concurrency:
    trials_in_parallel: 1
    sandboxes_at_once: 1
  warm_cold_policy:
    policy: A fresh sandbox per trial from the standard image, prepared in the account before the run.
      Nothing is warmed up. A provider's sandboxes can land on different CPU models; each trial records
      its model so a spread can be traced to it.
  steps:
  - id: create
    name: Create
    action: Start a new sandbox from the standard image.
    timer: null
    timeout_seconds: 300
    record_steps:
    - create
  - id: cpu-facts
    name: CPU facts
    action: Untimed, record nproc, the CPU model, the sha_ni, avx2 and avx512f flags, the L3 cache size,
      the cgroup's cpu.max and the memory size.
    timer: null
    timeout_seconds: 30
  - id: install-tools
    name: Install tools
    action: Write the pinned static 7-Zip 25.01 build (Igor Pavlov's own static build) and the pinned
      STREAM 5.10 build (John McCalpin's stream.c, built once with OpenMP for generic x86-64) into the
      sandbox and check each by its SHA-256.
    timer: null
  - id: 7-zip-all-vcpus
    name: 7-Zip, All vCPUs
    action: 'Run `./7zzs b -mmt<N>` as a background script that the harness polls, where N is the vCPU
      count requested, never `nproc`: some providers show the host''s CPUs inside a sandbox. The row runs
      in an order shuffled per trial with the other two rows of the trial. Compress and decompress ratings,
      CPU usage and 7-Zip''s own frequency estimate are recorded too.'
    timer:
      start_event: 7-Zip's benchmark begins.
      stop_event: 7zzs b -mmt<requested vCPU> exits; its rating is 7-Zip's own total MIPS over compress
        and decompress, by its own clock.
    timeout_seconds: 300
    record_steps:
    - cpu-7zip-mt
  - id: destroy
    name: Destroy
    action: Destroy the sandbox and confirm it is gone.
    timer: null
    timeout_seconds: 300
    record_steps:
    - destroy
  cadence: Manual.
  shared_trial:
    with: 7-zip-1-thread
    version: 1.1.0
timing_boundaries:
  start: 7-Zip's benchmark begins in the sandbox.
  stop: 7-Zip exits and prints its totals. The figure is 7-Zip's own, by its own clock; the job host times
    nothing.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
  ranking:
    ranked: true
    min_successes: 5
cost:
  method: provider_reported_or_priced
  pricing_reference:
    repository: sandbox-provider-pricing
    function: price()
    price_sheet_version: recorded in the run manifest
  billed_span: From the create request to the confirmed destroy, about three to five minutes.
  per_success: Cost of the successful attempts divided by their number; failed attempts' cost is not included.
failure_policy:
  timeout_seconds:
    create: 300
    7-zip-all-vcpus: 300
    destroy: 300
  retries: None; the first failed step ends the trial.
  success: 7-Zip exits 0 and prints a rating, and the sandbox is confirmed deleted.
  provider_errors:
  - A benchmark row that does not exit 0.
  - A failure whose owner is uncertain.
  benchmark_errors:
  - Output the benchmark cannot read after 7-Zip exited 0.
  exclusions:
  - An error shown not to be the provider's.
  - A sandbox that shows another CPU count than requested is recorded as `threads_differ`, and its result
    is kept.
source:
  name: 7-Zip
  version: '25.01'
  ids:
  - 7zzs-25.01-linux-x64-static
  - sha256:5ef56fbef44a9b618036a90039d4a709a18e0950d7939112114f5c43674c5422
  licence: LGPL-2.1-or-later
execution:
  mode: script
  inference: false
interpretation:
  informs: 'How fast a sandbox computes when all the requested vCPUs work at once: agents that build,
    test, compress or crunch data wait on the CPU, and two providers that sell the same 2 vCPU / 4 GiB
    can differ, for example by the CPU model a sandbox lands on.'
  limits:
  - The 7-Zip rating covers integer work such as compression, branching, and cache access; it does not
    measure floating-point or vector speed.
  caveats:
  - A sandbox that shows another CPU count than requested is recorded as `threads_differ`; the threads
    used are still the requested count.
  - A provider's sandboxes can land on different CPU models; each trial records its model, so a spread
    in results can be traced to it.
  - Each result is the tool's own figure by its own clock; the job host times nothing.
validity_checks:
- id: threads-differ
  threat: A sandbox shows another CPU count than requested, for example the host's CPUs.
  check: The CPU count the sandbox shows is compared with the requested vCPU count; a difference is recorded
    as `threads_differ` and the result is kept.
