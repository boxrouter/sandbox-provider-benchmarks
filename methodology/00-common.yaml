id: sbs.common
effective: '2026-11-08'
name: Common methodology
category: common
environment:
  size:
    vcpu: 2
    memory_gib: 4
  size_policy: Operation benchmarks (create, commands, files, pause and resume, snapshots, forks, reconnects and
    previews) run on the provider's smallest size that holds the stated size; a result from a larger size is
    flagged with the size it ran on. Machine-performance and workload benchmarks run on the stated size; where the
    provider has no such size they run on its nearest larger size, and the result is flagged with both sizes.
  image:
    reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
  region_policy: The provider's US region, never a narrower one, with one named exception. Boat, which is not tested yet, has no
    US region and no region choice, so it runs in the EU. Ordinary self-serve product, nothing tuned per
    provider. Results are never aggregated across job-host regions; each job-host region is
    its own series.
  connection_idle_seconds: 300
  job_host: One job host runs the benchmark for every provider, in the AWS region that the publication names.
    Each trial's record carries that region and the host's CPU load during the trial.
clocks:
  operation: An operation sent to the provider is published at the provider's own time, how long its exchanges with
    the provider were in flight. A step that never reaches the provider is timed on the monotonic clock of the job
    host that sends it, from just before the call until it returns.
  command_runtime: The sandbox's own clock, read just before and after the command. Total time, runtime
    and latency (total minus runtime) stay separate.
statistics:
  primary: median
  secondary:
  - mean
  percentile_method: Nearest rank over successful trials; nothing trimmed.
  tail:
    worse_side_percentile: 95
    min_successes: 20
  interval:
    type: bootstrap_percentile
    confidence: 0.95
    resamples: 10000
    seed: 0
    applies_to:
    - median
    - cost_per_success
  ranking:
    ranked: true
    requires_all_successful: true
cost:
  method: provider_reported_or_priced
  counted_sandboxes: A unit's cost is the sum of the costs of the sandboxes it created.
  per_success: The displayed cost is the total cost of the successful attempts divided by their count, shown per
    success or per 1,000 successes. The run's records retain the cost of every attempt, including failed ones.
  pricing_reference:
    repository: sandbox-provider-pricing
    document: cost-method.json
    versions: The price and rules versions recorded in the publication; they select each sandbox's method.
  notes:
  - Each sandbox's cost is read from the provider's record after the run's trials end, and read again until
    the provider reports it or its reporting window closes. It is shown as Reported By Provider, Calculated or
    Unknown, never zero or a range. A known cost the provider may still revise is published as read and
    counted as not final.
  - A unit with a sandbox whose cost is unknown has no cost; it is never zero and never a range.
  - A sandbox whose stop can't be confirmed, with no provider end time and no maximum lifetime, has no
    cost; its trial is the provider's failure.
failure_policy:
  timeout_seconds: {}
  retries: The first failed step ends the trial. Run each workload and primitive benchmark until its intended
    number of successful trials from the run's configuration is reached. A failed trial runs again as a new trial,
    at most three attempts for each success the cell still needs, and the cell stops early after three failures in
    a row at the same step with the same error. A trial that BoxRouter's own script, software or account limits
    ended is left out of the published data and counted as excluded.
  success: Every benchmark-specific check passes and every resource the trial created is deleted.
  provider_errors:
  - Create and transport errors, and a sandbox that stops answering.
  - A sandbox whose stop can't be confirmed.
  - A failure whose owner is uncertain.
  - A replayed command that exits with a different code than the recording, and a step that reaches its time limit.
  benchmark_errors:
  - A failure of the benchmark's own script, such as output it cannot parse after a command exited 0.
  exclusions:
  - Only successful trials enter the published figures. Every attempt, including failed ones, remains in the
    run's records with its owner and its cost.
  - Reliability is a separate future benchmark.
  blockers: One gate governs whether a result is complete. A cell (a provider, a benchmark, and for replay
    suites a task) is complete when it reaches the configured number of successful trials. A cell that falls
    short of that count, because it hit the attempt limit or a trial's outcome could not be established, is
    shown as k of N with its failures. A cell that did not run is shown as Not displayed with its reason.
capability_source:
  repository: https://github.com/boxrouter/sandbox-provider-spec
  declaration_path: providers/<provider>/declaration*.yaml
  use: The benchmark page uses declarations to include tests whose required capabilities are declared
    and exclude tests when a required capability is absent.
notes:
  summary: Timing, successful trials, statistics and cost are common; only composites fill an incomplete
    unit with the slowest median any provider had.
  what_this_measures: It sets the shared timing, trial-success, statistics, cost, and failure rules that
    apply to every benchmark.
  how_to_read: >-
    Shared benchmark results use the median and worst-side tail; each benchmark states its units and
    direction. Interactive subset sums are labelled derived views: per trial, sum selected sandboxes
    only when all have values; report the statistic using the same estimators and tail floor with no interval.
    
  statistics:
    median: The nearest-rank 50th percentile of successful trials, with no values trimmed.
    mean: The arithmetic mean of successful trials; no values are trimmed.
    p95: For lower-is-better results, p95 is the nearest-rank 95th percentile of the successful samples pooled
      across all units of a suite, with no values trimmed.
    tail_fallback: 'When a suite has fewer than 20 pooled samples, the worst sample is shown instead: the slowest or the
      lowest.'
    typical: The typical time is the median across successful trials.
  stage_medians: Each step and the total have separate medians, so the parts may not add up.
  time_between_stages: Step means add to the total, apart from time between steps.
