# Methodology versions that a collapse to the latest version must keep, because something served or frozen cites
# them (web#4889: #817 deleted versions that web's pinned data cites, and every method page of that data said
# "No Such Methodology"). `validate` fails when a listed version is missing from the catalog, so a collapse cannot
# delete one. Add a version here, with its holder, before any change that stops it being the latest.
# Released versions that named the retired image, plus versions depending on them, were removed with
# their sole-holder parameter trees and lock rows. Existing w1/c1 publications retain their old exact
# references, so pages for removed methodology versions can be absent until those datasets are rerun.
# An entry is deleted with its holder, in the change that repoints or replaces the holder (the document, its
# parameters tree and its lock row go with it).
holders:
  web-w1:
    what: web's pinned dataset w1 (benchmark-data data-v12, publication 20261107T122642Z, its summary cites these versions)
    retire_when: web pins a dataset built on the latest versions (a rerun, for example the first full weekly run)
  web-c1:
    what: web's pinned dataset c1 (benchmark-data data-v13, publication 20261107T123200Z, its summary cites these versions)
    retire_when: web pins a dataset built on the latest versions (a rerun, for example the first full weekly run)
    owner_decision: c1 cannot move to the latest versions by re-attribution, because the cost definition of 25 of its 35 cited versions differs from the latest; the bench owner decides to rerun c1 or to accept the changed cost definitions
  tree-w1:
    what: the frozen task tree dataset-w1-tasks-3 (commit dcc2d740), which binds these document versions
    retire_when: dataset w1 is rebuilt on a task tree bound to the latest versions, or retired
  tree-c1:
    what: the frozen task tree dataset-c1-tasks-2, which binds these document versions
    retire_when: dataset c1 is rebuilt on a task tree bound to the latest versions, or retired
  runner-tasks:
    what: task descriptions (tasks/*/description.json at c43870b2), whose sbs field binds these document versions; a campaign plan reads their parameters
    retire_when: the task descriptions move to the latest versions (bench-planner's decision)
  dependency:
    what: a retained version reads it through a parameter placeholder, an inherits or a shared workload, or it shares a methodology file with a retained version
    retire_when: every version that reads it is retired
