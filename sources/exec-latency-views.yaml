# The one source of the two Exec Latency reader documents (Latency per Call, Latency per 100 Calls).
# `shared` is what both state: procedure, timing, failure policy, cost, environment, clocks, parameters and checks.
# Each view states only what differs. Edit here, then run `python scripts/build_exec_views.py`;
# `tests/test_exec_views.py` fails when methodology/03-sandbox-operations/exec-views.yaml is stale.
shared:
  category: sandbox_operation
  notes:
    summary: Sequential `true` commands expose command runtime and the latency around it.
    how_it_is_measured: A job-host monotonic clock times each `true` call until its exit status and sandbox
      clock readings return. Calls run sequentially in one sandbox.
    cost_summary: The cost is the sum of the provider-sourced costs of the sandboxes, per successful call.
    cost_how_to_read: Only successful trials contribute to the cost value.
  inherits:
    id: sbs.common
    version: 1.0.18
  environment:
    size:
      vcpu: 2
      memory_gib: 4
    image:
      reference: ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
    network: unknown
    lifetime_seconds: 600
  clocks:
    operation: Job-host monotonic clock around each command call.
    command_runtime: Sandbox clock read immediately before and after true.
  procedure:
    mode: single
    trials: 100
    sandboxes_per_trial: 1
    concurrency:
      trials_in_parallel: 10
      sandboxes_at_once: 1
    warm_cold_policy:
      policy: One fresh sandbox per trial; 100 calls run sequentially in the same sandbox, so later calls
        reuse the session's warmed state.
      cold: First call after the untimed ready check.
      warm: Calls 2 through 100 follow immediately after the preceding call returns.
    variants:
    - id: 'true'
      label: true, 100 calls through the sandbox
      command: 'true'
      parameters:
        calls: 100
      description: The workload uses the {param:exec-latency.1.2.12.procedure.variants.0.label} configuration.
    steps:
    - id: create
      name: '{name:stage.create}'
      action: Create a fresh sandbox from the pinned standard image.
      timer: null
      timeout_seconds: 300
      record_steps:
      - create
    - id: 'true'
      name: true calls
      action: Send 100 true commands one at a time, with each call's sandbox clock readings returned to
        the job host.
      timer:
        start_event: The command call is dispatched.
        stop_event: The exit code and sandbox clock readings return to the job host.
      timeout_seconds: 30
      repeats: true
      record_steps:
      - 'true'
    - id: destroy
      name: '{name:stage.destroy}'
      action: Destroy the sandbox and confirm it is gone.
      timer: null
      timeout_seconds: 300
      record_steps:
      - destroy
    cadence: 'Manual: runs are started by hand, not on a fixed schedule.'
  timing_boundaries:
    start: Each true command call is dispatched.
    stop: Its exit code and the sandbox clock readings return to the job host.
  statistics:
    primary: median
    secondary:
    - mean
    ranking:
      ranked: true
      min_successes: 5
  cost:
    method: provider_reported_or_priced
  failure_policy:
    timeout_seconds:
      create: 300
      'true': 30
      destroy: 300
    retries: No command call is retried; the first failed call ends the trial.
    success: All 100 commands exit 0 and return both clock readings; the sandbox is confirmed destroyed.
    provider_errors:
    - A command call or transport error
    - a nonzero command exit
    - or missing clock readings.
    benchmark_errors:
    - A malformed measurement record or failure in benchmark-side timing and parsing.
    exclusions:
    - A failure shown not to be the provider's; retain the trial with its reason.
  parameters:
    path: parameters/exec-latency-2vcpu-8gib/1.0.3/
    sha256: f97b44012d461bfe429c9918e4d9b3c7bf43b8cc030f84115a43424d1363da79
  interpretation:
    what_to_do: Use the latency to judge the floor under every command an agent runs through a provider.
    informs: How long the shortest command, `true`, takes to come back through BoxRouter. A high latency
      points at the provider's exec API and its in-sandbox agent.
    limits:
    - The latency includes the network between the job host and the provider's US region; a provider whose
      region is farther away pays that distance.
    - Only calls through BoxRouter are measured.
    caveats:
    - BoxRouter keeps idle connections for 300 s, so a call that follows a pause may pay a new connection.
    - A run is 100 trials, so each provider's figures come from 100 sandboxes and 10,000 calls. Until
      2026-10-26 a run was 10 trials; the trial itself did not change.
    - Version 4 of the earlier test measures only the calls through BoxRouter and makes 100 calls instead
      of 20; version 3's results are not pooled with it.
  validity_checks:
  - id: clock_cross_check
    threat: A wrong sandbox clock reading would skew the runtime and the latency.
    check: Each call sends `true` between two reads of the sandbox's clock (`$EPOCHREALTIME`, checked
      against `/proc/uptime`), run by Bash.
  - id: all_calls_succeed
    threat: A failed call could be left out of the median.
    check: A call succeeds when it exits 0 with the clock readings back, and a trial succeeds only when
      all 100 calls do; every call counts, including the first.
  - id: first_command_not_measured
    threat: The sandbox's first command would add start-up work to the calls.
    check: The ready check runs untimed after create, so the 100 calls do not include the sandbox's first
      command.
  source:
    name: true command workload and BoxRouter standard image
    version: sha256:8db60a2eeeb06993
    ids:
    - true workload sha256:8db60a2eeeb06993
    - ghcr.io/boxrouter/standard-image@sha256:89d4c97048dbdfb8b6d85ad91833962ff38d1c334a5f47e6de80a9762310191b
    licence: unknown
  execution:
    mode: script
    inference: false
  independence_answers:
    fresh_sandbox:
      status: meets
      text: One fresh sandbox per trial; every pass, call or row run inside it is one sample.
    equal_concurrency:
      status: meets
      text: Up to 10 trials at once for every provider, the same number for each.
    shuffled_order:
      status: meets
      text: The benchmark's position in each provider's chain is shuffled per run with the seed recorded, and
        the pair's trials run in 4 rounds.
    caches:
      status: meets
      text: Later calls reuse the session's warmed state, as a user's calls do; nothing is cleared between calls.
        The provider's image caches stay on.
    job_host:
      status: meets
      text: Operation times come from the job host's monotonic clock and command runtimes from the sandbox's
        own clock; the job host serves one provider only.
    shared_provider_hosts:
      status: meets
      text: Up to 9 other trials of the pair's batch may be in flight on the provider's hosts; the number in
        flight is recorded for each trial.
    empty_account:
      status: meets
      text: The account is checked empty before the provider's chain, and the count of other live sandboxes
        is recorded at each batch's start and end.
    placement_facts:
      status: meets
      text: Each trial records its CPU model and count, kernel, working-directory device and file system,
        and the job host's load over its window.
    run_check:
      status: meets
      text: The run's independence check covers the pair on its main metric with the common thresholds.
    outliers:
      status: meets
      text: Values are excluded only by the common outlier and physical-limit rule, with the reason recorded.
views:
  per-call:
    id: exec-latency
    version: 1.2.12
    effective: '2026-11-08'
    name: Exec Latency
    notes:
      summary: Time to send a single exec `true` call.
      what_this_measures: The result is the round-trip latency of one call to a command that runs for
        almost no time, from the call until its result and the sandbox clock readings return.
      how_to_read: The {param:exec-latency.1.2.12.statistics.primary} summarizes every call of every successful
        trial, pooled, in the axis unit; {direction:total_time}.
    metrics:
    - name: total_time
      unit: ms
      direction: lower_is_better
      description: Median time from one command call starting until its result and clock readings return,
        over every call of every successful trial.
      formula: median(total(true))
      quantity: latency
      per: call
    statistics:
      percentile_method: Nearest rank over every call of every successful trial, pooled; calls of a trial
        that failed partway are left out, as they are from the per-trial sums; no trimming.
      sample: pooled_calls
      interval:
        type: cluster_bootstrap_percentile
        cluster: trial
        confidence: 0.95
        resamples: 10000
        seed: 0
        applies_to:
        - median
      scatter:
        sampling: one_random_call_per_trial
        seed: 0
  per-100-calls:
    id: exec-latency-per-100-calls
    version: 1.0.11
    effective: '2026-11-08'
    name: '{name:test.exec-latency-per-100-calls}'
    notes:
      summary: Total time to send {param:exec-latency.1.2.12.procedure.variants.0.parameters.calls} individual
        exec `true` calls.
      what_this_measures: The result is the round-trip latency of one trial's consecutive calls to a command
        that runs for almost no time, added up.
      how_to_read: The {param:exec-latency.1.2.12.statistics.primary} summarizes the successful trials
        in the axis unit; {direction:total_time}.
    metrics:
    - name: total_time
      unit: ms
      direction: lower_is_better
      description: Sum of the round-trip times of the 100 calls of one trial.
      formula: total(true)
      quantity: latency
      per: 100-calls
    statistics:
      percentile_method: Nearest rank over the successful trials; no trimming.
      sample: trial
      interval:
        type: bootstrap_percentile
        confidence: 0.95
        resamples: 10000
        seed: 0
        applies_to:
        - median
      scatter:
        sampling: every_trial
