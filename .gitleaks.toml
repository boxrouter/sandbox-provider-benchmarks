[extend]
useDefault = true

[[allowlists]]
description = "Public image signing-key fingerprints identify verification keys, not private keys."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)parameters/(deepswe|terminal-bench-4-0)/([^/]+/)?protocol\.json$''']
regexTarget = "line"
regexes = ['''^\s*"GPG_KEY": "[0-9A-Fa-f]{40}",?\s*$''']

[[allowlists]]
description = "The trace hub's publishable client key is public by design (run-definition schema: fetch_key)."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)parameters/terminal-bench-4-0/run\.json$''']
regexTarget = "line"
regexes = ['''^\s*"fetch_key": "sb_publishable_[A-Za-z0-9_-]+",?\s*$''']
