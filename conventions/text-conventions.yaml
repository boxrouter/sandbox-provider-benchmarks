shapes:
  details:
    type: ordered_parts
    tag: kind
    min_parts: 1
    parts:
    - kind: composite
      slot: details.composite
      properties:
        text:
          type: string
          minLength: 1
          pattern: \S
      required:
      - text
    - kind: setup
      slot: details.setup
      properties:
        text:
          type: string
          minLength: 1
          pattern: \S
      required:
      - text
    - kind: trial_steps
      slot: details.trial-steps
      properties:
        text:
          type: string
          minLength: 1
          pattern: \S
      required:
      - text
    - kind: limitations
      slot: details.limitations
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            pattern: \S
      required:
      - items
    - kind: sources
      slot: details.sources
      properties:
        links:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - href
            properties:
              label:
                type: string
                minLength: 1
                pattern: \S
              href:
                type: string
                format: uri
                minLength: 1
          contains:
            type: object
            required:
            - label
            properties:
              label:
                const: Full Method
      required:
      - links
reporting:
  offending_text_max_chars: 200
  redact_without_blocklist: true
  blocklist_environment: PUBLIC_TEXT_BLOCKLIST
writing_review_proposal:
  enabled: false
  blocking: false
  trigger: PRs changing authored reader text or conventions
  actor: An existing writing-review agent
  output: One advisory PR comment with concise suggested improvements and the applicable rule IDs
  constraints:
  - Do not block CI or merging.
  - Do not alter source text, measurements or canonical names.
  - Do not post comments until the coordinator explicitly enables this proposal.
hero:
  template: '{hero_description}. {direction} is better.'
  separator: '. '
  required_parts:
  - hero_description
  - direction
  direction_words:
    lower_is_better: Lower
    higher_is_better: Higher
readability:
  max_grade: 9
  method: Approximate English Flesch–Kincaid grade; advisory only.
  jargon_patterns:
  - (?i)\bper workload\b
  - (?i)\bcombined into\b
  - (?i)\bmedian of medians\b

presentation:
  link_kinds: [title, row, chart_label, control]
  calendar_date:
    locale: en-US
    options:
      timeZone: UTC
      month: short
      day: numeric
      year: numeric
    range_template: '{from} to {to}'
    time_options: {timeZone: UTC, hour: 2-digit, minute: 2-digit, hourCycle: h23}
    date_time_template: '{date} {time} UTC'
    example: Oct 26, 2026
  # reaches (the first unit below that), with this many significant digits, thousands separators and no trailing zeros.
  # image_sizes.byte_size_text and web's bytesText read these values and run every vector.
  byte_size:
    significant_digits: 3
    units:
    - {unit: MB, factor: 1000000}
    - {unit: GB, factor: 1000000000}
    vectors:
    - {bytes: 387666432, text: 388 MB}
    - {bytes: 418727404, text: 419 MB}
    - {bytes: 999000000, text: 999 MB}
    - {bytes: 1000000000, text: 1 GB}
    - {bytes: 1073741824, text: 1.07 GB}
    - {bytes: 1151836160, text: 1.15 GB}
    - {bytes: 2443095512, text: 2.44 GB}
    - {bytes: 7237809664, text: 7.24 GB}
    example: 7.24 GB
  # A size a test, provider or tool defines in binary (a payload, a block, a machine): the largest unit that divides the byte
  # count exactly, else bytes. placeholders.size_text and web read these values and run every vector.
  size_text:
    base: 1024
    units: [KiB, MiB, GiB, TiB]
    below_unit: {one: byte, many: bytes}
    vectors:
    - {bytes: 1, text: 1 byte}
    - {bytes: 1000, text: '1,000 bytes'}
    - {bytes: 1024, text: 1 KiB}
    - {bytes: 1536, text: '1,536 bytes'}
    - {bytes: 4096, text: 4 KiB}
    - {bytes: 1048576, text: 1 MiB}
    - {bytes: 1073741824, text: 1 GiB}
    - {bytes: 4294967296, text: 4 GiB}
    example: 4 KiB
  rules:
  - id: requested-size-only
    text: Show only the requested sandbox size on benchmark pages and drawers. Keep measured size, CPU model, effective cores and hardware or check notes in private evidence; do not render their rows or readings controls.
    predicate: {kind: schema, value: requested-size-only, evidence_required: true, checked_by: web}
    applies_to: {slots: [presentation.drawer, presentation.provider-page]}
    target: record
    severity: error

  - id: drawer-no-empty-headed-section
    text: Omit any drawer section or fact heading whose body has no reader content.
    predicate: {kind: schema, value: drawer-headed-content, evidence_required: true, checked_by: web}
    applies_to: {slots: [presentation.drawer]}
    target: record
    severity: error
  - id: composite-fallback-explained
    text: Describe a missing composite result in owner words, with the fallback rule on the secondary line; never render the internal word filled.
    predicate: {kind: schema, value: composite-fallback-reader-explanation, evidence_required: true, checked_by: web}
    applies_to: {slots: [presentation.drawer]}
    target: record
    severity: error
  - id: substitution-names-source
    text: A text that says a trace or workload was substituted names the value it took, the slowest (or highest-cost) value any provider recorded; a line that only says something is absent does not.
    predicate: {kind: schema, value: substitution-text-names-source, evidence_required: true, checked_by: web}
    applies_to: {slots: [presentation.drawer, chart.status-footer]}
    target: record
    severity: error
  - id: substitution-shown-one-level-up
    text: Show a substitution one level up from its gap; a trace's gap is counted on its workload's All tab and named, without counts, in the composite's Provider Failures line; a workload's gap is shown in the composite.
    predicate: {kind: schema, value: substitution-one-level-up, evidence_required: true, checked_by: web}
    applies_to: {slots: [presentation.drawer, chart.status-footer]}
    target: record
    severity: error
  - id: failed-trials-listed
    text: >-
      A provider's drill-down lists only unresolved failures: units or individual results with no successful trial after the recorded retries. A successful result has no failure list; replaced attempts never appear as failures, exclusions, footnotes or hover lines. The section uses the one owner label, Provider Failures, at every level. It is folded with the shared disclosure and closed until opened; each listed trial has no status word. On the composite the section names each index workload with such a trial and opens to its traces, jobs or tasks and then to their sandbox IDs ({parameters.composite_depth} levels). On a workload's All tab it names each trace, job or task and opens to its sandbox IDs ({parameters.workload_all_depth} levels). On one trace, job or task, and on every Sandbox Operations and Machine Performance view, it opens straight to the sandbox IDs ({parameters.single_depth} level). A trial shows all its sandbox IDs, or its trial id when it made none. Workloads follow the index order, traces, jobs and tasks the selector order, and trials their start order. A section with nothing to list is left out.
    parameters:
      composite_depth: 3
      workload_all_depth: 2
      single_depth: 1
    predicate: {kind: schema, value: failed-trials-listed, evidence_required: true, checked_by: web}
    applies_to: {slots: [presentation.drawer]}
    target: scope
    severity: error
