schema: boxrouter.text-conventions/1
version: 1
editing:
  source: conventions/text-conventions.yaml
  reference: docs/reference/text-conventions.md
slots:
  title:
    purpose: Identify the selected canonical subject.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Title
    enabled: true
    required: true
    casing: title
    order: 0
  description:
    purpose: State the measured boundary or counted outcome, without interpreting its result.
    form: sentence
    min_length: 8
    max_length: 200
    max_sentences: 2
    name: Description
    enabled: true
    required: true
    casing: sentence
    order: 1
    source: notes.introduction
  caption:
    purpose: Retired; direction is shown once at the end of the subtitle.
    form: forbidden
    min_length: 0
    max_length: 0
    max_sentences: 2
    name: Caption
    enabled: false
    required: false
    casing: preserve
    order: 99
  axis-title:
    purpose: Name the actual display unit and quantity where the axis must stand alone; match plotted
      tick scaling.
    form: label
    min_length: 1
    max_length: 80
    max_sentences: 1
    name: Axis Title
    enabled: true
    required: true
    casing: title
    order: 2
    generated: metric_label_grammar.forms.axis
    quantity_owner: true
  details.composite:
    purpose: Say how the All view of a workload combines its units, as the first part of its Details.
    form: sentence
    min_length: 8
    max_length: 300
    max_sentences: 2
    name: Details / Composite
    enabled: true
    required: false
    casing: sentence
    order: 4
    heading: Composite
    source: details.composite.sentence_source
  details.setup:
    purpose: Give provenance or fixed workload, timing boundaries and clock; derived indexes name inputs
      and aggregation.
    form: sentence
    min_length: 8
    max_length: 300
    max_sentences: 2
    name: Details / Setup
    enabled: true
    required: false
    casing: sentence
    order: 5
    heading: Setup
    source: notes.setup
  details.trial-steps:
    purpose: Say what one trial does, in order, after the setup.
    form: sentence
    min_length: 8
    max_length: 400
    max_sentences: 3
    name: Details / Trial Steps
    enabled: true
    required: false
    casing: sentence
    order: 6
    heading: Trial Steps
    source: notes.trial_steps
  details.limitations:
    purpose: State one exclusion or constraint per item; the method page's Scope Limits and Caveats draw the same items.
    form: sentence
    min_length: 8
    max_length: 240
    max_sentences: 1
    min_items: 0
    max_items: 8
    shown_items: 3
    name: Details / Limitations
    enabled: true
    required: false
    casing: sentence
    order: 7
    heading: Limitations
    presentation: bullets
    source: notes.limitations
  method-reading:
    purpose: Explain aggregation, source unit, direction and any chart-specific interpretation on the method page; the Details dropdown does not draw it.
    form: sentence
    min_length: 8
    max_length: 300
    max_sentences: 2
    name: Method Reading
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.how_to_read
  method-opening:
    purpose: Open the method page; the short Description stays the subtitle.
    form: sentence
    min_length: 8
    max_length: 1200
    max_sentences: 6
    name: Method Opening
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.opening
  method-workload:
    purpose: Name the upstream source, the units and variants selected, the pinned artifacts and the differences from an upstream run.
    form: structured
    min_length: 8
    max_length: 4500
    name: Method Workload
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.workload
  method-procedure:
    purpose: Give the trial's steps in order with its clocks, background execution, concurrency and cleanup.
    form: structured
    min_length: 8
    max_length: 4500
    name: Method Procedure
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.procedure
  method-metrics:
    purpose: Define the primary and secondary metrics, their clocks and the stage classification.
    form: structured
    min_length: 8
    max_length: 3500
    name: Method Metrics
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.metrics
  method-calculation:
    purpose: State how a composite or derived value is calculated from its inputs.
    form: structured
    min_length: 8
    max_length: 3500
    name: Method Calculation
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.calculation
  method-failure-policy:
    purpose: State the test's pass criteria, its failure and exclusion conditions and its diagnostic checks.
    form: structured
    min_length: 8
    max_length: 3000
    name: Method Failure Policy
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.failure_policy
  method-statistics-rules:
    purpose: State the test's statistical, tail and ranking rules, citing Common Methodology for the shared ones.
    form: structured
    min_length: 8
    max_length: 4500
    name: Method Statistics Rules
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.statistics_rules
  method-independence:
    purpose: State the trial independence rules, the run checks and the outlier gates; written on Common Methodology.
    form: structured
    min_length: 8
    max_length: 4500
    name: Method Independence
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: notes.independence
  details.latest-result:
    purpose: Retired; measured results are already present in the chart.
    form: forbidden
    min_length: 0
    max_length: 0
    max_sentences: 3
    name: Details / Latest Result
    enabled: false
    required: false
    casing: preserve
    order: 99
  details.sources:
    purpose: Link the exact method and public source provenance.
    form: link
    min_length: 1
    max_length: 240
    max_sentences: 1
    name: Details / Sources
    enabled: true
    required: false
    casing: preserve
    order: 8
    heading: Sources
    generated: record.source_url
  page-summary:
    purpose: State the page scope; also supplies its search description.
    form: sentence
    min_length: 8
    max_length: 160
    max_sentences: 1
    name: Page Summary
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: names[kind=page].summary
  section-intro:
    purpose: State the common scope of the section before its controls.
    form: sentence
    min_length: 8
    max_length: 160
    max_sentences: 2
    name: Section Intro
    enabled: true
    required: false
    casing: sentence
    order: 99
    source: names[kind=section|subsection].intro
  control-label:
    purpose: Identify the selection dimension.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Control Label
    enabled: true
    required: false
    casing: sentence
    order: 99
  option-label:
    purpose: Identify the selected variant, job or trace; when the choice is a shell command, name it by its command word, shown as code (for example, `true`), with the full command under it.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Option Label
    enabled: true
    required: false
    casing: title
    order: 99
  legend-label:
    purpose: Identify the plotted stage.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Legend Label
    enabled: true
    required: false
    casing: title
    order: 99
  tooltip:
    purpose: Explain the hovered stage, variant, statistic or capability.
    form: sentence
    min_length: 8
    max_length: 140
    max_sentences: 1
    name: Tooltip
    enabled: true
    required: false
    casing: sentence
    order: 99
    repeat_label: false
    max_provider_mentions: 1
    source: description
  not-displayed:
    purpose: List omitted provider identities with source-owned reasons.
    form: label
    min_length: 1
    max_length: 500
    max_sentences: 1
    name: Not Displayed
    enabled: true
    required: false
    casing: title
    order: 99
    generated: publication+notes.not_ranked
  empty-state:
    purpose: State which required evidence is missing and how a result qualifies.
    form: sentence
    min_length: 8
    max_length: 240
    max_sentences: 2
    name: Empty State
    enabled: true
    required: false
    casing: sentence
    order: 99
    generated: statistics.ranking
  status-line:
    purpose: Show region and measurement date, without clock times.
    form: label
    min_length: 1
    max_length: 160
    max_sentences: 1
    name: Status Line
    enabled: true
    required: false
    casing: title
    order: 99
    generated: publication
    runtime_fields:
    - region
    - measurement_date
  tab-label:
    purpose: Identify a canonical group or test.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Tab Label
    enabled: true
    required: false
    casing: title
    order: 99
  view-label:
    purpose: Identify the metric view in a selected-test context.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: View Label
    enabled: true
    required: false
    casing: title
    order: 99
  section-heading:
    purpose: Identify the canonical collection.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Section Heading
    enabled: true
    required: false
    casing: title
    order: 99
  page-title:
    purpose: Identify the page.
    form: canonical
    min_length: 1
    max_length: 60
    max_sentences: 1
    name: Page Title
    enabled: true
    required: false
    casing: title
    order: 99
  row-name:
    purpose: Identify the benchmark in a provider row.
    form: canonical
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Row Name
    enabled: true
    required: false
    casing: title
    order: 99
  column-header:
    purpose: Identify the canonical compared metric or capability.
    form: canonical
    min_length: 1
    max_length: 60
    max_sentences: 1
    name: Column Header
    enabled: true
    required: false
    casing: title
    order: 99
  rank-card-line:
    purpose: Explain the plotted rank statistic and direction.
    form: label
    min_length: 15
    max_length: 15
    max_sentences: 2
    name: Rank Card Line
    enabled: true
    required: false
    casing: sentence
    order: 99
    const: Lower is better
    generated: metric_label_grammar.forms.caption
  coming-soon:
    purpose: Identify planned content.
    form: chrome
    min_length: 1
    max_length: 40
    max_sentences: 1
    name: Coming Soon
    enabled: true
    required: false
    casing: title
    order: 99
  chart.bar-row:
    purpose: Identify the provider and plotted result; ranking status appears only in the chart footer.
    form: label
    min_length: 1
    max_length: 2000
    name: Chart / Bar Row
    enabled: true
    required: false
    casing: title
    order: 99
  chart.status-footer:
    purpose: Name each provider's ranking or display status once below the chart, in a short clause; the reason is in the provider's drill-down.
    form: label
    min_length: 1
    max_length: 1000
    name: Chart / Status Footer
    enabled: true
    required: false
    casing: preserve
    order: 99
    generated: ranking_status_footer
  chart.provider-notes:
    purpose: Name the providers that have a note of their own (a billing rule) once below the chart; the note is in each provider's drill-down.
    form: label
    min_length: 1
    max_length: 1000
    name: Chart / Provider Notes
    enabled: true
    required: false
    casing: preserve
    order: 99
    generated: ranking_status_footer
  subtitle:
    purpose: Identify the headline boundary and direction without repeating the title.
    form: label
    min_length: 19
    max_length: 90
    max_sentences: 1
    name: Hero Subtitle
    enabled: true
    required: true
    casing: preserve
    order: 99
    generated: headline+metric.direction
  chart:
    purpose: Contain rendered chart markup or an explicit no-data state.
    form: structured
    min_length: 0
    max_length: 100000
    name: Chart
    enabled: true
    required: false
    casing: preserve
    order: 99
  axis-direction:
    name: Axis Direction
    purpose: Retired; direction is shown once at the end of the subtitle, never on an axis.
    form: forbidden
    casing: preserve
    min_length: 0
    max_length: 0
    max_sentences: 1
    required: false
    enabled: false
    order: 99
  methodology-reader-entry:
    name: Methodology Reader Entry
    purpose: Define one shared concept with a name and source badge, and a short meaning and worked example
      where its section has no rule text of its own.
    form: structured
    casing: sentence
    min_length: 1
    max_length: 280
    required: true
    enabled: true
    order: 99
    max_semicolons: 1
    required_fields:
    - name
    - source
    source_badges:
    - Measured
    - Calculated
    - Published
    - Recorded
  hero-description:
    name: Hero Description
    purpose: Give the short owner-authored hero boundary, independently of the long panel Description.
    form: label
    casing: preserve
    min_length: 1
    max_length: 60
    max_sentences: 1
    required: true
    enabled: true
    order: 99
panel:
  slot_order:
  - title
  - description
  - axis-title
  - details.composite
  - details.setup
  - details.trial-steps
  - details.limitations
  - details.sources
  required_slots:
  - title
  - description
  - axis-title
  optional_slots:
  - details.composite
  - details.setup
  - details.trial-steps
  - details.limitations
  - details.sources
  forbidden_slots:
  - caption
  - axis-direction
  - details.latest-result
details:
  part_order:
  - details.composite
  - details.setup
  - details.trial-steps
  - details.limitations
  - details.sources
  show_only_when_filled: true
  full_method:
    slot: details.sources
    label: Full Method
    href_source: owner.public_method_url
    required: true
  # A workload panel's Details pane on a composite view (All Traces, All Jobs, All Tasks): rule details-pane-summarizes.
  composite:
    heading: Composite
    sentence_source: reader.common.blocks.common.all_view_aggregation
    term: workload value
    term_href: /benchmarks/methodology/sbs.common#workload-value
    unit_headings:
      details.setup: Per-{Unit} Setup
      details.trial-steps: Per-{Unit} Steps
      timed-part: Per-{Unit} Timed Part
    # The overview composite panels (Composite Workload Time, Cost, Time vs Cost): {Unit} is the index's counted unit, workload;
    # the calculation text stands under Composite.
    overview_headings:
      details.setup: Per-{Unit} Setup
      details.trial-steps: Composite
  # The line after the timed part; {section} is the methodology page's Measurement section, linked.
  all_steps: 'All {n} trial steps: {section}'
axis:
  max_direction_occurrences: 0
# A table column whose values share a unit names it once in its header, and its cells hold the number only (web rule units-in-header;
table:
  unit_header: "{name} ({unit})"
subtitle:
  template: '{description} {direction}'
  separator: ' '
  placement: end-of-subtitle
  max_direction_occurrences: 1
  directions:
    lower_is_better: Lower is better.
    higher_is_better: Higher is better.
  time_vs_cost_direction: Faster and cheaper is better.
  # The last line of a chart without segments (one bar per provider): the metric's label in sentence case, then the direction sentence with its first letter lowercased ("Time per job, lower is better."). Web fills it; it types neither.
  measure_template: '{measure}, {direction}'
  frontier_template: 'Displays each provider’s {name} {time} and {name} {cost} on a frontier graph.'
  score_composite_template: 'Averages a {measure} score over the workloads'' scores.'
  score_set_template: 'Averages a {measure} score over each {unit}. {set_sentence}'
  score_frontier_template: 'A time score and a cost score are each averaged from each {unit}. {set_sentence}'
  score_frontier_composite_template: 'A time score and a cost score are each averaged from workloads'' scores.'
  # A workload's words are contracts/text/workload-subtitles.json's, by test id: source, set_clause, set_sentence and unit_sentence (whose {label} is the selected unit's label); {unit} is the names table's unit word.
  workload_unit_template: '{Measure} per {unit}. {unit_sentence}'
  workload_set_template: 'Aggregates a {measure} statistic over each {unit}, {set_clause} (selected from {source}).'
title:
  # Every panel's title. A bracketed group is dropped when any part inside it is empty.
  template: '{category}[ {unit}] {measure}[ ({tool})][{separator}{variant}]'
  # The name of the category unit of a workload's All view: the statistic whose name it is (Composite).
  composite_unit_statistic: typical
  # A variant that is the full name of a names row of one of these kinds (with no selector option) names the panel by itself: the title is that name and the measure.
  whole_name_kinds:
  - test
  - view
  measure_in_name:
  - sequential-tti
  - burst-tti
inline_code:
  mark: '`'
vocabulary:
  overview: composite
banned_patterns:
  internal_ids:
  - \b[a-z][a-z0-9]*_[a-z0-9_]+\b
  - \b[a-z][a-z0-9-]*/[0-9]+\b(?![-.]?\w)
  - \bv?\d+\.\d+\.\d+\b
  - \b(?:stat-nearest-rank|cpu-7zip-mt|trial-cost)\b
  unresolved_placeholders: &id003
  - \{[^{}]+\}
  raw_values:
  - <[a-z0-9]+(?:_[a-z0-9]+)+>
  - \b[a-z0-9]+(?:-[a-z0-9]+){3,}\b
  - '[.!?]\s*\('
  page_describing:
  - (?i)\b(?:the|this) (?:page(?! cache)|UI|interface)\b
  - (?i)\b(?:greyed|grayed)\b
  - (?i)\bplanned definition\b
  - (?i)\bnot a shipped\b
  - (?i)\bcoming soon tag\b
allowed_literals:
- sha_ni
- avx2
- avx512f
- apply_patch
- /root/run_tests.sh
- 'sh -c <command>'
- 'bash -c <command>'
- 'timeout 120 <command>'
- 'timeout 90 <tool> <arguments>'
- './7zzs b -mmt<N>'
- '<provider>'
- '<digest>'
- '<task tag>'
- 'namanjain12/<repository>_final'
- namanjain12/numpy_final
- namanjain12/coveragepy_final
- node_modules
fact_scope:
  page:
  - measurement_date
  - region
  - machine_size
  - provider_list
  - header_trial_count
  panel:
  - metric_value
  - leader
  - selected_variant
  - panel_specific_trial_count
  rule: A fact shown in the page header must not appear in a panel or its hover text. Panel-specific counts
    are allowed only when they differ from a header count.
  forbidden_panel_runtime_fields:
  - measurement_date
  - region
  - machine_size
  - provider_list
  - header_trial_count
  date_pattern: \b(?:Measured|measured|Checked|checked)\s+(?:\d{1,2}\s+[A-Z][a-z]{2}|\d{4}-\d{2}-\d{2})\b
  literal_patterns:
    region: (?i)\b(?:Virginia|Oregon|The Dalles|Los Angeles|S[aã]o Paulo|Ashburn|Portland|Iowa|Ohio|Frankfurt|Amsterdam|London|Singapore|Sydney|Tokyo|Mumbai|(?:af|ap|ca|cn|eu|il|me|mx|sa|us)-(?:[a-z]+-?){1,3}\d)\b
    measurement_date: (?i)\b(?:\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)(?:\s+\d{4})?)\b
    size: (?i)\b\d+(?:\.\d+)?\s*(?:vCPUs?|GiB|MiB|GB|MB)\b
sentence_rule:
  predicate_pattern: \b(?:gets?|is|are|was|were|has|have|shows?|measures?|times|uses?|runs?|records?|compares?|covers?|reports?|reported|gives?|adds?|plots?|returns?|takes?|reads?|writes?|creates?|starts?|ends?|counts?|includes?|excludes?|comes?|come|replays?|retains?|keeps?|limits?|depends?|can|does|do|will|must|should|receives?|implies|imply|needs?|took|varied|requested|estimated|leads?|meets?|computes?|shares?|spans?|says?|say|appears?|appl(?:y|ies)|differs?|sums?|combines?|aggregates?|reflects?|exposes?|lists?|pauses?|resumes?|supplies|supply|exercises?|installs?|excludes?|benchmarks?|set|choose|see|fail(?:s|ed)?|holds?|stops?)\b
naming:
  source: names/names.yaml
  references: Every benchmark, workload, group and index name in reader text, labels and schema descriptions uses a name placeholder resolved from the registry at build time.
  enforcement: Editable templates reject literal canonical names; all reader projections and consumer output reject retired display names. Locked scientific records remain immutable and their reader projections resolve registry references.
  check: sandbox_benchmark_verifier.name_refs source_name_errors and published_name_errors
  form: title
  retired_words:
  - typical
  clock_name_forbidden_words:
  - runner
  title_case_kinds:
  - hero
  - index
  - page
  - quantity
  - section
  - stage
  - statistic
  - tab
  - test
  - view
  preserve:
  - proper names
  - acronyms
  - commands
  - unit symbols
  own_casing:
  - p95
  own_casing_words:
  - fio
  small_words:
  - a
  - an
  - and
  - as
  - at
  - by
  - for
  - from
  - in
  - of
  - 'on'
  - or
  - per
  - the
  - to
  - vs
  - with
  # The label rule (founder, 2026-11-08): every short label is Title Case; a sentence (it ends with a period), helper text, an error, an identifier, a unit and a brand name keep their own form. Each catalog lists the dotted paths of its labels; `exceptions` are fragments that a sentence reads or captions.
  label_catalogs:
  - file: contracts/text/methodology-page.json
    paths:
    - field_labels.*
    - enum_labels.*
    - navigation.*
    - actions.*
    - sections.*.name
    - common_sections.*.name
    - pages.*
    - availability.*
    - metric_names.*
    - standard_image.labels.*
    - standard_image.registry_link
    - standard_image.copy
    - standard_image.copied
    exceptions:
    - pages.checked
    - pages.price_speed
    - pages.provider_price_speed
    - pages.provider_columns
  - file: contracts/text/1.0.0.json
    paths:
    - ranking_statuses.*.label
    - statistics_selector.label
    - dots_selector.label
    - sandbox_selector.one
    - sandbox_selector.many
    - sandbox_selector.starts.*.label
    - provider_capabilities.supported
    - provider_capabilities.not_supported
  - file: contracts/text/fact-list.json
    paths:
    - fact_failed_*
    - fact_no_result_not_measured
    exceptions:
    - fact_failed_trial_one
    - fact_failed_trial_many
uniqueness:
  scope: selected-panel
  slots:
  - title
  - description
  - details.setup
  - details.limitations
  - details.sources
  comparison: casefold-collapse-whitespace
  quantity_owner: axis-title
  similarity_threshold: 0.8
  compare_details_with:
  - description
headings:
  forbid_ancestor_repeat: true
  forbid_adjacent_repeat: true
  equivalent_names:
  - - shared methodology
    - common methodology
methodology_style:
  list_markers:
    bullet: '- '
    numbered: '\d+\. '
  scope: Every notes field of reader/methods.yaml (a list's items one by one) and everything under its common.
  exemptions: conventions/methodology-style-exemptions.yaml
  allowed_words:
  - word: dispatched
  rules:
  - id: methodology-style.reuse-phrasing
    text: Reuse the existing phrasing for the same idea.
    check: phrase-table
    phrases:
    - idea: the cost of a test
      canonical: The cost is the sum of the provider-sourced costs of the sandboxes, per successful <unit>.
      variants:
      - provider-sourced costs of the sandboxes, divided by
    - idea: how the statistic and direction are read
      canonical: The statistic reference summarizes successful trials in the axis unit; then the direction reference.
      variants:
      - '[{]param:measured\.statistics\.primary[}] is shown in [{]unit:'
      - '[{]param:measured\.statistics\.primary[}] summarizes the successful trials'
    - idea: what the providers are compared on
      canonical: Providers compared on <quantity>.
      variants:
      - '(?i)\b(?:this test|the benchmark) measures the providers[''’]'
  - id: methodology-style.say-once
    text: Say a shared rule once, in Common or the tab block, and cite it. A sentence that carries a test's own name, a number, a parameter value or a variant word is that test's own and is not compared.
    check: repeated-sentence
    min_words: 4
    min_word_length: 4
    shared_parameters:
    - measured.statistics.
  - id: methodology-style.not-the-agent
    text: Never call the provider's process in the sandbox "the agent".
    check: forbidden-pattern
    sections:
    - sandbox-operations
    - machine-performance
    flags: i
    patterns:
    - '\bthe agent\b'
  - id: methodology-style.no-intensifiers
    text: Use no intensifier unless the sentence needs it.
    check: forbidden-pattern
    flags: i
    patterns:
    - '\b(?:actually|completely|strictly|literally|exact|exactly)\b'
  - id: methodology-style.no-typed-time-unit
    text: Name no time unit in the Metrics text; At a Glance and the chart axis show the unit.
    check: forbidden-pattern
    fields:
    - metrics
    flags: i
    patterns:
    - '\b(?:seconds|milliseconds|minutes|hours)\b'
    - '\bin (?:µs|ms)\b'
  - id: methodology-style.recorded-sizes
    text: A measured byte count (an image's bytes, a recorded fact in a parameter file) is never typed; reader text reads it through an image-size placeholder, which draws it in decimal MB and GB to three significant digits by presentation.byte_size, the way the results panel does. A size that a test, provider or tool defines in binary (the machine's memory, a payload, fio's blocks and file, a billing unit) is drawn in the unit its owner defines and never converted to kB, MB or GB; a rate is shown in the unit its tool reports (fio MiB/s, STREAM GB/s).
    check: recorded-size
  - id: methodology-style.introduction-no-machine-size
    text: An Introduction never names the machine size, neither as a machine placeholder nor as a typed size; At a Glance's Machine Size row states it.
    check: forbidden-pattern
    raw: true
    fields:
    - introduction
    patterns:
    - '[{]machine:'
    - '\b\d+\s*(?:vCPUs?|GiB)\b'
  - id: methodology-style.introduction-not-the-job-host
    text: An Introduction never makes the job host the subject of the timed action, so it does not start "Times the job host"; At a Glance's Clock row names the clock.
    check: forbidden-pattern
    raw: true
    fields:
    - introduction
    patterns:
    - '^Times the job host\b'
  - id: methodology-style.noun-phrase-headings
    text: Write a heading as a noun phrase, never a clause.
    check: heading
    clause_starters:
    - when
    - if
    - because
    - while
    - after
    - before
    - how
    - why
    - what
    verb_endings:
    - is
    - are
    - was
    - were
    - does
    - do
    - has
    - have
    - works
    - runs
    - measures
    - starts
    - ends
    - counts
    - happens
    - fails
  - id: methodology-style.no-negative-framing
    text: Say what is true; use no "never ... and never" doublet and no em-dash aside.
    check: forbidden-pattern
    flags: i
    patterns:
    - '\bnever\b[^.?!]+\band never\b'
    - '—never [^—]+—'
    - —
    - ' -- '
  - id: methodology-style.colon
    text: 'A colon follows only a noun that the words after it explain (two timed stages: Resume and Read), never a closing parenthesis, a code mark, a number or a verb. The check sees those four endings and the verbs listed here, in the fields listed here; whether the words after the colon explain the noun is for the reader of the change to judge.'
    check: colon-after-noun
    fields:
    - metric
    verbs:
    - is
    - are
    - was
    - were
    - returns
    - reads
    - runs
    - measures
    - times
    - includes
    - covers
    - uses
    - reports
    - computes
    - means
  - id: methodology-style.no-abstract-gets
    text: Name what the test measures; do not write what "a X gets".
    check: forbidden-pattern
    flags: i
    patterns:
    - '\b(?:measure|test|time|report)s? what (?:a|an|the) \w+'
  - id: methodology-style.one-workload-per-page
    text: Name no other workload in a workload's text.
    check: other-workload
  - id: methodology-style.latency
    text: Write time, not the retired word; it stays only as the defined term (total time minus runtime) or inside a current name.
    check: defined-term
    term: latency
    defined_term_patterns:
    - '^\W*latency\W+(?:is|means|equals)\b'
    - '[“"`]latency[”"`]'
  - id: methodology-style.numbers-are-references
    text: Write each number the measured definition holds as a reference to the measured definition, never as digits or as a number word (two to twelve). A number with a unit matches a value in that unit; a bare count matches a count of the same thing; a count before "variants" matches the number of the definition's variants; a version matches one the definition's source names, unless it is part of a name the names table owns.
    check: definition-digits
    ignore_values:
    - 0
    - 1
    units:
      bytes: {dimension: size, factor: 1, text: [byte, bytes], keys: [bytes]}
      kib: {dimension: size, factor: 1024, text: [kib], keys: [kib]}
      mib: {dimension: size, factor: 1048576, text: [mib], keys: [mib]}
      gib: {dimension: size, factor: 1073741824, text: [gib], keys: [gib]}
      ms: {dimension: time, factor: 1, text: [ms], keys: [ms]}
      seconds: {dimension: time, factor: 1000, text: [s, sec, second, seconds], keys: [seconds]}
      minutes: {dimension: time, factor: 60000, text: [min, mins, minute, minutes], keys: [minutes]}
      vcpu: {dimension: cpu, factor: 1, text: [vcpu, vcpus], keys: [vcpu]}
  - id: methodology-style.introduction-sentence
    text: An Introduction is one sentence of at most 200 characters, as the reader reads it. A test's starts with "Times" when the quantity is a time and "Measures" otherwise, a composite's with "Measures", a score's with "Averages" and the Time vs Cost frontier's with "Displays", never with a test, tab or workload name, since the panel's title and tab already name it. It says where the timing starts and ends, or what is measured. It holds no metric id, unit, or "lower/higher is better", since the chart's axis and the end of the subtitle carry those, and its numbers are references. The chart's subtitle and the methodology page both read it, except a workload's subtitle, which is the workload-subtitle-template. A combined view's subtitle in the names table follows the same shape.
    check: introduction-sentence
    max_length: 200
    time_verb: Times
    other_verb: Measures
    index_verbs:
    - Measures
    - Averages
    - Displays
    time_units:
    - ms
    direction_pattern: '\b(?:lower|higher)\s+is\s+better\b'
  - id: methodology-style.metric-paragraph
    text: A Metrics paragraph is one paragraph per metric, kept in the test's reader field metric. It starts with the metric's name and "is the", never with a verb, in one sentence shape for every test; it replaces both the Introduction and the old metrics note in the Metrics section, since the Introduction is already the subtitle. A test holds no metrics note beside it.
    check: metric-paragraph
  - id: methodology-style.status-labels
    text: A ranking status label exists once, at its owner content.ranking_statuses, in Title Case ("Not Ranked", "Provider Failures"), and every field label, enum label, heading, footer, drill-down row, rank cell and reader sentence reads it there through a param placeholder. Reader text, the page contracts and these conventions never type one, in any casing or with its colon, nor a retired one. The label rule (founder, 2026-11-08) covers every short label, not only a status; each catalog in naming.label_catalogs is Title Case, and a sentence-case label fails the names check.
    check: status-label
  - id: methodology-style.step-note-not-step
    text: A trial step's note says only what its step's sentence does not, and never retells the step; it shares no run of four or more words with the step and gives no timed status other than the step's, which the definition's steps own.
    check: step-note
    min_shared_words: 4
  - id: methodology-style.code-marks
    text: A code mark is for a command, a path, a flag, an environment variable or an API call, since those are what a reader could type; the field ids (burst_time, create_from_snapshot) stay in the data and under Data Sources, and a label, a number or a unit is plain text.
    check: code-marks
    deferred_fields:
    - metrics
    - metric
    field_id_pattern: '[a-z][a-z0-9]*(?:_[a-z0-9]+)+'
    environment_variables:
    - http_proxy
    - https_proxy
    value_keys:
    - sha256
    - path
    - expected_body
    - websocket_subprotocol
    plain_words: []
    commands: [7zzs, apk, apply_patch, apt, apt-get, attach, autoreconf, base64, bash, Bash, black, cargo, cat, checkout, cherry-pick, chmod, clean, conda, cp, create, ctest, curl, dd, destroy, diff, Edit, eslint, fetch, find, fio, flake8, fsync, git, Glob, Grep, grep, head, isort, jest, log, make, merge, micromamba, mkdir, mv, mvn, mypy, node, nosetests, npm, nproc, patch, pause, perl, pip, pnpm, poetry, pylint, pytest, python3, Read, read, rebase, reset, restore, resume, rg, rm, ruff, show, snapshot, sqlite3, stream, stress-ng, sudo, tail, timeout, touch, tox, 'true', tsc, unittest, uv, vitest, Write, xz, yarn]
    typable_patterns:
    - '[~.]?/[^`]*'
    - '[\w.-]+/[\w./<>*:-]*'  # a path, including an image reference with its :tag
    - '\.[\w.-]+'
    - '--?[A-Za-z][^`]*'
    - '\$?[A-Z][A-Z0-9_]{2,}(?:\b.*)?'
    - '__[A-Z_]+'
    - '[\w.-]+ ?[=:] ?\S.*'
    - '[a-z][\w-]*(?:\.[\w-]+)+(?:\(\))?'
    - '[a-z]\w*\(.*\)'
    - '[0-9a-f]{8,64}'
    - '(?:GET|POST) \S+'
    - '[\d.]+:\S+'
    - 'node_modules'
  - id: methodology-style.paragraph-shape
    text: A reader paragraph is at most about 400 characters as the page draws it, every placeholder resolved, and breaks at each change of topic; an enumeration of three or more items that each carry detail is a list, with a "- " line for each item (a "1. " line where the order means something) as a block of its own, and a list item is at most 1200 characters.
    check: paragraph-shape
    deferred_fields:
    - metrics
    - metric
    max_length: 400
    max_item_length: 1200
    min_items: 3
    min_item_length: 40
    exempt_paragraphs:
    - starts: The remaining pool is stratified across
      reason: One sentence that names the ten selected traces after its colon.
    - starts: Because steps fetch from live external registries
      reason: One sentence that classifies one outcome two ways; two items are not a list.
  - id: methodology-style.one-numbered-list
    text: A test page's trial steps are its one numbered list; every other list in its reader text is "- " lines.
    check: one-numbered-list
  - id: methodology-style.measurement-prose-not-steps
    text: The Measurement prose (Setup and the workload and procedure notes) says what the trial steps cannot, such as the image, the inputs and the reason for a choice, and never retells a step; the check refuses the lifecycle steps every trial has (creating the sandbox, the untimed readiness check and destroying the sandbox).
    check: forbidden-pattern
    flags: i
    fields:
    - setup
    - workload
    - procedure
    - setup_read
    - shared_workload
    - shared_procedure
    - shared_cpu_mem_procedure
    patterns:
    - '\bcreat(?:e|es|ing) (?:a fresh|a new|one) sandbox\b'
    - '\bsandbox is created\b'
    - '\buntimed readiness check\b'
    - '\bdestroy(?:s|ed|ing)?\b[^.]*\bsandbox\b'
    - '\bsandbox is (?:destroyed|confirmed gone)\b'
taxonomy_order:
  source: names/names.yaml
  rule: Each rendered benchmark/index/tab list must be a subsequence of its canonical kind and parent
    order.
metric_forms:
  short:
    template: '{quantity}'
    comparison_template: '{left.quantity} vs {right.quantity}'
    use: Metric-view controls only when the surrounding selected-test context is explicit; a comparison
      supplies both metric references.
    omit:
    - phase
    - per
    - unit
    - direction
    - statistic
    slot: control-label
  long:
    template: '{phase?} {quantity}{per_clause?}'
    use: Standalone metric labels, provider columns and cards, heroes, test rows and panel Titles.
    omit:
    - statistic
    - direction
    slot: title
  axis:
    template: '{phase_if_ambiguous?} {quantity}{unit_clause}'
    use: Each numeric axis, including both axes of a comparison.
    statistic: Omitted; the selected statistic belongs to its control.
    slot: axis-title
rules:
- id: text.min-chars
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: min_chars
    value:
      from: slot.min_length
  severity: error
  when: &id001
    field: slot.enabled
    op: eq
    value: true
  text: Add enough text to meet the minimum of {value} characters.
- id: text.max-chars
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: max_chars
    value:
      from: slot.max_length
  severity: error
  when: *id001
  text: Shorten this text to at most {value} characters.
- id: text.retired-slot
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: max_chars
    value: 0
  severity: error
  when:
    field: slot.enabled
    op: eq
    value: false
  text: Remove this retired slot; its information is already shown elsewhere.
- id: text.casing
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: casing
    value:
      from: slot.casing
    small_words:
      from: conventions.naming.small_words
    predicate_pattern:
      from: conventions.sentence_rule.predicate_pattern
  severity: error
  when: *id001
  text: Use the declared {value} casing and preserve canonical names, commands and units.
- id: text.const
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: equals
    value:
      from: slot.const
  severity: error
  when:
    field: slot.const
    op: exists
  text: 'Use the convention value exactly: {value}.'
- id: sentence.max-count
  applies_to:
    slots:
    - '*'
    forms: &id002
    - sentence
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: max_sentences
    value:
      from: slot.max_sentences
    boundary_pattern: (?<=[.!?])\s+
  severity: error
  text: Use no more than {value} sentences.
  when:
    field: scope.context
    op: ne
    value: authored
- id: reader.capital-start
  applies_to: &id006
    slots:
    - '*'
    exclude_slots:
    - chart
    - presentation.*
  target: record
  predicate: &id005
    kind: starts_with_capital
    value: true
    allow_number: true
    allowed_starts:
      from: conventions.proper_names
    each_sentence: true
    boundary_pattern: (?<=[.!?])\s+
  severity: error
  text: Start this sentence with a capital letter.
- id: sentence.period
  applies_to:
    slots:
    - '*'
    forms: *id002
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: ends_with_period
    value: true
  severity: error
  text: End this sentence with one period.
  when:
    field: scope.context
    op: ne
    value: authored
- id: sentence.predicate
  applies_to:
    slots:
    - '*'
    forms: *id002
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: required_pattern
    value:
      from: conventions.sentence_rule.predicate_pattern
    flags: i
  severity: error
  text: Write a complete sentence with a finite verb; replace the fragment.
  when:
    field: scope.context
    op: eq
    value: generated
- id: reader.no-internal_ids
  applies_to:
    slots:
    - '*'
    forms: &id004
    - sentence
    - canonical
    - label
    - link
    - fragment
    - action-label
    - chrome
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: forbidden_pattern
    value:
      from: conventions.banned_patterns.internal_ids
    ignore_patterns: *id003
    ignore_literals:
      from: conventions.allowed_literals
  severity: error
  text: Replace internal IDs, field names and version suffixes with reader-facing names.
- id: reader.no-page_describing
  applies_to:
    slots:
    - '*'
    forms: *id004
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: forbidden_pattern
    value:
      from: conventions.banned_patterns.page_describing
  severity: error
  text: Describe the measurement, not the page, UI or a status flag.
- id: reader.no-unresolved_placeholders
  applies_to: &id010
    slots:
    - '*'
    forms: *id004
    exclude_slots:
    - presentation.*
  target: record
  predicate: &id009
    kind: forbidden_pattern
    value:
      from: conventions.banned_patterns.unresolved_placeholders
  severity: error
  text: Resolve the placeholder from source data or omit the slot.
  when: &id011
    field: scope.context
    op: ne
    value: authored
- id: reader.vocabulary
  applies_to:
    slots:
    - '*'
    forms: *id004
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: allowed_vocabulary
    value:
      typical: []
  severity: error
  text: Composite names the value across workloads, and, as the title category, the geometric mean over one workload's units in that workload's All view (DeepSWE Composite Time, All Traces). The All view name (All Traces, All Jobs, All Tasks) names the view; the words workload value name one workload's value in prose. The statistic's own name names one unit's value.
- id: tooltip.no-label-repeat
  applies_to:
    slots:
    - tooltip
    - tooltip.*
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: forbidden_pattern
    value:
      from: record.label
    literal: true
    flags: i
  severity: error
  text: Remove the repeated label; use the tooltip to explain it.
- id: tooltip.no-raw-values
  applies_to:
    slots:
    - tooltip
    - tooltip.*
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: forbidden_pattern
    value:
      from: conventions.banned_patterns.raw_values
  severity: error
  text: Print the owner's sentence for the code; never a field reference, a runner step id or a count after
    the sentence.
- id: panel.required-slots
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: scope
  predicate:
    kind: required
    value:
      from: scope.required_slots
  severity: error
  text: 'Fill the missing required slots: {observed}.'
- id: panel.slot-order
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: scope
  predicate:
    kind: order
    value:
      from: conventions.panel.slot_order
  severity: error
  text: Put title, description, axis and filled Details parts in the declared order.
- id: panel.no-duplicate-copy
  applies_to:
    slots:
      from: conventions.uniqueness.slots
    exclude_slots:
    - presentation.*
  target: scope
  predicate:
    kind: unique_across_slots
    value: 1.0
  severity: error
  text: Remove duplicated text; keep each fact in one slot.
- id: details.add-information
  applies_to:
    slots:
    - description
    - details.*
    exclude_slots:
    - presentation.*
  target: scope
  predicate:
    kind: unique_across_slots
    value:
      from: conventions.uniqueness.similarity_threshold
    compare_between:
    - - description
    - - details.*
  severity: error
  text: Make Details add information beyond the Description.
- id: details.typed-shape
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: scope
  predicate:
    kind: schema
    value:
      from: scope.details
    shape: details
  severity: error
  when:
    field: scope.details
    op: exists
  text: Use known, filled Details parts in order; Limits allows at most three bullets.
- id: subtitle.direction-once
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: scope
  predicate:
    kind: max_occurrences
    value: 1
    literals:
      from: conventions.subtitle.directions
    ignore_slots:
    - subtitle
    - description
  severity: error
  text: Show direction once, at the end of the panel subtitle; remove it from axis titles and other text.
- id: footer.provider-once
  applies_to:
    slots:
    - chart.status-footer
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: max_occurrences
    value: 1
    literals:
      from: record.providers.*.provider
  severity: error
  text: Name each provider once; remove its name from the reason.
- id: reader.no-header-facts
  applies_to: &id008
    slots:
    - '*'
    forms: *id004
    exclude_slots:
    - presentation.*
  target: record
  predicate: &id007
    kind: forbidden_pattern
    value:
      from: scope.page_facts.*.surface_forms.*
    literal: true
    flags: i
  severity: error
  text: Remove the fact already shown in the page header.
- id: text.known-slot
  applies_to:
    slots:
    - '*'
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: allowed_values
    value:
      from: scope.slot_rules
    subject:
      from: record.slot
  severity: error
  text: Use a declared source slot; remove the unknown slot.
- id: hero.required-parts
  applies_to:
    slots:
    - subtitle
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: required
    value:
      from: conventions.hero.required_parts
    subject:
      from: record.values
  severity: error
  text: Supply the owner hero_description and metric-bound direction.
- id: hero.subtitle-template
  applies_to:
    slots:
    - subtitle
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: template
    value:
      from: record.values
    template:
      from: conventions.hero.template
  severity: error
  text: Render the complete source hero subtitle template.
- id: hero.exact-separator
  applies_to:
    slots:
    - subtitle
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: separator
    value:
      from: conventions.hero.separator
    parts: 2
  severity: error
  text: Separate the short description and direction with exactly period, space.
- id: hero.description-no-period
  applies_to:
    slots:
    - hero-description
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: forbidden_pattern
    value: '[\r\n]|\.$'
  severity: error
  text: Use a one-line short hero description without a trailing period.
- id: hero.direction-value
  applies_to:
    slots:
    - subtitle
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: allowed_values
    value:
    - Lower
    - Higher
    subject:
      from: record.values.direction
  severity: error
  text: Resolve Lower or Higher from the bound metric.
- id: reader.readability
  applies_to:
    slots:
    - description
    - details.*
    - tooltip
    - tooltip.*
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: readability_grade
    value:
      from: conventions.readability.max_grade
  severity: advisory
  text: Consider simpler words or a shorter sentence; estimated reading grade is {observed}, target at
    most {value}.
- id: reader.jargon
  applies_to:
    slots:
    - description
    - details.*
    - tooltip
    - tooltip.*
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: forbidden_pattern
    value:
      from: conventions.readability.jargon_patterns
  severity: advisory
  text: Consider plain wording instead of flagged jargon; use wording that is clear to the reader.
- id: hero.short-description-bound
  applies_to:
    slots:
    - subtitle
    exclude_slots:
    - presentation.*
  target: record
  predicate:
    kind: max_chars
