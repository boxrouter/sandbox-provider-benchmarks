  ci: ci-workloads
  rl: rl-workloads

# Retired ids: old records keep them, but no canonical test replaces them (decision D2).
retired:
  - machine.disk.fio
  - start-time-exec
  - image-build-4vcpu-8gib
  - image-build-4x8
  - sandbox.image_build.size_4x8

# What a retired document is called where an immutable older version of a composite still names it as an input
# (the page has no test row to read it from).
retired_names:
  sandbox.image_build.size_4x8: Image Build (4 vCPU / 8 GiB)
