    claude_opus_5_high: claude-opus-5-high
    claude_opus_5_5_max: claude-opus-5-5-max
    claude_sonnet_5_max: claude-sonnet-5-max
    glm_5_3_flash: glm-5-3-flash
  r2e-gym:
    numpy_0a476002600c: numpy-0a476002600c
    numpy_dda20349d172: numpy-dda20349d172
    numpy_61640a849557: numpy-61640a849557
    numpy_171a3e5811e4: numpy-171a3e5811e4
    numpy_bb46a495ee52: numpy-bb46a495ee52
    numpy_504b287bdf47: numpy-504b287bdf47
    numpy_3c0b4db0b51e: numpy-3c0b4db0b51e
    coveragepy_89f44c12465b: coveragepy-89f44c12465b
    numpy_6b8d55e66e53: numpy-6b8d55e66e53
    numpy_ad48eaa76403: numpy-ad48eaa76403
