# Old stage (group) ids, scoped by the canonical test or tab that shows them.
stage:
  r2e-gym:
    restore: create-from-snapshot
    tool: tool-calls
    cleanup: destroy
  pause-resume:
    sleep: pause
    wake: resume
    data: read
  snapshots:
    restore: create-from-snapshot
