# The one reference registry: id aliases.
# Id alias rows are only added. Every target is a canonical id from names.yaml; an old id is never a
# canonical id of its own kind and a target is never itself an old id (no chains). Read old
# records only through sandbox_benchmark_verifier.names.resolve; do not copy this table into another repository.
schema: boxrouter.bench.aliases/1

document:
  index.speed_score: time-score
  index.provider_score: provider-score
  index.cost_score: cost-score
  github-actions: ci-jobs
  reliability.provider_failures: reliability

# Page test ids and stored record benchmark ids.
test:
  github-actions: ci-jobs
  start-time: sequential-tti
  burst: burst-tti
  "true": exec-latency
  true-per-100-calls: exec-latency-per-100-calls
  file-list: list
  file-write-4kib: write-4kib
  file-read-4kib: read-4kib
  resume-after-wait: delayed-resume
  snapshot: snapshot-and-restore
  snapshot-fork: fork
  image-build-2x4: image-build-2vcpu-4gib
  cpu-7zip-1t: 7-zip-1-thread
  cpu-7zip-mt: 7-zip-all-vcpus
  disk-seq-read-1m: sequential-read
  disk-seq-write-1m: sequential-write
  disk-rand-read-4k: random-read
  disk-rand-write-4k: random-write
  hardlink: hard-links
  install: package-registries
  deep-swe: deepswe
  terminal-bench: terminal-bench-4-0
  rl-rollouts: r2e-gym

# Page test ids that were one test plus a variant.
test_variant:
  start-time-python3: [sequential-tti, python3]
  start-time-node: [sequential-tti, node]
  start-time-git: [sequential-tti, git]

# Stored benchmark identifiers (record benchmark.id).
task:
  primitives: files
  disk-fio: disk
  deep-swe: deepswe
  terminal-bench: terminal-bench-4-0
  rl-rollouts: r2e-gym
  start-time: sequential-tti
  burst: burst-tti
  "true": exec-latency
  resume-after-wait: delayed-resume
  snapshot: snapshot-and-restore
  snapshot-fork: fork
  hardlink: hard-links
  install: package-registries

# Old variant and job ids, scoped by the canonical test that owns them.
variant:
