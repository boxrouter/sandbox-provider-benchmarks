# Canonical page names and the metric vocabulary, each with one source-owned row.
# Edit by adding rows; an id never changes after creation. Old ids live in aliases.yaml.
schema: boxrouter.bench.names/2
catalog_selection:
  default_common: {id: sbs.common, version: 1.0.18}
  region_country_policy:
    source: {id: sbs.common, version: 1.0.18}
    equivalents: [{id: sbs.common, version: 1.0.18}]
    countries: [US]
    # A provider with no US region runs where its entry says, for the stated reason. Each entry
    # is named in the common's region_policy text; nothing else may run outside the US.
    exceptions:
    - provider: boat
      countries: [DE, FI, FR]
      reason: Boat has no US region and no region choice; its sandboxes run only in the EU, on machines
        in Germany, Finland and France (https://docs.boat.dev/compliance.md, read 2026-11-05), and its
        create request has no region field (https://docs.boat.dev/api/reference/sandboxes/create-sandbox.md).
# The label of a workload's all-units variant: its unit plural in Title Case.
all_variant_template: "All {Units}"
metric_label_grammar:
  tokens:
    per_clause: ' per {per}'
    unit_clause: ' ({unit})'
    unitless_units: [points]
    directions:
      lower_is_better: lower is better
      higher_is_better: higher is better
  forms:
    short:
      template: '{quantity}'
      comparison_template: '{left.quantity} vs {right.quantity}'
      use: Metric-view controls only when the surrounding selected-test context is explicit; a comparison supplies both metric references.
      omit: [phase, per, unit, direction, statistic]
      case: title
    long:
      template: '{phase?} {quantity}{per_clause?}'
      identity_override: When the target is a test, index, hero or pricing-panel identity, read that canonical name through the source binding instead of recomposing it.
      use: Standalone metric labels, provider columns and cards, heroes, test rows and panel Titles.
      omit: [statistic, direction]
      case: title
    axis:
      template: '{phase_if_ambiguous?} {quantity}{unit_clause}'
      use: Each numeric axis, including both axes of a comparison.
      statistic: Omitted; the caption identifies aggregation.
      case: title
    caption:
      template: 'The chart shows {statistic?} values{per_clause?}; {direction}.'
      use: Chart captions and rank-card metric lines; Details reading text embeds the same resolved metric fragment rather than maintaining another label.
      statistic: Required for aggregated measured values; absent for deterministic list rates or raw unaggregated values.
      case: sentence
  composition:
    per_clause: Resolve the denominator word from its source; render a per clause only when it adds an actual work or pricing denominator.
    unit_clause: Use the unit formatter's display unit; synchronize it with ticks and plotted scaling.
    rate_denominators: A unit already containing a denominator does not gain another per-second or per-hour clause; per-trial sampling metadata is not an extra divisor.
    comparison: Resolve both metric identities independently; use the same source quantity words in controls, axis labels and captions.
    capitalization: Short, long and axis labels use Title Case; captions and embedded Details fragments use the slot contract's sentence case. Preserve canonical proper names, unit symbols, commands and acronyms verbatim.
    no_runtime_titlecase: Consumers do not recase canonical test names or unit symbols; source generation applies casing to grammar tokens only.
    typical: Use the composite aggregate only when the source declares it; never substitute it for another statistic identity.
    median: Use the statistic name row resolved from the plotted statistic identity.
    mean: Use the statistic name row resolved from the plotted statistic identity; rejected display labels are owned by that row.
    other_statistics: Resolve source statistic identities through their name rows; Box Plot and Spread are presentations, not replacement statistic identities.
  quantities:
    time:
      applies_to: Elapsed time only; boundary and phase qualifiers remain meaningful.
      name_ref: {kind: view, id: time}
    cost:
      applies_to: A monetary amount for measured or specified work, never a price rate silently relabeled as an amount.
      name_ref: {kind: view, id: cost}
    rate:
      applies_to: A genuine rate without a more specific source-owned noun, including public monetary rates; preserve its denominator and provenance.
      name_ref: {kind: quantity, id: rate}
    bandwidth:
      applies_to: Data transferred per unit time, when the method defines bandwidth.
      name_ref: {kind: quantity, id: bandwidth}
    rating:
      applies_to: An upstream tool's declared rating; do not reinterpret it as time or a generic composite score.
      name_ref: {kind: quantity, id: rating}
    operations:
      applies_to: The source's operation-count noun; its unit distinguishes a count from a rate.
      name_ref: {kind: quantity, id: operations}
    links:
      applies_to: The source's link-count noun; retain the declared rate unit where applicable.
      name_ref: {kind: quantity, id: links}
    time_score:
      applies_to: A provider's score from 0 to 100 on elapsed time, relative to the best provider on each unit.
      name_ref: {kind: quantity, id: time-score}
    cost_score:
      applies_to: A provider's score from 0 to 100 on cost, relative to the best provider on each unit.
      name_ref: {kind: quantity, id: cost-score}
    provider_score:
      applies_to: A provider's score from 0 to 100, the mean of its four part scores.
      name_ref: {kind: quantity, id: provider-score}
    latency:
      applies_to: The round-trip time of a near-zero-runtime command, from the call until its result returns.
      name_ref: {kind: quantity, id: latency}
  vocabulary_rules:
    scope: Rejected synonyms are prohibited as alternative metric label words, not as scientific descriptions, upstream proper names, operation names or historical ids.
    prices: Provider pricing and pricing-panel names remain source-owned identities. Rate wording never claims a published list rate is an observed charge.
    legacy_rate: The index identity and formula need benchmark-owner confirmation; renaming cannot turn a rate into the time index.
    startup: Startup concepts are not aliases for every time metric; resolve the actual sequential or burst time-to-interactive identity and selected configuration first.
    no_fabrication: Missing phase, denominator or identity is an owner gap. Omit or reject a required label according to the slot contract; never guess metadata from spelling.
  contexts:
    metric-view-tab: {form: short, precondition: "A selected-test identity is already visible; a comparison supplies both metric references."}
    group-tab: {form: canonical-group-name, rule: "Names the collection, never a substitute metric or selected-test title."}
    selected-test-row-and-title: {form: long, target: test, rule: "Both slots consume one resolved label binding for the highlighted test; always render the test row beneath the group tab, including one-test groups."}
    hero-or-standalone: {form: long, target: source-bound-identity-or-metric}
    provider-column-or-card: {form: long, rule: "Reuse the same metric identity as the comparable benchmark; a sub-label supplies size, unit or denominator from that identity, never an alternate metric nickname."}
    chart-axis: {form: axis, rule: "Include the phase when several phases are plotted without an unambiguous surrounding subject; resolve both comparison axes independently."}
    chart-caption-or-rank-card-line: {form: caption}
    details-reading: {form: caption, rule: "Embed the resolved statistic/metric fragment in owner-authored prose; measurement boundaries, provenance and limits remain authored method facts."}
    pricing-panel: {form: long, target: pricing-panel, rule: "Preserve the pricing owner's panel identity; use axis and caption forms for its actual rate metadata, without adding a sample statistic."}
